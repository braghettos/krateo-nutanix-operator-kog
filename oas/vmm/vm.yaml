openapi: 3.0.3
# -----------------------------------------------------------------------------
# TRIMMED OAS SLICE - Nutanix Prism Central v4 - VM (vmm namespace)
# -----------------------------------------------------------------------------
# This is an oasgen-friendly, hand-authored slice covering ONLY the endpoints
# and fields needed to manage an AHV VM as a Kubernetes resource via Krateo KOG.
#
# It is a STARTER spec: the field set is intentionally small. Replace/extend it
# with the authoritative, version-exact document pulled from your Prism Central
# (see scripts/pull-specs.sh).
#
# Known Nutanix v4 behaviours that DO NOT round-trip cleanly through oasgen and
# are documented in README.md (## Architectural caveats):
#   * create/update/delete return 202 + a TaskReference (async) - not the entity
#   * update/delete require an If-Match (ETag) header + Ntnx-Request-Id header
#   * responses wrap the entity in a {"data": ...} envelope
# -----------------------------------------------------------------------------
info:
  title: Nutanix VMM - VM (trimmed)
  version: v4.1
servers:
  # Host + scheme are provided at runtime via the generated Configuration CR.
  # Keep the /api prefix here so verb paths stay relative to the namespace.
  - url: "{scheme}://{prismCentral}/api"
    variables:
      scheme:
        default: https
        enum: [https, http]
        description: Use http only for the local mock server; https for a real PC
      prismCentral:
        default: prism-central.example.com:9440
        description: Prism Central host:port (default API port 9440)
security:
  - basicAuth: []
  - apiKeyAuth: []
paths:
  /vmm/v4.1/ahv/config/vms:
    get:
      operationId: listVms
      summary: List VMs (used by the findby action)
      parameters:
        - name: $filter
          in: query
          required: false
          schema:
            type: string
          description: OData filter, e.g. name eq 'my-vm'
      responses:
        "200":
          description: List of VMs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmListResponse"
    post:
      operationId: createVm
      summary: Create a VM (async - returns a task)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Vm"
      responses:
        "202":
          description: Accepted - task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskReferenceResponse"
  /vmm/v4.1/ahv/config/vms/{extId}:
    get:
      operationId: getVmById
      summary: Get a VM by external id
      parameters:
        - $ref: "#/components/parameters/ExtId"
      responses:
        "200":
          description: A VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmResponse"
    put:
      operationId: updateVmById
      summary: Update a VM (async - requires If-Match ETag + Ntnx-Request-Id)
      parameters:
        - $ref: "#/components/parameters/ExtId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/NtnxRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Vm"
      responses:
        "202":
          description: Accepted - task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskReferenceResponse"
    delete:
      operationId: deleteVmById
      summary: Delete a VM (async - requires If-Match ETag + Ntnx-Request-Id)
      parameters:
        - $ref: "#/components/parameters/ExtId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/NtnxRequestId"
      responses:
        "202":
          description: Accepted - task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskReferenceResponse"
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Ntnx-Api-Key
  parameters:
    ExtId:
      name: extId
      in: path
      required: true
      schema:
        type: string
      description: Globally unique external identifier of the VM
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: ETag of the current entity (required by Nutanix for PUT/DELETE)
    NtnxRequestId:
      name: Ntnx-Request-Id
      in: header
      required: false
      schema:
        type: string
      description: Caller-generated unique UUID for idempotency (required for PUT/DELETE)
  schemas:
    Vm:
      type: object
      properties:
        extId:
          type: string
          description: External id (read-only, server-assigned)
          readOnly: true
        name:
          type: string
        description:
          type: string
        numSockets:
          type: integer
          format: int32
          default: 1
        numCoresPerSocket:
          type: integer
          format: int32
          default: 1
        numThreadsPerCore:
          type: integer
          format: int32
          default: 1
        memorySizeBytes:
          type: integer
          format: int64
        powerState:
          type: string
          enum: [ON, OFF]
        cluster:
          $ref: "#/components/schemas/ClusterReference"
    ClusterReference:
      type: object
      properties:
        extId:
          type: string
          description: External id of the target cluster
      required: [extId]
    VmResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Vm"
    VmListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Vm"
    TaskReferenceResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/TaskReference"
    TaskReference:
      type: object
      properties:
        extId:
          type: string
          description: External id of the async task (poll via the prism task API)
