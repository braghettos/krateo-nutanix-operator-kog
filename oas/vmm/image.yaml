openapi: 3.0.3
# -----------------------------------------------------------------------------
# TRIMMED OAS SLICE - Nutanix Prism Central v4 - Image (vmm / content)
# Starter spec. Replace/extend with the version-exact doc from your PC.
# -----------------------------------------------------------------------------
info:
  title: Nutanix VMM - Image (trimmed)
  version: v4.1
servers:
  - url: "{scheme}://{prismCentral}/api"
    variables:
      scheme:
        default: https
        enum: [https, http]
        description: Use http only for the local mock server; https for a real PC
      prismCentral:
        default: prism-central.example.com:9440
security:
  - basicAuth: []
  - apiKeyAuth: []
paths:
  /vmm/v4.1/content/images:
    get:
      operationId: listImages
      parameters:
        - name: $filter
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageListResponse"
    post:
      operationId: createImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Image"
      responses:
        "202":
          description: Accepted - task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskReferenceResponse"
  /vmm/v4.1/content/images/{extId}:
    get:
      operationId: getImageById
      parameters:
        - $ref: "#/components/parameters/ExtId"
      responses:
        "200":
          description: An image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageResponse"
    put:
      operationId: updateImageById
      parameters:
        - $ref: "#/components/parameters/ExtId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/NtnxRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Image"
      responses:
        "202":
          description: Accepted - task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskReferenceResponse"
    delete:
      operationId: deleteImageById
      parameters:
        - $ref: "#/components/parameters/ExtId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/NtnxRequestId"
      responses:
        "202":
          description: Accepted - task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskReferenceResponse"
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Ntnx-Api-Key
  parameters:
    ExtId:
      name: extId
      in: path
      required: true
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
    NtnxRequestId:
      name: Ntnx-Request-Id
      in: header
      required: false
      schema:
        type: string
  schemas:
    Image:
      type: object
      properties:
        extId:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [DISK_IMAGE, ISO_IMAGE]
        sizeBytes:
          type: integer
          format: int64
          readOnly: true
        source:
          $ref: "#/components/schemas/ImageSource"
    ImageSource:
      type: object
      description: One of url-based or VM-disk-based source
      properties:
        url:
          type: string
          description: HTTP/NFS URL to fetch the image from
        shouldAllowInsecureUrl:
          type: boolean
          default: false
    ImageResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Image"
    ImageListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Image"
    TaskReferenceResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/TaskReference"
    TaskReference:
      type: object
      properties:
        extId:
          type: string
