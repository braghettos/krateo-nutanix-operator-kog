openapi: 3.0.3
# -----------------------------------------------------------------------------
# TRIMMED OAS SLICE - Nutanix Prism Central v4 - Cluster (clustermgmt namespace)
# Starter spec. Clusters are typically registered, not created via API; this
# slice exposes read (get/findby) plus update for config. Adjust to your needs.
# -----------------------------------------------------------------------------
info:
  title: Nutanix Cluster Management - Cluster (trimmed)
  version: v4.0
servers:
  - url: "{scheme}://{prismCentral}/api"
    variables:
      scheme:
        default: https
        enum: [https, http]
        description: Use http only for the local mock server; https for a real PC
      prismCentral:
        default: prism-central.example.com:9440
security:
  - basicAuth: []
  - apiKeyAuth: []
paths:
  /clustermgmt/v4.0/config/clusters:
    get:
      operationId: listClusters
      parameters:
        - name: $filter
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of clusters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterListResponse"
  /clustermgmt/v4.0/config/clusters/{extId}:
    get:
      operationId: getClusterById
      parameters:
        - $ref: "#/components/parameters/ExtId"
      responses:
        "200":
          description: A cluster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterResponse"
    put:
      operationId: updateClusterById
      parameters:
        - $ref: "#/components/parameters/ExtId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/NtnxRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Cluster"
      responses:
        "202":
          description: Accepted - task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskReferenceResponse"
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Ntnx-Api-Key
  parameters:
    ExtId:
      name: extId
      in: path
      required: true
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
    NtnxRequestId:
      name: Ntnx-Request-Id
      in: header
      required: false
      schema:
        type: string
  schemas:
    Cluster:
      type: object
      properties:
        extId:
          type: string
          readOnly: true
        name:
          type: string
        nodes:
          type: object
          readOnly: true
          properties:
            numberOfNodes:
              type: integer
              format: int32
        config:
          type: object
          properties:
            clusterFunction:
              type: array
              items:
                type: string
                enum: [AOS, PRISM_CENTRAL, CLOUD_DATA_GATEWAY, AFS, ONE_NODE, TWO_NODE]
    ClusterResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Cluster"
    ClusterListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Cluster"
    TaskReferenceResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/TaskReference"
    TaskReference:
      type: object
      properties:
        extId:
          type: string
