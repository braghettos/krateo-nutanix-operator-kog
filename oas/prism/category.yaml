openapi: 3.0.3
# -----------------------------------------------------------------------------
# TRIMMED OAS SLICE - Nutanix Prism Central v4 - Category (prism namespace)
# Categories are key/value tags. They are the simplest fully-CRUD v4 resource
# and make the best first end-to-end test of the toolchain.
# Starter spec. Replace/extend with the version-exact doc from your PC.
# -----------------------------------------------------------------------------
info:
  title: Nutanix Prism - Category (trimmed)
  version: v4.0
servers:
  - url: "{scheme}://{prismCentral}/api"
    variables:
      scheme:
        default: https
        enum: [https, http]
        description: Use http only for the local mock server; https for a real PC
      prismCentral:
        default: prism-central.example.com:9440
security:
  - basicAuth: []
  - apiKeyAuth: []
paths:
  /prism/v4.0/config/categories:
    get:
      operationId: listCategories
      parameters:
        - name: $filter
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
    post:
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Category"
      responses:
        "200":
          description: Created category (categories may return the entity directly)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
  /prism/v4.0/config/categories/{extId}:
    get:
      operationId: getCategoryById
      parameters:
        - $ref: "#/components/parameters/ExtId"
      responses:
        "200":
          description: A category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
    put:
      operationId: updateCategoryById
      parameters:
        - $ref: "#/components/parameters/ExtId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/NtnxRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Category"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
    delete:
      operationId: deleteCategoryById
      parameters:
        - $ref: "#/components/parameters/ExtId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/NtnxRequestId"
      responses:
        "204":
          description: Deleted
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Ntnx-Api-Key
  parameters:
    ExtId:
      name: extId
      in: path
      required: true
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
    NtnxRequestId:
      name: Ntnx-Request-Id
      in: header
      required: false
      schema:
        type: string
  schemas:
    Category:
      type: object
      properties:
        extId:
          type: string
          readOnly: true
        key:
          type: string
        value:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [USER, SYSTEM, INTERNAL]
          default: USER
      required: [key, value]
    CategoryResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Category"
    CategoryListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
