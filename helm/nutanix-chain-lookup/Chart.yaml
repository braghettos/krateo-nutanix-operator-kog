apiVersion: v2
name: nutanix-chain-lookup
description: |
  Demonstrates coupling KOG resources whose inputs come from another CR, using a
  Krateo blueprint + Helm's `lookup` function. The parent Vm is created first; the
  dependent SerialPort reads the VM's runtime status.extId via lookup and is rendered
  only once it exists. The composition-dynamic-controller re-renders each reconcile,
  so lookup resolves on a later pass (simulated here with `helm upgrade`).
type: application
version: CHART_VERSION
appVersion: "0.1.0"
