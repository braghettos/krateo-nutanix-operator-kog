# Registers this blueprint with a full Krateo install (core-provider +
# composition-dynamic-controller). Krateo generates a VirtualMachine CRD from the
# chart's values.schema and a controller that renders the chart -> KOG Vm resource.
# Package + publish the chart first, e.g.:
#   helm dependency build blueprints/nutanix-virtualmachine   # vendor the portal-page subchart from Chart.lock
#   helm package blueprints/nutanix-virtualmachine
#   helm push nutanix-virtualmachine-0.3.0.tgz oci://ghcr.io/krateo-blueprints/charts
apiVersion: core.krateo.io/v1alpha1
kind: CompositionDefinition
metadata:
  name: nutanix-virtualmachine
  namespace: krateo-system
spec:
  chart:
    url: oci://ghcr.io/krateo-blueprints/charts/nutanix-virtualmachine
    version: 0.3.0
