{{- if not .Values.vm.clusterExtId }}
{{- fail "vm.clusterExtId is required (a registered PE cluster extId)" }}
{{- end }}
{{- if .Values.configuration.create }}
apiVersion: vmm.nutanix.krateo.io/v1alpha1
kind: VmConfiguration
metadata:
  name: {{ .Values.configuration.name }}
  namespace: {{ .Values.configuration.namespace }}
spec:
  authentication:
    basic:
      usernameRef:
        name: {{ .Values.configuration.authSecret.name }}
        namespace: {{ .Values.configuration.authSecret.namespace }}
        key: username
      passwordRef:
        name: {{ .Values.configuration.authSecret.name }}
        namespace: {{ .Values.configuration.authSecret.namespace }}
        key: password
---
{{- end }}
apiVersion: vmm.nutanix.krateo.io/v1alpha1
kind: Vm
metadata:
  name: {{ .Values.vm.name }}
  namespace: {{ .Values.configuration.namespace }}
spec:
  configurationRef:
    name: {{ .Values.configuration.name }}
    namespace: {{ .Values.configuration.namespace }}
  name: {{ .Values.vm.name }}
  description: {{ .Values.vm.description | quote }}
  # NOTE: no extId (discovered by the controller) and no powerState (rejected on create).
  # Large integers are rendered via `int64`/`int` so Helm doesn't emit scientific
  # notation (e.g. 2147483648 -> "2.147483648e+09"), which would break the integer fields.
  numSockets: {{ .Values.vm.numSockets | int }}
  numCoresPerSocket: {{ .Values.vm.numCoresPerSocket | int }}
  memorySizeBytes: {{ .Values.vm.memorySizeBytes | int64 }}
  cluster:
    extId: {{ .Values.vm.clusterExtId | quote }}
  {{- with .Values.vm.categories }}
  categories:
    {{- range . }}
    - extId: {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- with .Values.disks }}
  disks:
    {{- $busIndex := dict }}
    {{- range $d := . }}
    {{- $bus := $d.busType | default "SCSI" }}
    {{- $n := int (index $busIndex $bus | default 0) }}
    - backingInfo:
        $objectType: vmm.v4.ahv.config.VmDisk
        diskSizeBytes: {{ $d.sizeBytes | int64 }}
        {{- with $d.storageContainerExtId }}
        storageContainer:
          extId: {{ . | quote }}
        {{- end }}
      diskAddress:
        busType: {{ $bus }}
        index: {{ $n }}
    {{- $_ := set $busIndex $bus (add $n 1) }}
    {{- end }}
  {{- end }}
  {{- with .Values.nics }}
  nics:
    {{- range . }}
    - networkInfo:
        nicType: {{ .nicType | default "NORMAL_NIC" }}
        subnet:
          extId: {{ .subnetExtId | quote }}
    {{- end }}
  {{- end }}
  {{- with .Values.serialPorts }}
  serialPorts:
    {{- range . }}
    - index: {{ .index | int }}
      isConnected: {{ .isConnected | default false }}
    {{- end }}
  {{- end }}
