          type: string
          description: 'Hash of the spec. This will be returned from server.

            '
        categories_mapping:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
          description: 'Categories for the vm. This allows setting up multiple

            values from a single key. Categories assigned using the older view will be

            present here. This is the new way of assigning categories.

            '
