openapi: 3.0.0
info:
  title: NCM Self-Service
  description: "# Introduction \n**NCM Self-Service** allows you to seamlessly select, provision, and manage your business\
    \ applications across infrastructures for both, private and public clouds.\n\nSelf-Service provides application lifecycle,\
    \ monitoring, and remediation to manage heterogeneous infrastructure. For example, VMs or bare-metal servers. Self-Service\
    \ supports multiple platforms through its single self-service and automation interface to manage all your infrastructure.\n\
    \n# Authentication\n- **Basic Authentication** : The user provides user ID and password every time a request is sent as\
    \ the auth-header.\n\n- **Session Authentication** : The user credentials are stored in a cookie. \n\n"
  version: 3.1.0
servers:
- url: https://pc-host-ip:9440/api/nutanix/v3
security:
- basicAuth: []
paths:
  /api_keys:
    post:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                format: binary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/generate_api_key_input'
        description: Request body
        required: true
      tags:
      - users
      x-private: true
      x-doc-hide: true
      summary: Create API Key
      x-ntnx-operations:
      - create
      x-ntnx-kind: project
      description: Creates an API key using data included in the request
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://pc-host-ip:9440/api/nutanix/v3/api_keys \\\n    --header 'Accept:\
          \ application/json' \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json'\
          \ \\\n    --data '{\n    \"name\": \"string\",\n    \"roles\": [\n        {}\n    ],\n    \"should_grant_admin_access\"\
          : false\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Authorization:\
          \ Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json' \\\n    --body-data '{\n    \"name\"\
          : \"string\",\n    \"roles\": [\n        {}\n    ],\n    \"should_grant_admin_access\": false\n}' \\\n    --output-document\
          \ \\\n    - https://pc-host-ip:9440/api/nutanix/v3/api_keys"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"pc-host-ip:9440\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Authorization\": \"Basic <basic_auth_token>\",\n    \"Content-Type\": \"application/json\"\
          \n}\n\npayload =  \"\"\"{\n    \"name\": \"string\",\n    \"roles\": [\n        {}\n    ],\n    \"should_grant_admin_access\"\
          : false\n}\"\"\"\n\nconn.request(\"POST\",\"/api/nutanix/v3/api_keys\", payload, headers)\n\nres = conn.getresponse()\n\
          data = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://pc-host-ip:9440/api/nutanix/v3/api_keys\"\n\t\n\tpayload :=  strings.NewReader(`{\"name\": \"string\"\
          , \"roles\": [{}], \"should_grant_admin_access\": false}`)\n\treq, err := http.NewRequest(\"POST\", url, payload)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"\
          Accept\", \"application/json\")\n        req.Header.Add(\"Authorization\", \"Basic <basic_auth_token>\")\n     \
          \   req.Header.Add(\"Content-Type\", \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif\
          \ err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\
          \tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\t\
          return\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://pc-host-ip:9440/api/nutanix/v3/api_keys\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\"\
          )\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"{\\\"name\\\": \\\"string\\\", \\\"roles\\\
          \": [{}], \\\"should_grant_admin_access\\\": false}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://pc-host-ip:9440/api/nutanix/v3/api_keys';\nconst options = {\n  method: 'POST',\n  headers:\
          \ {'Accept': 'application/json', 'Authorization': 'Basic <basic_auth_token>', 'Content-Type': 'application/json'},\n\
          \  body:  `{\"name\": \"string\", \"roles\": [{}], \"should_grant_admin_access\": false}`\n};\n\ntry {\n  const\
          \ response = await fetch(url, options);\n  const data = await response.json();\n  console.log(data);\n} catch (error)\
          \ {\n  console.error(error);\n}"
  /api_keys/{name}:
    put:
      responses:
        '200':
          description: Success
        '404':
          description: Invalid UUID provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/project_status'
      parameters:
      - required: true
        description: Key name to disable accesses to
        in: path
        name: name
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  x-ntnx-enum:
                  - ENABLED
                  - DISABLED
                  type: string
                  description: Intended state of the key
        description: Request body for enabling/disabling API key
        required: true
      tags:
      - users
      x-private: true
      x-doc-hide: true
      summary: Enable/Disable API key
      x-ntnx-operations:
      - create
      x-ntnx-kind: project
      description: Enable/Disable access to the API key. Used for temporarily disabling accesses
      x-codeSamples:
      - lang: cURL
        source: "curl --request PUT \\\n    --url https://pc-host-ip:9440/api/nutanix/v3/api_keys/{name} \\\n    --header\
          \ 'Accept: application/json' \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n    --header 'Content-Type:\
          \ application/json' \\\n     "
      - lang: Wget
        source: "wget --quiet \\\n    --method PUT \\\n    --header 'Accept: application/json' \\\n    --header 'Authorization:\
          \ Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json' \\\n      \\\n    --output-document\
          \ \\\n    - https://pc-host-ip:9440/api/nutanix/v3/api_keys/{name}"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"pc-host-ip:9440\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Authorization\": \"Basic <basic_auth_token>\",\n    \"Content-Type\": \"application/json\"\
          \n}\n\npayload =  \"\"\"{}\"\"\"\n\nconn.request(\"PUT\",\"/api/nutanix/v3/api_keys/{name}\", payload, headers)\n\
          \nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://pc-host-ip:9440/api/nutanix/v3/api_keys/{name}\"\n\t \n\treq, err := http.NewRequest(\"PUT\", url,\
          \ nil)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"\
          Accept\", \"application/json\")\n        req.Header.Add(\"Authorization\", \"Basic <basic_auth_token>\")\n     \
          \   req.Header.Add(\"Content-Type\", \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif\
          \ err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\
          \tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\t\
          return\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"PUT\", \"https://pc-host-ip:9440/api/nutanix/v3/api_keys/{name}\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\"\
          )\n  .setHeader(\"Content-Type\", \"application/json\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://pc-host-ip:9440/api/nutanix/v3/api_keys/{name}';\nconst options = {\n  method: 'PUT',\n\
          \  headers: {'Accept': 'application/json', 'Authorization': 'Basic <basic_auth_token>', 'Content-Type': 'application/json'}\
          \ \n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await response.json();\n  console.log(data);\n\
          } catch (error) {\n  console.error(error);\n}"
    delete:
      responses:
        '200':
          description: Success
        '404':
          description: Invalid UUID provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/project_status'
      parameters:
      - required: true
        description: Key name to delete
        in: path
        name: name
        schema:
          type: string
      tags:
      - users
      x-private: true
      x-doc-hide: true
      summary: Delete API Key
      x-ntnx-operations:
      - delete
      x-ntnx-kind: project
      description: Deletes the specified API Key
      x-codeSamples:
      - lang: cURL
        source: "curl --request DELETE \\\n    --url https://pc-host-ip:9440/api/nutanix/v3/api_keys/{name} \\\n    --header\
          \ 'Accept: application/json' \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n     "
      - lang: Wget
        source: "wget --quiet \\\n    --method DELETE \\\n    --header 'Accept: application/json' \\\n    --header 'Authorization:\
          \ Basic <basic_auth_token>' \\\n      \\\n    --output-document \\\n    - https://pc-host-ip:9440/api/nutanix/v3/api_keys/{name}"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"pc-host-ip:9440\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Authorization\": \"Basic <basic_auth_token>\"\n}\n \nconn.request(\"DELETE\",\"/api/nutanix/v3/api_keys/{name}\"\
          , headers=headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://pc-host-ip:9440/api/nutanix/v3/api_keys/{name}\"\n\t \n\treq, err := http.NewRequest(\"DELETE\",\
          \ url, nil)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"\
          Accept\", \"application/json\")\n        req.Header.Add(\"Authorization\", \"Basic <basic_auth_token>\")\n    \n\
          \tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\
          \t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"\
          Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
