          - INVALID_SSL_CERTIFICATE
          - ERROR_ATTACHING_FILE_TO_CASE
          - SPEC_UPDATE_ERROR
          - SPEC_INCOMPATIBLE_ERROR
          - CLOUD_UNREACHABLE_ERROR
          - INVALID_CLOUD_CREDENTIALS
          - IDP_PORTAL_UNREACHABLE
          - SELF_PAIRING_NOT_ALLOWED
          - PAIRING_FAILED
          - PAIRING_NOT_ALLOWED
          - PAIRING_INITIATING_NOT_ALLOWED
          - CLOUD_TRUST_EXISTS
