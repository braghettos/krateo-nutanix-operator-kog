openapi: 3.0.0
info:
  title: NCM Self-Service
  description: "# Introduction \n**NCM Self-Service** allows you to seamlessly select, provision, and manage your business\
    \ applications across infrastructures for both, private and public clouds.\n\nSelf-Service provides application lifecycle,\
    \ monitoring, and remediation to manage heterogeneous infrastructure. For example, VMs or bare-metal servers. Self-Service\
    \ supports multiple platforms through its single self-service and automation interface to manage all your infrastructure.\n\
    \n# Authentication\n- **Basic Authentication** : The user provides user ID and password every time a request is sent as\
    \ the auth-header.\n\n- **Session Authentication** : The user credentials are stored in a cookie. \n\n"
  version: 3.1.0
servers:
- url: https://pc-host-ip:9440/api/nutanix/v3
security:
- basicAuth: []
paths:
  /projects/consumption_list:
    post:
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/app_consumption_response'
      parameters:
      - name: limit
        in: query
        schema:
          type: number
      - name: offset
        in: query
        schema:
          type: number
      requestBody:
        $ref: '#/components/requestBodies/app_consumption_input'
      tags:
      - Projects
      x-private: false
      x-doc-hide: false
      summary: List the consumption for the given project uuids
      x-ntnx-operations:
      - view
      x-ntnx-kind: project
      description: List the consumption for the given project uuids.
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://pc-host-ip:9440/api/nutanix/v3/projects/consumption_list \\\n \
          \   --header 'Accept: application/json' \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n    --header\
          \ 'Content-Type: application/json' \\\n    --data '{\n    \"filters\": {\n        \"cluster_ids\": [\n         \
          \   \"string\"\n        ],\n        \"entity_ids\": [\n            \"string\"\n        ],\n        \"entity_names\"\
          : [\n            \"string\"\n        ],\n        \"entity_tags\": {},\n        \"entity_types\": [\n           \
          \ \"string\"\n        ],\n        \"providers\": [\n            \"string\"\n        ]\n    },\n    \"group_by\"\
          : \"string\",\n    \"time_range\": {\n        \"end_time\": 0,\n        \"start_time\": 0,\n        \"time_delta\"\
          : 0\n    },\n    \"time_unit\": \"string\"\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Authorization:\
          \ Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json' \\\n    --body-data '{\n    \"filters\"\
          : {\n        \"cluster_ids\": [\n            \"string\"\n        ],\n        \"entity_ids\": [\n            \"string\"\
          \n        ],\n        \"entity_names\": [\n            \"string\"\n        ],\n        \"entity_tags\": {},\n  \
          \      \"entity_types\": [\n            \"string\"\n        ],\n        \"providers\": [\n            \"string\"\
          \n        ]\n    },\n    \"group_by\": \"string\",\n    \"time_range\": {\n        \"end_time\": 0,\n        \"\
          start_time\": 0,\n        \"time_delta\": 0\n    },\n    \"time_unit\": \"string\"\n}' \\\n    --output-document\
          \ \\\n    - https://pc-host-ip:9440/api/nutanix/v3/projects/consumption_list"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"pc-host-ip:9440\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Authorization\": \"Basic <basic_auth_token>\",\n    \"Content-Type\": \"application/json\"\
          \n}\n\npayload =  \"\"\"{\n    \"filters\": {\n        \"cluster_ids\": [\n            \"string\"\n        ],\n\
          \        \"entity_ids\": [\n            \"string\"\n        ],\n        \"entity_names\": [\n            \"string\"\
          \n        ],\n        \"entity_tags\": {},\n        \"entity_types\": [\n            \"string\"\n        ],\n  \
          \      \"providers\": [\n            \"string\"\n        ]\n    },\n    \"group_by\": \"string\",\n    \"time_range\"\
          : {\n        \"end_time\": 0,\n        \"start_time\": 0,\n        \"time_delta\": 0\n    },\n    \"time_unit\"\
          : \"string\"\n}\"\"\"\n\nconn.request(\"POST\",\"/api/nutanix/v3/projects/consumption_list\", payload, headers)\n\
          \nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://pc-host-ip:9440/api/nutanix/v3/projects/consumption_list\"\n\t\n\tpayload :=  strings.NewReader(`{\"\
          filters\": {\"cluster_ids\": [\"string\"], \"entity_ids\": [\"string\"], \"entity_names\": [\"string\"], \"entity_tags\"\
          : {}, \"entity_types\": [\"string\"], \"providers\": [\"string\"]}, \"group_by\": \"string\", \"time_range\": {\"\
          end_time\": 0, \"start_time\": 0, \"time_delta\": 0}, \"time_unit\": \"string\"}`)\n\treq, err := http.NewRequest(\"\
          POST\", url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\
          \        req.Header.Add(\"Accept\", \"application/json\")\n        req.Header.Add(\"Authorization\", \"Basic <basic_auth_token>\"\
          )\n        req.Header.Add(\"Content-Type\", \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\
          \tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\t\
          return\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://pc-host-ip:9440/api/nutanix/v3/projects/consumption_list\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\"\
          )\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"{\\\"filters\\\": {\\\"cluster_ids\\\": [\\\
          \"string\\\"], \\\"entity_ids\\\": [\\\"string\\\"], \\\"entity_names\\\": [\\\"string\\\"], \\\"entity_tags\\\"\
          : {}, \\\"entity_types\\\": [\\\"string\\\"], \\\"providers\\\": [\\\"string\\\"]}, \\\"group_by\\\": \\\"string\\\
          \", \\\"time_range\\\": {\\\"end_time\\\": 0, \\\"start_time\\\": 0, \\\"time_delta\\\": 0}, \\\"time_unit\\\":\
          \ \\\"string\\\"}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n  .join();\n\n\
          client.close();"
      - lang: JavaScript
        source: "const url = 'https://pc-host-ip:9440/api/nutanix/v3/projects/consumption_list';\nconst options = {\n  method:\
          \ 'POST',\n  headers: {'Accept': 'application/json', 'Authorization': 'Basic <basic_auth_token>', 'Content-Type':\
          \ 'application/json'},\n  body:  `{\"filters\": {\"cluster_ids\": [\"string\"], \"entity_ids\": [\"string\"], \"\
          entity_names\": [\"string\"], \"entity_tags\": {}, \"entity_types\": [\"string\"], \"providers\": [\"string\"]},\
          \ \"group_by\": \"string\", \"time_range\": {\"end_time\": 0, \"start_time\": 0, \"time_delta\": 0}, \"time_unit\"\
          : \"string\"}`\n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await response.json();\n\
          \  console.log(data);\n} catch (error) {\n  console.error(error);\n}"
components:
  requestBodies:
    app_consumption_input:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/app_consumption_input'
      required: true
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    api_version:
      readOnly: true
      type: string
      description: API Version of the Nutanix v3 API framework.
      title: API Version
    app_consumption_response:
      description: Consumption response data
      type: object
      properties:
        total_spend:
          type: number
          description: Total spend for the time range
        data_available_till:
          type: number
          description: Time till when data is available
        entries:
          items:
            type: object
            properties:
              date:
                type: string
              data:
                items:
                  type: object
                  properties:
                    value:
                      type: number
                    key:
                      type: string
                type: array
              spend:
                type: number
          type: array
          description: Consumption entries
        next:
          type: string
          description: URI & params for next set of entries
        currency:
          type: string
          description: Currency for cunsumption data
      title: Consumption response data
    project_status:
      description: 'The status of a REST API call. Only used when there is a failure to

        report.

        '
      type: object
      properties:
        kind:
          readOnly: true
          type: string
          description: The kind name
          x-ntnx-enum:
          - project
        code:
          readOnly: true
          type: integer
          description: The HTTP error code.
        message_list:
          items:
            $ref: '#/components/schemas/message_resource'
          readOnly: true
          type: array
        state:
          readOnly: true
          type: string
        api_version:
          $ref: '#/components/schemas/api_version'
      title: Response Kind
    message_resource:
      description: message.
      required:
      - message
      - reason
      type: object
      properties:
        message:
          type: string
          description: If state is ERROR, a message describing the error.
        reason:
          x-ntnx-enum:
          - ACCESS_DENIED
          - ACCESS_FORBIDDEN
          - ACTION_NOT_SUPPORTED
          - AUTHENTICATION_REQUIRED
          - BEARER_TOKEN_EXPIRED
          - BEARER_TOKEN_BAD_SIGNATURE
          - CANNOT_MODIFY_PRE_CONFIGURED_REPORT
          - CATEGORY_NAME_VALUE_MISMATCH
          - CONFIGURATION_INCOMPLETE
          - CONCURRENT_REQUESTS_NOT_ALLOWED
          - DEFAULT_PROJECT_UNAVAILABLE
          - DESERIALIZATION_FAILED
          - DIRECTORY_SERVICE_CONNECTION_FAILED
          - ENTITY_ALREADY_EXISTS
          - ENTITY_DELETION_FAILED
          - ENTITY_IS_READONLY
          - ENTITY_NAME_UUID_MISMATCH
          - ENTITY_NOT_CONFIGURED
          - ENTITY_NOT_FOUND
          - ENTITY_SAVE_ERROR
          - ENTITY_UPDATE_FAILED
          - IDEMPOTENCE_UUID_CREATION_FAILED
          - IDP_NOT_REACHABLE
          - INTERNAL_ERROR
          - INVALID_ARGUMENT
          - INVALID_AZ_NAME
          - INVALID_CONTENT_TYPE
          - INVALID_DATA_FORMAT
          - INVALID_PORTAL_CONFIGURATION
          - INVALID_REQUEST
          - INVALID_UUID
          - INVALID_OWNER_REFERENCE
          - INTERNAL_AZ_PROXY_SETUP_ERROR
          - INTERNAL_ERROR_REMOTE_REQUEST
          - INTERNAL_ROLE_ACCESS_DENIED
          - INCORRECT_EVENTS_FILTER
          - MISSING_ATTRIBUTE
          - MISSING_CURRENT_USER_METADATA
          - NAME_NOT_IN_DOMAIN
          - NO_RESPONSE_RECEIVED_FROM_PORTAL
          - PE_NOT_PAIRED_WITH_PC
          - PC_NOT_PAIRED_WITH_XI_PORTAL
          - REFERENCE_ERROR
          - RESERVED_ROLE_ACCESS_DENIED
          - REQUEST_NOT_SUPPORTED
          - REMOTE_CLUSTER_IP_FETCH_FAILED
          - REMOTE_CLUSTER_NOT_CONNECTED
          - REMOTE_CONNECTION_EXISTS
          - REMOTE_CONNECTION_NOT_FOUND
          - REPORT_CONFIG_NOT_FOUND
          - REPORTING_RESOURCE_NOT_FOUND
          - REPORTING_INTERNAL_ERROR
          - SERVICE_UNAVAILABLE
          - SEARCH_RESULT_PROCESSING_ERROR
          - TOO_MANY_REQUESTS
          - UNCONFIGURED_API_KEY
          - UNCONFIGURED_PORTAL_CONNECTION
          - UNSPECIFIED_EVENTS_FILTER
          - UNSUPPORTED_AZ_PROXY_API
          - UNSUPPORTED_MEDIA_TYPE_ERROR
          - UPLOAD_TO_S3_FAILED
          - VALIDATION_ERROR
          - INVALID_SSL_CERTIFICATE
          - ERROR_ATTACHING_FILE_TO_CASE
          - SPEC_UPDATE_ERROR
          - SPEC_INCOMPATIBLE_ERROR
          - CLOUD_UNREACHABLE_ERROR
          - INVALID_CLOUD_CREDENTIALS
          - IDP_PORTAL_UNREACHABLE
          - SELF_PAIRING_NOT_ALLOWED
          - PAIRING_FAILED
          - PAIRING_NOT_ALLOWED
          - PAIRING_INITIATING_NOT_ALLOWED
          - CLOUD_TRUST_EXISTS
          - DUPLICATE_CLOUD_TRUST
          - DUPLICATE_CLOUD_TRUST_ON_REMOTE
          type: string
          description: If state is ERROR, a machine-readable snake-cased string.
        details:
          additionalProperties:
            type: string
          readOnly: true
          type: object
          description: Custom key-value details relevant to the status.
      title: Message.
    app_consumption_input:
      description: Consumption filter data
      required:
      - time_unit
      type: object
      properties:
        group_by:
          type: string
          description: Group by attribute
        time_unit:
          type: string
          description: Grannularity of consumption data
        filters:
          type: object
          description: Filter consumption data
          properties:
            cluster_ids:
              items:
                type: string
              type: array
              description: Cluster ID filter list
            providers:
              items:
                x-ntnx-enum:
                - AWS
                - AZURE
                - CHEF
                - DOCKER
                - DOCKER_REGISTRY
                - EXISTING_MACHINE
                - GCP
                - JENKINS
                - NUTANIX
                - PUPPET
                - SALT
                - VCENTER
                type: string
              type: array
              description: Provider filter list
            entity_tags:
              type: object
              description: Entity tag filter list
            entity_names:
              items:
                type: string
              type: array
              description: Entity name filter list
            entity_ids:
              items:
                type: string
              type: array
              description: Entity ID filter list
            entity_types:
              items:
                type: string
              type: array
              description: Entity type filter list
        time_range:
          type: object
          description: Time range for cunsumption data
          properties:
            start_time:
              type: integer
              description: Start time for consumption data
            end_time:
              type: integer
              description: End time for consumption data
            time_delta:
              type: integer
              description: Time delta for consumption data
      title: Consumption filter data
