        group_member_attributes:
          items:
            $ref: '#/components/schemas/groups_requested_attribute'
          type: array
        group_member_sort_attribute:
          type: string
          description: 'The name of the attribute that will be used to sort group members.

            '
        bucket_boundary:
          type: integer
          description: For grouping, the boundary to snap to when grouping.
          format: int32
        group_offset:
          type: integer
          description: The offset into the total set of groups to return.
          format: int64
        downsampling_interval:
          type: integer
          description: 'Downsampling interval to apply to query if override is desired.

            '
          format: int32
        interval_start_ms:
          type: integer
          description: 'For a time-series query, the start of the interval since the epoch in ms. Default is latest value
            only.

            '
          format: int64
        entity_type:
          type: string
          description: The entity type that will be requested.
        group_member_offset:
          type: integer
          description: The offset into the total member set to return per group.
          format: int64
        grouping_attribute:
          type: string
          description: 'Attribute that will be used to perform a group-by if needed.

