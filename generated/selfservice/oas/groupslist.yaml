        group_sort_attribute:
          type: string
          description: 'The name of the attribute that will be used to sort groups.

            '
        number_of_buckets:
          type: integer
          description: For grouping, how many groups to return.
          format: int32
        entity_ids:
          items:
            type: string
          type: array
