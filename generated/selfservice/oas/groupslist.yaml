        availability_zone_scope:
          x-ntnx-enum:
          - LOCAL
          - GLOBAL
          type: string
          description: 'The scope of availability zones from which to fetch the  data.

            '
        group_count:
          type: integer
          description: The maximum number of groups to return in the result.
          format: int64
        group_attributes:
          items:
            $ref: '#/components/schemas/groups_requested_attribute'
          type: array
        interval_end_ms:
          type: integer
          description: 'For a time-series query, the end of the interval since the epoch in ms. Default is latest value only.

            '
          format: int64
        grouping_attribute_type:
          $ref: '#/components/schemas/groups_attribute_type'
        group_member_count:
          type: integer
          description: The maximum number of members to return per group.
          format: int64
        group_member_sort_order:
          $ref: '#/components/schemas/groups_sort_order'
        query_name:
