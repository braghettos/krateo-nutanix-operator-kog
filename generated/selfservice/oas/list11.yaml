openapi: 3.0.0
info:
  title: NCM Self-Service
  description: "# Introduction \n**NCM Self-Service** allows you to seamlessly select, provision, and manage your business\
    \ applications across infrastructures for both, private and public clouds.\n\nSelf-Service provides application lifecycle,\
    \ monitoring, and remediation to manage heterogeneous infrastructure. For example, VMs or bare-metal servers. Self-Service\
    \ supports multiple platforms through its single self-service and automation interface to manage all your infrastructure.\n\
    \n# Authentication\n- **Basic Authentication** : The user provides user ID and password every time a request is sent as\
    \ the auth-header.\n\n- **Session Authentication** : The user credentials are stored in a cookie. \n\n"
  version: 3.1.0
servers:
- url: https://pc-host-ip:9440/api/nutanix/v3
security:
- basicAuth: []
paths:
  /apps/list:
    post:
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/app_list_intent_response'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/app_list_input'
        required: true
      tags:
      - Apps
      x-private: false
      x-doc-hide: false
      summary: List applications
      x-ntnx-operations:
      - view
      x-ntnx-kind: app
      description: Retrieves the list of applications, applying filters provided (if any) in the request.
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://pc-host-ip:9440/api/nutanix/v3/apps/list \\\n    --header 'Accept:\
          \ application/json' \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json'\
          \ \\\n    --data '{\n    \"advanced_filter\": {\n        \"account_reference_list\": [\n            \"string\"\n\
          \        ],\n        \"cluster_reference_list\": [\n            \"string\"\n        ],\n        \"environment_reference_list\"\
          : [\n            \"string\"\n        ],\n        \"project_reference_list\": [\n            \"string\"\n       \
          \ ],\n        \"subnet_reference_list\": [\n            \"string\"\n        ],\n        \"tunnel_reference_list\"\
          : [\n            \"string\"\n        ],\n        \"vm_name_list\": [\n            \"string\"\n        ],\n     \
          \   \"vpc_reference_list\": [\n            \"string\"\n        ]\n    },\n    \"filter\": \"string\",\n    \"kind\"\
          : \"app\",\n    \"length\": 1,\n    \"offset\": 0,\n    \"sort_attribute\": \"string\",\n    \"sort_order\": \"\
          string\"\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Authorization:\
          \ Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json' \\\n    --body-data '{\n    \"advanced_filter\"\
          : {\n        \"account_reference_list\": [\n            \"string\"\n        ],\n        \"cluster_reference_list\"\
          : [\n            \"string\"\n        ],\n        \"environment_reference_list\": [\n            \"string\"\n   \
          \     ],\n        \"project_reference_list\": [\n            \"string\"\n        ],\n        \"subnet_reference_list\"\
          : [\n            \"string\"\n        ],\n        \"tunnel_reference_list\": [\n            \"string\"\n        ],\n\
          \        \"vm_name_list\": [\n            \"string\"\n        ],\n        \"vpc_reference_list\": [\n          \
          \  \"string\"\n        ]\n    },\n    \"filter\": \"string\",\n    \"kind\": \"app\",\n    \"length\": 1,\n    \"\
          offset\": 0,\n    \"sort_attribute\": \"string\",\n    \"sort_order\": \"string\"\n}' \\\n    --output-document\
          \ \\\n    - https://pc-host-ip:9440/api/nutanix/v3/apps/list"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"pc-host-ip:9440\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Authorization\": \"Basic <basic_auth_token>\",\n    \"Content-Type\": \"application/json\"\
          \n}\n\npayload =  \"\"\"{\n    \"advanced_filter\": {\n        \"account_reference_list\": [\n            \"string\"\
