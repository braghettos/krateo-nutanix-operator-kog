          $ref: '#/components/schemas/app_substrate_reference'
        tunnel_reference:
          $ref: '#/components/schemas/tunnel_reference'
        os_type:
          type: string
          description: ''
        instance_name:
          type: string
          description: ''
          maxLength: 64
        create_spec:
