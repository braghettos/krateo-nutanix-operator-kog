          description: ''
          format: UUID
        name:
          type: string
          description: ''
          maxLength: 64
        instance_id:
          type: string
          description: ''
          maxLength: 64
        readiness_probe:
          $ref: '#/components/schemas/app_substrate_readiness_probe'
        editables:
          additionalProperties: true
          type: object
          description: 'Runtime editable attributes for this entity. The structure for this is a dictionary. The keys in this
            dictionary should be the name of the attribute on the entity. If the attribute is editable, the value should be
