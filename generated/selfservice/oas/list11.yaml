        value:
          type: string
          description: ''
        label:
          type: string
          description: ''
        attrs:
          additionalProperties: true
          type: object
          description: ''
        editables:
          additionalProperties: true
          type: object
          description: 'Runtime editable attributes for this entity. The structure for this is a dictionary. The keys in this
