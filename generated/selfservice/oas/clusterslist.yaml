    cluster_def_status:
      description: 'Cluster status definition.  A Nutanix cluster is comprised of three or

        more Nutanix nodes. Each node in the cluster contains memory, CPU, RAM,

        and storage (SSD/HDD). Each node in the cluster runs standard hypervisor

        such as VMware vSphere, Microsoft Hyper-V, or AHV. A Controller VM (CVM)

        runs on each node in the cluster. The CVM enables each node to share

        local storage from all nodes in the cluster.

        '
      required:
      - resources
      type: object
      properties:
        state:
          readOnly: true
          type: string
          description: The state of the cluster entity.
        message_list:
          items:
            $ref: '#/components/schemas/message_resource'
          type: array
        name:
          type: string
          description: Cluster Name.
        resources:
          required:
          - config
          - network
          type: object
          description: Cluster resources.
          properties:
            nodes:
              $ref: '#/components/schemas/cluster_nodes'
            config:
              $ref: '#/components/schemas/cluster_config'
            network:
              $ref: '#/components/schemas/cluster_network'
            runtime_status_list:
              items:
                x-ntnx-enum:
                - UPGRADE_QUEUED
                - UPGRADE_CANCELLED
                - UPGRADE_IN_PROGRESS
                - UPGRADE_SCHEDULED
                - HAVE_SELF_ENCRYPTING_DRIVE
                - SSP_CONFIG_OWNER
                type: string
              type: array
              description: Cluster current attributes and onging operations.
      title: Cluster Status
