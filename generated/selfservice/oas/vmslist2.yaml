          ,\"/api/nutanix/v3/blueprints/brownfield_import/vms/list\", payload, headers)\n\nres = conn.getresponse()\ndata\
          \ = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://pc-host-ip:9440/api/nutanix/v3/blueprints/brownfield_import/vms/list\"\n\t\n\tpayload :=  strings.NewReader(`{\"\
          filter\": \"string\", \"kind\": \"blueprint\", \"length\": 1, \"offset\": 0, \"sort_attribute\": \"string\", \"\
