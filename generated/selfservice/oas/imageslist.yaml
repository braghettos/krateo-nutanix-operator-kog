openapi: 3.0.0
info:
  title: NCM Self-Service
  description: "# Introduction \n**NCM Self-Service** allows you to seamlessly select, provision, and manage your business\
    \ applications across infrastructures for both, private and public clouds.\n\nSelf-Service provides application lifecycle,\
    \ monitoring, and remediation to manage heterogeneous infrastructure. For example, VMs or bare-metal servers. Self-Service\
    \ supports multiple platforms through its single self-service and automation interface to manage all your infrastructure.\n\
    \n# Authentication\n- **Basic Authentication** : The user provides user ID and password every time a request is sent as\
    \ the auth-header.\n\n- **Session Authentication** : The user credentials are stored in a cookie. \n\n"
  version: 3.1.0
servers:
- url: https://pc-host-ip:9440/api/nutanix/v3
security:
- basicAuth: []
paths:
  /aws/v1/images/list:
    post:
      description: 'List AWS AMIs . Supported filters are:

        - account_uuid

        - region

        - is-public

        - name

        - image-id

        Use account_uuid to list images on a particular account.

        Use account_uuid and region filters together to list images

        belonging to a particular region.

        Provide name to limit the results to

        those AMI names containing the provided name

        Provide image-ids to limit the results to

        corresponding AMIs

        '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aws_image_list_metadata'
        required: true
      tags:
      - aws/images
      x-private: true
      x-doc-hide: true
      summary: List all AWS AMIs.
      x-ntnx-operations:
      - view
      x-ntnx-kind: aws_image
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aws_image_list_response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://pc-host-ip:9440/api/nutanix/v3/aws/v1/images/list \\\n    --header\
          \ 'Accept: application/json' \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n    --header 'Content-Type:\
          \ application/json' \\\n    --data '{\n    \"filter\": \"string\",\n    \"kind\": \"aws_image\",\n    \"length\"\
          : 1,\n    \"offset\": 0,\n    \"sort_attribute\": \"string\",\n    \"sort_order\": \"string\"\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Authorization:\
          \ Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json' \\\n    --body-data '{\n    \"filter\"\
          : \"string\",\n    \"kind\": \"aws_image\",\n    \"length\": 1,\n    \"offset\": 0,\n    \"sort_attribute\": \"\
          string\",\n    \"sort_order\": \"string\"\n}' \\\n    --output-document \\\n    - https://pc-host-ip:9440/api/nutanix/v3/aws/v1/images/list"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"pc-host-ip:9440\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Authorization\": \"Basic <basic_auth_token>\",\n    \"Content-Type\": \"application/json\"\
          \n}\n\npayload =  \"\"\"{\n    \"filter\": \"string\",\n    \"kind\": \"aws_image\",\n    \"length\": 1,\n    \"\
          offset\": 0,\n    \"sort_attribute\": \"string\",\n    \"sort_order\": \"string\"\n}\"\"\"\n\nconn.request(\"POST\"\
          ,\"/api/nutanix/v3/aws/v1/images/list\", payload, headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"\
          utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://pc-host-ip:9440/api/nutanix/v3/aws/v1/images/list\"\n\t\n\tpayload :=  strings.NewReader(`{\"filter\"\
          : \"string\", \"kind\": \"aws_image\", \"length\": 1, \"offset\": 0, \"sort_attribute\": \"string\", \"sort_order\"\
