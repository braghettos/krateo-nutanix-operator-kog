components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    aws_image_list_response:
      description: AWS VPC entity list.
      required:
      - api_version
      - metadata
      type: object
      properties:
        entities:
          items:
            $ref: '#/components/schemas/aws_image_resource'
          type: array
        api_version:
          type: string
        metadata:
          $ref: '#/components/schemas/aws_image_list_metadata_output'
      title: aws_image entity list
    sort_order:
      x-ntnx-enum:
      - ASCENDING
      - DESCENDING
      description: The sort order in which results are returned
      title: Sort order
    aws_image_def_status:
      description: aws_image resources status
      type: object
      properties:
        name:
          type: string
          description: aws_image name.
        resources:
          $ref: '#/components/schemas/aws_image_resources_def_status'
      title: aws_image resources status
    aws_image_list_metadata_output:
      description: 'All api calls that return a list will have this metadata block

        '
      type: object
      properties:
        kind:
          x-ntnx-enum:
          - aws_image
          type: string
          description: The kind name
        total_matches:
          type: integer
          description: Total matches found
        sort_attribute:
          type: string
          description: The attribute to perform sort on
        filter:
          type: string
          description: The filter used for the results
        length:
          type: integer
          description: The number of records retrieved relative to the offset
        sort_order:
          $ref: '#/components/schemas/sort_order'
        offset:
          type: integer
          description: Offset from the start of the entity list
      title: Metadata for aws_image list output
    aws_image_list_metadata:
      description: 'All api calls that return a list will have this metadata block as input

        '
      type: object
      properties:
        kind:
          x-ntnx-enum:
          - aws_image
          type: string
          description: The kind name
        sort_attribute:
          type: string
          description: The attribute to perform sort on
        filter:
          type: string
          description: The filter in FIQL syntax used for the results.
        length:
          minimum: 1
          type: integer
          description: The number of records to retrieve relative to the offset
          format: int32
        sort_order:
          $ref: '#/components/schemas/sort_order'
        offset:
          minimum: 0
          type: integer
          description: Offset from the start of the entity list
          format: int32
      title: Metadata for aws_image list
    aws_image_resource:
      description: aws_image entity
      type: object
      properties:
        status:
          $ref: '#/components/schemas/aws_image_def_status'
      title: aws_image
    aws_image_resources_def_status:
      description: AWS image resources
      type: object
      properties:
        root_device_type:
          type: string
          description: Root device type (e.g. ebs, instance-store)
        hypervisor:
          type: string
          description: The supported hypervisor.
        virtualization_type:
          type: string
          description: Type of virtualization supported.
        platform:
          type: string
          description: Platform of the image (e.g. Windows)
        root_device_name:
          type: string
          description: Root device name (e.g. /dev/sda1, /dev/sda2)
        id:
          pattern: ^ami-[a-f0-9]{1,17}$
          type: string
          description: The AWS ID of the AMI.
        architecture:
          type: string
          description: Architecture of the AWS image (e.g. i386, x86_64)
      title: AWS image resources
