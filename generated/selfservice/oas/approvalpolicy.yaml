            '
          format: date-time
        spec_version:
          type: integer
          description: Version number of the latest spec.
        spec_hash:
          type: string
          description: 'Hash of the spec. This will be returned from server.

            '
        categories_mapping:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
          description: 'Categories for the calm_feature. This allows setting up multiple

