openapi: 3.0.0
info:
  title: NCM Self-Service
  description: "# Introduction \n**NCM Self-Service** allows you to seamlessly select, provision, and manage your business\
    \ applications across infrastructures for both, private and public clouds.\n\nSelf-Service provides application lifecycle,\
    \ monitoring, and remediation to manage heterogeneous infrastructure. For example, VMs or bare-metal servers. Self-Service\
    \ supports multiple platforms through its single self-service and automation interface to manage all your infrastructure.\n\
    \n# Authentication\n- **Basic Authentication** : The user provides user ID and password every time a request is sent as\
    \ the auth-header.\n\n- **Session Authentication** : The user credentials are stored in a cookie. \n\n"
  version: 3.1.0
servers:
- url: https://pc-host-ip:9440/api/nutanix/v3
security:
- basicAuth: []
paths:
  /calm_projects/validate:
    post:
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/project_validate_response'
      requestBody:
        $ref: '#/components/requestBodies/project_validate_input'
      tags:
      - Projects
      x-private: true
      x-doc-hide: true
      summary: Validates the project with respect to Self-Service entities
      x-ntnx-operations:
      - view
      x-ntnx-kind: project
      description: Validates the project with respect to Self-Service entities
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://pc-host-ip:9440/api/nutanix/v3/calm_projects/validate \\\n    --header\
          \ 'Accept: application/json' \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n    --header 'Content-Type:\
          \ application/json' \\\n    --data '{\n    \"account_uuids\": [\n        \"string\"\n    ],\n    \"cluster_uuids\"\
          : [\n        \"string\"\n    ],\n    \"subnet_uuids\": [\n        \"string\"\n    ],\n    \"vpc_uuids\": [\n   \
          \     \"string\"\n    ]\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Authorization:\
          \ Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json' \\\n    --body-data '{\n    \"account_uuids\"\
          : [\n        \"string\"\n    ],\n    \"cluster_uuids\": [\n        \"string\"\n    ],\n    \"subnet_uuids\": [\n\
          \        \"string\"\n    ],\n    \"vpc_uuids\": [\n        \"string\"\n    ]\n}' \\\n    --output-document \\\n\
          \    - https://pc-host-ip:9440/api/nutanix/v3/calm_projects/validate"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"pc-host-ip:9440\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Authorization\": \"Basic <basic_auth_token>\",\n    \"Content-Type\": \"application/json\"\
          \n}\n\npayload =  \"\"\"{\n    \"account_uuids\": [\n        \"string\"\n    ],\n    \"cluster_uuids\": [\n    \
          \    \"string\"\n    ],\n    \"subnet_uuids\": [\n        \"string\"\n    ],\n    \"vpc_uuids\": [\n        \"string\"\
          \n    ]\n}\"\"\"\n\nconn.request(\"POST\",\"/api/nutanix/v3/calm_projects/validate\", payload, headers)\n\nres =\
          \ conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://pc-host-ip:9440/api/nutanix/v3/calm_projects/validate\"\n\t\n\tpayload :=  strings.NewReader(`{\"\
          account_uuids\": [\"string\"], \"cluster_uuids\": [\"string\"], \"subnet_uuids\": [\"string\"], \"vpc_uuids\": [\"\
          string\"]}`)\n\treq, err := http.NewRequest(\"POST\", url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"Error\
          \ creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"Accept\", \"application/json\")\n     \
          \   req.Header.Add(\"Authorization\", \"Basic <basic_auth_token>\")\n        req.Header.Add(\"Content-Type\", \"\
          application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"Error\
          \ creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\t\
          if err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\
          \n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://pc-host-ip:9440/api/nutanix/v3/calm_projects/validate\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\"\
          )\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"{\\\"account_uuids\\\": [\\\"string\\\"],\
          \ \\\"cluster_uuids\\\": [\\\"string\\\"], \\\"subnet_uuids\\\": [\\\"string\\\"], \\\"vpc_uuids\\\": [\\\"string\\\
          \"]}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://pc-host-ip:9440/api/nutanix/v3/calm_projects/validate';\nconst options = {\n  method:\
          \ 'POST',\n  headers: {'Accept': 'application/json', 'Authorization': 'Basic <basic_auth_token>', 'Content-Type':\
          \ 'application/json'},\n  body:  `{\"account_uuids\": [\"string\"], \"cluster_uuids\": [\"string\"], \"subnet_uuids\"\
          : [\"string\"], \"vpc_uuids\": [\"string\"]}`\n};\n\ntry {\n  const response = await fetch(url, options);\n  const\
          \ data = await response.json();\n  console.log(data);\n} catch (error) {\n  console.error(error);\n}"
components:
  requestBodies:
    project_validate_input:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/project_validate_input'
      required: true
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    project_validate_input:
      description: Project account input filters
      type: object
      properties:
        vpc_uuids:
          items:
            type: string
          type: array
        cluster_uuids:
          items:
            type: string
          type: array
        account_uuids:
          items:
            type: string
          type: array
        subnet_uuids:
          items:
            type: string
          type: array
      title: Project validate input filters
    project_validate_response:
      description: Project account response
      type: object
      properties:
        status:
          $ref: '#/components/schemas/project_status'
        spec:
          $ref: '#/components/schemas/project'
        api_version:
          type: string
        metadata:
          $ref: '#/components/schemas/project_metadata'
      title: Project account response
    message_resource:
      description: message.
      required:
      - message
      - reason
      type: object
      properties:
        message:
          type: string
          description: If state is ERROR, a message describing the error.
        reason:
          x-ntnx-enum:
          - ACCESS_DENIED
          - ACCESS_FORBIDDEN
          - ACTION_NOT_SUPPORTED
          - AUTHENTICATION_REQUIRED
          - BEARER_TOKEN_EXPIRED
          - BEARER_TOKEN_BAD_SIGNATURE
          - CANNOT_MODIFY_PRE_CONFIGURED_REPORT
          - CATEGORY_NAME_VALUE_MISMATCH
          - CONFIGURATION_INCOMPLETE
          - CONCURRENT_REQUESTS_NOT_ALLOWED
          - DEFAULT_PROJECT_UNAVAILABLE
          - DESERIALIZATION_FAILED
          - DIRECTORY_SERVICE_CONNECTION_FAILED
          - ENTITY_ALREADY_EXISTS
          - ENTITY_DELETION_FAILED
          - ENTITY_IS_READONLY
          - ENTITY_NAME_UUID_MISMATCH
          - ENTITY_NOT_CONFIGURED
          - ENTITY_NOT_FOUND
          - ENTITY_SAVE_ERROR
          - ENTITY_UPDATE_FAILED
          - IDEMPOTENCE_UUID_CREATION_FAILED
          - IDP_NOT_REACHABLE
          - INTERNAL_ERROR
          - INVALID_ARGUMENT
          - INVALID_AZ_NAME
          - INVALID_CONTENT_TYPE
          - INVALID_DATA_FORMAT
          - INVALID_PORTAL_CONFIGURATION
          - INVALID_REQUEST
          - INVALID_UUID
          - INVALID_OWNER_REFERENCE
          - INTERNAL_AZ_PROXY_SETUP_ERROR
          - INTERNAL_ERROR_REMOTE_REQUEST
          - INTERNAL_ROLE_ACCESS_DENIED
          - INCORRECT_EVENTS_FILTER
          - MISSING_ATTRIBUTE
          - MISSING_CURRENT_USER_METADATA
          - NAME_NOT_IN_DOMAIN
          - NO_RESPONSE_RECEIVED_FROM_PORTAL
          - PE_NOT_PAIRED_WITH_PC
          - PC_NOT_PAIRED_WITH_XI_PORTAL
          - REFERENCE_ERROR
          - RESERVED_ROLE_ACCESS_DENIED
          - REQUEST_NOT_SUPPORTED
          - REMOTE_CLUSTER_IP_FETCH_FAILED
          - REMOTE_CLUSTER_NOT_CONNECTED
          - REMOTE_CONNECTION_EXISTS
          - REMOTE_CONNECTION_NOT_FOUND
          - REPORT_CONFIG_NOT_FOUND
          - REPORTING_RESOURCE_NOT_FOUND
          - REPORTING_INTERNAL_ERROR
          - SERVICE_UNAVAILABLE
          - SEARCH_RESULT_PROCESSING_ERROR
          - TOO_MANY_REQUESTS
          - UNCONFIGURED_API_KEY
          - UNCONFIGURED_PORTAL_CONNECTION
          - UNSPECIFIED_EVENTS_FILTER
          - UNSUPPORTED_AZ_PROXY_API
          - UNSUPPORTED_MEDIA_TYPE_ERROR
          - UPLOAD_TO_S3_FAILED
          - VALIDATION_ERROR
          - INVALID_SSL_CERTIFICATE
          - ERROR_ATTACHING_FILE_TO_CASE
          - SPEC_UPDATE_ERROR
          - SPEC_INCOMPATIBLE_ERROR
          - CLOUD_UNREACHABLE_ERROR
          - INVALID_CLOUD_CREDENTIALS
          - IDP_PORTAL_UNREACHABLE
          - SELF_PAIRING_NOT_ALLOWED
          - PAIRING_FAILED
          - PAIRING_NOT_ALLOWED
          - PAIRING_INITIATING_NOT_ALLOWED
          - CLOUD_TRUST_EXISTS
          - DUPLICATE_CLOUD_TRUST
          - DUPLICATE_CLOUD_TRUST_ON_REMOTE
