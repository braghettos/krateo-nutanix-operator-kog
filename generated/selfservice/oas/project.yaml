            '
        categories_mapping:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
          description: 'Categories for the project. This allows setting up multiple

            values from a single key. Categories assigned using the older view will be

            present here. This is the new way of assigning categories.

            '
        should_force_translate:
          type: boolean
          description: 'Applied on Prism Central only. Indicate whether force to translate the spec of the fanout request
            to fit the target cluster API schema.

            '
        entity_version:
          readOnly: true
          type: string
          description: 'Logical entity version that allows serializing updates to the entity

            across multiple API namespaces.  For kinds that support

            entity_version, it overrides spec_version described above.

            '
        owner_reference:
          $ref: '#/components/schemas/user_reference'
        categories:
          additionalProperties:
            type: string
          type: object
          description: 'Categories for the project. This allows assigning one value

            of a key to any entity. Changes done in this will be reflected in

            the categories_mapping field.

            '
        name:
          readOnly: true
          type: string
          description: project name
          maxLength: 80
