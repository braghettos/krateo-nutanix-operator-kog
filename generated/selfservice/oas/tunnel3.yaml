      properties:
        kind:
          readOnly: true
          type: string
          description: The kind name
          x-ntnx-enum:
          - tunnel
        code:
          readOnly: true
          type: integer
          description: The HTTP error code.
        message_list:
          items:
            $ref: '#/components/schemas/message_resource'
          readOnly: true
          type: array
        state:
          readOnly: true
          type: string
        api_version:
          $ref: '#/components/schemas/api_version'
      title: Response Kind
    app_credential_reference:
      description: The reference to a app_credential
