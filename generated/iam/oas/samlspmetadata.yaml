openapi: 3.0.1
info:
  title: Nutanix IAM Versioned APIs
  description: Nutanix APIs for managing users, user-groups, directory services, identity providers, roles and authorization
    policies.
  version: '4.0'
  x-repo-name: iam
  x-logo:
    altText: Iam Logo
    url: https://developers.nutanix.com/api/v1/namespaces/iam/images/iam-logo-img.svg
servers:
- url: https://{pc-ip}:9440/api
security:
- basicAuthScheme: []
- apiKeyAuthScheme: []
paths:
  /iam/v4.0/authn/saml-sp-metadata:
    get:
      tags:
      - SAMLIdentityProviders
      summary: Get SP-Metadata for SAML identity provider
      description: Downloads SP-Metadata for SAML identity provider.
      operationId: getSamlSpMetadata
      responses:
        '200':
          description: SP-Metadata for SAML identity provider downloaded.
          content:
            text/xml:
              schema:
                type: string
                format: byte
        4XX:
          description: Client error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/iam.v4.0.error.ErrorResponse'
                additionalProperties: false
                description: REST response for all response codes in API path /iam/v4.0/authn/saml-sp-metadata Get operation
        5XX:
          description: Server error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/iam.v4.0.error.ErrorResponse'
                additionalProperties: false
                description: REST response for all response codes in API path /iam/v4.0/authn/saml-sp-metadata Get operation
      x-permissions:
        deploymentList:
        - ON_PREM
        - CLOUD
        operationName: View SP Metadata For SAML IdP
        roleList:
        - Super Admin
      x-rate-limit:
      - type: xsmall
        count: 5
        timeUnit: seconds
      - type: Small
        count: 5
        timeUnit: seconds
      - type: Large
        count: 10
        timeUnit: seconds
      - type: XLarge
        count: 10
        timeUnit: seconds
      x-supported-versions:
      - product: PC
        version: '2024.3'
      x-code-samples:
      - lang: Java
        source: "\npackage sample;\n\nimport com.nutanix.iam.java.client.ApiClient;\nimport com.nutanix.iam.java.client.api.SAMLIdentityProvidersApi;\n\
          import com.nutanix.dp1.iam.iam.v4.authn.GetSamlSpMetadataApiResponse;\nimport org.springframework.web.client.RestClientException;\n\
          \npublic class JavaSdkSample {\n    public static void main(String[] args) {\n        // Configure the client\n\
          \        ApiClient apiClient = new ApiClient();\n        // IPv4/IPv6 address or FQDN of the cluster\n        apiClient.setHost(\"\
          localhost\");\n        // Port to which to connect to\n        apiClient.setPort(9440);\n        // Interval in\
          \ ms to use during retry attempts\n        apiClient.setRetryInterval(5000);\n        // Max retry attempts while\
          \ reconnecting on a loss of connection\n        apiClient.setMaxRetryAttempts(5);\n        // UserName to connect\
          \ to the cluster\n        String username = \"username\";\n        // Password to connect to the cluster\n     \
          \   String password = \"password\";\n        apiClient.setUsername(username);\n        apiClient.setPassword(password);\n\
          \n        // Please add authorization information here if needed.\n        SAMLIdentityProvidersApi sAMLIdentityProvidersApi\
          \ = new SAMLIdentityProvidersApi(apiClient);\n\n\n        try {\n            GetSamlSpMetadataApiResponse getSamlSpMetadataApiResponse\
          \ = sAMLIdentityProvidersApi.getSamlSpMetadata();\n            System.out.println(getSamlSpMetadataApiResponse.toString());\n\
          \n        } catch (RestClientException ex) {\n            System.out.println(ex.getMessage());\n        }\n    }\n\
          }\n"
      - lang: JavaScript
        source: "\nimport { ApiClient, SAMLIdentityProvidersApi } from \"@nutanix-api/iam-js-client\";\n\n// Configure the\
          \ client\nlet apiClientInstance = new ApiClient();\n// IPv4/IPv6 address or FQDN of the cluster\napiClientInstance.host\
          \ = 'localhost';\n// Port to which to connect to\napiClientInstance.port = '9440';\n// Max retry attempts while\
          \ reconnecting on a loss of connection\napiClientInstance.maxRetryAttempts = 5;\n// Interval in ms to use during\
          \ retry attempts\napiClientInstance.retryInterval = 5000;\n// UserName to connect to the cluster\napiClientInstance.username\
          \ = 'username';\n// Password to connect to the cluster\napiClientInstance.password = 'password';\n// Please add\
          \ authorization information here if needed.\nlet sAMLIdentityProvidersApi = new SAMLIdentityProvidersApi(apiClientInstance);\n\
          \nfunction sample() {\n\n\n\n\n\n\n    sAMLIdentityProvidersApi.getSamlSpMetadata().then(({data, response}) => {\n\
          \        console.log(`API returned the following status code: ${response.status}`);\n        console.log(data.getData());\n\
          \    }).catch((error) => {\n        console.log(`Error is: ${error}`);\n    });\n\n}\nsample()\n"
      - lang: Python
        source: "\nimport ntnx_iam_py_client\n\nif __name__ == \"__main__\":\n    # Configure the client\n    config = ntnx_iam_py_client.Configuration()\n\
          \    # IPv4/IPv6 address or FQDN of the cluster\n    config.host = \"localhost\"\n    # Port to which to connect\
          \ to\n    config.port = 9440\n    # Max retry attempts while reconnecting on a loss of connection\n    config.max_retry_attempts\
          \ = 3\n    # Backoff factor to use during retry attempts\n    config.backoff_factor = 3\n    # UserName to connect\
          \ to the cluster\n    config.username = \"username\"\n    # Password to connect to the cluster\n    config.password\
          \ = \"password\"\n    # Please add authorization information here if needed.\n    client = ntnx_iam_py_client.ApiClient(configuration=config)\n\
          \    s_aml_identity_providers_api = ntnx_iam_py_client.SAMLIdentityProvidersApi(api_client=client)\n\n\n    try:\n\
          \        api_response = s_aml_identity_providers_api.get_saml_sp_metadata()\n        print(api_response)\n    except\
          \ ntnx_iam_py_client.rest.ApiException as e:\n        print(e)\n\n"
      - lang: Go
        source: "\npackage main\n\nimport (\n    \"fmt\"\n    \"time\"\n    \"github.com/nutanix/ntnx-api-golang-clients/iam-go-client/v4/api\"\
          \n    \"github.com/nutanix/ntnx-api-golang-clients/iam-go-client/v4/client\"\n)\n\nvar (\n    ApiClientInstance\
          \ *client.ApiClient\n    SAMLIdentityProvidersApiInstance *api.SAMLIdentityProvidersApi\n)\n\nfunc main() {\n  \
          \  ApiClientInstance = client.NewApiClient()\n    // IPv4/IPv6 address or FQDN of the cluster\n    ApiClientInstance.Host\
          \ = \"localhost\"\n    // Port to which to connect to\n    ApiClientInstance.Port = 9440\n    // Interval in ms\
          \ to use during retry attempts\n    ApiClientInstance.RetryInterval = 5 * time.Second\n    // Max retry attempts\
          \ while reconnecting on a loss of connection\n    ApiClientInstance.MaxRetryAttempts = 5\n    // UserName to connect\
          \ to the cluster\n    ApiClientInstance.Username = \"username\"\n    // Password to connect to the cluster\n   \
          \ ApiClientInstance.Password = \"password\"\n    // Please add authorization information here if needed.\n    SAMLIdentityProvidersApiInstance\
          \ = api.NewSAMLIdentityProvidersApi(ApiClientInstance)\n\n\n\n    response, error := SAMLIdentityProvidersApiInstance.GetSamlSpMetadata()\n\
          \    if error != nil {\n        fmt.Println(error)\n        return\n    }\n    data, _ := response.GetData().(import.)\n\
          \    fmt.Println(data)\n\n}\n\n"
      - lang: cURL
        source: "\ncurl --request GET \\\n     --url \"https://{pc-ip}:9440/api/iam/v4.0/authn/saml-sp-metadata\" \\\n   \
          \  --header 'Accept: text/xml' \\\n     --header 'Authorization:Basic $APP_ACCESS_TOKEN' \\\n\n"
      - lang: Wget
        source: "\n\nwget --verbose \\\n     --method GET \\\n     --header 'Accept: text/xml' \\\n--header 'Authorization:Basic\
          \ $APP_ACCESS_TOKEN' \\\n- \"https://{pc-ip}:9440/api/iam/v4.0/authn/saml-sp-metadata\"\n"
