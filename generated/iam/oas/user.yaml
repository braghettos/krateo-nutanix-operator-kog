      enum:
      - PREDEFINED
      - USERDEFINED
      - SERVICEDEFINED
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        PREDEFINED: Predefined creator workflow type is for entity created by the system.
        SERVICEDEFINED: Servicedefined creator workflow type is for entity created by the service.
        USERDEFINED: Userdefined creator workflow type is for entity created by the users.
        $UNKNOWN: 'Unknown value.

          '
        $REDACTED: 'Redacted value.

          '
    common.v1.0.config.Flag:
      type: object
      properties:
        name:
          maxLength: 128
          minLength: 3
          type: string
          description: 'Name of the flag.

            '
        value:
          type: boolean
          description: 'Value of the flag.

            '
          default: false
      additionalProperties: false
      description: 'Many entities in the Nutanix APIs carry flags.  This object captures all the flags associated with that
        entity through this object.  The field that hosts this type of object must have an attribute called x-bounded-map-keys
        that tells which flags are actually present for that entity.

        '
    iam.v4.0.authn.UserType:
