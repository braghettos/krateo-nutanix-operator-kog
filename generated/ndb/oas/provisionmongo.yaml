components:
  schemas:
    ERAPropertyValue:
      properties:
        description:
          type: string
        name:
          type: string
        ref_id:
          type: string
        secure:
          type: boolean
        value:
          type: string
      type: object
    TaskInfoSummary:
      properties:
        associatedOperations:
          items:
            $ref: '#/components/schemas/TaskInfoSummary'
          type: array
        dbserverId:
          description: ID of the Database Server. associated with the NDB Operation.
          format: uuid
          type: string
        dependencyReport:
          $ref: '#/components/schemas/EraDependencyReport'
        entityId:
          description: ID of the entity associated with the NDB Operation. For example, Time Machine ID.
          format: uuid
          type: string
        entityName:
          description: Name of the entity associated with the NDB Operation. For example, Time Machine ID.
          type: string
        entityType:
          type: string
        message:
          type: string
        name:
          description: Name of the Operation created in NDB.
          type: string
        operationId:
          description: ID of the Operation entry created in NDB.
          format: uuid
          type: string
        status:
          description: Status of the NDB Operation.
          type: string
        workId:
          description: ID of the work entry created in NDB.
          format: uuid
          type: string
      type: object
    EraDependencyReport:
      properties:
        dependenciesSatisfied:
          type: boolean
        dependenciesVerified:
          type: boolean
        ipAddress:
          type: string
        missingConfigurations:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
        missingDependencies:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
      type: object
    ProvisionMongosModel:
      description: Provision Mongos Model.
      properties:
        computeProfileId:
          format: uuid
          type: string
        createDbserver:
          type: boolean
        databaseDescription:
          type: string
        dbParameterProfileId:
          format: uuid
          type: string
        name:
          type: string
        networkProfileId:
          format: uuid
          type: string
        nodes:
          items:
            $ref: '#/components/schemas/Node'
          type: array
        nxClusterId:
          format: uuid
          type: string
        shardedClusterInfo:
          properties:
            mongosInfo:
              items:
                $ref: '#/components/schemas/ShardedClusterMember'
              type: array
          required:
          - mongosInfo
          type: object
        softwareProfileId:
          format: uuid
          type: string
        softwareProfileVersionId:
          format: uuid
          type: string
      type: object
    Node:
      properties:
        computeProfileId:
          format: uuid
          type: string
        networkProfileId:
          format: uuid
          type: string
        newDbServerTimeZone:
          properties: {}
          type: object
        nxClusterId:
          format: uuid
          type: string
        properties:
          items:
            properties: {}
            type: object
          type: array
        vmName:
          type: string
      type: object
    ShardedClusterMember:
      description: MongoDB Sharded Cluster member details.
      properties:
        memberVmNames:
          items:
            type: string
          type: array
        name:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/ERAPropertyValue'
          type: array
      required:
      - name
      - memberVmNames
      - properties
      type: object
    EraDependencyInfo:
      properties:
        dependencyName:
          type: string
        description:
          type: string
        isPresent:
          type: boolean
        isSoftware:
          type: boolean
        name:
          type: string
        requiredAction:
          type: string
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
