openapi: 3.0.1
info:
  description: "**Nutanix Database Service** (NDB) is a database as a service (DBaaS) that automates and simplifies database\
    \ administration, brings one-click simplicity and invisible operations to database provisioning and life-cycle management.\
    \ NDB enables database administrators to provision, clone, and refresh the databases at any point in time. NDB allows\
    \ administrators to define standards for their database provisioning needs with end-state driven functionality that includes\
    \ High Availability (HA) database deployments. NDB automates and simplifies the operations such as provisioning of databases\
    \ and copy data management. \n\n\n# Notes\n\nWhile making Nutanix API requests to the NDB services by using the default\
    \ self-signed certificates, the request needs to be configured to ignore SSL certificate verification requests. For example,\
    \ in case of a cURL, use _- - insecure_ flag to ensure that the SSL certificate used to encrypt the request should not\
    \ be verified."
  title: Nutanix NDB
  version: '0.9'
servers:
- url: /era/v0.9
security:
- era_token: []
- era_auth: []
paths:
  /resources/certs:
    get:
      operationId: getAllCACertificates
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CACertificateDTO'
                type: array
          description: Operation completed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Unauthorized:

            - Missing authentication token

            - Invalid authentication token

            - Token expired

            '
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Forbidden:

            - User doesn''t have required permissions

            '
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Internal Server Error:

            - Database error

            - System error

            '
      summary: Retrieves list of all imported CA certificates
      tags:
      - NDB Resources
      x-codeSamples:
      - lang: cURL
        source: "curl --request GET \\\n    --url :///era/v0.9/resources/certs \\\n    --header 'Authorization: Basic <basic_auth_token>'\
          \ \\\n     "
      - lang: Wget
        source: "wget --quiet \\\n    --method GET \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n      \\\
          \n    --output-document \\\n    - :///era/v0.9/resources/certs"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"\")\n\nheaders = {\n    \"Authorization\": \"\
          Basic <basic_auth_token>\"\n}\n \nconn.request(\"GET\",\"/era/v0.9/resources/certs\", headers=headers)\n\nres =\
          \ conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \":///era/v0.9/resources/certs\"\n\t \n\treq, err := http.NewRequest(\"GET\", url, nil)\n\tif err != nil {\n\
          \t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"Authorization\",\
          \ \"Basic <basic_auth_token>\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"\
          Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\t\
          fmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"GET\", \":///era/v0.9/resources/certs\"\
          )\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = ':///era/v0.9/resources/certs';\nconst options = {\n  method: 'GET',\n  headers: {'Authorization':\
          \ 'Basic <basic_auth_token>'} \n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await\
          \ response.json();\n  console.log(data);\n} catch (error) {\n  console.error(error);\n}"
    post:
      description: 'Imports a CA certificate into NDB Control Plane VMs.

        The certificate will be used for validating WinRM HTTPS connections.

        '
      operationId: addCACertificate
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                caType:
                  enum:
                  - AD Integrated
                  - Third Party
                  type: string
                certificateFile:
                  format: binary
                  type: string
                displayName:
                  maxLength: 128
                  pattern: ^[a-zA-Z0-9_-]+$
                  type: string
              required:
              - displayName
              - certificateFile
              - caType
              type: object
        description: "Required form fields to upload a CA certificate:\n\n- **displayName** (string, required):  \n  - Display\
          \ name for the certificate.  \n  - Must be unique.  \n  - Max length: 128 characters.  \n  - Pattern: ^[a-zA-Z0-9_-]+$\n\
          \n- **certificateFile** (file, required):  \n  - CA certificate file in PEM format only.  \n  - Max file size: 1MB.\
          \  \n  - Supported extensions: `.cer`, `.pem`, `.crt` , `.der` \n  - Must contain valid X.509 certificate(s).  \n\
          \  - For multi-chain CA configurations, must contain the complete certificate chain in a single file.\n\n- **caType**\
          \ (string, required):  \n  - Type of CA certificate.  \n  - Allowed values: `\"AD Integrated\"` for Active Directory\
          \ integrated CA or `\"Third Party\"` for externally managed CA.\n"
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CACertificateDTO'
          description: CA certificate added successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "Bad Request:\n- Invalid certificate format  \n  - Invalid certificate format. Only PEM-encoded X.509\
            \ certificates are supported.\"\n- Invalid display name  \n  - The display name must be alphanumeric and unique.\"\
            \n- Certificate already exists  \n  - A certificate with this display name already exists.\"\n- File size exceeded\
            \  \n  - Certificate file exceeds the maximum allowed size (1MB).\"\n- Certificate validation failed  \n  - Certificate\
            \ chain is incomplete. Missing issuer for CN=Intermediate-CA.\"\n"
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Unauthorized:

            - Missing authentication token

            - Invalid authentication token

            - Token expired

            '
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Forbidden:

            - User doesn''t have required permissions

            '
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Internal Server Error:

            - Certificate import failed

            - File processing error

            '
      summary: Imports a CA certificate to NDB
      tags:
      - NDB Resources
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url :///era/v0.9/resources/certs \\\n    --header 'Accept: multipart/form-data'\
          \ \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n    --header 'Content-Type: multipart/form-data'\
          \ \\\n    --data '{\n    \"caType\": \"AD Integrated\",\n    \"certificateFile\": 118972614966591299556308065,\n\
          \    \"displayName\": \"string\"\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: multipart/form-data' \\\n    --header 'Authorization:\
          \ Basic <basic_auth_token>' \\\n    --header 'Content-Type: multipart/form-data' \\\n    --body-data '{\n    \"\
          caType\": \"AD Integrated\",\n    \"certificateFile\": 118972614966591299556308065,\n    \"displayName\": \"string\"\
          \n}' \\\n    --output-document \\\n    - :///era/v0.9/resources/certs"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"\")\n\nheaders = {\n    \"Accept\": \"multipart/form-data\"\
          ,\n    \"Authorization\": \"Basic <basic_auth_token>\",\n    \"Content-Type\": \"multipart/form-data\"\n}\n\npayload\
          \ =  \"\"\"{\n    \"caType\": \"AD Integrated\",\n    \"certificateFile\": 118972614966591299556308065,\n    \"\
          displayName\": \"string\"\n}\"\"\"\n\nconn.request(\"POST\",\"/era/v0.9/resources/certs\", payload, headers)\n\n\
          res = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \":///era/v0.9/resources/certs\"\n\t\n\tpayload :=  strings.NewReader(`{\"caType\": \"AD Integrated\", \"certificateFile\"\
          : 118972614966591299556308065, \"displayName\": \"string\"}`)\n\treq, err := http.NewRequest(\"POST\", url, payload)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"\
          Accept\", \"multipart/form-data\")\n        req.Header.Add(\"Authorization\", \"Basic <basic_auth_token>\")\n  \
          \      req.Header.Add(\"Content-Type\", \"multipart/form-data\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\
          \tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\t\
          return\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \":///era/v0.9/resources/certs\"\
          )\n  .setHeader(\"Accept\", \"multipart/form-data\")\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\"\
          )\n  .setHeader(\"Content-Type\", \"multipart/form-data\")\n  .setBody(\"{\\\"caType\\\": \\\"AD Integrated\\\"\
          , \\\"certificateFile\\\": 118972614966591299556308065, \\\"displayName\\\": \\\"string\\\"}\")\n  .execute()\n\
          \  .toCompletableFuture()\n  .thenAccept(System.out::println)\n  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = ':///era/v0.9/resources/certs';\nconst options = {\n  method: 'POST',\n  headers: {'Accept':\
          \ 'multipart/form-data', 'Authorization': 'Basic <basic_auth_token>', 'Content-Type': 'multipart/form-data'},\n\
          \  body:  `{\"caType\": \"AD Integrated\", \"certificateFile\": 118972614966591299556308065, \"displayName\": \"\
          string\"}`\n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await response.json();\n\
          \  console.log(data);\n} catch (error) {\n  console.error(error);\n}"
  /resources/certs/{id}:
    delete:
      description: 'Deletes a CA certificate from NDB Control Plane VMs


        - The ID must be a valid UUID.

        '
      operationId: deleteCACertificateById
      parameters:
      - description: UUID of the certificate to delete.
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: CA certificate deleted successfully.
        '400':
          description: Invalid CA certificate ID format.
        '404':
          description: CA certificate not found.
        '500':
          description: Server error while deleting CA certificate.
      summary: Delete a CA Certificate by ID
      tags:
      - NDB Resources
      x-codeSamples:
      - lang: cURL
        source: "curl --request DELETE \\\n    --url :///era/v0.9/resources/certs/{id} \\\n    --header 'Authorization: Basic\
          \ <basic_auth_token>' \\\n     "
      - lang: Wget
        source: "wget --quiet \\\n    --method DELETE \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n    \
          \  \\\n    --output-document \\\n    - :///era/v0.9/resources/certs/{id}"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"\")\n\nheaders = {\n    \"Authorization\": \"\
          Basic <basic_auth_token>\"\n}\n \nconn.request(\"DELETE\",\"/era/v0.9/resources/certs/{id}\", headers=headers)\n\
          \nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \":///era/v0.9/resources/certs/{id}\"\n\t \n\treq, err := http.NewRequest(\"DELETE\", url, nil)\n\tif err !=\
          \ nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"Authorization\"\
          , \"Basic <basic_auth_token>\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"\
          Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\t\
          fmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"DELETE\", \":///era/v0.9/resources/certs/{id}\"\
          )\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = ':///era/v0.9/resources/certs/{id}';\nconst options = {\n  method: 'DELETE',\n  headers: {'Authorization':\
          \ 'Basic <basic_auth_token>'} \n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await\
          \ response.json();\n  console.log(data);\n} catch (error) {\n  console.error(error);\n}"
components:
  schemas:
    ERAPropertyValue:
      properties:
        description:
          type: string
        name:
          type: string
        ref_id:
          type: string
        secure:
          type: boolean
        value:
          type: string
      type: object
    ERAEntity:
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/ERAPropertyValue'
          type: array
        type:
          type: string
      type: object
    CACertificateDTO:
      properties:
        caType:
          type: string
        certificates:
          items:
            $ref: '#/components/schemas/CACertificateDetailsDTO'
          type: array
        dateCreated:
          format: date-time
          type: string
        dateModified:
          format: date-time
          type: string
        displayName:
          type: string
        id:
          format: uuid
          type: string
      type: object
    CACertificateDetailsDTO:
      properties:
        certificatePath:
          type: string
        expiryDate:
          format: date-time
          type: string
        issuer:
          type: string
        name:
          type: string
        status:
          type: string
      type: object
    ErrorResponse:
      properties:
        dependentEntities:
          items:
            $ref: '#/components/schemas/ERAEntity'
          type: array
        errorCode:
          type: string
        message:
          type: string
        reason:
          type: string
        remedy:
          type: string
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
