openapi: 3.0.1
info:
  description: "**Nutanix Database Service** (NDB) is a database as a service (DBaaS) that automates and simplifies database\
    \ administration, brings one-click simplicity and invisible operations to database provisioning and life-cycle management.\
    \ NDB enables database administrators to provision, clone, and refresh the databases at any point in time. NDB allows\
    \ administrators to define standards for their database provisioning needs with end-state driven functionality that includes\
    \ High Availability (HA) database deployments. NDB automates and simplifies the operations such as provisioning of databases\
    \ and copy data management. \n\n\n# Notes\n\nWhile making Nutanix API requests to the NDB services by using the default\
    \ self-signed certificates, the request needs to be configured to ignore SSL certificate verification requests. For example,\
    \ in case of a cURL, use _- - insecure_ flag to ensure that the SSL certificate used to encrypt the request should not\
    \ be verified."
  title: Nutanix NDB
  version: '0.9'
servers:
- url: /era/v0.9
security:
- era_token: []
- era_auth: []
paths:
  /maintenance/tasks:
    post:
      description: 'Adds operating system patching or database patching maintenance tasks for Database Server(s) or Database
        cluster(s).

        '
      operationId: createMaintenanceTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceTaskInfo'
        description: Payload required to create a maintenance task.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInfoSummary'
          description: Operation completed.
      summary: Add DB Server or Database Cluster for maintenance
      tags:
      - Maintenance
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url :///era/v0.9/maintenance/tasks \\\n    --header 'Accept: application/json'\
          \ \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json' \\\
          \n    --data '{\n    \"entities\": {\n        \"ERA_DBSERVER\": [\n            \"string\"\n        ],\n        \"\
          ERA_DBSERVER_CLUSTER\": [\n            \"string\"\n        ]\n    },\n    \"tasks\": [\n        {\n            \"\
          payload\": {\n                \"customPatchCommand\": {\n                    \"patchOSCommand\": \"string\",\n \
          \                   \"performReboot\": true,\n                    \"rollbackCommand\": \"string\"\n            \
          \    },\n                \"prePostCommand\": {\n                    \"postCommand\": \"string\",\n             \
          \       \"preCommand\": \"string\"\n                }\n            },\n            \"tasktype\": \"OS_PATCHING\"\
          \n        }\n    ]\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Authorization:\
          \ Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json' \\\n    --body-data '{\n    \"entities\"\
          : {\n        \"ERA_DBSERVER\": [\n            \"string\"\n        ],\n        \"ERA_DBSERVER_CLUSTER\": [\n    \
          \        \"string\"\n        ]\n    },\n    \"tasks\": [\n        {\n            \"payload\": {\n              \
          \  \"customPatchCommand\": {\n                    \"patchOSCommand\": \"string\",\n                    \"performReboot\"\
          : true,\n                    \"rollbackCommand\": \"string\"\n                },\n                \"prePostCommand\"\
          : {\n                    \"postCommand\": \"string\",\n                    \"preCommand\": \"string\"\n        \
          \        }\n            },\n            \"tasktype\": \"OS_PATCHING\"\n        }\n    ]\n}' \\\n    --output-document\
          \ \\\n    - :///era/v0.9/maintenance/tasks"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"\")\n\nheaders = {\n    \"Accept\": \"application/json\"\
          ,\n    \"Authorization\": \"Basic <basic_auth_token>\",\n    \"Content-Type\": \"application/json\"\n}\n\npayload\
          \ =  \"\"\"{\n    \"entities\": {\n        \"ERA_DBSERVER\": [\n            \"string\"\n        ],\n        \"ERA_DBSERVER_CLUSTER\"\
          : [\n            \"string\"\n        ]\n    },\n    \"tasks\": [\n        {\n            \"payload\": {\n      \
          \          \"customPatchCommand\": {\n                    \"patchOSCommand\": \"string\",\n                    \"\
          performReboot\": true,\n                    \"rollbackCommand\": \"string\"\n                },\n              \
          \  \"prePostCommand\": {\n                    \"postCommand\": \"string\",\n                    \"preCommand\":\
          \ \"string\"\n                }\n            },\n            \"tasktype\": \"OS_PATCHING\"\n        }\n    ]\n}\"\
          \"\"\n\nconn.request(\"POST\",\"/era/v0.9/maintenance/tasks\", payload, headers)\n\nres = conn.getresponse()\ndata\
          \ = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \":///era/v0.9/maintenance/tasks\"\n\t\n\tpayload :=  strings.NewReader(`{\"entities\": {\"ERA_DBSERVER\":\
          \ [\"string\"], \"ERA_DBSERVER_CLUSTER\": [\"string\"]}, \"tasks\": [{\"payload\": {\"customPatchCommand\": {\"\
          patchOSCommand\": \"string\", \"performReboot\": true, \"rollbackCommand\": \"string\"}, \"prePostCommand\": {\"\
          postCommand\": \"string\", \"preCommand\": \"string\"}}, \"tasktype\": \"OS_PATCHING\"}]}`)\n\treq, err := http.NewRequest(\"\
          POST\", url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\
          \        req.Header.Add(\"Accept\", \"application/json\")\n        req.Header.Add(\"Authorization\", \"Basic <basic_auth_token>\"\
          )\n        req.Header.Add(\"Content-Type\", \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\
          \tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\t\
          return\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \":///era/v0.9/maintenance/tasks\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\"\
          )\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"{\\\"entities\\\": {\\\"ERA_DBSERVER\\\":\
          \ [\\\"string\\\"], \\\"ERA_DBSERVER_CLUSTER\\\": [\\\"string\\\"]}, \\\"tasks\\\": [{\\\"payload\\\": {\\\"customPatchCommand\\\
          \": {\\\"patchOSCommand\\\": \\\"string\\\", \\\"performReboot\\\": true, \\\"rollbackCommand\\\": \\\"string\\\"\
          }, \\\"prePostCommand\\\": {\\\"postCommand\\\": \\\"string\\\", \\\"preCommand\\\": \\\"string\\\"}}, \\\"tasktype\\\
          \": \\\"OS_PATCHING\\\"}]}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n  .join();\n\
          \nclient.close();"
      - lang: JavaScript
        source: "const url = ':///era/v0.9/maintenance/tasks';\nconst options = {\n  method: 'POST',\n  headers: {'Accept':\
          \ 'application/json', 'Authorization': 'Basic <basic_auth_token>', 'Content-Type': 'application/json'},\n  body:\
          \  `{\"entities\": {\"ERA_DBSERVER\": [\"string\"], \"ERA_DBSERVER_CLUSTER\": [\"string\"]}, \"tasks\": [{\"payload\"\
          : {\"customPatchCommand\": {\"patchOSCommand\": \"string\", \"performReboot\": true, \"rollbackCommand\": \"string\"\
          }, \"prePostCommand\": {\"postCommand\": \"string\", \"preCommand\": \"string\"}}, \"tasktype\": \"OS_PATCHING\"\
          }]}`\n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await response.json();\n  console.log(data);\n\
          } catch (error) {\n  console.error(error);\n}"
components:
  schemas:
    MaintenanceTaskInfo:
      properties:
        entities:
          $ref: '#/components/schemas/MaintenanceTaskEntity'
        tasks:
          items:
            $ref: '#/components/schemas/MaintenanceTaskDTO'
          type: array
      type: object
    PatchOSDTO:
      properties:
        customPatchCommand:
          $ref: '#/components/schemas/PatchOSPatchCommandInfo'
        prePostCommand:
          $ref: '#/components/schemas/PatchOSPrePostCommandInfo'
      type: object
    PatchOSPatchCommandInfo:
      properties:
        patchOSCommand:
          type: string
        performReboot:
          type: boolean
        rollbackCommand:
          type: string
      type: object
    MaintenanceTaskDTO:
      properties:
        payload:
          $ref: '#/components/schemas/PatchOSDTO'
        tasktype:
          enum:
          - OS_PATCHING
          - DB_PATCHING
          type: string
      type: object
    TaskInfoSummary:
      properties:
        associatedOperations:
          items:
            $ref: '#/components/schemas/TaskInfoSummary'
          type: array
        dbserverId:
          description: ID of the Database Server. associated with the NDB Operation.
          format: uuid
          type: string
        dependencyReport:
          $ref: '#/components/schemas/EraDependencyReport'
        entityId:
          description: ID of the entity associated with the NDB Operation. For example, Time Machine ID.
          format: uuid
          type: string
        entityName:
          description: Name of the entity associated with the NDB Operation. For example, Time Machine ID.
          type: string
        entityType:
          type: string
        message:
          type: string
        name:
          description: Name of the Operation created in NDB.
          type: string
        operationId:
          description: ID of the Operation entry created in NDB.
          format: uuid
          type: string
        status:
          description: Status of the NDB Operation.
          type: string
        workId:
          description: ID of the work entry created in NDB.
          format: uuid
          type: string
      type: object
    EraDependencyReport:
      properties:
        dependenciesSatisfied:
          type: boolean
        dependenciesVerified:
          type: boolean
        ipAddress:
          type: string
        missingConfigurations:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
        missingDependencies:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
      type: object
    PatchOSPrePostCommandInfo:
      properties:
        postCommand:
          type: string
        preCommand:
          type: string
      type: object
    EraDependencyInfo:
      properties:
        dependencyName:
          type: string
        description:
          type: string
        isPresent:
          type: boolean
        isSoftware:
          type: boolean
        name:
          type: string
        requiredAction:
          type: string
      type: object
    MaintenanceTaskEntity:
      properties:
        ERA_DBSERVER:
          items:
            type: string
          type: array
        ERA_DBSERVER_CLUSTER:
          items:
            type: string
          type: array
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
