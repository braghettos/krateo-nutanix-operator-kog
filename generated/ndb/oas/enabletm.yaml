components:
  schemas:
    EraWeeklySchedule:
      properties:
        dayOfWeek:
          type: string
        dayOfWeekValue:
          enum:
          - SUNDAY
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          type: string
        enabled:
          type: boolean
      type: object
    ERAPropertyValue:
      properties:
        description:
          type: string
        name:
          type: string
        ref_id:
          type: string
        secure:
          type: boolean
        value:
          type: string
      type: object
    EraMonthlySchedule:
      properties:
        dayOfMonth:
          format: int32
          type: integer
        enabled:
          type: boolean
      type: object
    EraQuarterlySchedule:
      properties:
        dayOfMonth:
          format: int32
          type: integer
        enabled:
          type: boolean
        startMonth:
          type: string
        startMonthValue:
          enum:
          - JANUARY
          - FEBRUARY
          - MARCH
          - APRIL
          - MAY
          - JUNE
          - JULY
          - AUGUST
          - SEPTEMBER
          - OCTOBER
          - NOVEMBER
          - DECEMBER
          type: string
      type: object
    ERAEntity:
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/ERAPropertyValue'
          type: array
        type:
          type: string
      type: object
    EraScheduleDTO:
      description: Defines a backup schedule. Note - All properties are mandatory. If continuous schedule is not needed, you
        must still specify a valid object, with enabled=false. Omitting the object/property is not permitted.
      properties:
        continuousSchedule:
          $ref: '#/components/schemas/EraContinuousSchedule'
        continuousScheduleEnabled:
          type: boolean
        dailySchedule:
          $ref: '#/components/schemas/EraDailySchedule'
        dateCreated:
          type: string
        dateModified:
          type: string
        description:
          type: string
        globalPolicy:
          type: boolean
        id:
          format: uuid
          type: string
        monthlySchedule:
          $ref: '#/components/schemas/EraMonthlySchedule'
        name:
          type: string
        ownerId:
          format: uuid
          type: string
        quartelySchedule:
          $ref: '#/components/schemas/EraQuarterlySchedule'
        referenceCount:
          format: int32
          type: integer
        snapshotTimeOfDay:
          $ref: '#/components/schemas/ERAScheduleTime'
        startTime:
          type: string
        systemPolicy:
          type: boolean
        uniqueName:
          type: string
        weeklySchedule:
          $ref: '#/components/schemas/EraWeeklySchedule'
        yearlySchedule:
          $ref: '#/components/schemas/EraYearlySchedule'
      type: object
    EraContinuousSchedule:
      properties:
        enabled:
          type: boolean
        logBackupInterval:
          format: int32
          type: integer
        logBackupRepeatIntervalInMinutes:
          format: int32
          type: integer
        snapshotRepeatIntervalInMinutes:
          format: int32
          type: integer
        snapshotsPerDay:
          format: int32
          type: integer
      type: object
    TaskInfoSummary:
      properties:
        associatedOperations:
          items:
            $ref: '#/components/schemas/TaskInfoSummary'
          type: array
        dbserverId:
          description: ID of the Database Server. associated with the NDB Operation.
          format: uuid
          type: string
        dependencyReport:
          $ref: '#/components/schemas/EraDependencyReport'
        entityId:
          description: ID of the entity associated with the NDB Operation. For example, Time Machine ID.
          format: uuid
          type: string
        entityName:
          description: Name of the entity associated with the NDB Operation. For example, Time Machine ID.
          type: string
        entityType:
          type: string
        message:
          type: string
        name:
          description: Name of the Operation created in NDB.
          type: string
        operationId:
          description: ID of the Operation entry created in NDB.
          format: uuid
          type: string
        status:
          description: Status of the NDB Operation.
          type: string
        workId:
          description: ID of the work entry created in NDB.
          format: uuid
          type: string
      type: object
    EraYearlySchedule:
      properties:
        dayOfMonth:
          format: int32
          type: integer
        enabled:
          type: boolean
        month:
          type: string
        monthValue:
          enum:
          - JANUARY
          - FEBRUARY
          - MARCH
          - APRIL
          - MAY
          - JUNE
          - JULY
          - AUGUST
          - SEPTEMBER
          - OCTOBER
          - NOVEMBER
          - DECEMBER
          type: string
      type: object
    EnableTmMongoShardedClusterRequest:
      properties:
        backupPolicy:
          description: Backup Policy as json String
          type: string
        nxClusterIdStorageResourceIdMappings:
          additionalProperties:
            type: string
          description: Backup Nutanix Cluster ID to Storage Resource ID mapping provided for Point In Time Recovery.
          type: object
        nxClusterIds:
          description: Backup Nutanix Cluster ID provided for Point In Time Recovery.
          items:
            type: string
          type: array
        schedule:
          $ref: '#/components/schemas/EraScheduleDTO'
        scheduleId:
          description: The Schedule ID to associate with the Time Machine
          format: uuid
          type: string
        slaId:
          description: The SLA ID to associate with the Time Machine
          format: uuid
          type: string
      required:
      - slaId
      type: object
    EraDailySchedule:
      properties:
        enabled:
          type: boolean
      type: object
    EraDependencyReport:
      properties:
        dependenciesSatisfied:
          type: boolean
        dependenciesVerified:
          type: boolean
        ipAddress:
          type: string
        missingConfigurations:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
        missingDependencies:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
      type: object
    ErrorResponse:
      properties:
        dependentEntities:
          items:
            $ref: '#/components/schemas/ERAEntity'
          type: array
        errorCode:
          type: string
        message:
          type: string
        reason:
          type: string
        remedy:
          type: string
      type: object
    EraDependencyInfo:
      properties:
        dependencyName:
          type: string
        description:
          type: string
        isPresent:
          type: boolean
        isSoftware:
          type: boolean
        name:
          type: string
        requiredAction:
          type: string
      type: object
    ERAScheduleTime:
      properties:
        extra:
          type: boolean
        hours:
          format: int32
          type: integer
        minutes:
          format: int32
          type: integer
        repeatIntervalInMinutes:
          format: int32
          type: integer
        seconds:
          format: int32
          type: integer
        validScheduleTime:
          type: boolean
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
