openapi: 3.0.1
info:
  description: "**Nutanix Database Service** (NDB) is a database as a service (DBaaS) that automates and simplifies database\
    \ administration, brings one-click simplicity and invisible operations to database provisioning and life-cycle management.\
    \ NDB enables database administrators to provision, clone, and refresh the databases at any point in time. NDB allows\
    \ administrators to define standards for their database provisioning needs with end-state driven functionality that includes\
    \ High Availability (HA) database deployments. NDB automates and simplifies the operations such as provisioning of databases\
    \ and copy data management. \n\n\n# Notes\n\nWhile making Nutanix API requests to the NDB services by using the default\
    \ self-signed certificates, the request needs to be configured to ignore SSL certificate verification requests. For example,\
    \ in case of a cURL, use _- - insecure_ flag to ensure that the SSL certificate used to encrypt the request should not\
    \ be verified."
  title: Nutanix NDB
  version: '0.9'
servers:
- url: /era/v0.9
security:
- era_token: []
- era_auth: []
paths:
  /databases/{database-id}/action/enable-tm:
    post:
      description: 'Starts an Enable Time Machine operation on a MongoDB Sharded Cluster that already has an Ops Manager associated
        with it.

        '
      operationId: pushMongoDbShardedClusterEnableTmWork
      parameters:
      - description: The ID of the parent MongoDB Sharded Cluster database on which to enable Time Machine.
        in: path
        name: database-id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableTmMongoShardedClusterRequest'
        description: Payload containing the SLA and schedule configuration for enabling Time Machine.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInfoSummary'
          description: Enable Time Machine operation submitted successfully.
        '403':
          description: Forbidden. Inadequate rights on the database to enable Time Machine.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity. Time Machine on this database is already enabled.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error.
      summary: Enable Time Machine on a MongoDB Sharded Cluster database.
      tags:
      - Databases
