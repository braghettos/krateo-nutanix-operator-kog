openapi: 3.0.1
info:
  description: "**Nutanix Database Service** (NDB) is a database as a service (DBaaS) that automates and simplifies database\
    \ administration, brings one-click simplicity and invisible operations to database provisioning and life-cycle management.\
    \ NDB enables database administrators to provision, clone, and refresh the databases at any point in time. NDB allows\
    \ administrators to define standards for their database provisioning needs with end-state driven functionality that includes\
    \ High Availability (HA) database deployments. NDB automates and simplifies the operations such as provisioning of databases\
    \ and copy data management. \n\n\n# Notes\n\nWhile making Nutanix API requests to the NDB services by using the default\
    \ self-signed certificates, the request needs to be configured to ignore SSL certificate verification requests. For example,\
    \ in case of a cURL, use _- - insecure_ flag to ensure that the SSL certificate used to encrypt the request should not\
    \ be verified."
  title: Nutanix NDB
  version: '0.9'
servers:
- url: /era/v0.9
security:
- era_token: []
- era_auth: []
paths:
  /dbservers/register:
    post:
      description: "Registers a Database Server running on a Nutanix cluster with NDB. There are prerequisites for a DB Server\
        \ to be registered with NDB. \nRefer to the official NDB guide for more information.\n"
      operationId: registerDBServer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDBServerModel'
        description: Payload required to register a Database Server.
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInfoSummary'
          description: Operation completed.
      summary: Register an existing Database Server
      tags:
      - Database Servers
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url :///era/v0.9/dbservers/register \\\n    --header 'Accept: application/json'\
          \ \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json' \\\
          \n    --data '{\n    \"actionArguments\": [\n        {\n            \"name\": \"string\",\n            \"value\"\
          : {}\n        }\n    ],\n    \"databaseType\": \"oracle_database\",\n    \"forcedInstall\": true,\n    \"nxClusterUuid\"\
          : \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\",\n    \"password\": \"string\",\n    \"username\": \"string\",\n    \"\
          vmIp\": \"192.168.0.1\",\n    \"workingDirectory\": \"string\"\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Authorization:\
          \ Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json' \\\n    --body-data '{\n    \"actionArguments\"\
          : [\n        {\n            \"name\": \"string\",\n            \"value\": {}\n        }\n    ],\n    \"databaseType\"\
          : \"oracle_database\",\n    \"forcedInstall\": true,\n    \"nxClusterUuid\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\
          ,\n    \"password\": \"string\",\n    \"username\": \"string\",\n    \"vmIp\": \"192.168.0.1\",\n    \"workingDirectory\"\
          : \"string\"\n}' \\\n    --output-document \\\n    - :///era/v0.9/dbservers/register"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"\")\n\nheaders = {\n    \"Accept\": \"application/json\"\
          ,\n    \"Authorization\": \"Basic <basic_auth_token>\",\n    \"Content-Type\": \"application/json\"\n}\n\npayload\
          \ =  \"\"\"{\n    \"actionArguments\": [\n        {\n            \"name\": \"string\",\n            \"value\": {}\n\
          \        }\n    ],\n    \"databaseType\": \"oracle_database\",\n    \"forcedInstall\": true,\n    \"nxClusterUuid\"\
          : \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\",\n    \"password\": \"string\",\n    \"username\": \"string\",\n    \"\
          vmIp\": \"192.168.0.1\",\n    \"workingDirectory\": \"string\"\n}\"\"\"\n\nconn.request(\"POST\",\"/era/v0.9/dbservers/register\"\
          , payload, headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \":///era/v0.9/dbservers/register\"\n\t\n\tpayload :=  strings.NewReader(`{\"actionArguments\": [{\"name\"\
          : \"string\", \"value\": {}}], \"databaseType\": \"oracle_database\", \"forcedInstall\": true, \"nxClusterUuid\"\
          : \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\", \"password\": \"string\", \"username\": \"string\", \"vmIp\": \"192.168.0.1\"\
          , \"workingDirectory\": \"string\"}`)\n\treq, err := http.NewRequest(\"POST\", url, payload)\n\tif err != nil {\n\
          \t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"Accept\", \"application/json\"\
          )\n        req.Header.Add(\"Authorization\", \"Basic <basic_auth_token>\")\n        req.Header.Add(\"Content-Type\"\
          , \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"Error\
          \ creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\t\
          if err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\
          \n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \":///era/v0.9/dbservers/register\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\"\
          )\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"{\\\"actionArguments\\\": [{\\\"name\\\":\
          \ \\\"string\\\", \\\"value\\\": {}}], \\\"databaseType\\\": \\\"oracle_database\\\", \\\"forcedInstall\\\": true,\
          \ \\\"nxClusterUuid\\\": \\\"b4d15375-1097-4c96-a4c4-4cb5809b05bb\\\", \\\"password\\\": \\\"string\\\", \\\"username\\\
          \": \\\"string\\\", \\\"vmIp\\\": \\\"192.168.0.1\\\", \\\"workingDirectory\\\": \\\"string\\\"}\")\n  .execute()\n\
          \  .toCompletableFuture()\n  .thenAccept(System.out::println)\n  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = ':///era/v0.9/dbservers/register';\nconst options = {\n  method: 'POST',\n  headers: {'Accept':\
          \ 'application/json', 'Authorization': 'Basic <basic_auth_token>', 'Content-Type': 'application/json'},\n  body:\
          \  `{\"actionArguments\": [{\"name\": \"string\", \"value\": {}}], \"databaseType\": \"oracle_database\", \"forcedInstall\"\
          : true, \"nxClusterUuid\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\", \"password\": \"string\", \"username\": \"\
          string\", \"vmIp\": \"192.168.0.1\", \"workingDirectory\": \"string\"}`\n};\n\ntry {\n  const response = await fetch(url,\
          \ options);\n  const data = await response.json();\n  console.log(data);\n} catch (error) {\n  console.error(error);\n\
          }"
components:
  schemas:
    TaskInfoSummary:
      properties:
        associatedOperations:
          items:
            $ref: '#/components/schemas/TaskInfoSummary'
          type: array
        dbserverId:
          description: ID of the Database Server. associated with the NDB Operation.
          format: uuid
          type: string
        dependencyReport:
          $ref: '#/components/schemas/EraDependencyReport'
        entityId:
          description: ID of the entity associated with the NDB Operation. For example, Time Machine ID.
          format: uuid
          type: string
        entityName:
          description: Name of the entity associated with the NDB Operation. For example, Time Machine ID.
          type: string
        entityType:
          type: string
        message:
          type: string
        name:
          description: Name of the Operation created in NDB.
          type: string
        operationId:
          description: ID of the Operation entry created in NDB.
          format: uuid
          type: string
        status:
          description: Status of the NDB Operation.
          type: string
        workId:
          description: ID of the work entry created in NDB.
          format: uuid
          type: string
      type: object
    EraDependencyReport:
      properties:
        dependenciesSatisfied:
          type: boolean
        dependenciesVerified:
          type: boolean
        ipAddress:
          type: string
        missingConfigurations:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
        missingDependencies:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
      type: object
    RegisterDBServerModel:
      description: Register Database Server Model.
      properties:
        actionArguments:
          items:
            $ref: '#/components/schemas/ActionArguments'
          type: array
        databaseType:
          enum:
          - oracle_database
          - postgres_database
          - sqlserver_database
          - mariadb_database
          - mysql_database
          - mongodb_database
          type: string
        forcedInstall:
          type: boolean
        nxClusterUuid:
          format: uuid
          type: string
        password:
          type: string
        username:
          type: string
        vmIp:
          format: ipv4
          type: string
        workingDirectory:
          type: string
      type: object
    EraDependencyInfo:
      properties:
        dependencyName:
          type: string
        description:
          type: string
        isPresent:
          type: boolean
        isSoftware:
          type: boolean
        name:
          type: string
        requiredAction:
          type: string
      type: object
    ActionArguments:
      properties:
        name:
          type: string
        value:
          type: object
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
