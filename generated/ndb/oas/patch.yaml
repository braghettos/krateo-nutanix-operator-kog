openapi: 3.0.1
info:
  description: "**Nutanix Database Service** (NDB) is a database as a service (DBaaS) that automates and simplifies database\
    \ administration, brings one-click simplicity and invisible operations to database provisioning and life-cycle management.\
    \ NDB enables database administrators to provision, clone, and refresh the databases at any point in time. NDB allows\
    \ administrators to define standards for their database provisioning needs with end-state driven functionality that includes\
    \ High Availability (HA) database deployments. NDB automates and simplifies the operations such as provisioning of databases\
    \ and copy data management. \n\n\n# Notes\n\nWhile making Nutanix API requests to the NDB services by using the default\
    \ self-signed certificates, the request needs to be configured to ignore SSL certificate verification requests. For example,\
    \ in case of a cURL, use _- - insecure_ flag to ensure that the SSL certificate used to encrypt the request should not\
    \ be verified."
  title: Nutanix NDB
  version: '0.9'
servers:
- url: /era/v0.9
security:
- era_token: []
- era_auth: []
paths:
  /dbservers/{dbserver_id}/patch:
    post:
      description: Patch the Database Server details using the Database Server ID.
      operationId: patchDbServer
      parameters:
      - description: ID of the Database Server. to patch.
        in: path
        name: dbserver_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDBServerModel'
        description: Payload required to patch the Database Server.
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInfoSummary'
          description: Operation completed.
      summary: Patch a Database Server
      tags:
      - Database Servers
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url :///era/v0.9/dbservers/{dbserver_id}/patch \\\n    --header 'Accept: application/json'\
          \ \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json' \\\
          \n    --data '{\n    \"actionArguments\": [\n        {\n            \"name\": \"string\",\n            \"value\"\
          : {}\n        }\n    ],\n    \"scheduleInfo\": {\n        \"scheduleTime\": \"string\",\n        \"timeZone\": \"\
          string\"\n    },\n    \"softwareProfileVersionId\": \"string\"\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Authorization:\
          \ Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json' \\\n    --body-data '{\n    \"actionArguments\"\
          : [\n        {\n            \"name\": \"string\",\n            \"value\": {}\n        }\n    ],\n    \"scheduleInfo\"\
          : {\n        \"scheduleTime\": \"string\",\n        \"timeZone\": \"string\"\n    },\n    \"softwareProfileVersionId\"\
          : \"string\"\n}' \\\n    --output-document \\\n    - :///era/v0.9/dbservers/{dbserver_id}/patch"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"\")\n\nheaders = {\n    \"Accept\": \"application/json\"\
          ,\n    \"Authorization\": \"Basic <basic_auth_token>\",\n    \"Content-Type\": \"application/json\"\n}\n\npayload\
          \ =  \"\"\"{\n    \"actionArguments\": [\n        {\n            \"name\": \"string\",\n            \"value\": {}\n\
          \        }\n    ],\n    \"scheduleInfo\": {\n        \"scheduleTime\": \"string\",\n        \"timeZone\": \"string\"\
          \n    },\n    \"softwareProfileVersionId\": \"string\"\n}\"\"\"\n\nconn.request(\"POST\",\"/era/v0.9/dbservers/{dbserver_id}/patch\"\
          , payload, headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \":///era/v0.9/dbservers/{dbserver_id}/patch\"\n\t\n\tpayload :=  strings.NewReader(`{\"actionArguments\":\
          \ [{\"name\": \"string\", \"value\": {}}], \"scheduleInfo\": {\"scheduleTime\": \"string\", \"timeZone\": \"string\"\
          }, \"softwareProfileVersionId\": \"string\"}`)\n\treq, err := http.NewRequest(\"POST\", url, payload)\n\tif err\
          \ != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"Accept\"\
          , \"application/json\")\n        req.Header.Add(\"Authorization\", \"Basic <basic_auth_token>\")\n        req.Header.Add(\"\
          Content-Type\", \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"\
          Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\t\
          fmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \":///era/v0.9/dbservers/{dbserver_id}/patch\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\"\
          )\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"{\\\"actionArguments\\\": [{\\\"name\\\":\
          \ \\\"string\\\", \\\"value\\\": {}}], \\\"scheduleInfo\\\": {\\\"scheduleTime\\\": \\\"string\\\", \\\"timeZone\\\
          \": \\\"string\\\"}, \\\"softwareProfileVersionId\\\": \\\"string\\\"}\")\n  .execute()\n  .toCompletableFuture()\n\
