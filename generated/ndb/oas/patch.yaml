      - lang: JavaScript
        source: "const url = ':///era/v0.9/dbservers/{dbserver_id}/patch';\nconst options = {\n  method: 'POST',\n  headers:\
          \ {'Accept': 'application/json', 'Authorization': 'Basic <basic_auth_token>', 'Content-Type': 'application/json'},\n\
          \  body:  `{\"actionArguments\": [{\"name\": \"string\", \"value\": {}}], \"scheduleInfo\": {\"scheduleTime\": \"\
          string\", \"timeZone\": \"string\"}, \"softwareProfileVersionId\": \"string\"}`\n};\n\ntry {\n  const response =\
          \ await fetch(url, options);\n  const data = await response.json();\n  console.log(data);\n} catch (error) {\n \
          \ console.error(error);\n}"
components:
  schemas:
    TaskInfoSummary:
      properties:
        associatedOperations:
          items:
            $ref: '#/components/schemas/TaskInfoSummary'
          type: array
        dbserverId:
          description: ID of the Database Server. associated with the NDB Operation.
          format: uuid
          type: string
        dependencyReport:
          $ref: '#/components/schemas/EraDependencyReport'
        entityId:
          description: ID of the entity associated with the NDB Operation. For example, Time Machine ID.
          format: uuid
          type: string
        entityName:
          description: Name of the entity associated with the NDB Operation. For example, Time Machine ID.
          type: string
        entityType:
          type: string
        message:
          type: string
        name:
          description: Name of the Operation created in NDB.
          type: string
        operationId:
          description: ID of the Operation entry created in NDB.
          format: uuid
          type: string
        status:
          description: Status of the NDB Operation.
          type: string
        workId:
          description: ID of the work entry created in NDB.
          format: uuid
          type: string
      type: object
    EraDependencyReport:
      properties:
        dependenciesSatisfied:
          type: boolean
        dependenciesVerified:
          type: boolean
        ipAddress:
          type: string
        missingConfigurations:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
        missingDependencies:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
      type: object
    PatchDBServerModel:
      properties:
        actionArguments:
          items:
            $ref: '#/components/schemas/ActionArguments'
          type: array
        scheduleInfo:
          $ref: '#/components/schemas/ScheduleInfo'
        softwareProfileVersionId:
          type: string
      type: object
    ScheduleInfo:
      properties:
        scheduleTime:
          type: string
        timeZone:
          type: string
      type: object
    EraDependencyInfo:
      properties:
        dependencyName:
          type: string
        description:
          type: string
        isPresent:
          type: boolean
        isSoftware:
          type: boolean
        name:
          type: string
        requiredAction:
          type: string
      type: object
    ActionArguments:
      properties:
        name:
          type: string
        value:
          type: object
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
