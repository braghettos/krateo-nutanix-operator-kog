          type: string
        ref_id:
          type: string
        secure:
          type: boolean
        value:
          type: string
      type: object
    ERAEntity:
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/ERAPropertyValue'
          type: array
        type:
          type: string
      type: object
    ERAUser:
      properties:
        customerId:
          type: string
        directoryId:
          type: string
        email:
          type: string
        encrypted:
          type: boolean
        eulaAccepted:
          type: boolean
        groups:
          items:
            type: string
          type: array
        id:
          format: uuid
          type: string
        internalUser:
          type: boolean
        isExternalAuth:
          type: boolean
        password:
          type: string
        passwordExpired:
          type: boolean
        passwordHint:
          type: string
        privilegeEndpoints:
          items:
            type: string
          type: array
          uniqueItems: true
        properties: {}
        resetProfile:
          type: boolean
        roles:
          items:
            type: string
          type: array
        rolesGroupMapping:
          additionalProperties:
            items:
              type: string
            type: array
            uniqueItems: true
          type: object
        state:
          type: string
        unresetProfile:
          type: boolean
        username:
          type: string
      type: object
    ErrorResponse:
      properties:
        dependentEntities:
          items:
            $ref: '#/components/schemas/ERAEntity'
          type: array
        errorCode:
          type: string
        message:
          type: string
        reason:
          type: string
        remedy:
          type: string
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
