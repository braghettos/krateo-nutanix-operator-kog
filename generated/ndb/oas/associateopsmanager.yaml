      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \":///era/v0.9/databases/{database-id}/associate-ops-manager\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\"\
          )\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"{\\\"mmsApiKey\\\": \\\"string\\\", \\\"omAgentDownloadUrl\\\
          \": \\\"string\\\", \\\"omAgentLogStorageSizeInGB\\\": 0, \\\"omDBUserName\\\": \\\"string\\\", \\\"omDBUserPassword\\\
          \": \\\"string\\\", \\\"omGroupId\\\": \\\"string\\\", \\\"omOrgId\\\": \\\"string\\\", \\\"opsMgrId\\\": \\\"b4d15375-1097-4c96-a4c4-4cb5809b05bb\\\
          \"}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = ':///era/v0.9/databases/{database-id}/associate-ops-manager';\nconst options = {\n  method: 'POST',\n\
          \  headers: {'Accept': 'application/json', 'Authorization': 'Basic <basic_auth_token>', 'Content-Type': 'application/json'},\n\
          \  body:  `{\"mmsApiKey\": \"string\", \"omAgentDownloadUrl\": \"string\", \"omAgentLogStorageSizeInGB\": 0, \"\
          omDBUserName\": \"string\", \"omDBUserPassword\": \"string\", \"omGroupId\": \"string\", \"omOrgId\": \"string\"\
