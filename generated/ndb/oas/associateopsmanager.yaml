components:
  schemas:
    AssociateOpsManagerRequest:
      properties:
        mmsApiKey:
          description: API key generated in Ops Manager to communicate with it.
          type: string
        omAgentDownloadUrl:
          description: URL to download OM Agent from Ops Manager
          type: string
        omAgentLogStorageSizeInGB:
          description: Size of the Ops Manager Agent's log storage. This is optional, with a default size of 5 GB.
          format: int32
          type: integer
        omDBUserName:
          description: Optional database username for Ops Manager; defaults to mmsAgent if not specified.
          type: string
        omDBUserPassword:
          description: Optional database user password for Ops Manager; defaults to a randomly generated 16-character value.
          type: string
        omGroupId:
          description: The id of the group or project in Ops Manager.
          type: string
        omOrgId:
          description: The id of the organisation in Ops Manager.
          type: string
        opsMgrId:
          description: The id of the Ops Manager registered in NDB.
          format: uuid
          type: string
      required:
      - opsMgrId
      - omOrgId
      - omGroupId
      - mmsApiKey
      - omAgentDownloadUrl
      type: object
    ERAPropertyValue:
      properties:
        description:
          type: string
        name:
          type: string
        ref_id:
          type: string
        secure:
          type: boolean
        value:
          type: string
      type: object
    ERAEntity:
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/ERAPropertyValue'
          type: array
        type:
          type: string
      type: object
    TaskInfoSummary:
      properties:
        associatedOperations:
          items:
            $ref: '#/components/schemas/TaskInfoSummary'
          type: array
        dbserverId:
          description: ID of the Database Server. associated with the NDB Operation.
          format: uuid
          type: string
        dependencyReport:
          $ref: '#/components/schemas/EraDependencyReport'
        entityId:
          description: ID of the entity associated with the NDB Operation. For example, Time Machine ID.
          format: uuid
          type: string
        entityName:
          description: Name of the entity associated with the NDB Operation. For example, Time Machine ID.
          type: string
        entityType:
          type: string
        message:
          type: string
        name:
          description: Name of the Operation created in NDB.
          type: string
        operationId:
          description: ID of the Operation entry created in NDB.
          format: uuid
          type: string
        status:
          description: Status of the NDB Operation.
          type: string
        workId:
          description: ID of the work entry created in NDB.
          format: uuid
          type: string
      type: object
    EraDependencyReport:
      properties:
        dependenciesSatisfied:
          type: boolean
        dependenciesVerified:
          type: boolean
        ipAddress:
          type: string
        missingConfigurations:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
        missingDependencies:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
      type: object
    ErrorResponse:
      properties:
        dependentEntities:
          items:
            $ref: '#/components/schemas/ERAEntity'
          type: array
        errorCode:
          type: string
        message:
          type: string
        reason:
          type: string
        remedy:
          type: string
      type: object
    EraDependencyInfo:
      properties:
        dependencyName:
          type: string
        description:
          type: string
        isPresent:
          type: boolean
        isSoftware:
          type: boolean
        name:
          type: string
        requiredAction:
          type: string
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
