          local time zone.
        in: header
        name: client_tz
        schema:
          type: string
      - in: query
        name: entityType
        schema:
          enum:
          - DATABASE
          - TIME_MACHINE
          - CLONE
          - DATABASE_SERVER
          type: string
      - in: query
        name: id
        schema:
          format: uuid
          type: string
