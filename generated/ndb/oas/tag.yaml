components:
  schemas:
    UpdateTagModel:
      properties:
        description:
          type: string
        name:
          type: string
        owner:
          type: string
        required:
          type: boolean
        status:
          enum:
          - ENABLED
          - DEPRECATED
          type: string
      required:
      - name
      - owner
      type: object
    EraTagDTO:
      properties:
        dateCreated:
          type: string
        dateModified:
          type: string
        description:
          type: string
        entityType:
          enum:
          - DATABASE
          - TIME_MACHINE
          - DATABASE_SERVER
          - CLONE
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        owner:
          type: string
        required:
          type: boolean
        status:
          enum:
          - ENABLED
          - DEPRECATED
          type: string
        values:
          format: int32
          type: integer
      type: object
    TagModel:
      properties:
        description:
          type: string
        entityType:
          enum:
          - DATABASE
          - TIME_MACHINE
          - CLONE
          - DATABASE_SERVER
          type: string
        name:
          type: string
        required:
          type: boolean
        status:
          enum:
          - ENABLED
          - DEPRECATED
          type: string
      required:
      - entityType
      - name
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
