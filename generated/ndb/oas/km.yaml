          items:
            $ref: '#/components/schemas/ERAPropertyValue'
          type: array
        type:
          type: string
      type: object
    KMS:
      properties:
        configCount:
          readOnly: true
          type: integer
        dateCreated:
          readOnly: true
          type: string
        dateModified:
          readOnly: true
          type: string
        description:
          type: string
        host:
          type: string
        id:
          format: uuid
          readOnly: true
          type: string
        name:
          type: string
        ownerId:
          format: uuid
          readOnly: true
          type: string
        port:
          type: integer
        status:
          readOnly: true
          type: string
        type:
          type: string
      type: object
    ErrorResponse:
      properties:
        dependentEntities:
          items:
            $ref: '#/components/schemas/ERAEntity'
          type: array
        errorCode:
          type: string
        message:
          type: string
        reason:
          type: string
        remedy:
          type: string
