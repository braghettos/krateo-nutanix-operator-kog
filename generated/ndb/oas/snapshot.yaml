          \ response.json();\n  console.log(data);\n} catch (error) {\n  console.error(error);\n}"
components:
  schemas:
    ERASnapshotInfo:
      properties:
        info:
          properties: {}
          type: object
        secureInfo:
          properties: {}
          type: object
      type: object
    DeregisterInfo:
      properties:
        message:
          type: string
        operations:
          items:
            type: string
          type: array
      type: object
    ERAPropertyValue:
      properties:
        description:
          type: string
        name:
          type: string
        ref_id:
          type: string
        secure:
          type: boolean
        value:
          type: string
      type: object
    ERASnapshotDTO:
      properties:
        appInfoVersion:
          type: string
        applicableTypeFrequencies:
          items:
            $ref: '#/components/schemas/snapshotType'
          type: array
        applicableTypes:
          items:
            type: string
          type: array
        databaseNodeId:
          format: uuid
          type: string
        databaseSnapshot:
          type: boolean
        dateCreated:
          type: string
        dateModified:
          type: string
        dbserverId:
          format: uuid
          type: string
        dbserverIp:
          format: ipv4
          type: string
        dbserverName:
          type: string
        description:
          type: string
        fromTimeStamp:
          type: string
        id:
          format: uuid
          type: string
        info:
          $ref: '#/components/schemas/ERASnapshotInfo'
        lcmConfig:
          $ref: '#/components/schemas/EraLCMConfigInfoEraEntityExpiryPolicy'
        metadata:
          $ref: '#/components/schemas/ERASnapshotMetadata'
        name:
          type: string
        ownerId:
          format: uuid
          type: string
        processed:
          type: boolean
        properties:
          items:
            $ref: '#/components/schemas/ERAPropertyValue'
          type: array
        protectionDomainId:
          format: uuid
          type: string
        queryCount:
          type: integer
        snapshotId:
          format: uuid
          type: string
        snapshotSize:
          type: string
        snapshotTimeStamp:
          type: string
        snapshotUuid:
          format: uuid
          type: string
        status:
          type: string
        tags:
          items:
            $ref: '#/components/schemas/EraTagValueDTO'
          type: array
        timeMachineId:
          format: uuid
          type: string
        timeZone:
          type: string
        toTimeStamp:
          type: string
        type:
          type: string
        typeFrequency:
          $ref: '#/components/schemas/snapshotType'
      type: object
    TaskInfoSummary:
      properties:
        associatedOperations:
          items:
            $ref: '#/components/schemas/TaskInfoSummary'
          type: array
        dbserverId:
          description: ID of the Database Server. associated with the NDB Operation.
          format: uuid
          type: string
        dependencyReport:
          $ref: '#/components/schemas/EraDependencyReport'
        entityId:
          description: ID of the entity associated with the NDB Operation. For example, Time Machine ID.
          format: uuid
          type: string
        entityName:
          description: Name of the entity associated with the NDB Operation. For example, Time Machine ID.
          type: string
        entityType:
          type: string
        message:
          type: string
        name:
          description: Name of the Operation created in NDB.
          type: string
        operationId:
          description: ID of the Operation entry created in NDB.
          format: uuid
          type: string
        status:
          description: Status of the NDB Operation.
          type: string
        workId:
          description: ID of the work entry created in NDB.
          format: uuid
          type: string
      type: object
    EraLCMConfigInfoEraEntityExpiryPolicy:
      properties:
        expiryDetails:
          $ref: '#/components/schemas/EraEntityExpiryPolicy'
        postDeleteCommand:
          $ref: '#/components/schemas/EraPostDeleteCommand'
        preDeleteCommand:
          $ref: '#/components/schemas/EraPreDeleteCommand'
        refreshDetails:
          $ref: '#/components/schemas/EraEntityRefreshPolicy'
      type: object
    EraDependencyReport:
      properties:
        dependenciesSatisfied:
          type: boolean
        dependenciesVerified:
          type: boolean
        ipAddress:
          type: string
        missingConfigurations:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
        missingDependencies:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
      type: object
    snapshotType:
      description: he type of the snapshot (used to determine retention policies)
      enum:
      - CONTINUOUS
      - NONE
      - CONTINUOUS_EXTRA
      - TRANSIENT
      - CONTINUOUS_RETRY
      - DISCRETE
      - MANUAL
      - HOURLY
      - DAILY
      - WEEKLY
      - MONTHLY
      - QUARTERLY
      - YEARLY
      type: string
    EraPreDeleteCommand:
      properties:
        command:
          type: string
      type: object
    EraEntityExpiryPolicy:
      properties:
        effectiveTimestamp:
          type: string
        expireInDays:
          format: int32
          type: integer
        expiryDateTimezone:
          type: string
        expiryTimestamp:
          type: string
        remindBeforeInDays:
          format: int32
          type: integer
        userCreated:
          type: boolean
      type: object
    EraTagValueDTO:
      properties:
        entityId:
          type: string
        entityType:
          enum:
          - DATABASE
          - TIME_MACHINE
          - DATABASE_SERVER
          - CLONE
          type: string
        tagId:
          type: string
        tagName:
          type: string
        value:
          type: string
      type: object
    EraPostDeleteCommand:
      properties:
        command:
          type: string
      type: object
    EraDependencyInfo:
      properties:
        dependencyName:
          type: string
        description:
          type: string
        isPresent:
          type: boolean
        isSoftware:
          type: boolean
        name:
          type: string
        requiredAction:
          type: string
      type: object
    EraEntityRefreshPolicy:
      properties:
        lastRefreshDate:
          type: string
        nextRefreshDate:
          type: string
        refreshDateTimezone:
          type: string
        refreshInDays:
          format: int32
          type: integer
        refreshInHours:
          format: int32
          type: integer
        refreshInMonths:
          format: int32
          type: integer
        refreshTime:
          type: string
      type: object
    ERASnapshotMetadata:
      properties:
        deregisterInfo:
          $ref: '#/components/schemas/DeregisterInfo'
        fromTimeStamp:
          type: string
        info:
          properties: {}
          type: object
        secureInfo:
          properties: {}
          type: object
        toTimeStamp:
          type: string
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
