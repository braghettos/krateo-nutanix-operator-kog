components:
  schemas:
    TaskInfoSummary:
      properties:
        associatedOperations:
          items:
            $ref: '#/components/schemas/TaskInfoSummary'
          type: array
        dbserverId:
          description: ID of the Database Server. associated with the NDB Operation.
          format: uuid
          type: string
        dependencyReport:
          $ref: '#/components/schemas/EraDependencyReport'
        entityId:
          description: ID of the entity associated with the NDB Operation. For example, Time Machine ID.
          format: uuid
          type: string
        entityName:
          description: Name of the entity associated with the NDB Operation. For example, Time Machine ID.
          type: string
        entityType:
          type: string
        message:
          type: string
        name:
          description: Name of the Operation created in NDB.
          type: string
        operationId:
          description: ID of the Operation entry created in NDB.
          format: uuid
          type: string
        status:
          description: Status of the NDB Operation.
          type: string
        workId:
          description: ID of the work entry created in NDB.
          format: uuid
          type: string
      type: object
    EraDependencyReport:
      properties:
        dependenciesSatisfied:
          type: boolean
        dependenciesVerified:
          type: boolean
        ipAddress:
          type: string
        missingConfigurations:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
        missingDependencies:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
      type: object
    ObjectStoreDTO:
      additionalProperties: false
      properties:
        clusterName:
          description: Required if 'clusterReference' parameter is not provided.
          type: string
        clusterReference:
          description: Required if 'clusterName' parameter is not provided.
          type: string
        domain:
          type: string
        numWorkerNodes:
          type: integer
        publicNetworkIps:
          items:
            type: string
          type: array
        publicNetworkName:
          description: Required if 'publicNetworkReference' parameter is not provided.
          type: string
        publicNetworkReference:
          description: Required if 'publicNetworkName' parameter is not provided.
          type: string
        storageNetworkDnsIp:
          type: string
        storageNetworkName:
          description: Required if 'storageNetworkReference' parameter is not provided.
          type: string
        storageNetworkReference:
          description: Required if 'storageNetworkName' parameter is not provided.
          type: string
        storageNetworkVip:
          type: string
        totalCapacityGiB:
          type: integer
      required:
      - domain
      - numWorkerNodes
      - publicNetworkIps
      - storageNetworkDnsIp
      - storageNetworkVip
      - totalCapacityGiB
      type: object
    EraDependencyInfo:
      properties:
        dependencyName:
          type: string
        description:
          type: string
        isPresent:
          type: boolean
        isSoftware:
          type: boolean
        name:
          type: string
        requiredAction:
          type: string
      type: object
    ProvisionStorageResourceRequest:
      properties:
        description:
          type: string
        domainId:
          type: string
        name:
          type: string
        objectStore:
          $ref: '#/components/schemas/ObjectStoreDTO'
        type:
          type: string
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
