          directoryId\": \"string\", \"email\": \"string\", \"encrypted\": false, \"eulaAccepted\": false, \"groups\": [\"\
          string\"], \"id\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\", \"internalUser\": false, \"isExternalAuth\": false,\
