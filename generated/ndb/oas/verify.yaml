      - lang: JavaScript
        source: "const url = ':///era/v0.9/users/external/verify';\nconst options = {\n  method: 'POST',\n  headers: {'Accept':\
          \ 'application/json', 'Authorization': 'Basic <basic_auth_token>', 'Content-Type': 'application/json'},\n  body:\
          \  `{\"customerId\": \"string\", \"directoryId\": \"string\", \"email\": \"string\", \"encrypted\": false, \"eulaAccepted\"\
