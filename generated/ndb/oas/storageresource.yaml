components:
  schemas:
    ERAPropertyValue:
      properties:
        description:
          type: string
        name:
          type: string
        ref_id:
          type: string
        secure:
          type: boolean
        value:
          type: string
      type: object
    ERAEntity:
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/ERAPropertyValue'
          type: array
        type:
          type: string
      type: object
    ERAStorageResourceDTO:
      properties:
        accessKey:
          type: string
        cloudId:
          format: uuid
          readOnly: true
          type: string
        createKeys:
          type: boolean
        description:
          type: string
        domainId:
          format: uuid
          type: string
        entityId:
          format: uuid
          readOnly: true
          type: string
        fqdn:
          type: string
        id:
          format: uuid
          readOnly: true
          type: string
        info:
          properties:
            deploymentVersion:
              type: string
            dnsDomainName:
