  /storage-resources/{storage-resource-id}:
    delete:
      description: Deregisters a Nutanix Object Store from NDB.
      operationId: deleteStorageResource
      parameters:
      - in: path
        name: storage-resource-id
        required: true
        schema:
          format: uuid
          type: string
      - description: Allow force delete of object store, even if associated log drive is not curated.
        in: query
        name: force-delete
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ERAStatusDTO'
          description: Operation completed.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request. - This Object Store is currently in use. Disassociate Object Store with all entities before
            removing it. - Storage resource can only be deleted for type NUTANIX_OBJECT_STORE.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden. - Not owner and the user has no privilege to delete storage resource.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found. - storage-resource-id not found.
      summary: Deregister a Nutanix Object Store
