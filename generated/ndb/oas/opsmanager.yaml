      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EraPaginationResponse'
                - properties:
                    entities:
                      items:
                        $ref: '#/components/schemas/OpsManager'
                      type: array
                  type: object
          description: Returns a list of Ops Managers.
        '500':
