        in: header
        name: client_tz
        schema:
          type: string
      - description: Includes the resolved alerts in the response.
        in: query
        name: resolved
        schema:
          type: string
      - description: Look-back time interval in minutes for fetching the alerts.
        in: query
        name: timeInterval
        schema:
          type: string
      - description: Returns a concise response.
        in: query
        name: summary
        schema:
          type: string
