components:
  schemas:
    UpdateAlertModel:
      properties:
        acknowledged:
          type: boolean
        id:
          format: uuid
          type: string
        resetAcknowledged:
          type: boolean
        resetResolved:
          type: boolean
        resolved:
          type: boolean
      type: object
    ERAAlertDTO:
      properties:
        acknowledged:
          type: boolean
        dateAcknowledged:
          type: string
        dateCreated:
          type: string
        dateModified:
          type: string
        dateResolved:
          type: string
        entityId:
          format: uuid
          type: string
        entityName:
          type: string
        entityType:
          type: string
        id:
          format: uuid
          type: string
        message:
          type: string
        notified:
          type: boolean
        operationId:
          format: uuid
          type: string
        ownerId:
          format: uuid
          type: string
        policyId:
          format: uuid
          type: string
        resetAcknowledged:
          type: boolean
        resetResolved:
          type: boolean
        resolved:
          type: boolean
        severity:
          type: string
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
