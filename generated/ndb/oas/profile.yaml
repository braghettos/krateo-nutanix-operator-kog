          \ \\\"systemProfile\\\": false, \\\"type\\\": \\\"string\\\"}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = ':///era/v0.9/profiles';\nconst options = {\n  method: 'POST',\n  headers: {'Accept': 'application/json',\
