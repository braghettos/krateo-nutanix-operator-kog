components:
  schemas:
    ERAPropertyValue:
      properties:
        description:
          type: string
        name:
          type: string
        ref_id:
          type: string
        secure:
          type: boolean
        value:
          type: string
      type: object
    TaskInfoSummary:
      properties:
        associatedOperations:
          items:
            $ref: '#/components/schemas/TaskInfoSummary'
          type: array
        dbserverId:
          description: ID of the Database Server. associated with the NDB Operation.
          format: uuid
          type: string
        dependencyReport:
          $ref: '#/components/schemas/EraDependencyReport'
        entityId:
          description: ID of the entity associated with the NDB Operation. For example, Time Machine ID.
          format: uuid
          type: string
        entityName:
          description: Name of the entity associated with the NDB Operation. For example, Time Machine ID.
          type: string
        entityType:
          type: string
        message:
          type: string
        name:
          description: Name of the Operation created in NDB.
          type: string
        operationId:
          description: ID of the Operation entry created in NDB.
          format: uuid
          type: string
        status:
          description: Status of the NDB Operation.
          type: string
        workId:
          description: ID of the work entry created in NDB.
          format: uuid
          type: string
      type: object
    JSONObject:
      type: object
    CreateProfileModel:
      properties:
        dbVersion:
          type: string
        deprecated:
          type: boolean
        description:
          type: string
        engineType:
          enum:
          - oracle_database
          - postgres_database
          - sqlserver_database
          - mariadb_database
          - mysql_database
          - mongodb_database
          type: string
        name:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/Properties'
          type: array
        published:
          description: Indicates whether the Profile is visible for updates.
          type: boolean
        systemProfile:
          type: boolean
        type:
          type: string
      type: object
    EraProfileVersionDTO:
      properties:
        assocDatabases:
          items:
            type: string
          type: array
        assocDbServers:
          items:
            type: string
          type: array
        custom1:
          type: string
        custom2:
          type: string
        custom3:
          type: string
        custom4:
          type: string
        custom5:
          type: string
        dateCreated:
          type: string
        dateModified:
          type: string
        dbVersion:
          type: string
        deprecated:
          type: boolean
        description:
          type: string
        engineType:
          type: string
        id:
          format: uuid
          type: string
        json:
          $ref: '#/components/schemas/JSONObject'
        name:
          type: string
        nxClusterId:
          format: uuid
          type: string
        owner:
          type: string
        profileId:
          format: uuid
          type: string
        properties:
          items:
            $ref: '#/components/schemas/ERAPropertyValue'
          type: array
        propertiesMap:
          additionalProperties:
            type: string
          type: object
        published:
          type: boolean
        systemProfile:
          type: boolean
        topology:
          type: string
        type:
          type: string
        version:
          type: string
      type: object
    EraDependencyReport:
      properties:
        dependenciesSatisfied:
          type: boolean
        dependenciesVerified:
          type: boolean
        ipAddress:
          type: string
        missingConfigurations:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
        missingDependencies:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
      type: object
    ERAProfileDTO:
      properties:
        assocDatabases:
          items:
            type: string
          type: array
        assocDbServers:
          items:
            type: string
          type: array
        custom1:
          type: string
        custom2:
          type: string
        custom3:
          type: string
        custom4:
          type: string
        custom5:
          type: string
        dateCreated:
          type: string
        dateModified:
          type: string
        dbVersion:
          type: string
        description:
          type: string
        engineType:
          type: string
        id:
          format: uuid
          type: string
        latestVersion:
          type: string
        latestVersionId:
          type: string
        name:
          type: string
        nxClusterId:
          format: uuid
          type: string
        owner:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/ERAPropertyValue'
          type: array
        propertiesMap:
          additionalProperties:
            type: string
          type: object
        systemProfile:
          type: boolean
        topology:
          type: string
        type:
          type: string
        versions:
          items:
            $ref: '#/components/schemas/EraProfileVersionDTO'
          type: array
      type: object
    EraDependencyInfo:
      properties:
        dependencyName:
          type: string
        description:
          type: string
        isPresent:
          type: boolean
        isSoftware:
          type: boolean
        name:
          type: string
        requiredAction:
          type: string
      type: object
    UpdateProfileModel:
      properties:
        description:
          type: string
        name:
          type: string
        type:
          type: string
      type: object
    Properties:
      properties:
        name:
          type: string
        value:
          oneOf:
          - type: string
          - type: boolean
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
