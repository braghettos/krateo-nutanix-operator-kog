openapi: 3.0.1
info:
  description: "**Nutanix Database Service** (NDB) is a database as a service (DBaaS) that automates and simplifies database\
    \ administration, brings one-click simplicity and invisible operations to database provisioning and life-cycle management.\
    \ NDB enables database administrators to provision, clone, and refresh the databases at any point in time. NDB allows\
    \ administrators to define standards for their database provisioning needs with end-state driven functionality that includes\
    \ High Availability (HA) database deployments. NDB automates and simplifies the operations such as provisioning of databases\
    \ and copy data management. \n\n\n# Notes\n\nWhile making Nutanix API requests to the NDB services by using the default\
    \ self-signed certificates, the request needs to be configured to ignore SSL certificate verification requests. For example,\
    \ in case of a cURL, use _- - insecure_ flag to ensure that the SSL certificate used to encrypt the request should not\
    \ be verified."
  title: Nutanix NDB
  version: '0.9'
servers:
- url: /era/v0.9
security:
- era_token: []
- era_auth: []
paths:
  /profiles/input-file:
    get:
      description: 'This API will provide input JSON

        '
      operationId: getInputFile
      parameters:
      - in: query
        name: type
        schema:
          enum:
          - Software
          - Compute
          - Network
          - Database_Parameter
          type: string
      - description: The Database engine for which you want to create a Profile.
        in: query
        name: engine
        schema:
          enum:
          - oracle_database
          - postgres_database
          - sqlserver_database
          - mariadb_database
          - mysql_database
          - mongodb_database
          type: string
      - description: single, cluster.
        in: query
        name: topology
        schema:
          type: string
      - in: query
        name: db-version
        schema:
          type: string
      - in: query
        name: id
        schema:
          type: string
      - description: Profile Name. This should always be used with the Profile type.
        in: query
        name: name
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EraProfileVersionDTO'
          description: Operation completed.
      summary: Get the payload for creating a Profile in NDB
      tags:
      - Profiles
      x-codeSamples:
      - lang: cURL
        source: "curl --request GET \\\n    --url :///era/v0.9/profiles/input-file \\\n    --header 'Authorization: Basic\
          \ <basic_auth_token>' \\\n     "
      - lang: Wget
        source: "wget --quiet \\\n    --method GET \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n      \\\
          \n    --output-document \\\n    - :///era/v0.9/profiles/input-file"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"\")\n\nheaders = {\n    \"Authorization\": \"\
          Basic <basic_auth_token>\"\n}\n \nconn.request(\"GET\",\"/era/v0.9/profiles/input-file\", headers=headers)\n\nres\
          \ = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \":///era/v0.9/profiles/input-file\"\n\t \n\treq, err := http.NewRequest(\"GET\", url, nil)\n\tif err != nil\
          \ {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"Authorization\"\
          , \"Basic <basic_auth_token>\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"\
          Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\t\
          fmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"GET\", \":///era/v0.9/profiles/input-file\"\
          )\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = ':///era/v0.9/profiles/input-file';\nconst options = {\n  method: 'GET',\n  headers: {'Authorization':\
          \ 'Basic <basic_auth_token>'} \n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await\
          \ response.json();\n  console.log(data);\n} catch (error) {\n  console.error(error);\n}"
components:
  schemas:
    JSONObject:
      type: object
    EraProfileVersionDTO:
      properties:
        assocDatabases:
          items:
            type: string
          type: array
        assocDbServers:
          items:
            type: string
          type: array
        custom1:
          type: string
        custom2:
          type: string
        custom3:
          type: string
        custom4:
          type: string
        custom5:
          type: string
        dateCreated:
          type: string
        dateModified:
          type: string
        dbVersion:
          type: string
        deprecated:
          type: boolean
        description:
          type: string
        engineType:
          type: string
        id:
          format: uuid
          type: string
        json:
          $ref: '#/components/schemas/JSONObject'
        name:
          type: string
        nxClusterId:
          format: uuid
          type: string
        owner:
          type: string
        profileId:
          format: uuid
          type: string
        properties:
          items:
            $ref: '#/components/schemas/ERAPropertyValue'
          type: array
        propertiesMap:
          additionalProperties:
            type: string
          type: object
        published:
          type: boolean
        systemProfile:
          type: boolean
        topology:
          type: string
        type:
          type: string
        version:
          type: string
      type: object
    ERAPropertyValue:
      properties:
        description:
          type: string
        name:
          type: string
        ref_id:
          type: string
        secure:
          type: boolean
        value:
          type: string
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
