components:
  schemas:
    ERAPropertyValue:
      properties:
        description:
          type: string
        name:
          type: string
        ref_id:
          type: string
        secure:
          type: boolean
        value:
          type: string
      type: object
    ShardedClusterInfo:
      description: MongoDB Sharded Cluster details.
      properties:
        configServerInfo:
          $ref: '#/components/schemas/ShardedClusterMember'
        mongosInfo:
          items:
            $ref: '#/components/schemas/ShardedClusterMember'
          type: array
        shardInfo:
          items:
            $ref: '#/components/schemas/ShardedClusterMember'
          type: array
      required:
      - configServerInfo
      - shardInfo
      - mongosInfo
      type: object
    TimeMachineInfo:
      description: Time Machine Info.
      properties:
        autoTuneLogDrive:
          type: boolean
        backupNodeIds:
          description: List of backup node IDs for the Time Machine
          items:
            type: string
          type: array
        description:
          type: string
        name:
          type: string
        schedule:
          $ref: '#/components/schemas/Schedule'
        slaId:
          type: string
        tags:
          items:
            $ref: '#/components/schemas/Tags'
          type: array
      type: object
    ActionArguments:
      properties:
        name:
          type: string
        value:
          type: object
      type: object
    EraYearlySchedule:
      properties:
        dayOfMonth:
          format: int32
          type: integer
        enabled:
          type: boolean
        month:
          type: string
        monthValue:
          enum:
          - JANUARY
          - FEBRUARY
          - MARCH
          - APRIL
          - MAY
          - JUNE
          - JULY
          - AUGUST
          - SEPTEMBER
          - OCTOBER
          - NOVEMBER
          - DECEMBER
          type: string
      type: object
    ProvisionDatabaseModel:
      description: Provision Database Model.
      properties:
        actionArguments:
          items:
            $ref: '#/components/schemas/ActionArguments'
          type: array
        clustered:
          type: boolean
        computeProfileId:
          type: string
        createDbserver:
          type: boolean
        databaseGroupingInfo:
          $ref: '#/components/schemas/ERADatabaseGroupingInfo'
        databaseType:
          enum:
          - oracle_database
          - postgres_database
          - sqlserver_database
          - mariadb_database
          - mysql_database
          - mongodb_database
          type: string
        dbParameterProfileId:
          type: string
        dbserverLogicalClusterId:
          format: uuid
          type: string
        name:
          type: string
        networkProfileId:
          type: string
        newDbServerTimeZone:
          type: string
        nodeCount:
          format: int32
          type: integer
        nodes:
          items:
            $ref: '#/components/schemas/Nodes'
          type: array
        nxClusterId:
          type: string
        opsMgrInfo:
          $ref: '#/components/schemas/OpsMgrInfo'
        shardedClusterInfo:
          $ref: '#/components/schemas/ShardedClusterInfo'
        softwareProfileId:
          type: string
        softwareProfileVersionId:
          type: string
        sshPublicKey:
          type: string
        timeMachineInfo:
          $ref: '#/components/schemas/TimeMachineInfo'
      type: object
    SnapshotTimeOfDay:
      description: Time of the day to take a Snapshot.
      properties:
        hours:
          format: int32
          type: integer
        minutes:
          format: int32
          type: integer
        seconds:
          format: int32
          type: integer
      type: object
    EraQuarterlySchedule:
      properties:
        dayOfMonth:
          format: int32
          type: integer
        enabled:
          type: boolean
        startMonth:
          type: string
        startMonthValue:
          enum:
          - JANUARY
          - FEBRUARY
          - MARCH
          - APRIL
          - MAY
          - JUNE
          - JULY
          - AUGUST
          - SEPTEMBER
          - OCTOBER
          - NOVEMBER
          - DECEMBER
          type: string
      type: object
    Schedule:
      description: Schedule Model.
      properties:
        continuousSchedule:
          $ref: '#/components/schemas/EraContinuousSchedule'
        monthlySchedule:
          $ref: '#/components/schemas/EraMonthlySchedule'
        quartelySchedule:
          $ref: '#/components/schemas/EraQuarterlySchedule'
        snapshotTimeOfDay:
          $ref: '#/components/schemas/SnapshotTimeOfDay'
        weeklySchedule:
          $ref: '#/components/schemas/EraWeeklySchedule'
        yearlySchedule:
          $ref: '#/components/schemas/EraYearlySchedule'
      type: object
    ERADatabaseGroupingInfo:
      properties:
        createNewGroup:
          type: boolean
        databaseGroupId:
          type: string
        databases:
          items:
            $ref: '#/components/schemas/ERADatabasePropertiesInfo'
          type: array
        groupAtDbserver:
          type: boolean
        newDatabaseGroupName:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/ERAPropertyValue'
          type: array
      type: object
    Nodes:
      description: Nodes
      properties:
        properties:
          items:
            $ref: '#/components/schemas/Properties'
          type: array
        vmName:
          type: string
      type: object
    Tags:
      properties:
        tagId:
          type: string
        value:
          type: string
      type: object
    EraWeeklySchedule:
      properties:
        dayOfWeek:
          type: string
        dayOfWeekValue:
          enum:
          - SUNDAY
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          type: string
        enabled:
          type: boolean
      type: object
    EraMonthlySchedule:
      properties:
        dayOfMonth:
          format: int32
          type: integer
        enabled:
          type: boolean
      type: object
    EraContinuousSchedule:
      properties:
        enabled:
          type: boolean
        logBackupInterval:
          format: int32
          type: integer
        logBackupRepeatIntervalInMinutes:
          format: int32
          type: integer
        snapshotRepeatIntervalInMinutes:
          format: int32
          type: integer
        snapshotsPerDay:
          format: int32
          type: integer
      type: object
    TaskInfoSummary:
      properties:
        associatedOperations:
          items:
            $ref: '#/components/schemas/TaskInfoSummary'
          type: array
        dbserverId:
          description: ID of the Database Server. associated with the NDB Operation.
          format: uuid
          type: string
        dependencyReport:
          $ref: '#/components/schemas/EraDependencyReport'
        entityId:
          description: ID of the entity associated with the NDB Operation. For example, Time Machine ID.
          format: uuid
          type: string
        entityName:
          description: Name of the entity associated with the NDB Operation. For example, Time Machine ID.
          type: string
        entityType:
          type: string
        message:
          type: string
        name:
          description: Name of the Operation created in NDB.
          type: string
        operationId:
          description: ID of the Operation entry created in NDB.
          format: uuid
          type: string
        status:
          description: Status of the NDB Operation.
          type: string
        workId:
          description: ID of the work entry created in NDB.
          format: uuid
          type: string
      type: object
    ERADatabasePropertiesInfo:
      properties:
        actionArguments:
          items:
            $ref: '#/components/schemas/ActionArguments'
          type: array
        databaseName:
          type: string
        description:
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        ownerId:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/ERAPropertyValue'
          type: array
      type: object
    EraDependencyReport:
      properties:
        dependenciesSatisfied:
          type: boolean
        dependenciesVerified:
          type: boolean
        ipAddress:
          type: string
        missingConfigurations:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
        missingDependencies:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
      type: object
    ShardedClusterMember:
      description: MongoDB Sharded Cluster member details.
      properties:
        memberVmNames:
          items:
            type: string
          type: array
        name:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/ERAPropertyValue'
          type: array
      required:
      - name
      - memberVmNames
      - properties
      type: object
    EraDependencyInfo:
      properties:
        dependencyName:
          type: string
        description:
          type: string
        isPresent:
          type: boolean
        isSoftware:
          type: boolean
        name:
          type: string
        requiredAction:
          type: string
      type: object
    OpsMgrInfo:
      description: Required only for the provisioning of a MongoDB sharded Database. Configuration details of the Ops Manager
        to be associated.
      properties:
        mmsApiKey:
          description: API key generated in Ops Manager to communicate with it.
          type: string
        omAgentDownloadUrl:
          description: URL to download OM Agent from Ops Manager
          type: string
        omAgentLogStorageSizeInGB:
          description: Size of the Ops Manager Agent's log storage. Optional, defaults to 5 GB.
          format: int32
          type: integer
        omGroupId:
          description: The id of the group or project in Ops Manager.
          type: string
        omOrgId:
          description: The id of the organisation in Ops Manager.
          type: string
        opsMgrId:
          description: The id of the Ops Manager registered in NDB.
          format: uuid
          type: string
      type: object
    Properties:
      properties:
        name:
          type: string
        value:
          oneOf:
          - type: string
          - type: boolean
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
