components:
  schemas:
    ERAPropertyValue:
      properties:
        description:
          type: string
        name:
          type: string
        ref_id:
          type: string
        secure:
          type: boolean
        value:
          type: string
      type: object
    ERAEntity:
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/ERAPropertyValue'
          type: array
        type:
          type: string
      type: object
    ErrorResponse:
      properties:
        dependentEntities:
          items:
            $ref: '#/components/schemas/ERAEntity'
          type: array
        errorCode:
          type: string
        message:
          type: string
        reason:
          type: string
        remedy:
          type: string
      type: object
    EraPaginationResponse:
      properties:
        count:
          format: int32
          type: integer
        entities:
          items:
            type: object
          type: array
      type: object
    CTE:
      properties:
        cteApiVersion:
          description: API version of end-points in use by the CTE.
          type: string
        cteVersion:
          description: Discovered version of CTE.
          readOnly: true
          type: string
        dateCreated:
          readOnly: true
          type: string
