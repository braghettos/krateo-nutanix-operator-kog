components:
  schemas:
    ERAEntity:
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/ERAPropertyValue'
          type: array
        type:
          type: string
      type: object
    ERAPropertyValue:
      properties:
        description:
          type: string
        name:
          type: string
        ref_id:
          type: string
        secure:
          type: boolean
        value:
          type: string
      type: object
    DomainDTO:
      properties:
        cloudType:
          readOnly: true
          type: string
        dateCreated:
          readOnly: true
          type: string
        dateModified:
          readOnly: true
          type: string
        description:
          type: string
        domainExtId:
          format: uuid
          readOnly: true
          type: string
        id:
          format: uuid
          readOnly: true
          type: string
        ipAddress:
          type: string
        name:
          type: string
        ownerId:
          readOnly: true
          type: string
        password:
          type: string
        port:
          type: integer
        queryCount:
          readOnly: true
          type: integer
        status:
          enum:
          - UP
          - DOWN
          - DELETED
          readOnly: true
          type: string
        username:
          type: string
      type: object
    ErrorResponse:
      properties:
        dependentEntities:
          items:
