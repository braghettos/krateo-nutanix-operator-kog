openapi: 3.0.1
info:
  description: "**Nutanix Database Service** (NDB) is a database as a service (DBaaS) that automates and simplifies database\
    \ administration, brings one-click simplicity and invisible operations to database provisioning and life-cycle management.\
    \ NDB enables database administrators to provision, clone, and refresh the databases at any point in time. NDB allows\
    \ administrators to define standards for their database provisioning needs with end-state driven functionality that includes\
    \ High Availability (HA) database deployments. NDB automates and simplifies the operations such as provisioning of databases\
    \ and copy data management. \n\n\n# Notes\n\nWhile making Nutanix API requests to the NDB services by using the default\
    \ self-signed certificates, the request needs to be configured to ignore SSL certificate verification requests. For example,\
    \ in case of a cURL, use _- - insecure_ flag to ensure that the SSL certificate used to encrypt the request should not\
    \ be verified."
  title: Nutanix NDB
  version: '0.9'
servers:
- url: /era/v0.9
security:
- era_token: []
- era_auth: []
paths:
  /domains:
    get:
      operationId: getDomains
      parameters:
      - description: The number of results to return.
        in: query
        name: limit
        schema:
          type: integer
      - description: The number of Domains skipped before selecting the next set of results.
        in: query
        name: offset
        schema:
          type: integer
      - description: Specifies the type of identifier provided in the 'value' parameter.
        in: query
        name: value-type
        schema:
          enum:
          - name
          - ipAddress
          - status
          type: string
      - description: "It holds a corresponding value for the value-type. \nFor 'name' and 'ipAddress' use comma-separated\
          \ values. \nFor status use 'UP', 'DOWN', or 'DELETED'.\n"
        in: query
        name: value
        schema:
          type: string
      - description: Based on the registered PE clusters, gets the domains that are available to be registered with NDB.
        in: query
        name: available-to-register
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DomainDTO'
                type: array
          description: Operation completed.
      summary: Get a list of Domains registered with NDB
      tags:
      - Domains
      x-codeSamples:
