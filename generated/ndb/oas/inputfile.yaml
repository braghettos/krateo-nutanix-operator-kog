openapi: 3.0.1
info:
  description: "**Nutanix Database Service** (NDB) is a database as a service (DBaaS) that automates and simplifies database\
    \ administration, brings one-click simplicity and invisible operations to database provisioning and life-cycle management.\
    \ NDB enables database administrators to provision, clone, and refresh the databases at any point in time. NDB allows\
    \ administrators to define standards for their database provisioning needs with end-state driven functionality that includes\
    \ High Availability (HA) database deployments. NDB automates and simplifies the operations such as provisioning of databases\
    \ and copy data management. \n\n\n# Notes\n\nWhile making Nutanix API requests to the NDB services by using the default\
    \ self-signed certificates, the request needs to be configured to ignore SSL certificate verification requests. For example,\
    \ in case of a cURL, use _- - insecure_ flag to ensure that the SSL certificate used to encrypt the request should not\
    \ be verified."
  title: Nutanix NDB
  version: '0.9'
servers:
- url: /era/v0.9
security:
- era_token: []
- era_auth: []
paths:
  /app_types/{database_engine}/provision/input-file:
    get:
      description: "Get a list of inputs required to provision a Database of the given type.\nThis will return the complete\
        \ metadata for each input property such as display name, description, and more.\nOnly the 'name' and 'value' should\
        \ be given to the 'provisionInfo' part of the input JSON for provisioning a Database. Example:\n```\n{\n  ...\n  ...\n\
        \  'provisionInfo': [\n    {\n      'name': 'db_prop_1',\n      'value': 'val1'\n    },\n    {\n      'name': 'db_prop_2',\n\
        \      'value': 'val2'\n    },\n    ...\n    ...\n  ]\n}\n```\n"
      operationId: getInputFileForProvisionApplication
      parameters:
      - description: Database engine type.
        in: path
        name: database_engine
        required: true
        schema:
          enum:
          - oracle_database
          - postgres_database
          - sqlserver_database
          - mariadb_database
          - mysql_database
          - mongodb_database
          type: string
      - in: query
        name: category
        required: true
        schema:
          enum:
          - db_server
          - database
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPropertiesDTO'
          description: Operation completed.
      summary: Get input file for provisioning application
      tags:
      - Databases
      x-codeSamples:
      - lang: cURL
        source: "curl --request GET \\\n    --url :///era/v0.9/app_types/{database_engine}/provision/input-file \\\n    --header\
          \ 'Authorization: Basic <basic_auth_token>' \\\n     "
      - lang: Wget
        source: "wget --quiet \\\n    --method GET \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n      \\\
          \n    --output-document \\\n    - :///era/v0.9/app_types/{database_engine}/provision/input-file"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"\")\n\nheaders = {\n    \"Authorization\": \"\
          Basic <basic_auth_token>\"\n}\n \nconn.request(\"GET\",\"/era/v0.9/app_types/{database_engine}/provision/input-file\"\
          , headers=headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \":///era/v0.9/app_types/{database_engine}/provision/input-file\"\n\t \n\treq, err := http.NewRequest(\"GET\"\
          , url, nil)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"\
          Authorization\", \"Basic <basic_auth_token>\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil\
          \ {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err\
          \ := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t\
          }\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"GET\", \":///era/v0.9/app_types/{database_engine}/provision/input-file\"\
          )\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = ':///era/v0.9/app_types/{database_engine}/provision/input-file';\nconst options = {\n  method:\
          \ 'GET',\n  headers: {'Authorization': 'Basic <basic_auth_token>'} \n};\n\ntry {\n  const response = await fetch(url,\
          \ options);\n  const data = await response.json();\n  console.log(data);\n} catch (error) {\n  console.error(error);\n\
          }"
components:
  schemas:
    ERAPropertyDefinition:
      properties:
        alias:
          type: string
        category:
          type: string
        custom1:
          type: string
        custom2:
          type: string
        custom3:
          type: string
        default_value:
          type: string
        description:
          type: string
        display_name:
          type: string
        index:
          format: int32
          type: integer
        isDuplicable:
          type: string
        name:
          type: string
        parameterized_description:
          type: string
        parameterized_display_name:
          type: string
        ref_id:
          type: string
        regex:
          type: string
        required:
          type: string
        secure:
          type: string
        sensitive:
          type: string
        type:
          type: string
        value_type:
          type: string
      type: object
    DriverPropertiesDTO:
      properties:
        properties:
          items:
            $ref: '#/components/schemas/ERAPropertyDefinition'
          type: array
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
