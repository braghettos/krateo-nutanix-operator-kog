openapi: 3.0.1
info:
  description: "**Nutanix Database Service** (NDB) is a database as a service (DBaaS) that automates and simplifies database\
    \ administration, brings one-click simplicity and invisible operations to database provisioning and life-cycle management.\
    \ NDB enables database administrators to provision, clone, and refresh the databases at any point in time. NDB allows\
    \ administrators to define standards for their database provisioning needs with end-state driven functionality that includes\
    \ High Availability (HA) database deployments. NDB automates and simplifies the operations such as provisioning of databases\
    \ and copy data management. \n\n\n# Notes\n\nWhile making Nutanix API requests to the NDB services by using the default\
    \ self-signed certificates, the request needs to be configured to ignore SSL certificate verification requests. For example,\
    \ in case of a cURL, use _- - insecure_ flag to ensure that the SSL certificate used to encrypt the request should not\
    \ be verified."
  title: Nutanix NDB
  version: '0.9'
servers:
- url: /era/v0.9
security:
- era_token: []
- era_auth: []
paths:
  /dpcs/{dbserver-cluster-id}/remove-dbservers:
    post:
      description: 'Submits an operation to remove one or more cluster nodes from the existing Database Server Cluster.

        Payload includes a list of cluster node IDs to be removed and additional cluster configuration

        if needed, for example, failover configuration in case the existing primary node is being removed.

        The task consists of the following steps:

        1. Failover in case the primary cluster node is being removed.

        2. Remove the secondary database from the cluster.

        3. Remove cluster nodes from the Database Cluster.

        4. Register database and cluster changes.'
      operationId: removeDBServersFromDBServerCluster
      parameters:
      - in: path
        name: dbserver-cluster-id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DBServerClusterRemoveNodesModel'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInfoSummary'
          description: Operation completed.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "Bad Request:\n- DB Server Cluster ID is not specified\n- Invalid request payload\n  - DB Server ID\
            \ list is empty\n"
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error.
      summary: Remove cluster nodes to scale down Database Server Cluster
      tags:
      - Database Server Physical Clusters
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url :///era/v0.9/dpcs/{dbserver-cluster-id}/remove-dbservers \\\n    --header\
          \ 'Accept: application/json' \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n    --header 'Content-Type:\
          \ application/json' \\\n    --data '{\n    \"dbserverIds\": [\n        \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\n\
          \    ],\n    \"logicalClusterConfig\": [\n        {\n            \"logicalClusterId\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\
          ,\n            \"preferredPrimaryId\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\n        }\n    ]\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Authorization:\
          \ Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json' \\\n    --body-data '{\n    \"dbserverIds\"\
          : [\n        \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\n    ],\n    \"logicalClusterConfig\": [\n        {\n    \
          \        \"logicalClusterId\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\",\n            \"preferredPrimaryId\": \"\
          b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\n        }\n    ]\n}' \\\n    --output-document \\\n    - :///era/v0.9/dpcs/{dbserver-cluster-id}/remove-dbservers"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"\")\n\nheaders = {\n    \"Accept\": \"application/json\"\
          ,\n    \"Authorization\": \"Basic <basic_auth_token>\",\n    \"Content-Type\": \"application/json\"\n}\n\npayload\
          \ =  \"\"\"{\n    \"dbserverIds\": [\n        \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\n    ],\n    \"logicalClusterConfig\"\
          : [\n        {\n            \"logicalClusterId\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\",\n            \"preferredPrimaryId\"\
          : \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\n        }\n    ]\n}\"\"\"\n\nconn.request(\"POST\",\"/era/v0.9/dpcs/{dbserver-cluster-id}/remove-dbservers\"\
          , payload, headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \":///era/v0.9/dpcs/{dbserver-cluster-id}/remove-dbservers\"\n\t\n\tpayload :=  strings.NewReader(`{\"dbserverIds\"\
          : [\"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"], \"logicalClusterConfig\": [{\"logicalClusterId\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\
          , \"preferredPrimaryId\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"}]}`)\n\treq, err := http.NewRequest(\"POST\"\
          , url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n     \
          \   req.Header.Add(\"Accept\", \"application/json\")\n        req.Header.Add(\"Authorization\", \"Basic <basic_auth_token>\"\
          )\n        req.Header.Add(\"Content-Type\", \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\
          \tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\t\
          return\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \":///era/v0.9/dpcs/{dbserver-cluster-id}/remove-dbservers\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\"\
          )\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"{\\\"dbserverIds\\\": [\\\"b4d15375-1097-4c96-a4c4-4cb5809b05bb\\\
          \"], \\\"logicalClusterConfig\\\": [{\\\"logicalClusterId\\\": \\\"b4d15375-1097-4c96-a4c4-4cb5809b05bb\\\", \\\"\
          preferredPrimaryId\\\": \\\"b4d15375-1097-4c96-a4c4-4cb5809b05bb\\\"}]}\")\n  .execute()\n  .toCompletableFuture()\n\
          \  .thenAccept(System.out::println)\n  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = ':///era/v0.9/dpcs/{dbserver-cluster-id}/remove-dbservers';\nconst options = {\n  method: 'POST',\n\
          \  headers: {'Accept': 'application/json', 'Authorization': 'Basic <basic_auth_token>', 'Content-Type': 'application/json'},\n\
          \  body:  `{\"dbserverIds\": [\"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"], \"logicalClusterConfig\": [{\"logicalClusterId\"\
          : \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\", \"preferredPrimaryId\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"}]}`\n\
          };\n\ntry {\n  const response = await fetch(url, options);\n  const data = await response.json();\n  console.log(data);\n\
          } catch (error) {\n  console.error(error);\n}"
components:
  schemas:
    ERAPropertyValue:
      properties:
        description:
          type: string
        name:
          type: string
        ref_id:
          type: string
        secure:
          type: boolean
        value:
          type: string
      type: object
    ERAEntity:
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/ERAPropertyValue'
          type: array
        type:
          type: string
      type: object
    DBServerClusterRemoveNodesLogicalClusterParametersModel:
      properties:
        logicalClusterId:
          format: uuid
          type: string
        preferredPrimaryId:
          format: uuid
          type: string
      type: object
    TaskInfoSummary:
      properties:
        associatedOperations:
          items:
            $ref: '#/components/schemas/TaskInfoSummary'
          type: array
        dbserverId:
          description: ID of the Database Server. associated with the NDB Operation.
          format: uuid
          type: string
        dependencyReport:
          $ref: '#/components/schemas/EraDependencyReport'
        entityId:
          description: ID of the entity associated with the NDB Operation. For example, Time Machine ID.
          format: uuid
          type: string
        entityName:
          description: Name of the entity associated with the NDB Operation. For example, Time Machine ID.
          type: string
        entityType:
          type: string
        message:
          type: string
        name:
          description: Name of the Operation created in NDB.
          type: string
        operationId:
          description: ID of the Operation entry created in NDB.
          format: uuid
          type: string
        status:
          description: Status of the NDB Operation.
          type: string
        workId:
          description: ID of the work entry created in NDB.
          format: uuid
          type: string
      type: object
    EraDependencyReport:
      properties:
        dependenciesSatisfied:
          type: boolean
        dependenciesVerified:
          type: boolean
        ipAddress:
          type: string
        missingConfigurations:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
        missingDependencies:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
      type: object
    ErrorResponse:
      properties:
        dependentEntities:
          items:
            $ref: '#/components/schemas/ERAEntity'
          type: array
