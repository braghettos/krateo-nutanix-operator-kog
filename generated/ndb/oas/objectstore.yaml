openapi: 3.0.1
info:
  description: "**Nutanix Database Service** (NDB) is a database as a service (DBaaS) that automates and simplifies database\
    \ administration, brings one-click simplicity and invisible operations to database provisioning and life-cycle management.\
    \ NDB enables database administrators to provision, clone, and refresh the databases at any point in time. NDB allows\
    \ administrators to define standards for their database provisioning needs with end-state driven functionality that includes\
    \ High Availability (HA) database deployments. NDB automates and simplifies the operations such as provisioning of databases\
    \ and copy data management. \n\n\n# Notes\n\nWhile making Nutanix API requests to the NDB services by using the default\
    \ self-signed certificates, the request needs to be configured to ignore SSL certificate verification requests. For example,\
    \ in case of a cURL, use _- - insecure_ flag to ensure that the SSL certificate used to encrypt the request should not\
    \ be verified."
  title: Nutanix NDB
  version: '0.9'
servers:
- url: /era/v0.9
security:
- era_token: []
- era_auth: []
paths:
  /domains/{domain-id}/object-stores:
    get:
      operationId: getObjectStoresForDomain
      parameters:
      - description: ID of the Domain.
        in: path
        name: domain-id
        required: true
        schema:
          format: uuid
          type: string
      - description: The number of object stores to return.
        in: query
        name: limit
        schema:
          type: integer
      - description: The number of object stores skipped before selecting the next set of object stores.
        in: query
        name: offset
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ERAStorageResource'
                type: array
          description: Operation completed.
      summary: Get a list of object stores managed by a Domain
      tags:
      - Domains
      x-codeSamples:
      - lang: cURL
        source: "curl --request GET \\\n    --url :///era/v0.9/domains/{domain-id}/object-stores \\\n    --header 'Authorization:\
          \ Basic <basic_auth_token>' \\\n     "
      - lang: Wget
        source: "wget --quiet \\\n    --method GET \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n      \\\
          \n    --output-document \\\n    - :///era/v0.9/domains/{domain-id}/object-stores"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"\")\n\nheaders = {\n    \"Authorization\": \"\
          Basic <basic_auth_token>\"\n}\n \nconn.request(\"GET\",\"/era/v0.9/domains/{domain-id}/object-stores\", headers=headers)\n\
          \nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \":///era/v0.9/domains/{domain-id}/object-stores\"\n\t \n\treq, err := http.NewRequest(\"GET\", url, nil)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"\
          Authorization\", \"Basic <basic_auth_token>\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil\
          \ {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err\
          \ := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t\
          }\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"GET\", \":///era/v0.9/domains/{domain-id}/object-stores\"\
          )\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = ':///era/v0.9/domains/{domain-id}/object-stores';\nconst options = {\n  method: 'GET',\n  headers:\
          \ {'Authorization': 'Basic <basic_auth_token>'} \n};\n\ntry {\n  const response = await fetch(url, options);\n \
          \ const data = await response.json();\n  console.log(data);\n} catch (error) {\n  console.error(error);\n}"
components:
  schemas:
    ERAStorageResource:
      properties:
        cloudId:
          format: uuid
          readOnly: true
          type: string
        description:
          type: string
        domainId:
          format: uuid
          type: string
        entityId:
          format: uuid
          readOnly: true
          type: string
        id:
          format: uuid
          readOnly: true
          type: string
        info:
          properties:
            deploymentVersion:
              type: string
            dnsDomainName:
              type: string
            fqdn:
              type: string
            ipAddresses:
              items:
                type: string
              type: array
            provisioned:
              type: boolean
            storageCapacityInBytes:
              format: int64
              type: integer
            storageUsageInBytes:
              format: int64
              type: integer
            username:
              type: string
          readOnly: true
          required:
          - provisioned
          - fqdn
          type: object
        name:
          type: string
        ownerId:
          format: uuid
          readOnly: true
          type: string
        status:
          enum:
          - UP
          - DOWN
          - DELETED
          - PROVISIONING
          readOnly: true
          type: string
        type:
          enum:
          - NUTANIX_OBJECT_STORE
          - NUTANIX_CLUSTER
          type: string
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
