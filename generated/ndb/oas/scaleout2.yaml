openapi: 3.0.1
info:
  description: "**Nutanix Database Service** (NDB) is a database as a service (DBaaS) that automates and simplifies database\
    \ administration, brings one-click simplicity and invisible operations to database provisioning and life-cycle management.\
    \ NDB enables database administrators to provision, clone, and refresh the databases at any point in time. NDB allows\
    \ administrators to define standards for their database provisioning needs with end-state driven functionality that includes\
    \ High Availability (HA) database deployments. NDB automates and simplifies the operations such as provisioning of databases\
    \ and copy data management. \n\n\n# Notes\n\nWhile making Nutanix API requests to the NDB services by using the default\
    \ self-signed certificates, the request needs to be configured to ignore SSL certificate verification requests. For example,\
    \ in case of a cURL, use _- - insecure_ flag to ensure that the SSL certificate used to encrypt the request should not\
    \ be verified."
  title: Nutanix NDB
  version: '0.9'
servers:
- url: /era/v0.9
security:
- era_token: []
- era_auth: []
paths:
  /dpcs/{dbserver-cluster-id}/scale-out:
    post:
      description: "Submits an operation to provision new cluster nodes to the existing Database Server Cluster.\nThe task\
        \ consists of the following steps:\n1. Provision and register new cluster nodes.\n2. Modify the Database Server cluster\
        \ to join nodes.\n3. Add secondary Databases to new cluster nodes.\n4. Register database and cluster changes.\n\n\
        Secondary databases are created from a snapshot, and eventually joined to \nthe target Database cluster to synchronize\
        \ with the cluster leader. The request\nwill be validated against the target database type and version. Validation\
        \ includes the maximum\nnumber of replicas supported or the number of cluster roles, for example, the number of sync\
        \ replicas."
      operationId: scaleOutDBServerCluster
      parameters:
      - in: path
        name: dbserver-cluster-id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaleOutDBServerClusterModel'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInfoSummary'
          description: Operation completed.
      summary: Provision new cluster nodes to horizontally scale Database Server Cluster
      tags:
      - Database Server Physical Clusters
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url :///era/v0.9/dpcs/{dbserver-cluster-id}/scale-out \\\n    --header 'Accept:\
          \ application/json' \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json'\
          \ \\\n    --data '{\n    \"dbservers\": [\n        {\n            \"databases\": [\n                {\n        \
          \            \"id\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\",\n                    \"name\": \"string\"\n     \
          \           }\n            ],\n            \"name\": \"string\",\n            \"nxClusterId\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\
          \n        }\n    ],\n    \"id\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Authorization:\
          \ Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json' \\\n    --body-data '{\n    \"dbservers\"\
          : [\n        {\n            \"databases\": [\n                {\n                    \"id\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\
          ,\n                    \"name\": \"string\"\n                }\n            ],\n            \"name\": \"string\"\
          ,\n            \"nxClusterId\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\n        }\n    ],\n    \"id\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\
          \n}' \\\n    --output-document \\\n    - :///era/v0.9/dpcs/{dbserver-cluster-id}/scale-out"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"\")\n\nheaders = {\n    \"Accept\": \"application/json\"\
          ,\n    \"Authorization\": \"Basic <basic_auth_token>\",\n    \"Content-Type\": \"application/json\"\n}\n\npayload\
          \ =  \"\"\"{\n    \"dbservers\": [\n        {\n            \"databases\": [\n                {\n               \
          \     \"id\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\",\n                    \"name\": \"string\"\n            \
          \    }\n            ],\n            \"name\": \"string\",\n            \"nxClusterId\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\
          \n        }\n    ],\n    \"id\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\n}\"\"\"\n\nconn.request(\"POST\",\"/era/v0.9/dpcs/{dbserver-cluster-id}/scale-out\"\
          , payload, headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \":///era/v0.9/dpcs/{dbserver-cluster-id}/scale-out\"\n\t\n\tpayload :=  strings.NewReader(`{\"dbservers\"\
          : [{\"databases\": [{\"id\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\", \"name\": \"string\"}], \"name\": \"string\"\
          , \"nxClusterId\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"}], \"id\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\
          }`)\n\treq, err := http.NewRequest(\"POST\", url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating\
          \ request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"Accept\", \"application/json\")\n        req.Header.Add(\"\
          Authorization\", \"Basic <basic_auth_token>\")\n        req.Header.Add(\"Content-Type\", \"application/json\")\n\
          \    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\"\
          , err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\t\
          fmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\
          \n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \":///era/v0.9/dpcs/{dbserver-cluster-id}/scale-out\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\"\
          )\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"{\\\"dbservers\\\": [{\\\"databases\\\": [{\\\
          \"id\\\": \\\"b4d15375-1097-4c96-a4c4-4cb5809b05bb\\\", \\\"name\\\": \\\"string\\\"}], \\\"name\\\": \\\"string\\\
          \", \\\"nxClusterId\\\": \\\"b4d15375-1097-4c96-a4c4-4cb5809b05bb\\\"}], \\\"id\\\": \\\"b4d15375-1097-4c96-a4c4-4cb5809b05bb\\\
          \"}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = ':///era/v0.9/dpcs/{dbserver-cluster-id}/scale-out';\nconst options = {\n  method: 'POST',\n\
