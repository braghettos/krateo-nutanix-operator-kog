openapi: 3.0.1
info:
  description: "**Nutanix Database Service** (NDB) is a database as a service (DBaaS) that automates and simplifies database\
    \ administration, brings one-click simplicity and invisible operations to database provisioning and life-cycle management.\
    \ NDB enables database administrators to provision, clone, and refresh the databases at any point in time. NDB allows\
    \ administrators to define standards for their database provisioning needs with end-state driven functionality that includes\
    \ High Availability (HA) database deployments. NDB automates and simplifies the operations such as provisioning of databases\
    \ and copy data management. \n\n\n# Notes\n\nWhile making Nutanix API requests to the NDB services by using the default\
    \ self-signed certificates, the request needs to be configured to ignore SSL certificate verification requests. For example,\
    \ in case of a cURL, use _- - insecure_ flag to ensure that the SSL certificate used to encrypt the request should not\
    \ be verified."
  title: Nutanix NDB
  version: '0.9'
servers:
- url: /era/v0.9
security:
- era_token: []
- era_auth: []
paths:
  /services/update-ndb-service-ip:
    post:
      description: 'Updates the NDB service IP address and related configurations. This endpoint is only applicable in SMSP
        environments.

        The API can be used to update the metadata and to dispatch a work to update the NDB service IP address on other entities.

        '
      operationId: updateNDBServiceIP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNDBServiceIPRequest'
        description: Payload required to update NDB service IP configuration.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateNDBServiceIPResponse'
          description: NDB service IP update API completed successfully.
      summary: Update NDB Service IP
      tags:
      - Configuration
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url :///era/v0.9/services/update-ndb-service-ip \\\n    --header 'Accept: application/json'\
          \ \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json' \\\
          \n    --data '{\n    \"ipAddress\": \"192.168.0.1\",\n    \"updateConfigs\": false,\n    \"updateMetadata\": false\n\
          }'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Authorization:\
          \ Basic <basic_auth_token>' \\\n    --header 'Content-Type: application/json' \\\n    --body-data '{\n    \"ipAddress\"\
          : \"192.168.0.1\",\n    \"updateConfigs\": false,\n    \"updateMetadata\": false\n}' \\\n    --output-document \\\
          \n    - :///era/v0.9/services/update-ndb-service-ip"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"\")\n\nheaders = {\n    \"Accept\": \"application/json\"\
          ,\n    \"Authorization\": \"Basic <basic_auth_token>\",\n    \"Content-Type\": \"application/json\"\n}\n\npayload\
          \ =  \"\"\"{\n    \"ipAddress\": \"192.168.0.1\",\n    \"updateConfigs\": false,\n    \"updateMetadata\": false\n\
          }\"\"\"\n\nconn.request(\"POST\",\"/era/v0.9/services/update-ndb-service-ip\", payload, headers)\n\nres = conn.getresponse()\n\
          data = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \":///era/v0.9/services/update-ndb-service-ip\"\n\t\n\tpayload :=  strings.NewReader(`{\"ipAddress\": \"192.168.0.1\"\
          , \"updateConfigs\": false, \"updateMetadata\": false}`)\n\treq, err := http.NewRequest(\"POST\", url, payload)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"\
          Accept\", \"application/json\")\n        req.Header.Add(\"Authorization\", \"Basic <basic_auth_token>\")\n     \
          \   req.Header.Add(\"Content-Type\", \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif\
          \ err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\
          \tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\t\
          return\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \":///era/v0.9/services/update-ndb-service-ip\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\"\
          )\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"{\\\"ipAddress\\\": \\\"192.168.0.1\\\", \\\
          \"updateConfigs\\\": false, \\\"updateMetadata\\\": false}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = ':///era/v0.9/services/update-ndb-service-ip';\nconst options = {\n  method: 'POST',\n  headers:\
          \ {'Accept': 'application/json', 'Authorization': 'Basic <basic_auth_token>', 'Content-Type': 'application/json'},\n\
          \  body:  `{\"ipAddress\": \"192.168.0.1\", \"updateConfigs\": false, \"updateMetadata\": false}`\n};\n\ntry {\n\
          \  const response = await fetch(url, options);\n  const data = await response.json();\n  console.log(data);\n} catch\
          \ (error) {\n  console.error(error);\n}"
components:
  schemas:
    EraDependencyInfo:
      properties:
        dependencyName:
          type: string
        description:
          type: string
        isPresent:
          type: boolean
        isSoftware:
          type: boolean
        name:
          type: string
        requiredAction:
          type: string
      type: object
    TaskInfoSummary:
      properties:
        associatedOperations:
          items:
            $ref: '#/components/schemas/TaskInfoSummary'
          type: array
        dbserverId:
          description: ID of the Database Server. associated with the NDB Operation.
          format: uuid
          type: string
        dependencyReport:
          $ref: '#/components/schemas/EraDependencyReport'
        entityId:
          description: ID of the entity associated with the NDB Operation. For example, Time Machine ID.
          format: uuid
          type: string
        entityName:
          description: Name of the entity associated with the NDB Operation. For example, Time Machine ID.
          type: string
        entityType:
          type: string
        message:
          type: string
        name:
          description: Name of the Operation created in NDB.
          type: string
        operationId:
          description: ID of the Operation entry created in NDB.
          format: uuid
          type: string
        status:
          description: Status of the NDB Operation.
          type: string
        workId:
          description: ID of the work entry created in NDB.
          format: uuid
          type: string
      type: object
    UpdateNDBServiceIPRequest:
      description: Request model for updating NDB service IP configuration.
      properties:
        ipAddress:
          description: IP address for the NDB service.
          format: ipv4
          type: string
        updateConfigs:
          description: "Indicates if the configurations should be updated. \nConfiguration includes the NDB service IP in\
            \ era_cli_cfg config file on all registered DBserver and Agent VMs.\n"
          type: boolean
        updateMetadata:
          description: 'Indicates if the metadata should be updated.

            Metadata includes MSP metadata stored in NDB and NDB server details stored in era_dbservers table.

            '
          type: boolean
      type: object
    EraDependencyReport:
      properties:
        dependenciesSatisfied:
          type: boolean
        dependenciesVerified:
          type: boolean
        ipAddress:
          type: string
        missingConfigurations:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
        missingDependencies:
          items:
            $ref: '#/components/schemas/EraDependencyInfo'
          type: array
      type: object
    UpdateNDBServiceIPResponse:
      description: Response model for NDB service IP update operation.
      properties:
        metadataUpdated:
          description: Flag indicating whether the metadata was successfully updated.
          type: boolean
        operationSummary:
          $ref: '#/components/schemas/TaskInfoSummary'
          description: Summary information about the NDB service IP update operation.
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
