components:
  schemas:
    ERAPropertyValue:
      properties:
        description:
          type: string
        name:
          type: string
        ref_id:
          type: string
        secure:
          type: boolean
        value:
          type: string
      type: object
    ERAEntity:
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        properties:
          items:
            $ref: '#/components/schemas/ERAPropertyValue'
          type: array
        type:
          type: string
      type: object
    KMSCertificate:
      properties:
        data:
          type: string
        fileName:
          type: string
        password:
          type: string
      type: object
    KMSConfigDetails:
      properties:
        certificates:
          additionalProperties:
            $ref: '#/components/schemas/KMSCertificate'
          type: object
        credentials:
          additionalProperties:
            type: string
          type: object
        keys:
          additionalProperties:
            type: string
          type: object
      type: object
      writeOnly: true
    KMSConfig:
      properties:
        databaseCount:
          readOnly: true
          type: integer
        databaseType:
          type: string
        dateCreated:
          readOnly: true
          type: string
        dateModified:
          readOnly: true
          type: string
        description:
          type: string
        details:
          $ref: '#/components/schemas/KMSConfigDetails'
          type: object
        id:
          format: uuid
          readOnly: true
          type: string
        kmsId:
          format: uuid
          readOnly: true
          type: string
        name:
          type: string
        ownerId:
          format: uuid
          readOnly: true
          type: string
        status:
          readOnly: true
          type: string
      type: object
    ErrorResponse:
      properties:
        dependentEntities:
          items:
            $ref: '#/components/schemas/ERAEntity'
          type: array
        errorCode:
          type: string
        message:
          type: string
        reason:
          type: string
        remedy:
          type: string
      type: object
    EraPaginationResponse:
      properties:
        count:
          format: int32
          type: integer
        entities:
          items:
            type: object
          type: array
      type: object
  securitySchemes:
    era_auth:
      description: NDB username and password.
      scheme: basic
      type: http
    era_token:
      description: NDB API token.
      in: header
      name: Authorization
      type: apiKey
