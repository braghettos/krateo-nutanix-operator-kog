components:
  schemas:
    foundation_networking_input:
      description: Set virtual interfaces on FVM.
      properties:
        default_gateway:
          description: Default gateway on the node.
          format: ipv4
          type: string
        nics:
          description: NICs array.
          items:
            $ref: '#/components/schemas/nics_list'
          type: array
      required:
      - nics
      type: object
    nics_list:
      properties:
        config:
          description: Config to be applied on the node.
          items:
            $ref: '#/components/schemas/virtual_interface'
          type: array
        interface_index:
          description: Interface index of the NIC.
          type: string
      type: object
    foundation_networking_details:
      description: Get list of NICs on standalone FVM.
      properties:
        default_gateway:
          description: Default gateway configured on the node.
          type: string
        nics:
          description: List of NICs present on the node.
          properties:
            interface_details:
              description: Interface details of NIC interface.
              properties:
                ipv4_address:
                  description: IPv4 address.
                  format: ipv4
                  type: string
                ipv6_address:
                  description: IPv6 address.
                  type: string
                name:
                  description: Name of the interface.
                  type: string
                netmask:
                  description: Netmask of the virtual interface.
                  format: ipv4
                  type: string
                parent_interface_index:
                  description: Interface index of the parent interface.
                  type: integer
                primary_interface:
                  description: Boolean that indicates if interface is primary.
                  type: boolean
                vlan:
                  description: Vlan id on the interface.
                  type: integer
              type: object
            interface_index:
              description: Interface_index of NIC interface.
              type: string
          type: object
      required:
      - nics
      - default_gateway
      type: object
    http_error_500:
      description: HTTP error 500 description.
      properties:
        error:
          properties:
            details:
              description: Error details.
              type: object
            message:
              description: Error message.
              type: string
            session_id:
              description: Imaging session ID.
              type: string
          type: object
      type: object
    foundation_networking_config:
      description: Foundation network configuration details.
      items:
        description: Foundation network configuration.
        properties:
          config:
            description: Foundation network properties.
            items:
              $ref: '#/components/schemas/foundation_networking_properties'
            type: array
          ifindex:
            description: Interface index.
            type: string
        type: object
      type: array
    virtual_interface:
      description: Virtual interface config sent in POST.
      properties:
        delete:
          description: Flag to indicate delete operation.
          type: boolean
        ipv4_address:
          description: IPv4 address.
          format: ipv4
          type: string
        netmask:
          description: Netmask of the virtual interface.
          format: ipv4
          type: string
        vlan:
          description: Vlan id to be set on the virtual interface.
          type: integer
      type: object
    foundation_networking_properties:
      description: Foundation network properties.
      properties:
        ipv4:
          description: IPv4 address.
          format: ipv4
          type: string
        netmask:
          description: Netmask address.
          format: ipv4
          type: string
        vlan:
          description: Vlan.
          type: string
      type: object
