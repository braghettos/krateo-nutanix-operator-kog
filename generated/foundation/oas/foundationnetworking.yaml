    post:
      description: 'Configures network settings for foundation. Supports configuring

        virtual interfaces when multihoming is enabled. Configures

        sub-interfaces with VLAN ID so that standalone or CVM foundation

        can image and/or discover nodes that are behind a

        flat switch or managed switch.

        '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/foundation_networking_input'
        required: true
      responses:
        '200':
          description: Operation completed.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/foundation_networking_config'
        '500':
          description: Raised in case of any errors such as missing mandatory keys.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/http_error_500'
