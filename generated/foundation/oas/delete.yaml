    name: 'Copyright Nutanix Inc. All rights reserved

      '
  title: Foundation REST API
  version: '5.10'
servers:
- url: /foundation
security: []
paths:
  /delete:
    post:
      description: Deletes hypervisor or AOS images uploaded to Foundation.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                installer_type:
                  description: One of "kvm", "esx", "hyperv", "xen", or "nos".
                  type: string
                filename:
                  description: Name of the installer file.
                  type: string
              required:
              - installer_type
              - filename
        required: true
      responses:
        '200':
          description: Operation completed.
      summary: Delete a file uploaded to Foundation
      tags:
      - File Management APIs
      x-codeSamples:
