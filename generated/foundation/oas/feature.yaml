openapi: 3.0.0
info:
  contact:
    email: foundation@nutanix.com
    name: Foundation Developers
  description: '# Foundation


    Foundation is a Nutanix provided tool used for bootstrapping, imaging, and deployment of Nutanix clusters. The imaging
    process will install the desired version of the AOS software and the hypervisor of your choice. One of the ways to use
    Foundation services is to make use of the APIs provided by Foundation.


    Foundation provides seven categories of APIs, namely, General APIs, File Management APIs, Networking APIs, Imaging and
    Cluster Creation APIs, UCS Managed Mode APIs, Foundation Upgrade APIs and Factory APIs.


    However, most of these APIs find their use in internal scenarios. Some APIs that find most relevance in the customer scenario
    are image_nodes, pre_check, reboot_to_phoenix, reboot_from_phoenix, progress, phoenix_network_status, abort_session, get_progress_sessions
    among others.



    - Foundation Version: 5.10



    ## Terminology


    Some of the acronyms frequently used in the API descriptions are listed below:


    - **FVM** - Foundation Virtual Machine, A VM that has Foundation service running on it.

    - **BMC** - Baseboard management controller.

    - **IPMI** - Intelligent Platform Management Interface.


    **[Contact Us by Email](mailto:foundation@nutanix.com)**


    **License: Copyright Nutanix Inc. All rights reserved**


    '
  license:
    name: 'Copyright Nutanix Inc. All rights reserved

      '
  title: Foundation REST API
  version: '5.10'
servers:
- url: /foundation
security: []
paths:
  /features:
    get:
      description: Gets the status of the feature if feature_name is specified. Retrieves all features with a specified status
        Gets all the features and their status if no query parameters are provided.
      parameters:
      - description: Name of the feature.
        in: query
        name: feature_name
        schema:
          type: string
      - description: True, to query enabled features and false, to query disabled features
        in: query
        name: enabled
        schema:
          type: boolean
      responses:
        '200':
          description: Operation completed.
          content:
            '*/*':
              schema:
                description: Feature names and their respective status.
                items:
                  description: Feature name and enabled/disabled status.
                  properties:
                    enabled:
                      description: True, if the feature is enabled. False, if the feature is disabled.
                      type: boolean
                    feature_name:
                      description: Name of the feature.
                      type: string
                  type: object
                type: array
        '500':
          description: Raised in case of any errors.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/http_error_500'
      summary: Get feature(s) and their status
      tags:
      - General APIs
      x-codeSamples:
      - lang: cURL
        source: "curl --request GET \\\n    --url https://www.nutanix.dev/foundation/features \\\n     "
      - lang: Wget
        source: "wget --quiet \\\n    --method GET \\\n      \\\n    --output-document \\\n    - https://www.nutanix.dev/foundation/features"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {}\n \nconn.request(\"\
          GET\",\"/foundation/features\", headers=headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"\
          utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://www.nutanix.dev/foundation/features\"\n\t \n\treq, err := http.NewRequest(\"GET\", url, nil)\n\t\
          if err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n    \n\tres, err := http.DefaultClient.Do(req)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\
          \tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\t\
          return\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"GET\", \"https://www.nutanix.dev/foundation/features\"\
          )\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://www.nutanix.dev/foundation/features';\nconst options = {\n  method: 'GET',\n  headers:\
          \ {} \n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await response.json();\n  console.log(data);\n\
          } catch (error) {\n  console.error(error);\n}"
    post:
      description: Enables or disables Foundation features for the current session. If any of the features provided are unsupported
        by Foundation or cannot be modified by this API, it aborts the operation and returns an error. This API has a non-persistent
        behaviour, that is, when Foundation is restarted, the features that are enabled/disabled by the API will not be reflected.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/features_post_input'
        required: true
      responses:
        '200':
          description: Operation completed.
        '500':
          description: Raised in case of any errors.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/http_error_500'
      summary: Enable or disable foundation features
      tags:
      - General APIs
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://www.nutanix.dev/foundation/features \\\n    --data '{\n    \"features\"\
          : [\n        {\n            \"enable\": true,\n            \"feature_name\": \"string\"\n        }\n    ]\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --body-data '{\n    \"features\": [\n        {\n            \"\
          enable\": true,\n            \"feature_name\": \"string\"\n        }\n    ]\n}' \\\n    --output-document \\\n \
          \   - https://www.nutanix.dev/foundation/features"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {}\n\npayload\
          \ =  \"\"\"{\n    \"features\": [\n        {\n            \"enable\": true,\n            \"feature_name\": \"string\"\
          \n        }\n    ]\n}\"\"\"\n\nconn.request(\"POST\",\"/foundation/features\", payload, headers)\n\nres = conn.getresponse()\n\
          data = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://www.nutanix.dev/foundation/features\"\n\t\n\tpayload :=  strings.NewReader(`{\"features\": [{\"enable\"\
          : true, \"feature_name\": \"string\"}]}`)\n\treq, err := http.NewRequest(\"POST\", url, payload)\n\tif err != nil\
          \ {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n    \n\tres, err := http.DefaultClient.Do(req)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\
          \tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\t\
          return\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://www.nutanix.dev/foundation/features\"\
          )\n  .setBody(\"{\\\"features\\\": [{\\\"enable\\\": true, \\\"feature_name\\\": \\\"string\\\"}]}\")\n  .execute()\n\
          \  .toCompletableFuture()\n  .thenAccept(System.out::println)\n  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://www.nutanix.dev/foundation/features';\nconst options = {\n  method: 'POST',\n  headers:\
          \ {},\n  body:  `{\"features\": [{\"enable\": true, \"feature_name\": \"string\"}]}`\n};\n\ntry {\n  const response\
          \ = await fetch(url, options);\n  const data = await response.json();\n  console.log(data);\n} catch (error) {\n\
          \  console.error(error);\n}"
components:
  schemas:
    features_post_input:
      description: Feature names and their respective status.
      items:
        description: Feature name and enabled/disabled status.
        properties:
          enable:
            description: True, if the feature has to be enabled. False, if the feature has to be disabled.
            type: boolean
          feature_name:
            description: Name of the feature.
            type: string
        type: object
      type: array
    http_error_500:
      description: HTTP error 500 description.
      properties:
        error:
          properties:
            details:
              description: Error details.
              type: object
            message:
              description: Error message.
              type: string
            session_id:
              description: Imaging session ID.
              type: string
          type: object
      type: object
