components:
  schemas:
    upload_parameters_response:
      description: Upload parameters response.
      properties:
        in_whitelist:
          description: Indicates whether the hypervisor ISO is in the whitelist.
          type: boolean
        md5sum:
          description: Md5sum of the ISO.
          type: string
        name:
          description: Name of the ISO.
          type: string
      type: object
