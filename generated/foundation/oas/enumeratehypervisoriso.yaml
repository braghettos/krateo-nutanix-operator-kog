components:
  schemas:
    all_installers:
      description: All installer types.
      properties:
        esx:
          description: Hypervisor installer.
          items:
            $ref: '#/components/schemas/hyp_installer'
          type: array
        hyperv:
          description: Hypervisor installer.
          items:
            $ref: '#/components/schemas/hyp_installer'
          type: array
        kvm:
          description: Hypervisor installer.
          items:
            $ref: '#/components/schemas/hyp_installer'
          type: array
        linux:
          description: Hypervisor installer.
          items:
            $ref: '#/components/schemas/hyp_installer'
          type: array
      required:
      - esx
      - hyperv
      - kvm
      - linux
      type: object
    hyp_installer:
      description: Hypervisor installer.
      properties:
        filename:
          description: Name of the installer.
          type: string
        supported:
          description: Whether front-end should treat hyp as supported.
          type: boolean
      required:
      - filename
      - supported
      type: object
