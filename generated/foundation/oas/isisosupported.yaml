openapi: 3.0.0
info:
  contact:
    email: foundation@nutanix.com
    name: Foundation Developers
  description: '# Foundation


    Foundation is a Nutanix provided tool used for bootstrapping, imaging, and deployment of Nutanix clusters. The imaging
    process will install the desired version of the AOS software and the hypervisor of your choice. One of the ways to use
    Foundation services is to make use of the APIs provided by Foundation.


    Foundation provides seven categories of APIs, namely, General APIs, File Management APIs, Networking APIs, Imaging and
    Cluster Creation APIs, UCS Managed Mode APIs, Foundation Upgrade APIs and Factory APIs.


    However, most of these APIs find their use in internal scenarios. Some APIs that find most relevance in the customer scenario
    are image_nodes, pre_check, reboot_to_phoenix, reboot_from_phoenix, progress, phoenix_network_status, abort_session, get_progress_sessions
    among others.



    - Foundation Version: 5.10



    ## Terminology


    Some of the acronyms frequently used in the API descriptions are listed below:


    - **FVM** - Foundation Virtual Machine, A VM that has Foundation service running on it.

    - **BMC** - Baseboard management controller.

    - **IPMI** - Intelligent Platform Management Interface.


    **[Contact Us by Email](mailto:foundation@nutanix.com)**


    **License: Copyright Nutanix Inc. All rights reserved**


    '
  license:
    name: 'Copyright Nutanix Inc. All rights reserved

      '
  title: Foundation REST API
  version: '5.10'
servers:
- url: /foundation
security: []
paths:
  /is_iso_supported:
    post:
      description: 'Gets the details of a supported hypervisor from the

        iso_whitelist.json. If an AHV version is not specified

        in the JSON, the API reports it as supported with

        no additional details.

        '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/is_iso_supported_params'
        required: true
      responses:
        '200':
          description: Operation completed.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/is_iso_supported_response'
        '500':
          description: Raised in case of any errors.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/http_error_500'
      summary: Check whether a hypervisor is supported
      tags:
      - General APIs
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://www.nutanix.dev/foundation/is_iso_supported \\\n    --data '{\n\
          \    \"hypervisor_type\": \"string\",\n    \"md5sum\": \"string\",\n    \"node_model\": \"string\",\n    \"nos_version\"\
          : \"string\"\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --body-data '{\n    \"hypervisor_type\": \"string\",\n    \"md5sum\"\
          : \"string\",\n    \"node_model\": \"string\",\n    \"nos_version\": \"string\"\n}' \\\n    --output-document \\\
          \n    - https://www.nutanix.dev/foundation/is_iso_supported"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {}\n\npayload\
          \ =  \"\"\"{\n    \"hypervisor_type\": \"string\",\n    \"md5sum\": \"string\",\n    \"node_model\": \"string\"\
          ,\n    \"nos_version\": \"string\"\n}\"\"\"\n\nconn.request(\"POST\",\"/foundation/is_iso_supported\", payload,\
          \ headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://www.nutanix.dev/foundation/is_iso_supported\"\n\t\n\tpayload :=  strings.NewReader(`{\"hypervisor_type\"\
          : \"string\", \"md5sum\": \"string\", \"node_model\": \"string\", \"nos_version\": \"string\"}`)\n\treq, err :=\
          \ http.NewRequest(\"POST\", url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\
          \t\treturn\n\t}\n\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating\
          \ request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\tif err !=\
          \ nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\
          \n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://www.nutanix.dev/foundation/is_iso_supported\"\
          )\n  .setBody(\"{\\\"hypervisor_type\\\": \\\"string\\\", \\\"md5sum\\\": \\\"string\\\", \\\"node_model\\\": \\\
          \"string\\\", \\\"nos_version\\\": \\\"string\\\"}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://www.nutanix.dev/foundation/is_iso_supported';\nconst options = {\n  method: 'POST',\n\
          \  headers: {},\n  body:  `{\"hypervisor_type\": \"string\", \"md5sum\": \"string\", \"node_model\": \"string\"\
          , \"nos_version\": \"string\"}`\n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await\
          \ response.json();\n  console.log(data);\n} catch (error) {\n  console.error(error);\n}"
components:
  schemas:
    is_iso_supported_params:
      description: Parameters required to check if an ISO is supported.
      properties:
        hypervisor_type:
          description: Hypervisor type.
          type: string
        md5sum:
          description: md5sum of the hypervisor ISO.
          type: string
        node_model:
          description: Model name of the node.
          type: string
        nos_version:
          description: NOS version.
          type: string
      required:
      - hypervisor_type
      - md5sum
      - nos_version
      - node_model
      type: object
    is_iso_supported_response:
      description: Details of the ISO.
      properties:
        metadata:
          additionalProperties: true
          description: Metadata of ISO from iso_whitelist.json.
          type: object
        supported:
          description: Indicates whether the ISO is supported or not.
          type: boolean
      required:
      - supported
      - metadata
      type: object
    http_error_500:
      description: HTTP error 500 description.
      properties:
        error:
          properties:
            details:
              description: Error details.
              type: object
            message:
              description: Error message.
              type: string
            session_id:
              description: Imaging session ID.
              type: string
          type: object
      type: object
