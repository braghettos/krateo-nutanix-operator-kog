    name: 'Copyright Nutanix Inc. All rights reserved

      '
  title: Foundation REST API
  version: '5.10'
servers:
- url: /foundation
security: []
paths:
  /drivers:
    get:
      description: Retrieves a list of the required drivers for a specified hypervisor type, version/distro, vendor, and AOS
        version.
      parameters:
      - description: Hypervisor Type.
        in: query
        name: hypervisor_type
        required: true
        schema:
          type: string
      - description: Hypervisor version, required only for esx.
        in: query
        name: hypervisor_version
        schema:
          type: string
      - description: Hypervisor distro, required only for AHV.
        in: query
        name: hypervisor_distro
        schema:
          type: string
      - description: Vendor for which the drivers need to be fetched. Vendor can be SMC, Dell, Lenovo, Fujitsu, Hpe, Cisco
          or generic. Any unidentified vendor is treated as generic.
        in: query
        name: vendor
        schema:
          type: string
      - description: AOS version.
        in: query
        name: aos_version
        schema:
          type: string
      responses:
        '200':
          description: Operation completed.
          content:
            '*/*':
              schema:
                description: URLs and md5sums of all required drivers.
                items:
                  description: URL and md5sum of a driver.
                  properties:
                    md5sum:
                      description: md5sum of a driver.
                      type: string
                    url:
                      description: URL of a driver.
                      type: string
                  type: object
                type: array
      summary: Get the list of drivers to be installed for node and hypervisor type
      tags:
      - General APIs
