openapi: 3.0.0
info:
  contact:
    email: foundation@nutanix.com
    name: Foundation Developers
  description: '# Foundation


    Foundation is a Nutanix provided tool used for bootstrapping, imaging, and deployment of Nutanix clusters. The imaging
    process will install the desired version of the AOS software and the hypervisor of your choice. One of the ways to use
    Foundation services is to make use of the APIs provided by Foundation.


    Foundation provides seven categories of APIs, namely, General APIs, File Management APIs, Networking APIs, Imaging and
    Cluster Creation APIs, UCS Managed Mode APIs, Foundation Upgrade APIs and Factory APIs.


    However, most of these APIs find their use in internal scenarios. Some APIs that find most relevance in the customer scenario
    are image_nodes, pre_check, reboot_to_phoenix, reboot_from_phoenix, progress, phoenix_network_status, abort_session, get_progress_sessions
    among others.



    - Foundation Version: 5.10



    ## Terminology


    Some of the acronyms frequently used in the API descriptions are listed below:


    - **FVM** - Foundation Virtual Machine, A VM that has Foundation service running on it.

    - **BMC** - Baseboard management controller.

    - **IPMI** - Intelligent Platform Management Interface.


    **[Contact Us by Email](mailto:foundation@nutanix.com)**


    **License: Copyright Nutanix Inc. All rights reserved**


    '
  license:
    name: 'Copyright Nutanix Inc. All rights reserved

      '
  title: Foundation REST API
  version: '5.10'
servers:
- url: /foundation
security: []
paths:
  /get_progress_sessions:
    get:
      description: 'Reports status of current and all previous sessions.

        The sessions can have active, failed and succeeded status.

        This API can also be used to check if a session is currently active.

        '
      responses:
        '200':
          description: Operation completed.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/sessions_progress_properties'
      summary: Get status of imaging sessions
      tags:
      - Imaging and Cluster Creation APIs
      x-codeSamples:
      - lang: cURL
        source: "curl --request GET \\\n    --url https://www.nutanix.dev/foundation/get_progress_sessions \\\n     "
      - lang: Wget
        source: "wget --quiet \\\n    --method GET \\\n      \\\n    --output-document \\\n    - https://www.nutanix.dev/foundation/get_progress_sessions"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {}\n \nconn.request(\"\
          GET\",\"/foundation/get_progress_sessions\", headers=headers)\n\nres = conn.getresponse()\ndata = res.read()\n\n\
          print(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://www.nutanix.dev/foundation/get_progress_sessions\"\n\t \n\treq, err := http.NewRequest(\"GET\", url,\
          \ nil)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n    \n\tres, err\
          \ := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\
          \t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error\
          \ creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"GET\", \"https://www.nutanix.dev/foundation/get_progress_sessions\"\
          )\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://www.nutanix.dev/foundation/get_progress_sessions';\nconst options = {\n  method: 'GET',\n\
          \  headers: {} \n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await response.json();\n\
          \  console.log(data);\n} catch (error) {\n  console.error(error);\n}"
components:
  schemas:
    sessions_progress_properties:
      description: List of succeeded, active and failed sessions and their properties.
      properties:
        active_sessions:
          description: List of details of active sessions.
          items:
            additionalProperties:
              $ref: '#/components/schemas/progress_properties'
            description: Progress details of the the session.
            type: object
          type: array
        failed_sessions:
          description: List of details of failed sessions.
          items:
            additionalProperties:
              $ref: '#/components/schemas/progress_properties'
            description: Progress details of the the session.
            type: object
          type: array
        succeeded_sessions:
          description: List of details of succeeded sessions.
          items:
            additionalProperties:
              $ref: '#/components/schemas/progress_properties'
            description: Progress details of the the session.
            type: object
          type: array
      type: object
    post_cluster_progress_properties:
      description: Post cluster creation tasks properties.
      properties:
        cluster_name:
          description: Name of the cluster.
          type: string
        messages:
          description: List of error messages and exceptions.
          items:
            description: Error message or exception.
            type: string
          type: array
        percent_complete:
          description: Percentage of the action completed.
          format: float
          type: number
        status:
          description: Action currently being performed.
          type: string
        time_elapsed:
          description: Time elapsed in minutes.
          format: float
          type: number
        time_total:
          description: Total time required in minutes.
          format: float
          type: number
      type: object
    progress_properties:
      properties:
        abort_session:
          description: True, if the session is aborted, false, otherwise.
          type: boolean
        action:
          description: Operation currently being performed.
          type: string
        aggregate_percent_complete:
          description: Percentage of process completed.
          format: float
          type: number
        clusters:
          description: Details of the clusters.
          items:
            $ref: '#/components/schemas/cluster_progress_properties'
          type: array
        imaging_stopped:
          description: True, if imaging is stopped, false, otherwise.
          type: boolean
        nodes:
          description: Details of the nodes.
          items:
            $ref: '#/components/schemas/node_progress_properties'
          type: array
        post_cluster_creation_ops:
          description: Details of post-cluster creation tasks.
          items:
            $ref: '#/components/schemas/post_cluster_progress_properties'
          type: array
        results:
          description: List of results.
          items:
            description: Result.
            type: string
          type: array
        session_id:
          description: Session ID.
          type: string
      type: object
    cluster_progress_properties:
      description: Cluster properties.
      properties:
        category:
          description: List of error categories.
          items:
            description: Error category.
            type: string
          type: array
        cluster_members:
          description: List of the IPv4 addresses of the nodes out of which a cluster should be formed.
          items:
            description: IPv4 address of node.
            format: ipv4
            type: string
          type: array
        cluster_members_ipv6:
          description: List of the IPv6 addresses of the nodes out of which a cluster should be formed.
          items:
            description: IPv6 address of node.
            format: ipv6
            type: string
          type: array
        cluster_name:
          description: Name of cluster.
          type: string
        messages:
          description: List of error messages and exceptions.
          items:
            description: Error message or exception.
            type: string
          type: array
        percent_complete:
          description: Percentage of action completed.
          format: float
          type: number
        status:
          description: Action currently being performed.
          type: string
        time_elapsed:
          description: Time elapsed in minutes.
          format: float
          type: number
        time_total:
          description: Total time required in minutes.
          format: float
          type: number
      type: object
    node_progress_properties:
      description: Node properties.
      properties:
        category:
          description: List of error categories.
          items:
            description: Error category.
            type: string
          type: array
        cvm_ip:
          description: IP address of CVM.
          format: ipv4
          type: string
        cvm_ipv6_address:
          description: Global IPv6 address of CVM.
          format: ipv6
          type: string
        hypervisor_ip:
          description: IP address of hypervisor.
          format: ipv4
          type: string
        hypervisor_ipv6_address:
          description: Global IPv6 address of hypervisor.
          format: ipv6
          type: string
        messages:
          description: List of error messages and exceptions.
          items:
            description: Error message or exception.
            type: string
          type: array
        node_serial:
          description: Node serial.
          type: string
        percent_complete:
          description: Percentage of action completed.
          format: float
          type: number
        phoenix_ip:
          description: IP address of Phoenix.
          format: ipv4
          type: string
        status:
          description: Action currently being performed.
          type: string
        time_elapsed:
          description: Time elapsed in minutes.
          format: float
          type: number
        time_total:
          description: Total time required in minutes.
          format: float
          type: number
      type: object
