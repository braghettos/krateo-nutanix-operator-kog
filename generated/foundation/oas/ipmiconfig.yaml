openapi: 3.0.0
info:
  contact:
    email: foundation@nutanix.com
    name: Foundation Developers
  description: '# Foundation


    Foundation is a Nutanix provided tool used for bootstrapping, imaging, and deployment of Nutanix clusters. The imaging
    process will install the desired version of the AOS software and the hypervisor of your choice. One of the ways to use
    Foundation services is to make use of the APIs provided by Foundation.


    Foundation provides seven categories of APIs, namely, General APIs, File Management APIs, Networking APIs, Imaging and
    Cluster Creation APIs, UCS Managed Mode APIs, Foundation Upgrade APIs and Factory APIs.


    However, most of these APIs find their use in internal scenarios. Some APIs that find most relevance in the customer scenario
    are image_nodes, pre_check, reboot_to_phoenix, reboot_from_phoenix, progress, phoenix_network_status, abort_session, get_progress_sessions
    among others.



    - Foundation Version: 5.10



    ## Terminology


    Some of the acronyms frequently used in the API descriptions are listed below:


    - **FVM** - Foundation Virtual Machine, A VM that has Foundation service running on it.

    - **BMC** - Baseboard management controller.

    - **IPMI** - Intelligent Platform Management Interface.


    **[Contact Us by Email](mailto:foundation@nutanix.com)**


    **License: Copyright Nutanix Inc. All rights reserved**


    '
  license:
    name: 'Copyright Nutanix Inc. All rights reserved

      '
  title: Foundation REST API
  version: '5.10'
servers:
- url: /foundation
security: []
paths:
  /ipmi_config:
    post:
      description: Configures IPMI IP address on BMC of nodes.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ipmi_config_params'
        required: true
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ipmi_config_params_response'
        '500':
          description: Raised in case of any errors such as missing mandatory keys
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/http_error_500'
      summary: Configure BMC IPv4
      tags:
      - Networking APIs
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://www.nutanix.dev/foundation/ipmi_config \\\n    --data '{\n    \"\
          blocks\": [\n        {}\n    ],\n    \"ipmi_gateway\": \"192.168.0.1\",\n    \"ipmi_netmask\": \"192.168.0.1\",\n\
          \    \"ipmi_password\": \"string\",\n    \"ipmi_user\": \"string\"\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --body-data '{\n    \"blocks\": [\n        {}\n    ],\n    \"\
          ipmi_gateway\": \"192.168.0.1\",\n    \"ipmi_netmask\": \"192.168.0.1\",\n    \"ipmi_password\": \"string\",\n \
          \   \"ipmi_user\": \"string\"\n}' \\\n    --output-document \\\n    - https://www.nutanix.dev/foundation/ipmi_config"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {}\n\npayload\
          \ =  \"\"\"{\n    \"blocks\": [\n        {}\n    ],\n    \"ipmi_gateway\": \"192.168.0.1\",\n    \"ipmi_netmask\"\
          : \"192.168.0.1\",\n    \"ipmi_password\": \"string\",\n    \"ipmi_user\": \"string\"\n}\"\"\"\n\nconn.request(\"\
          POST\",\"/foundation/ipmi_config\", payload, headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"\
          utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://www.nutanix.dev/foundation/ipmi_config\"\n\t\n\tpayload :=  strings.NewReader(`{\"blocks\": [{}],\
          \ \"ipmi_gateway\": \"192.168.0.1\", \"ipmi_netmask\": \"192.168.0.1\", \"ipmi_password\": \"string\", \"ipmi_user\"\
          : \"string\"}`)\n\treq, err := http.NewRequest(\"POST\", url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"Error\
          \ creating request:\", err)\n\t\treturn\n\t}\n\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil\
          \ {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err\
          \ := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t\
          }\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://www.nutanix.dev/foundation/ipmi_config\"\
          )\n  .setBody(\"{\\\"blocks\\\": [{}], \\\"ipmi_gateway\\\": \\\"192.168.0.1\\\", \\\"ipmi_netmask\\\": \\\"192.168.0.1\\\
          \", \\\"ipmi_password\\\": \\\"string\\\", \\\"ipmi_user\\\": \\\"string\\\"}\")\n  .execute()\n  .toCompletableFuture()\n\
          \  .thenAccept(System.out::println)\n  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://www.nutanix.dev/foundation/ipmi_config';\nconst options = {\n  method: 'POST',\n  headers:\
          \ {},\n  body:  `{\"blocks\": [{}], \"ipmi_gateway\": \"192.168.0.1\", \"ipmi_netmask\": \"192.168.0.1\", \"ipmi_password\"\
          : \"string\", \"ipmi_user\": \"string\"}`\n};\n\ntry {\n  const response = await fetch(url, options);\n  const data\
          \ = await response.json();\n  console.log(data);\n} catch (error) {\n  console.error(error);\n}"
components:
  schemas:
    http_error_500:
      description: HTTP error 500 description.
      properties:
        error:
          properties:
            details:
              description: Error details.
              type: object
            message:
              description: Error message.
              type: string
            session_id:
              description: Imaging session ID.
              type: string
          type: object
      type: object
    ipmi_config_params:
      description: ipmi config parameters.
      properties:
        blocks:
          description: Block details.
          items:
            description: Block details.
            properties:
              block_id:
                description: Block id.
                type: string
              nodes:
                description: Node dictionary for ipmi_config.
                items:
                  $ref: '#/components/schemas/node_dict_for_ipmi_config'
                type: array
            type: object
          type: array
        ipmi_gateway:
          description: IPMI gateway.
          format: ipv4
          type: string
        ipmi_netmask:
          description: IPMI netmask.
          format: ipv4
          type: string
        ipmi_password:
          description: IPMI password.
          type: string
        ipmi_user:
          description: IPMI username.
          type: string
      required:
      - ipmi_netmask
      - ipmi_gateway
      - blocks
      type: object
    node_dict_for_ipmi_config:
      description: Node dictionary for ipmi config.
      properties:
        ipmi_configure_now:
          description: Whether IPMI should be configured.
          type: boolean
        ipmi_ip:
          description: IPMI IP address.
          format: ipv4
          type: string
        ipmi_mac:
          description: IPMI mac address.
          type: string
      required:
      - ipmi_ip
      - ipmi_configure_now
      type: object
    node_dict_for_ipmi_config_response:
      description: Node dictionary for ipmi config response.
      properties:
        ipmi_configure_now:
          description: Whether IPMI should be configured.
          type: boolean
        ipmi_configure_successful:
          description: Whether IPMI was successfully configured.
          type: boolean
        ipmi_ip:
          description: IPMI IP address.
          format: ipv4
          type: string
        ipmi_mac:
          description: IPMI mac address.
          type: string
      required:
      - ipmi_ip
      - ipmi_mac
      - ipmi_configure_now
      type: object
    ipmi_config_params_response:
      description: ipmi config parameters response.
      properties:
        blocks:
          description: Block details.
          items:
            description: Block details.
            properties:
              block_id:
                description: Block id.
                type: string
              nodes:
                description: Node dictionary for ipmi_config_response.
                items:
                  $ref: '#/components/schemas/node_dict_for_ipmi_config_response'
                type: array
            type: object
          type: array
        ipmi_gateway:
          description: IPMI gateway.
          format: ipv4
          type: string
        ipmi_netmask:
          description: IPMI netmask.
          format: ipv4
          type: string
        ipmi_password:
          description: IPMI password.
          type: string
        ipmi_user:
          description: IPMI username.
          type: string
      required:
      - ipmi_user
      - ipmi_password
      - ipmi_netmask
      - ipmi_gateway
      - blocks
      type: object
