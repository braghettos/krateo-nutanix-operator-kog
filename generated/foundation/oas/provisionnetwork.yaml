components:
  schemas:
    provision_network_params:
      description: Provision Networking on the node.
      properties:
        error:
          description: 'Present when this API returns partial results.

            See the `error` field at node level for more details.

            '
          type: string
        nodes:
          description: nodes array.
          items:
            $ref: '#/components/schemas/node_info_list'
          type: array
      required:
      - nodes
      type: object
    http_error_500:
      description: HTTP error 500 description.
      properties:
        error:
          properties:
            details:
              description: Error details.
              type: object
            message:
              description: Error message.
              type: string
            session_id:
              description: Imaging session ID.
              type: string
          type: object
      type: object
    node_info_list:
      description: Network parameters of the node.
      properties:
        cvm_gateway:
          description: Gateway of CVM.
          format: ipv4
          type: string
        cvm_ip:
          description: CVM IP address.
          format: ipv4
          type: string
        cvm_ipv6_address:
          description: Global IPv6 address of CVM.
          format: ipv6
          type: string
        cvm_netmask:
          description: Netmask of CVM.
          format: ipv4
          type: string
        cvm_vlan_id:
          description: CVM VLAN tag.
          type: string
        error:
          description: 'Only exists when failed to fetch node_info, with the reason of failure.

            all other fields will be empty

            '
          type: string
        hypervisor_gateway:
          description: Gateway of the hypervisor.
          format: ipv4
          type: string
        hypervisor_hostname:
          description: Hypervisor hostname.
          type: string
        hypervisor_ip:
          description: Hypervisor IP address.
          format: ipv4
          type: string
        hypervisor_ipv6_address:
          description: Global IPv6 address of hypervisor.
          format: ipv6
          type: string
        hypervisor_netmask:
          description: Netmask of the hypervisor.
          format: ipv4
          type: string
        ipmi_gateway:
          description: IPMI gateway.
          format: ipv4
          type: string
        ipmi_ip:
          description: IPMI IP address.
          format: ipv4
          type: string
        ipmi_netmask:
          description: IPMI netmask.
          format: ipv4
          type: string
        ipv6_address:
          description: IPv6 link local address.
          type: string
        phoenix_ipv6_address:
          description: Global IPv6 address of Phoenix.
          format: ipv6
          type: string
      type: object
