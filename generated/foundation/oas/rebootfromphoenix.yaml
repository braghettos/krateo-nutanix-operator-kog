        source: "curl --request POST \\\n    --url https://www.nutanix.dev/foundation/reboot_from_phoenix \\\n    --data '{\n\
          \    \"compute_only\": true,\n    \"cvm_ip\": \"192.168.0.1\",\n    \"hypervisor_ip\": \"192.168.0.1\",\n    \"\
          reboot_timeout_mins\": 25\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --body-data '{\n    \"compute_only\": true,\n    \"cvm_ip\": \"\
          192.168.0.1\",\n    \"hypervisor_ip\": \"192.168.0.1\",\n    \"reboot_timeout_mins\": 25\n}' \\\n    --output-document\
          \ \\\n    - https://www.nutanix.dev/foundation/reboot_from_phoenix"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {}\n\npayload\
          \ =  \"\"\"{\n    \"compute_only\": true,\n    \"cvm_ip\": \"192.168.0.1\",\n    \"hypervisor_ip\": \"192.168.0.1\"\
          ,\n    \"reboot_timeout_mins\": 25\n}\"\"\"\n\nconn.request(\"POST\",\"/foundation/reboot_from_phoenix\", payload,\
          \ headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://www.nutanix.dev/foundation/reboot_from_phoenix\"\n\t\n\tpayload :=  strings.NewReader(`{\"compute_only\"\
          : true, \"cvm_ip\": \"192.168.0.1\", \"hypervisor_ip\": \"192.168.0.1\", \"reboot_timeout_mins\": 25}`)\n\treq,\
          \ err := http.NewRequest(\"POST\", url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\"\
          , err)\n\t\treturn\n\t}\n\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"\
          Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\t\
          fmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://www.nutanix.dev/foundation/reboot_from_phoenix\"\
          )\n  .setBody(\"{\\\"compute_only\\\": true, \\\"cvm_ip\\\": \\\"192.168.0.1\\\", \\\"hypervisor_ip\\\": \\\"192.168.0.1\\\
          \", \\\"reboot_timeout_mins\\\": 25}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://www.nutanix.dev/foundation/reboot_from_phoenix';\nconst options = {\n  method: 'POST',\n\
          \  headers: {},\n  body:  `{\"compute_only\": true, \"cvm_ip\": \"192.168.0.1\", \"hypervisor_ip\": \"192.168.0.1\"\
          , \"reboot_timeout_mins\": 25}`\n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await\
          \ response.json();\n  console.log(data);\n} catch (error) {\n  console.error(error);\n}"
components:
  schemas:
    reboot_from_phoenix:
      description: Reboot from phoenix parameters.
      properties:
        compute_only:
          description: Indicate this is a compute-only node.
          type: boolean
        cvm_ip:
          description: IP address of CVM.
          format: ipv4
          type: string
        hypervisor_ip:
          description: IP address of hypervisor.
          format: ipv4
          type: string
        reboot_timeout_mins:
          description: Time period (in minutes) foundation waits for the CVM to come up.
          format: int64
          minimum: 25
          type: integer
      type: object
