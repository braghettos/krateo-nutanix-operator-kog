components:
  schemas:
    ssd_properties:
      description: Details of the SSD.
      properties:
        approved_by:
          description: Name of the vendor who approved.
          type: string
        blacklist_firmware:
          description: List of unsupported firmwares.
          items:
            description: Names of unsupported firmwares.
            type: string
          type: array
        boot:
          description: True, if it is a supported boot drive, false otherwise.
          type: boolean
        capacity_gb:
          description: Capacity of the SSD in GBs.
          format: int64
          type: integer
        data:
          description: True if it is a data drive, False otherwise.
          type: boolean
        diagnostic_test:
          description: Value of the diagnostic test.
          format: int64
          type: integer
        endurance:
          description: Value of endurance in numbers.
          format: int64
          type: integer
        include_in_hcl:
          description: Value to state if it includes in HCL or not.
          type: boolean
        interface:
          description: Type of interface.
          type: string
        manufacturer:
          description: Name of the manufacturer of the SSD.
          type: string
      type: object
    http_error_500:
      description: HTTP error 500 description.
      properties:
        error:
          properties:
            details:
              description: Error details.
              type: object
            message:
              description: Error message.
              type: string
            session_id:
              description: Imaging session ID.
              type: string
          type: object
      type: object
    hcl_properties:
      description: List of Nutanix supported and qualified SSDs.
      properties:
        last_edit:
          description: Time stamp of the file when it was last edited.
          format: int64
          type: integer
        ssd:
          description: List of supported and qualified SSDs.
          items:
            $ref: '#/components/schemas/ssd_properties'
          type: array
        version:
          description: Version number of the hcl.json file.
          format: int64
          type: integer
      type: object
