components:
  schemas:
    http_error_500:
      description: HTTP error 500 description.
      properties:
        error:
          properties:
            details:
              description: Error details.
              type: object
            message:
              description: Error message.
              type: string
            session_id:
              description: Imaging session ID.
              type: string
          type: object
      type: object
    component_install:
      description: Component install detail
      properties:
        component_name:
          description: Name of component.
          type: string
        target_version:
          description: Target version of component
          type: string
      required:
      - component_name
      - target_version
      type: object
    components_install_list:
      description: Complete list of components that will be updated. This list will also contain dependent components that
        will be updated.
      properties:
        components:
          description: Components list.
          items:
            $ref: '#/components/schemas/component_install'
          type: array
      required:
      - components
      type: object
    updates_list:
      description: List of updates to be installed.
      properties:
        updates:
          description: Updates list.
          items:
            $ref: '#/components/schemas/component_install'
          type: array
      required:
      - updates
      type: object
