openapi: 3.0.0
info:
  contact:
    email: foundation@nutanix.com
    name: Foundation Developers
  description: '# Foundation


    Foundation is a Nutanix provided tool used for bootstrapping, imaging, and deployment of Nutanix clusters. The imaging
    process will install the desired version of the AOS software and the hypervisor of your choice. One of the ways to use
    Foundation services is to make use of the APIs provided by Foundation.


    Foundation provides seven categories of APIs, namely, General APIs, File Management APIs, Networking APIs, Imaging and
    Cluster Creation APIs, UCS Managed Mode APIs, Foundation Upgrade APIs and Factory APIs.


    However, most of these APIs find their use in internal scenarios. Some APIs that find most relevance in the customer scenario
    are image_nodes, pre_check, reboot_to_phoenix, reboot_from_phoenix, progress, phoenix_network_status, abort_session, get_progress_sessions
    among others.



    - Foundation Version: 5.10



    ## Terminology


    Some of the acronyms frequently used in the API descriptions are listed below:


    - **FVM** - Foundation Virtual Machine, A VM that has Foundation service running on it.

    - **BMC** - Baseboard management controller.

    - **IPMI** - Intelligent Platform Management Interface.


    **[Contact Us by Email](mailto:foundation@nutanix.com)**


    **License: Copyright Nutanix Inc. All rights reserved**


    '
  license:
    name: 'Copyright Nutanix Inc. All rights reserved

      '
  title: Foundation REST API
  version: '5.10'
servers:
- url: /foundation
security: []
paths:
  /components/install:
    post:
      description: Installs the updates from the list.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updates_list'
        required: true
      responses:
        '200':
          description: List of components that will be updated along with their target versions. This will contain all the
            components that are being updated along with the dependent components.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/components_install_list'
        '500':
          description: Raised in case of any errors
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/http_error_500'
      summary: Install packages
      tags:
      - Components APIs
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://www.nutanix.dev/foundation/components/install \\\n    --data '{\n\
          \    \"updates\": [\n        {\n            \"component_name\": \"string\",\n            \"target_version\": \"\
          string\"\n        }\n    ]\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --body-data '{\n    \"updates\": [\n        {\n            \"\
          component_name\": \"string\",\n            \"target_version\": \"string\"\n        }\n    ]\n}' \\\n    --output-document\
          \ \\\n    - https://www.nutanix.dev/foundation/components/install"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {}\n\npayload\
          \ =  \"\"\"{\n    \"updates\": [\n        {\n            \"component_name\": \"string\",\n            \"target_version\"\
          : \"string\"\n        }\n    ]\n}\"\"\"\n\nconn.request(\"POST\",\"/foundation/components/install\", payload, headers)\n\
          \nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://www.nutanix.dev/foundation/components/install\"\n\t\n\tpayload :=  strings.NewReader(`{\"updates\"\
          : [{\"component_name\": \"string\", \"target_version\": \"string\"}]}`)\n\treq, err := http.NewRequest(\"POST\"\
          , url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n    \n\
          \tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\
          \t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"\
          Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://www.nutanix.dev/foundation/components/install\"\
          )\n  .setBody(\"{\\\"updates\\\": [{\\\"component_name\\\": \\\"string\\\", \\\"target_version\\\": \\\"string\\\
          \"}]}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://www.nutanix.dev/foundation/components/install';\nconst options = {\n  method: 'POST',\n\
