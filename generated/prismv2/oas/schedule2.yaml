components:
  schemas:
    delete.dto.PrimitiveDTO_java.lang.Boolean_:
      type: object
      properties:
        value:
          type: boolean
    update.dto.dr.CronScheduleDTO:
      type: object
      properties:
        app_consistent:
          type: boolean
        duration_in_usecs:
          format: int64
          type: integer
        end_time_in_usecs:
          format: int64
          type: integer
        every_nth:
          format: int32
          type: integer
        id:
          type: string
        is_rollup_sched:
          type: boolean
        pd_name:
          type: string
        retention_policy:
          $ref: '#/components/schemas/update.dto.dr.RetentionPolicyDTO'
        rollup_schedule_uuid:
          type: string
        start_times_in_usecs:
          items:
            format: int64
            type: integer
          type: array
        suspended:
          type: boolean
        timezone_offset:
          format: int32
          type: integer
        type:
          enum:
          - SECONDLY
          - MINUTELY
          - HOURLY
          - DAILY
          - WEEKLY
          - MONTHLY
          type: string
        user_start_time_in_usecs:
          format: int64
          type: integer
        values:
          items:
            format: int32
            type: integer
          type: array
    update.dto.dr.RetentionPolicyDTO:
