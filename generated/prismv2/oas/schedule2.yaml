            format: int32
            type: integer
          type: object
        remote_retention_period:
          additionalProperties:
            format: int32
            type: integer
          type: object
        remote_retention_type:
          additionalProperties:
            enum:
            - NUM_SNAPSHOTS
            - DAYS
            - WEEKS
            - MONTHS
            type: string
          type: object
