    delete:
      summary: Delete a Virtual Machine.
      description: Delete a Virtual Machine. This is an idempotent operation. If the Virtual Machine is currently powered
        on, it will be forcefully powered off. The logical timestamp can optionally be provided for consistency. If a logical
        timestamp is specified, then this operation will be rejected if the logical timestamp specified is not the value of
        the Virtual Machine logical timestamp. The logical timestamp can be obtained from the Virtual Machine object. This
        is also an asynchronous operation that results in the creation of a task object. The UUID of this task object is returned
        as the response of this operation. This task can be monitored by using the /tasks/poll API.
      tags:
      - /vms
      operationId: delete/vms/{uuid}/deleteVM
      parameters:
      - name: uuid
        in: path
        description: Id of the Virtual Machine
        required: true
        schema:
          type: string
      - name: delete_snapshots
        in: query
        description: Delete Virtual Machine snapshots
        required: false
        schema:
          type: boolean
      - name: logical_timestamp
        in: query
        description: The Virtual logical timestamp
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/delete.dto.acropolis.ReturnValueDTO_TaskIdDTO'
      x-codeSamples:
