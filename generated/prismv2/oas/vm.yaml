    put:
      summary: Update a Virtual Machine.
      description: Update a Virtual Machine. Field that are not set or are not specified are ignored. Note that some attributes
        may not be modifiable while the Virtual Machine is running. For instance, the KVM hypervisor does not support CPU
        or memory hot-plug. The hwclockTimezone attribute specifies the VM s hardware clock timezone. Most operating systems
        assume the system clock is UTC, but some (like Windows) expect the local timezone. Changes to the clock timezone only
        take effect after a full Virtual Machine power cycle. This API can be used to reclaim memory from guests using a balloon
        driver. It is not currently possible to return ballooned memory to a guest. The attempt to reclaim memory may fail
        if the balloon driver is not installed, or is unable to allocate the requested amount of memory from the guest OS.
        In this case, the Virtual Machine s memory reservation will be restored to its value from before the balloon attempt.
        If a logical timestamp is specified, then this operation will be rejected if the logical timestamp specified is not
        the value of the Virtual Machine logical timestamp. The logical timestamp can be obtained from the Virtual Machine
        object. This is also an asynchronous operation that results in the creation of a task object. The UUID of this task
        object is returned as the response of this operation. This task can be monitored by using the /tasks/poll API. The
        VM disks cannot be updated using this api. Please use v2.0 vms/uuid/disks/update API.
      tags:
      - /vms
      operationId: put/vms/{uuid}/updateVM
      parameters:
      - name: uuid
        in: path
        description: Id of the Virtual Machine
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update.dto.uhura.VmConfigDTO'
        description: Virtual Machine Update Info
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/update.dto.acropolis.ReturnValueDTO_TaskIdDTO'
