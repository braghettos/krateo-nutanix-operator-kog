            application/json:
              schema:
                $ref: '#/components/schemas/create.dto.hyperv.MultiNodeConfigurationOperationResponseDTO'
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/hosts/unjoin_domain\
