      - lang: JavaScript
        source: "const url = 'https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/hosts/unjoin_domain';\nconst options\
          \ = {\n  method: 'POST',\n  headers: {'Accept': 'application/json', 'Content-Type': 'application/json'},\n  body:\
          \  `{\"credential\": {\"logon_name\": \"string\", \"password\": \"string\"}, \"domain_descriptor\": {\"domain_name\"\
