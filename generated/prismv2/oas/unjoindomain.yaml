          ,\n        \"ou_path\": \"string\"\n    },\n    \"force\": true,\n    \"node_descriptors\": [\n        {\n     \
          \       \"name\": \"string\",\n            \"node_id\": \"string\",\n            \"node_uuid\": \"string\"\n   \
          \     }\n    ],\n    \"node_name_prefix\": \"string\",\n    \"restart\": true\n}'"
