components:
  requestBodies:
    create.dto.hyperv.ConfigureHypervNodeRequestDTO_HypervNodeDomainConfigurationDTO:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create.dto.hyperv.ConfigureHypervNodeRequestDTO_HypervNodeDomainConfigurationDTO'
  schemas:
    create.dto.hyperv.MultiNodeConfigurationOperationResponseDTO_NodeSpecificStatus:
      type: object
      properties:
        message:
          type: string
        node_id:
          type: string
        node_uuid:
          type: string
        reboot_initiated:
          type: boolean
        successful:
          type: boolean
    create.dto.hyperv.MultiNodeConfigurationOperationResponseDTO:
      type: object
      properties:
        node_specific_status:
          items:
            $ref: '#/components/schemas/create.dto.hyperv.MultiNodeConfigurationOperationResponseDTO_NodeSpecificStatus'
          type: array
    create.dto.hyperv.CredentialDTO:
      type: object
      properties:
        logon_name:
          type: string
        password:
          type: string
    create.dto.hyperv.DomainDescriptorDTO:
      type: object
      properties:
        domain_name:
          type: string
        name_prefix:
          type: string
        name_server:
          type: string
        ou_path:
          type: string
    create.dto.hyperv.HypervNodeDescriptorDTO:
      type: object
