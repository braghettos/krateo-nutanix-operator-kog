          type: boolean
    get.dto.appliance.configuration.KMSTypeDTO:
      type: object
      properties:
        force_update_config:
          type: boolean
        kms_type:
          enum:
          - EKM
          - LKM
          - PCKM
          type: string
        skip_cluster_size_check:
          type: boolean
