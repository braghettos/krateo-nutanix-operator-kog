          type: integer
        entity_list:
          items:
            type: string
          type: array
        message:
          type: string
    create.dto.alerts.AlertPolicyDTO:
      type: object
      properties:
        auto_resolve:
          type: boolean
        created_by:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        error_on_conflict:
          type: boolean
        filter:
          type: string
        id:
          type: string
        impact_types:
          items:
            type: string
          type: array
        last_updated_timestamp_in_usecs:
          format: int64
          type: integer
        policies_to_override:
          items:
            type: string
          type: array
        related_policies:
