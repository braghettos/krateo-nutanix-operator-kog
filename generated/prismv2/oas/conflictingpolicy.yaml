            $ref: '#/components/schemas/create.dto.alerts.AlertPolicyDTO_RelatedPolicies'
          type: array
        title:
          type: string
        trigger_conditions:
          items:
            $ref: '#/components/schemas/create.dto.alerts.AlertPolicyDTO_TriggerCondition'
          type: array
        trigger_wait_period_in_secs:
          format: int64
          type: integer
    create.dto.alerts.AlertPolicyDTO_TriggerCondition:
      type: object
      properties:
        condition:
          type: string
        condition_type:
          enum:
          - STATIC_THRESHOLD
          - ANOMALY
          - SAFETY_ZONE
          type: string
        severity_level:
          enum:
