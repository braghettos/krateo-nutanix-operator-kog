        network logical timestamp. The logical timestamp can be obtained from the virtual network object.
      tags:
      - /networks
      operationId: put/networks/{uuid}/updateNetwork
      parameters:
      - name: uuid
        in: path
        description: UUID of the network
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update.dto.acropolis.NetworkConfigDTO'
        description: Updated network spec
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/update.dto.PrimitiveDTO_java.lang.Boolean_'
