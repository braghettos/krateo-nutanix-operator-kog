    delete:
      summary: Delete a network.
      description: Delete a network. A network cannot be deleted while Virtual Machines are still attached to it. The logical
        timestamp can optionally be provided for consistency. If a logical timestamp is specified, then this operation will
        be rejected if the logical timestamp specified is not the value of the virtual network logical timestamp. The logical
        timestamp can be obtained from the virtual network object.
      tags:
      - /networks
      operationId: delete/networks/{uuid}/deleteNetwork
      parameters:
      - name: uuid
        in: path
        description: Id of the network
        required: true
        schema:
          type: string
      - name: logical_timestamp
        in: query
        description: Logical timestamp for synchronized delete
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/delete.dto.PrimitiveDTO_java.lang.Boolean_'
