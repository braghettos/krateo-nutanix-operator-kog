          \  \"annotation\": \"string\",\n    \"ip_config\": {\n        \"assigned_ips\": 0,\n        \"default_gateway\"\
          : \"string\",\n        \"dhcp_options\": {\n            \"boot_file_name\": \"string\",\n            \"domain_name\"\
          : \"string\",\n            \"domain_name_servers\": \"string\",\n            \"domain_search\": \"string\",\n  \
