components:
  schemas:
    get.dto.upgrade.MinimumRequirementsDTO:
      type: object
      properties:
        memory_gb:
          format: int32
          type: integer
        storage_gb:
          format: int32
          type: integer
        v_cpus:
          format: int32
          type: integer
    get.base.EntityCollection_get.dto.upgrade.SoftwareDTO_:
      type: object
      properties:
        entities:
          items:
            $ref: '#/components/schemas/get.dto.upgrade.SoftwareDTO'
          type: array
        error_info:
          $ref: '#/components/schemas/get.base.ErrorInfo'
        metadata:
          $ref: '#/components/schemas/get.base.Metadata'
    get.dto.upgrade.SoftwareDTO:
      type: object
      properties:
        cmsp_required:
          type: boolean
        compatible_fs_versions:
          items:
            type: string
          type: array
        compatible_fsm_versions:
          items:
            type: string
          type: array
        compatible_nos_versions:
          items:
            type: string
          type: array
        compatible_pe_nos_versions:
          items:
            type: string
          type: array
        compatible_platforms:
          items:
            type: string
          type: array
        compatible_versions:
          items:
            type: string
          type: array
        current_size_in_bytes:
          format: int64
          type: integer
        full_release_version:
          type: string
        gpg_signature:
          type: string
        hypervisor_installer_string:
          type: string
        hypervisor_type:
          type: string
        is_lts:
          type: boolean
        log:
          $ref: '#/components/schemas/org.slf4j.Logger'
        md5_sum:
          type: string
        min_nos_version:
          type: string
        min_pcversion:
          type: string
        minimum_requirements_dto:
          $ref: '#/components/schemas/get.dto.upgrade.MinimumRequirementsDTO'
        name:
          type: string
        prism_central_sizes:
          items:
            $ref: '#/components/schemas/get.dto.prismcentral.PrismCentralSizeDTO'
          type: array
        qualified_date:
          format: int64
          type: integer
        release_date:
          format: int64
          type: integer
        release_note_url:
          type: string
        software_type:
          enum:
          - NOS
          - HYPERVISOR
          - HYPERVISOR_INSTALLER
          - HYPERVISOR_ISO
          - NCC
          - FILE_SERVER
          - FILES
          - FIRMWARE
          - FIRMWARE_DISK
          - FIRMWARE_NIC
          - FIRMWARE_BIOS
          - FIRMWARE_BMC
          - FIRMWARE_HBA
          - FOUNDATION
          - ACS
          - PRISM_CENTRAL_DEPLOY
          - PRISM_CENTRAL
          - FILE_ANALYTICS
          - UNKNOWN
          type: string
        status:
          enum:
          - NONE
          - AVAILABLE
          - QUEUED
          - INPROGRESS
          - PAUSED
          - COMPLETED
          - CORRUPTED
          - MD5SUMMISMATCH
          - FAILED
          type: string
        supported_models:
          items:
            type: string
          type: array
        total_size_in_bytes:
          format: int64
          type: integer
        transfer_type:
          enum:
          - AUTOMATIC_DOWNLOAD
          - DOWNLOAD
          - UPLOAD
          type: string
        upgrade_notification:
          $ref: '#/components/schemas/get.dto.upgrade.UpgradeNotificationDTO'
        url:
          type: string
        version:
          type: string
    get.dto.prismcentral.PrismCentralSizeDTO:
      type: object
      properties:
        disk_size_in_gib:
          format: int32
          type: integer
        memory_size_in_gib:
          format: int32
          type: integer
        num_vms_supported:
          format: int32
          type: integer
        pc_vm_form_factor:
          type: string
        vcpus:
          format: int32
          type: integer
    get.dto.upgrade.DescriptionItemDTO:
      type: object
      properties:
        affected_releases:
          items:
            type: string
          type: array
        message:
          type: string
        severity_level:
          type: string
    get.dto.upgrade.UpgradeNotificationDTO:
      type: object
      properties:
        cancel_message:
          type: string
        description_item_list:
          items:
            $ref: '#/components/schemas/get.dto.upgrade.DescriptionItemDTO'
          type: array
        proceed_message:
          type: string
        title:
          type: string
    get.base.Metadata:
      type: object
      properties:
        count:
          format: int32
          type: integer
        end_index:
          format: int32
          type: integer
        filter_criteria:
          type: string
        grand_total_entities:
          format: int32
          type: integer
        next_cursor:
          type: string
        page:
          format: int32
          type: integer
        previous_cursor:
          type: string
        search_string:
          type: string
        sort_criteria:
          type: string
        start_index:
          format: int32
          type: integer
        total_entities:
          format: int32
          type: integer
    get.base.ErrorInfo:
      type: object
      properties:
        count:
          format: int64
          type: integer
        entity_list:
          items:
            type: string
          type: array
        message:
          type: string
    delete.dto.PrimitiveDTO_java.lang.Boolean_:
      type: object
      properties:
        value:
          type: boolean
    org.slf4j.Logger:
      type: object
      properties:
        root_logger_name:
          type: string
