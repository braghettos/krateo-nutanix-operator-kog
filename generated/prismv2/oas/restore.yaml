openapi: 3.0.0
info:
  version: v2.0
  title: Nutanix Prism API Reference
  description: "# Introduction\n\nThe Nutanix REST APIs allow you to create scripts that run system administration commands\
    \ against the Nutanix cluster. The API enables the use of HTTP requests to get information about the cluster as well as\
    \ make changes to the configuration. Output from the API calls are returned in JSON format.\n\nAll API users should have\
    \ valid Prism login credentials to send API calls to the Prism server. APIs on nutanix.dev portal are publicly available\
    \ to all valid users without special permissions for viewing purposes.\n\nThe v2 API is an update of the v1 API. Users\
    \ of the v1 API are encouraged to migrate to v2. \n\n[Nutanix API versions \u2013 What are they and what does each one\
    \ do?](https://www.nutanix.dev/api-versions/)"
  contact:
    name: Nutanix, Inc.
    url: http://www.nutanix.com
  license:
    name: EULA
    url: http://www.nutanix.com/eula
servers:
- url: https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0
security: []
paths:
  /vms/{uuid}/restore:
    post:
      summary: Restore a Virtual Machine to a snapshotted state.
      description: Restore a Virtual Machine to a snapshotted state. If the VM is currently running, it will be powered off.
        Since Virtual Machine snapshots do not include the Virtual Machine memory image, the Virtual Machine will remain powered
        off after the restore is complete. A Virtual Machine snapshot may no longer be compatible with the current virtual
        network configuration. In this case, the user may choose not to restore the Virtual Machine s network adpaters using
        the restoreNetworkConfig keyword argument.  This is also an asynchronous operation that results in the creation of
        a task object. The UUID of this task object is returned as the response of this operation. This task can be monitored
        by using the /tasks/poll API.
      tags:
      - /vms
      operationId: post/vms/{uuid}/restore/restoreVM
      parameters:
      - name: uuid
        in: path
        description: Uuid of the Virtual Machine
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create.dto.acropolis.VMRestoreDTO'
        description: 'Restore Virtual Machine '
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create.dto.acropolis.ReturnValueDTO_TaskIdDTO'
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/vms/{uuid}/restore\
          \ \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type: application/json' \\\n    --data '{\n\
          \    \"restore_network_configuration\": true,\n    \"snapshot_uuid\": \"string\",\n    \"uuid\": \"string\",\n \
          \   \"vm_logical_time_stamp\": 0\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type:\
          \ application/json' \\\n    --body-data '{\n    \"restore_network_configuration\": true,\n    \"snapshot_uuid\"\
          : \"string\",\n    \"uuid\": \"string\",\n    \"vm_logical_time_stamp\": 0\n}' \\\n    --output-document \\\n  \
          \  - https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/vms/{uuid}/restore"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"any_cvm_ip:9440\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Content-Type\": \"application/json\"\n}\n\npayload =  \"\"\"{\n    \"restore_network_configuration\"\
          : true,\n    \"snapshot_uuid\": \"string\",\n    \"uuid\": \"string\",\n    \"vm_logical_time_stamp\": 0\n}\"\"\"\
          \n\nconn.request(\"POST\",\"/PrismGateway/services/rest/v2.0/vms/{uuid}/restore\", payload, headers)\n\nres = conn.getresponse()\n\
          data = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/vms/{uuid}/restore\"\n\t\n\tpayload :=  strings.NewReader(`{\"\
          restore_network_configuration\": true, \"snapshot_uuid\": \"string\", \"uuid\": \"string\", \"vm_logical_time_stamp\"\
          : 0}`)\n\treq, err := http.NewRequest(\"POST\", url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating\
          \ request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"Accept\", \"application/json\")\n        req.Header.Add(\"\
          Content-Type\", \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"\
          Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\t\
          fmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/vms/{uuid}/restore\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"\
          {\\\"restore_network_configuration\\\": true, \\\"snapshot_uuid\\\": \\\"string\\\", \\\"uuid\\\": \\\"string\\\"\
          , \\\"vm_logical_time_stamp\\\": 0}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/vms/{uuid}/restore';\nconst options\
          \ = {\n  method: 'POST',\n  headers: {'Accept': 'application/json', 'Content-Type': 'application/json'},\n  body:\
          \  `{\"restore_network_configuration\": true, \"snapshot_uuid\": \"string\", \"uuid\": \"string\", \"vm_logical_time_stamp\"\
          : 0}`\n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await response.json();\n  console.log(data);\n\
          } catch (error) {\n  console.error(error);\n}"
components:
  schemas:
    create.dto.acropolis.VMRestoreDTO:
      type: object
      properties:
        restore_network_configuration:
          type: boolean
        snapshot_uuid:
          type: string
        uuid:
          type: string
        vm_logical_time_stamp:
          format: int64
          type: integer
    create.dto.acropolis.ReturnValueDTO_TaskIdDTO:
      type: object
      properties:
        task_uuid:
          type: string
