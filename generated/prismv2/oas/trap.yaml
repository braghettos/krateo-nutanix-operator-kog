          \   \"cluster_uuid\": \"string\",\n    \"generic_dto\": {\n        \"community_string\": \"string\",\n        \"\
          engine_id\": \"string\",\n        \"inform\": true,\n        \"log\": {\n            \"root_logger_name\": \"string\"\
          \n        },\n        \"port\": 0,\n        \"receiver_name\": \"string\",\n        \"transport_protocol\": \"TCP\"\
