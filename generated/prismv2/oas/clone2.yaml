components:
  schemas:
    create.dto.acropolis.VMCloneSpecDTO:
      type: object
      properties:
        boot_config:
          $ref: '#/components/schemas/create.dto.acropolis.BootConfigDTO'
        clone_affinity:
          type: boolean
        memory_mb:
          format: int64
          type: integer
        name:
          type: string
        num_cores_per_vcpu:
          format: int64
          type: integer
        num_vcpus:
          format: int64
          type: integer
        override_network_config:
          type: boolean
        uuid:
          type: string
        vm_nics:
          items:
            $ref: '#/components/schemas/create.dto.acropolis.VMNicSpecDTO'
          type: array
    create.dto.acropolis.SnapshotCloneDTO:
      type: object
      properties:
        spec_list:
          items:
            $ref: '#/components/schemas/create.dto.acropolis.VMCloneSpecDTO'
          type: array
        uuid:
          type: string
    create.dto.acropolis.BootConfigDTO:
      type: object
      properties:
        boot_device_order:
          items:
            enum:
            - CDROM
            - DISK
            - NIC
            type: string
          type: array
        boot_device_type:
          enum:
          - CDROM
          - DISK
          - NIC
          type: string
        disk_address:
          $ref: '#/components/schemas/create.dto.acropolis.VMDiskAddressDTO'
        hardware_virtualization:
          type: boolean
        mac_addr:
          type: string
        secure_boot:
          type: boolean
        uefi_boot:
          type: boolean
    create.dto.acropolis.VMNicSpecDTO:
      type: object
      properties:
        adapter_type:
          enum:
          - E1000
          - E1000e
          - PCNet32
          - Vmxnet
          - Vmxnet2
          - Vmxnet3
          - Unsupported
          type: string
        ip_address:
          type: string
        ip_addresses:
          items:
            type: string
          type: array
        is_connected:
          type: boolean
        mac_address:
          type: string
        model:
          type: string
        network_uuid:
          type: string
        nic_uuid:
          type: string
        port_id:
          type: string
        request_ip:
          type: boolean
        requested_ip_address:
          type: string
        vlan_mode:
          enum:
          - Access
          - Trunked
          - Untagged
          type: string
    create.dto.acropolis.VMDiskAddressDTO:
      type: object
      properties:
        device_bus:
          enum:
          - SCSI
          - IDE
          - PCI
          - SATA
          - SPAPR
          - NVME
          type: string
        device_index:
          format: int32
          type: integer
        device_uuid:
          type: string
        disk_label:
          type: string
        is_cdrom:
          type: boolean
        ndfs_filepath:
          type: string
        vmdisk_uuid:
          type: string
        volume_group_uuid:
          type: string
    create.dto.acropolis.ReturnValueDTO_TaskIdDTO:
      type: object
      properties:
        task_uuid:
          type: string
