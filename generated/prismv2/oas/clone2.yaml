          : \"string\",\n                    \"volume_group_uuid\": \"string\"\n                },\n                \"hardware_virtualization\"\
          : true,\n                \"mac_addr\": \"string\",\n                \"secure_boot\": true,\n                \"uefi_boot\"\
          : true\n            },\n            \"clone_affinity\": true,\n            \"memory_mb\": 0,\n            \"name\"\
