      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/snapshots/{uuid}/clone\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"\
          {\\\"spec_list\\\": [{\\\"boot_config\\\": {\\\"boot_device_order\\\": [\\\"string\\\"], \\\"boot_device_type\\\"\
