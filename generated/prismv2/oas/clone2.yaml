          : 0, \"name\": \"string\", \"num_cores_per_vcpu\": 0, \"num_vcpus\": 0, \"override_network_config\": true, \"uuid\"\
          : \"string\", \"vm_nics\": [{\"adapter_type\": \"E1000\", \"ip_address\": \"string\", \"ip_addresses\": [\"string\"\
