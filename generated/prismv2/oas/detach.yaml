components:
  schemas:
    create.dto.uhura.VmDiskInfoDTO:
      type: object
      properties:
        datasource_uuid:
          type: string
        disk_address:
          $ref: '#/components/schemas/create.dto.acropolis.VMDiskAddressDTO'
        flash_mode_enabled:
          type: boolean
        is_cdrom:
          type: boolean
        is_empty:
          type: boolean
        is_hot_remove_enabled:
          type: boolean
        is_scsi_passthrough:
          type: boolean
        is_thin_provisioned:
          type: boolean
        shared:
          type: boolean
        size:
          format: int64
          type: integer
        source_disk_address:
          $ref: '#/components/schemas/create.dto.acropolis.VMDiskAddressDTO'
        storage_container_uuid:
          type: string
    create.dto.uhura.VMDiskDetachDTO:
      type: object
      properties:
        uuid:
          type: string
        vm_disks:
          items:
            $ref: '#/components/schemas/create.dto.uhura.VmDiskInfoDTO'
          type: array
    create.dto.acropolis.ReturnValueDTO_TaskIdDTO:
      type: object
      properties:
        task_uuid:
          type: string
    create.dto.acropolis.VMDiskAddressDTO:
      type: object
      properties:
        device_bus:
          enum:
          - SCSI
          - IDE
          - PCI
          - SATA
          - SPAPR
          - NVME
          type: string
        device_index:
          format: int32
          type: integer
        device_uuid:
          type: string
        disk_label:
          type: string
        is_cdrom:
          type: boolean
        ndfs_filepath:
          type: string
        vmdisk_uuid:
          type: string
        volume_group_uuid:
          type: string
