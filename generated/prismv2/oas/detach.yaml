      - lang: JavaScript
        source: "const url = 'https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/vms/{uuid}/disks/detach';\nconst options\
          \ = {\n  method: 'POST',\n  headers: {'Accept': 'application/json', 'Content-Type': 'application/json'},\n  body:\
          \  `{\"uuid\": \"string\", \"vm_disks\": [{\"datasource_uuid\": \"string\", \"disk_address\": {\"device_bus\": \"\
          SCSI\", \"device_index\": 0, \"device_uuid\": \"string\", \"disk_label\": \"string\", \"is_cdrom\": true, \"ndfs_filepath\"\
