openapi: 3.0.0
info:
  version: v2.0
  title: Nutanix Prism API Reference
  description: "# Introduction\n\nThe Nutanix REST APIs allow you to create scripts that run system administration commands\
    \ against the Nutanix cluster. The API enables the use of HTTP requests to get information about the cluster as well as\
    \ make changes to the configuration. Output from the API calls are returned in JSON format.\n\nAll API users should have\
    \ valid Prism login credentials to send API calls to the Prism server. APIs on nutanix.dev portal are publicly available\
    \ to all valid users without special permissions for viewing purposes.\n\nThe v2 API is an update of the v1 API. Users\
    \ of the v1 API are encouraged to migrate to v2. \n\n[Nutanix API versions \u2013 What are they and what does each one\
    \ do?](https://www.nutanix.dev/api-versions/)"
  contact:
    name: Nutanix, Inc.
    url: http://www.nutanix.com
  license:
    name: EULA
    url: http://www.nutanix.com/eula
servers:
- url: https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0
security: []
paths:
  /vms/{uuid}/disks/detach:
    post:
      summary: Detach disks from Virtual Machine.
      description: Detach disks from Virtual Machine.A disk drive may either be a regular disk drive, or a CD-ROM drive. Only
        CD-ROM drives may be empty. By default, regular disk drives are configured on the SCSI bus, and CD-ROM drives are
        configured on the IDE bus. The user may override this behavior with the deviceBus attribute. By default, a disk drive
        is placed on the first available bus slot. The user may override this behavior with the deviceIndex attribute. Disks
        on the SCSI bus may optionally be configured for passthrough on platforms that support iSCSI. When in passthrough
        mode, SCSI commands are passed directly to NDFS via iSCSI. When SCSI passthrough is disabled, the hypervisor provides
        a SCSI emulation layer, and treats the underlying iSCSI target as a block device. By default, SCSI passthrough is
        enabled for SCSI devices on supported platforms. If the disk image is cloned from an existing vmdisk or NFS file,
        the user may specify a minimum size for the resulting clone. This can be used to expand a disk image at clone time.
        If the VM is running, the disk is hot-added to the VM. Note that certain buses, like IDE, are not hot-pluggable. This
        is also an asynchronous operation that results in the creation of a task object. The UUID of this task object is returned
        as the response of this operation. This task can be monitored by using the /tasks/poll API.
      tags:
      - /vms
      operationId: post/vms/{uuid}/disks/detach/detachVMDisk
      parameters:
      - name: uuid
        in: path
        description: Id of the Virtual Machine
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create.dto.uhura.VMDiskDetachDTO'
        description: Info about the virtual disks or CD-Roms to be detached
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create.dto.acropolis.ReturnValueDTO_TaskIdDTO'
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/vms/{uuid}/disks/detach\
          \ \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type: application/json' \\\n    --data '{\n\
          \    \"uuid\": \"string\",\n    \"vm_disks\": [\n        {\n            \"datasource_uuid\": \"string\",\n     \
          \       \"disk_address\": {\n                \"device_bus\": \"SCSI\",\n                \"device_index\": 0,\n \
          \               \"device_uuid\": \"string\",\n                \"disk_label\": \"string\",\n                \"is_cdrom\"\
          : true,\n                \"ndfs_filepath\": \"string\",\n                \"vmdisk_uuid\": \"string\",\n        \
          \        \"volume_group_uuid\": \"string\"\n            },\n            \"flash_mode_enabled\": true,\n        \
          \    \"is_cdrom\": true,\n            \"is_empty\": true,\n            \"is_hot_remove_enabled\": true,\n      \
          \      \"is_scsi_passthrough\": true,\n            \"is_thin_provisioned\": true,\n            \"shared\": true,\n\
          \            \"size\": 0,\n            \"source_disk_address\": {\n                \"device_bus\": \"SCSI\",\n \
          \               \"device_index\": 0,\n                \"device_uuid\": \"string\",\n                \"disk_label\"\
          : \"string\",\n                \"is_cdrom\": true,\n                \"ndfs_filepath\": \"string\",\n           \
          \     \"vmdisk_uuid\": \"string\",\n                \"volume_group_uuid\": \"string\"\n            },\n        \
          \    \"storage_container_uuid\": \"string\"\n        }\n    ]\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type:\
          \ application/json' \\\n    --body-data '{\n    \"uuid\": \"string\",\n    \"vm_disks\": [\n        {\n        \
          \    \"datasource_uuid\": \"string\",\n            \"disk_address\": {\n                \"device_bus\": \"SCSI\"\
          ,\n                \"device_index\": 0,\n                \"device_uuid\": \"string\",\n                \"disk_label\"\
          : \"string\",\n                \"is_cdrom\": true,\n                \"ndfs_filepath\": \"string\",\n           \
          \     \"vmdisk_uuid\": \"string\",\n                \"volume_group_uuid\": \"string\"\n            },\n        \
          \    \"flash_mode_enabled\": true,\n            \"is_cdrom\": true,\n            \"is_empty\": true,\n         \
          \   \"is_hot_remove_enabled\": true,\n            \"is_scsi_passthrough\": true,\n            \"is_thin_provisioned\"\
          : true,\n            \"shared\": true,\n            \"size\": 0,\n            \"source_disk_address\": {\n     \
          \           \"device_bus\": \"SCSI\",\n                \"device_index\": 0,\n                \"device_uuid\": \"\
          string\",\n                \"disk_label\": \"string\",\n                \"is_cdrom\": true,\n                \"\
          ndfs_filepath\": \"string\",\n                \"vmdisk_uuid\": \"string\",\n                \"volume_group_uuid\"\
          : \"string\"\n            },\n            \"storage_container_uuid\": \"string\"\n        }\n    ]\n}' \\\n    --output-document\
          \ \\\n    - https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/vms/{uuid}/disks/detach"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"any_cvm_ip:9440\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Content-Type\": \"application/json\"\n}\n\npayload =  \"\"\"{\n    \"uuid\": \"string\"\
          ,\n    \"vm_disks\": [\n        {\n            \"datasource_uuid\": \"string\",\n            \"disk_address\": {\n\
          \                \"device_bus\": \"SCSI\",\n                \"device_index\": 0,\n                \"device_uuid\"\
          : \"string\",\n                \"disk_label\": \"string\",\n                \"is_cdrom\": true,\n              \
          \  \"ndfs_filepath\": \"string\",\n                \"vmdisk_uuid\": \"string\",\n                \"volume_group_uuid\"\
          : \"string\"\n            },\n            \"flash_mode_enabled\": true,\n            \"is_cdrom\": true,\n     \
          \       \"is_empty\": true,\n            \"is_hot_remove_enabled\": true,\n            \"is_scsi_passthrough\":\
          \ true,\n            \"is_thin_provisioned\": true,\n            \"shared\": true,\n            \"size\": 0,\n \
          \           \"source_disk_address\": {\n                \"device_bus\": \"SCSI\",\n                \"device_index\"\
          : 0,\n                \"device_uuid\": \"string\",\n                \"disk_label\": \"string\",\n              \
          \  \"is_cdrom\": true,\n                \"ndfs_filepath\": \"string\",\n                \"vmdisk_uuid\": \"string\"\
          ,\n                \"volume_group_uuid\": \"string\"\n            },\n            \"storage_container_uuid\": \"\
          string\"\n        }\n    ]\n}\"\"\"\n\nconn.request(\"POST\",\"/PrismGateway/services/rest/v2.0/vms/{uuid}/disks/detach\"\
          , payload, headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/vms/{uuid}/disks/detach\"\n\t\n\tpayload :=  strings.NewReader(`{\"\
          uuid\": \"string\", \"vm_disks\": [{\"datasource_uuid\": \"string\", \"disk_address\": {\"device_bus\": \"SCSI\"\
          , \"device_index\": 0, \"device_uuid\": \"string\", \"disk_label\": \"string\", \"is_cdrom\": true, \"ndfs_filepath\"\
          : \"string\", \"vmdisk_uuid\": \"string\", \"volume_group_uuid\": \"string\"}, \"flash_mode_enabled\": true, \"\
          is_cdrom\": true, \"is_empty\": true, \"is_hot_remove_enabled\": true, \"is_scsi_passthrough\": true, \"is_thin_provisioned\"\
          : true, \"shared\": true, \"size\": 0, \"source_disk_address\": {\"device_bus\": \"SCSI\", \"device_index\": 0,\
          \ \"device_uuid\": \"string\", \"disk_label\": \"string\", \"is_cdrom\": true, \"ndfs_filepath\": \"string\", \"\
          vmdisk_uuid\": \"string\", \"volume_group_uuid\": \"string\"}, \"storage_container_uuid\": \"string\"}]}`)\n\treq,\
          \ err := http.NewRequest(\"POST\", url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\"\
          , err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"Accept\", \"application/json\")\n        req.Header.Add(\"Content-Type\"\
          , \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"Error\
          \ creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\t\
          if err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\
          \n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/vms/{uuid}/disks/detach\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"\
          {\\\"uuid\\\": \\\"string\\\", \\\"vm_disks\\\": [{\\\"datasource_uuid\\\": \\\"string\\\", \\\"disk_address\\\"\
          : {\\\"device_bus\\\": \\\"SCSI\\\", \\\"device_index\\\": 0, \\\"device_uuid\\\": \\\"string\\\", \\\"disk_label\\\
          \": \\\"string\\\", \\\"is_cdrom\\\": true, \\\"ndfs_filepath\\\": \\\"string\\\", \\\"vmdisk_uuid\\\": \\\"string\\\
          \", \\\"volume_group_uuid\\\": \\\"string\\\"}, \\\"flash_mode_enabled\\\": true, \\\"is_cdrom\\\": true, \\\"is_empty\\\
