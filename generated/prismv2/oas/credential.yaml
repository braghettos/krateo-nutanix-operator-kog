          \     \"secret_key\": \"string\"\n    },\n    \"azure_credential\": {\n        \"secure_file_id\": \"string\",\n\
          \        \"subscription_id\": \"string\"\n    },\n    \"credential_id\": 0,\n    \"name\": \"string\",\n    \"use_as_default\"\
          : true\n}' \\\n    --output-document \\\n    - https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/cloud/{cloud_type}/credentials"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"any_cvm_ip:9440\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Content-Type\": \"application/json\"\n}\n\npayload =  \"\"\"{\n    \"aws_credential\"\
          : {\n        \"access_key\": \"string\",\n        \"secret_key\": \"string\"\n    },\n    \"azure_credential\":\
          \ {\n        \"secure_file_id\": \"string\",\n        \"subscription_id\": \"string\"\n    },\n    \"credential_id\"\
          : 0,\n    \"name\": \"string\",\n    \"use_as_default\": true\n}\"\"\"\n\nconn.request(\"POST\",\"/PrismGateway/services/rest/v2.0/cloud/{cloud_type}/credentials\"\
          , payload, headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/cloud/{cloud_type}/credentials\"\n\t\n\tpayload :=\
          \  strings.NewReader(`{\"aws_credential\": {\"access_key\": \"string\", \"secret_key\": \"string\"}, \"azure_credential\"\
          : {\"secure_file_id\": \"string\", \"subscription_id\": \"string\"}, \"credential_id\": 0, \"name\": \"string\"\
          , \"use_as_default\": true}`)\n\treq, err := http.NewRequest(\"POST\", url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"\
          Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"Accept\", \"application/json\")\n \
          \       req.Header.Add(\"Content-Type\", \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\
          \tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\t\
          return\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/cloud/{cloud_type}/credentials\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"\
          {\\\"aws_credential\\\": {\\\"access_key\\\": \\\"string\\\", \\\"secret_key\\\": \\\"string\\\"}, \\\"azure_credential\\\
          \": {\\\"secure_file_id\\\": \\\"string\\\", \\\"subscription_id\\\": \\\"string\\\"}, \\\"credential_id\\\": 0,\
          \ \\\"name\\\": \\\"string\\\", \\\"use_as_default\\\": true}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/cloud/{cloud_type}/credentials';\nconst\
          \ options = {\n  method: 'POST',\n  headers: {'Accept': 'application/json', 'Content-Type': 'application/json'},\n\
          \  body:  `{\"aws_credential\": {\"access_key\": \"string\", \"secret_key\": \"string\"}, \"azure_credential\":\
          \ {\"secure_file_id\": \"string\", \"subscription_id\": \"string\"}, \"credential_id\": 0, \"name\": \"string\"\
          , \"use_as_default\": true}`\n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await response.json();\n\
          \  console.log(data);\n} catch (error) {\n  console.error(error);\n}"
