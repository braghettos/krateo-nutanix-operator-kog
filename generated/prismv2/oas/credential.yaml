      - lang: cURL
        source: "curl --request POST \\\n    --url https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/cloud/{cloud_type}/credentials\
          \ \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type: application/json' \\\n    --data '{\n\
          \    \"aws_credential\": {\n        \"access_key\": \"string\",\n        \"secret_key\": \"string\"\n    },\n  \
          \  \"azure_credential\": {\n        \"secure_file_id\": \"string\",\n        \"subscription_id\": \"string\"\n \
          \   },\n    \"credential_id\": 0,\n    \"name\": \"string\",\n    \"use_as_default\": true\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type:\
