openapi: 3.0.0
info:
  version: v2.0
  title: Nutanix Prism API Reference
  description: "# Introduction\n\nThe Nutanix REST APIs allow you to create scripts that run system administration commands\
    \ against the Nutanix cluster. The API enables the use of HTTP requests to get information about the cluster as well as\
    \ make changes to the configuration. Output from the API calls are returned in JSON format.\n\nAll API users should have\
    \ valid Prism login credentials to send API calls to the Prism server. APIs on nutanix.dev portal are publicly available\
    \ to all valid users without special permissions for viewing purposes.\n\nThe v2 API is an update of the v1 API. Users\
    \ of the v1 API are encouraged to migrate to v2. \n\n[Nutanix API versions \u2013 What are they and what does each one\
    \ do?](https://www.nutanix.dev/api-versions/)"
  contact:
    name: Nutanix, Inc.
    url: http://www.nutanix.com
  license:
    name: EULA
    url: http://www.nutanix.com/eula
servers:
- url: https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0
security: []
paths:
  /protection_domains/{name}/restore_entities:
    post:
      summary: Rollback Virtual Machines and/or NFS files.
      description: Rollback Virtual Machines and/or NFS files in a Protection Domain to a given Snapshot
      tags:
      - /protection_domains
      operationId: post/protection_domains/{name}/restore_entities/restoreEntities
      parameters:
      - name: name
        in: path
        description: Name of the Protection Domain
        required: true
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/create.dto.dr.RestoreEntitiesRequestDTO'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create.dto.dr.RestoreEntitiesDTO'
        '500':
          description: Any internal exception while performing this operation
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/protection_domains/{name}/restore_entities\
          \ \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type: application/json' \\\n    --data '{\n\
          \    \"nfs_files\": [\n        \"string\"\n    ],\n    \"path_prefix\": \"string\",\n    \"replace\": true,\n  \
          \  \"restore_vm_agnostic\": true,\n    \"snapshot_id\": \"string\",\n    \"vg_name_prefix\": \"string\",\n    \"\
          vm_name_prefix\": \"string\",\n    \"vm_names\": [\n        \"string\"\n    ],\n    \"vm_uuids\": [\n        \"\
          string\"\n    ],\n    \"volume_group_uuids\": [\n        \"string\"\n    ]\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type:\
          \ application/json' \\\n    --body-data '{\n    \"nfs_files\": [\n        \"string\"\n    ],\n    \"path_prefix\"\
          : \"string\",\n    \"replace\": true,\n    \"restore_vm_agnostic\": true,\n    \"snapshot_id\": \"string\",\n  \
          \  \"vg_name_prefix\": \"string\",\n    \"vm_name_prefix\": \"string\",\n    \"vm_names\": [\n        \"string\"\
          \n    ],\n    \"vm_uuids\": [\n        \"string\"\n    ],\n    \"volume_group_uuids\": [\n        \"string\"\n \
          \   ]\n}' \\\n    --output-document \\\n    - https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/protection_domains/{name}/restore_entities"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"any_cvm_ip:9440\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Content-Type\": \"application/json\"\n}\n\npayload =  \"\"\"{\n    \"nfs_files\"\
          : [\n        \"string\"\n    ],\n    \"path_prefix\": \"string\",\n    \"replace\": true,\n    \"restore_vm_agnostic\"\
          : true,\n    \"snapshot_id\": \"string\",\n    \"vg_name_prefix\": \"string\",\n    \"vm_name_prefix\": \"string\"\
          ,\n    \"vm_names\": [\n        \"string\"\n    ],\n    \"vm_uuids\": [\n        \"string\"\n    ],\n    \"volume_group_uuids\"\
          : [\n        \"string\"\n    ]\n}\"\"\"\n\nconn.request(\"POST\",\"/PrismGateway/services/rest/v2.0/protection_domains/{name}/restore_entities\"\
          , payload, headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/protection_domains/{name}/restore_entities\"\n\t\n\
          \tpayload :=  strings.NewReader(`{\"nfs_files\": [\"string\"], \"path_prefix\": \"string\", \"replace\": true, \"\
          restore_vm_agnostic\": true, \"snapshot_id\": \"string\", \"vg_name_prefix\": \"string\", \"vm_name_prefix\": \"\
          string\", \"vm_names\": [\"string\"], \"vm_uuids\": [\"string\"], \"volume_group_uuids\": [\"string\"]}`)\n\treq,\
          \ err := http.NewRequest(\"POST\", url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\"\
          , err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"Accept\", \"application/json\")\n        req.Header.Add(\"Content-Type\"\
          , \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"Error\
          \ creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\t\
          if err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\
          \n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/protection_domains/{name}/restore_entities\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"\
          {\\\"nfs_files\\\": [\\\"string\\\"], \\\"path_prefix\\\": \\\"string\\\", \\\"replace\\\": true, \\\"restore_vm_agnostic\\\
          \": true, \\\"snapshot_id\\\": \\\"string\\\", \\\"vg_name_prefix\\\": \\\"string\\\", \\\"vm_name_prefix\\\": \\\
          \"string\\\", \\\"vm_names\\\": [\\\"string\\\"], \\\"vm_uuids\\\": [\\\"string\\\"], \\\"volume_group_uuids\\\"\
          : [\\\"string\\\"]}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n  .join();\n\
          \nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/protection_domains/{name}/restore_entities';\n\
          const options = {\n  method: 'POST',\n  headers: {'Accept': 'application/json', 'Content-Type': 'application/json'},\n\
          \  body:  `{\"nfs_files\": [\"string\"], \"path_prefix\": \"string\", \"replace\": true, \"restore_vm_agnostic\"\
          : true, \"snapshot_id\": \"string\", \"vg_name_prefix\": \"string\", \"vm_name_prefix\": \"string\", \"vm_names\"\
          : [\"string\"], \"vm_uuids\": [\"string\"], \"volume_group_uuids\": [\"string\"]}`\n};\n\ntry {\n  const response\
          \ = await fetch(url, options);\n  const data = await response.json();\n  console.log(data);\n} catch (error) {\n\
          \  console.error(error);\n}"
components:
  requestBodies:
    create.dto.dr.RestoreEntitiesRequestDTO:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create.dto.dr.RestoreEntitiesRequestDTO'
      description: Restore request instance
      required: true
  schemas:
    create.dto.dr.RestoreEntitiesRequestDTO:
      type: object
      properties:
        nfs_files:
          items:
            type: string
          type: array
        path_prefix:
          type: string
        replace:
          type: boolean
        restore_vm_agnostic:
          type: boolean
        snapshot_id:
          type: string
        vg_name_prefix:
          type: string
        vm_name_prefix:
          type: string
        vm_names:
          items:
            type: string
          type: array
        vm_uuids:
          items:
            type: string
          type: array
        volume_group_uuids:
          items:
            type: string
          type: array
    create.dto.dr.RestoreEntitiesDTO:
      type: object
      properties:
        task_uuid:
          type: string
        value:
          type: boolean
