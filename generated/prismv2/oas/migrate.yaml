openapi: 3.0.0
info:
  version: v2.0
  title: Nutanix Prism API Reference
  description: "# Introduction\n\nThe Nutanix REST APIs allow you to create scripts that run system administration commands\
    \ against the Nutanix cluster. The API enables the use of HTTP requests to get information about the cluster as well as\
    \ make changes to the configuration. Output from the API calls are returned in JSON format.\n\nAll API users should have\
    \ valid Prism login credentials to send API calls to the Prism server. APIs on nutanix.dev portal are publicly available\
    \ to all valid users without special permissions for viewing purposes.\n\nThe v2 API is an update of the v1 API. Users\
    \ of the v1 API are encouraged to migrate to v2. \n\n[Nutanix API versions \u2013 What are they and what does each one\
    \ do?](https://www.nutanix.dev/api-versions/)"
  contact:
    name: Nutanix, Inc.
    url: http://www.nutanix.com
  license:
    name: EULA
    url: http://www.nutanix.com/eula
servers:
- url: https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0
security: []
paths:
  /protection_domains/{name}/migrate:
    post:
      summary: Migrate an active Protection Domain to a DR site.
      description: Mark the specified Protection domain as inactive and failover to the given Remote Site.
      tags:
      - /protection_domains
      operationId: post/protection_domains/{name}/migrate/migrateProtectionDomain
      parameters:
      - name: name
        in: path
        description: Name of the Protection Domain
        required: true
        schema:
          type: string
      - name: skip_vm_mobility_check
        in: query
        description: Flag to specify whether mobility check has to be skipped
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create.dto.PrimitiveDTO_java.lang.String_'
        description: Name of the Remote Site
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create.base.EntityCollection_create.dto.dr.VirtualMachine_'
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/protection_domains/{name}/migrate\
          \ \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type: application/json' \\\n    --data '{\n\
          \    \"value\": \"string\"\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type:\
          \ application/json' \\\n    --body-data '{\n    \"value\": \"string\"\n}' \\\n    --output-document \\\n    - https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/protection_domains/{name}/migrate"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"any_cvm_ip:9440\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Content-Type\": \"application/json\"\n}\n\npayload =  \"\"\"{\n    \"value\": \"\
          string\"\n}\"\"\"\n\nconn.request(\"POST\",\"/PrismGateway/services/rest/v2.0/protection_domains/{name}/migrate\"\
          , payload, headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/protection_domains/{name}/migrate\"\n\t\n\tpayload\
          \ :=  strings.NewReader(`{\"value\": \"string\"}`)\n\treq, err := http.NewRequest(\"POST\", url, payload)\n\tif\
          \ err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"\
          Accept\", \"application/json\")\n        req.Header.Add(\"Content-Type\", \"application/json\")\n    \n\tres, err\
          \ := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\
          \t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error\
          \ creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/protection_domains/{name}/migrate\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"\
          {\\\"value\\\": \\\"string\\\"}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/protection_domains/{name}/migrate';\n\
          const options = {\n  method: 'POST',\n  headers: {'Accept': 'application/json', 'Content-Type': 'application/json'},\n\
          \  body:  `{\"value\": \"string\"}`\n};\n\ntry {\n  const response = await fetch(url, options);\n  const data =\
          \ await response.json();\n  console.log(data);\n} catch (error) {\n  console.error(error);\n}"
components:
  schemas:
    create.dto.dr.VmRecoverabilityDTO:
      type: object
      properties:
        cerebro_error:
          type: string
        reason:
          type: string
        remote_site:
          type: string
    create.dto.dr.VirtualMachine:
      type: object
      properties:
        app_consistent_snapshots:
          type: boolean
        consistency_group:
          type: string
        related_entity_uuids:
          items:
            type: string
          type: array
        vm_files:
          items:
            type: string
          type: array
        vm_handle:
          format: int64
          type: integer
        vm_id:
          type: string
        vm_name:
          type: string
        vm_power_state_on_recovery:
          enum:
          - Powered Off
          - Powered On
          - Power state at time of snapshot
          type: string
        vm_recoverability:
          items:
            $ref: '#/components/schemas/create.dto.dr.VmRecoverabilityDTO'
          type: array
    create.base.Metadata:
      type: object
      properties:
        count:
          format: int32
          type: integer
        end_index:
          format: int32
          type: integer
        filter_criteria:
          type: string
        grand_total_entities:
          format: int32
          type: integer
        next_cursor:
          type: string
        page:
          format: int32
          type: integer
        previous_cursor:
          type: string
        search_string:
          type: string
        sort_criteria:
          type: string
        start_index:
          format: int32
          type: integer
        total_entities:
          format: int32
          type: integer
    create.base.ErrorInfo:
      type: object
      properties:
        count:
          format: int64
          type: integer
        entity_list:
          items:
            type: string
          type: array
        message:
          type: string
    create.base.EntityCollection_create.dto.dr.VirtualMachine_:
      type: object
      properties:
        entities:
          items:
            $ref: '#/components/schemas/create.dto.dr.VirtualMachine'
          type: array
        error_info:
          $ref: '#/components/schemas/create.base.ErrorInfo'
        metadata:
          $ref: '#/components/schemas/create.base.Metadata'
    create.dto.PrimitiveDTO_java.lang.String_:
      type: object
      properties:
        value:
          type: string
