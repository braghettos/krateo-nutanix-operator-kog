components:
  schemas:
    delete.dto.PrimitiveDTO_java.lang.Boolean_:
      type: object
      properties:
        value:
          type: boolean
    get.dto.dr.OutOfBandSchedulePoliciesDTO_Schedule:
      type: object
      properties:
        app_consistent:
          type: boolean
        remote_site_names:
          items:
            type: string
          type: array
        schedule_id:
          format: int64
          type: integer
        schedule_start_time_usecs:
          format: int64
          type: integer
        snapshot_retention_time_secs:
          format: int32
          type: integer
    get.dto.dr.OutOfBandSchedulePoliciesDTO:
      type: object
      properties:
        pd_name:
