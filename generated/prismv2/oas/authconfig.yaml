        content:
          application/json:
            schema:
              $ref: '#/components/schemas/patch.dto.RequestDTO_patch.auth.dto.config.AuthConfigDTO_'
        description: an AuthConfigDTO instance
        required: true
      responses:
        '200':
          description: Successful operation
