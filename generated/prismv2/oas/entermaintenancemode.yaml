openapi: 3.0.0
info:
  version: v2.0
  title: Nutanix Prism API Reference
  description: "# Introduction\n\nThe Nutanix REST APIs allow you to create scripts that run system administration commands\
    \ against the Nutanix cluster. The API enables the use of HTTP requests to get information about the cluster as well as\
    \ make changes to the configuration. Output from the API calls are returned in JSON format.\n\nAll API users should have\
    \ valid Prism login credentials to send API calls to the Prism server. APIs on nutanix.dev portal are publicly available\
    \ to all valid users without special permissions for viewing purposes.\n\nThe v2 API is an update of the v1 API. Users\
    \ of the v1 API are encouraged to migrate to v2. \n\n[Nutanix API versions \u2013 What are they and what does each one\
    \ do?](https://www.nutanix.dev/api-versions/)"
  contact:
    name: Nutanix, Inc.
    url: http://www.nutanix.com
  license:
    name: EULA
    url: http://www.nutanix.com/eula
servers:
- url: https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0
security: []
paths:
  /hosts/{uuid}/enter_maintenance_mode:
    post:
      summary: Put a host in maintenance mode.
      description: Put a host in maintenance mode. It can be specified if Virtual Machines currently running on the host need
        to be powered off, live migrated or cold migrated. The host will be marked as unschedulable, so that no new Virtual
        Machines can be instantiated on it. Subsequently, an attempt is made to evacuate VMs from the host. If the evacuation
        attempt fails (e.g., because there are insufficient resources available elsewhere in the cluster), the host will remain
        in the entering maintenance mode state, where it is marked unschedulable, waiting for user remediation. This operation
        is idempotent and can be run again with different options like powering off the Virtual Machines, live or cold migrating
        them. This is also an asynchronous operation that results in the creation of a task object. The UUID of this task
        object is returned as the response of this operation. This task can be monitored by using the /tasks/poll API.
      tags:
      - /hosts
      operationId: post/hosts/{uuid}/enter_maintenance_mode/enterMaintenanceMode
      parameters:
      - name: uuid
        in: path
        description: UUID of host to put in maintenance mode
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create.dto.acropolis.MaintenanceModeDTO'
        description: Maintenance mode options
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create.dto.acropolis.ReturnValueDTO_TaskIdDTO'
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/hosts/{uuid}/enter_maintenance_mode\
          \ \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type: application/json' \\\n    --data '{\n\
          \    \"evacuation_option\": \"POWER_OFF\",\n    \"logical_timestamp\": 0,\n    \"non_migratable_vm_option\": \"\
          BLOCK\"\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type:\
          \ application/json' \\\n    --body-data '{\n    \"evacuation_option\": \"POWER_OFF\",\n    \"logical_timestamp\"\
          : 0,\n    \"non_migratable_vm_option\": \"BLOCK\"\n}' \\\n    --output-document \\\n    - https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/hosts/{uuid}/enter_maintenance_mode"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"any_cvm_ip:9440\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Content-Type\": \"application/json\"\n}\n\npayload =  \"\"\"{\n    \"evacuation_option\"\
          : \"POWER_OFF\",\n    \"logical_timestamp\": 0,\n    \"non_migratable_vm_option\": \"BLOCK\"\n}\"\"\"\n\nconn.request(\"\
          POST\",\"/PrismGateway/services/rest/v2.0/hosts/{uuid}/enter_maintenance_mode\", payload, headers)\n\nres = conn.getresponse()\n\
          data = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/hosts/{uuid}/enter_maintenance_mode\"\n\t\n\tpayload\
          \ :=  strings.NewReader(`{\"evacuation_option\": \"POWER_OFF\", \"logical_timestamp\": 0, \"non_migratable_vm_option\"\
          : \"BLOCK\"}`)\n\treq, err := http.NewRequest(\"POST\", url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"Error\
          \ creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"Accept\", \"application/json\")\n     \
          \   req.Header.Add(\"Content-Type\", \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif\
          \ err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\
          \tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\t\
          return\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/hosts/{uuid}/enter_maintenance_mode\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"\
          {\\\"evacuation_option\\\": \\\"POWER_OFF\\\", \\\"logical_timestamp\\\": 0, \\\"non_migratable_vm_option\\\": \\\
          \"BLOCK\\\"}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/hosts/{uuid}/enter_maintenance_mode';\n\
          const options = {\n  method: 'POST',\n  headers: {'Accept': 'application/json', 'Content-Type': 'application/json'},\n\
          \  body:  `{\"evacuation_option\": \"POWER_OFF\", \"logical_timestamp\": 0, \"non_migratable_vm_option\": \"BLOCK\"\
          }`\n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await response.json();\n  console.log(data);\n\
          } catch (error) {\n  console.error(error);\n}"
components:
  schemas:
    create.dto.acropolis.ReturnValueDTO_TaskIdDTO:
      type: object
      properties:
        task_uuid:
          type: string
    create.dto.acropolis.MaintenanceModeDTO:
      type: object
      properties:
        evacuation_option:
          enum:
          - POWER_OFF
          - COLD_MIGRATE
          - LIVE_MIGRATE
          type: string
        logical_timestamp:
          format: int64
          type: integer
        non_migratable_vm_option:
          enum:
          - BLOCK
          - ACPI_SHUTDOWN_AND_POWER_OFF
          type: string
