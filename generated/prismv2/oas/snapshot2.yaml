      operationId: delete/snapshots/{uuid}/deleteSnapshot
      parameters:
      - name: uuid
        in: path
        description: Id of the Snapshot
        required: true
        schema:
          type: string
      - name: logical_timestamp
        in: query
        description: Logical timestamp
        required: false
        schema:
          type: integer
          format: int64
