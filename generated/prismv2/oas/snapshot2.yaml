openapi: 3.0.0
info:
  version: v2.0
  title: Nutanix Prism API Reference
  description: "# Introduction\n\nThe Nutanix REST APIs allow you to create scripts that run system administration commands\
    \ against the Nutanix cluster. The API enables the use of HTTP requests to get information about the cluster as well as\
    \ make changes to the configuration. Output from the API calls are returned in JSON format.\n\nAll API users should have\
    \ valid Prism login credentials to send API calls to the Prism server. APIs on nutanix.dev portal are publicly available\
    \ to all valid users without special permissions for viewing purposes.\n\nThe v2 API is an update of the v1 API. Users\
    \ of the v1 API are encouraged to migrate to v2. \n\n[Nutanix API versions \u2013 What are they and what does each one\
    \ do?](https://www.nutanix.dev/api-versions/)"
  contact:
    name: Nutanix, Inc.
    url: http://www.nutanix.com
  license:
    name: EULA
    url: http://www.nutanix.com/eula
servers:
- url: https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0
security: []
paths:
  /snapshots:
    post:
      summary: Create Virtual Machine snapshots.
      description: Create Virtual Machine snapshots. If a UUID is specified for the snapshot, this operation will be idempotent.
        If multiple VMs are specified, all of their configurations and disks will fall into the same consistency group. Since
        this operation requires the coordination of multiple resources, it should not be abused by specifying more than several
        VMs at a time. Snapshots are crash-consistent. They do not include the VM s current memory image, only the VM configuration
        and its disk contents. The snapshot is taken atomically across all of a VM s configuration and disks to ensure consistency.
        This is also an asynchronous operation that results in the creation of a task object. The UUID of this task object
        is returned as the response of this operation. This task can be monitored by using the /tasks/poll API.
      tags:
      - /snapshots
      operationId: post/snapshots/createSnapshot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create.dto.acropolis.SnapshotCreateDTO'
        description: Create a snapshot
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create.dto.acropolis.ReturnValueDTO_TaskIdDTO'
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/snapshots \\\n\
          \    --header 'Accept: application/json' \\\n    --header 'Content-Type: application/json' \\\n    --data '{\n \
          \   \"snapshot_specs\": [\n        {\n            \"snapshot_name\": \"string\",\n            \"uuid\": \"string\"\
          ,\n            \"vm_logical_timestamp\": 0,\n            \"vm_uuid\": \"string\"\n        }\n    ]\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type:\
          \ application/json' \\\n    --body-data '{\n    \"snapshot_specs\": [\n        {\n            \"snapshot_name\"\
          : \"string\",\n            \"uuid\": \"string\",\n            \"vm_logical_timestamp\": 0,\n            \"vm_uuid\"\
          : \"string\"\n        }\n    ]\n}' \\\n    --output-document \\\n    - https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/snapshots"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"any_cvm_ip:9440\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Content-Type\": \"application/json\"\n}\n\npayload =  \"\"\"{\n    \"snapshot_specs\"\
          : [\n        {\n            \"snapshot_name\": \"string\",\n            \"uuid\": \"string\",\n            \"vm_logical_timestamp\"\
          : 0,\n            \"vm_uuid\": \"string\"\n        }\n    ]\n}\"\"\"\n\nconn.request(\"POST\",\"/PrismGateway/services/rest/v2.0/snapshots\"\
          , payload, headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/snapshots\"\n\t\n\tpayload :=  strings.NewReader(`{\"\
          snapshot_specs\": [{\"snapshot_name\": \"string\", \"uuid\": \"string\", \"vm_logical_timestamp\": 0, \"vm_uuid\"\
          : \"string\"}]}`)\n\treq, err := http.NewRequest(\"POST\", url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"\
          Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"Accept\", \"application/json\")\n \
          \       req.Header.Add(\"Content-Type\", \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\
          \tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\t\
          return\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/snapshots\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"\
          {\\\"snapshot_specs\\\": [{\\\"snapshot_name\\\": \\\"string\\\", \\\"uuid\\\": \\\"string\\\", \\\"vm_logical_timestamp\\\
          \": 0, \\\"vm_uuid\\\": \\\"string\\\"}]}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/snapshots';\nconst options = {\n  method:\
          \ 'POST',\n  headers: {'Accept': 'application/json', 'Content-Type': 'application/json'},\n  body:  `{\"snapshot_specs\"\
          : [{\"snapshot_name\": \"string\", \"uuid\": \"string\", \"vm_logical_timestamp\": 0, \"vm_uuid\": \"string\"}]}`\n\
          };\n\ntry {\n  const response = await fetch(url, options);\n  const data = await response.json();\n  console.log(data);\n\
          } catch (error) {\n  console.error(error);\n}"
