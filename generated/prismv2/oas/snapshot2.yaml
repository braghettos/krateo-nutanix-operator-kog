    delete:
      summary: Delete a snapshot.
      description: Delete a snapshot. This operation is idempotent. The logical timestamp can optionally be provided for consistency.
        If a logical timestamp is specified, then this operation will be rejected if the logical timestamp specified is not
        the value of the snapshot logical timestamp. This is also an asynchronous operation that results in the creation of
        a task object. The UUID of this task object is returned as the response of this operation. This task can be monitored
        by using the /tasks/poll API.
      tags:
