          \    \"spec_list\": [\n        {\n            \"adapter_type\": \"E1000\",\n            \"ip_address\": \"string\"\
          ,\n            \"ip_addresses\": [\n                \"string\"\n            ],\n            \"is_connected\": true,\n\
          \            \"mac_address\": \"string\",\n            \"model\": \"string\",\n            \"network_uuid\": \"\
          string\",\n            \"nic_uuid\": \"string\",\n            \"port_id\": \"string\",\n            \"request_ip\"\
          : true,\n            \"requested_ip_address\": \"string\",\n            \"vlan_mode\": \"Access\"\n        }\n \
