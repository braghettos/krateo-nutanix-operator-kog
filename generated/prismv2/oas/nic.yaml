  /vms/{uuid}/nics/{nic_id}:
    put:
      summary: Update a NIC for a Virtual Machine.
      description: Update a NIC for a Virtual Machine.  A VM NIC must be associated with a MAC address. It is not possible
        to change this association as the MAC address acts as the NIC s identifier. If the virtual network is managed (see
        POST /networks/), the IPv4 address of the NIC can be updated. If the VM is running, the NIC is hot-added to the VM.
        The logical timestamp can optionally be provided for consistency. If a logical timestamp is specified, then this operation
        will be rejected if the logical timestamp specified is not the value of the Virtual Machine logical timestamp. The
        logical timestamp can be obtained from the Virtual Machine object. This is also an asynchronous operation that results
        in the creation of a task object. The UUID of this task object is returned as the response of this operation. This
        task can be monitored by using the /tasks/poll API.
      tags:
      - /vms
      operationId: put/vms/{uuid}/nics/{nic_id}/updateNic
      parameters:
      - name: uuid
        in: path
        description: UUID of the Virtual Machine
        required: true
        schema:
          type: string
      - name: nic_id
        in: path
        description: Virtual Machine NIC identifier (MAC address)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update.dto.acropolis.VMNicUpdateDTO'
        description: NIC Config Update Info
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/update.dto.acropolis.ReturnValueDTO_TaskIdDTO'
