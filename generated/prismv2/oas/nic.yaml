openapi: 3.0.0
info:
  version: v2.0
  title: Nutanix Prism API Reference
  description: "# Introduction\n\nThe Nutanix REST APIs allow you to create scripts that run system administration commands\
    \ against the Nutanix cluster. The API enables the use of HTTP requests to get information about the cluster as well as\
    \ make changes to the configuration. Output from the API calls are returned in JSON format.\n\nAll API users should have\
    \ valid Prism login credentials to send API calls to the Prism server. APIs on nutanix.dev portal are publicly available\
    \ to all valid users without special permissions for viewing purposes.\n\nThe v2 API is an update of the v1 API. Users\
    \ of the v1 API are encouraged to migrate to v2. \n\n[Nutanix API versions \u2013 What are they and what does each one\
    \ do?](https://www.nutanix.dev/api-versions/)"
  contact:
    name: Nutanix, Inc.
    url: http://www.nutanix.com
  license:
    name: EULA
    url: http://www.nutanix.com/eula
servers:
- url: https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0
security: []
paths:
  /vms/{uuid}/nics:
    post:
      summary: Add a NIC to a Virtual Machine.
      description: Add a NIC to a Virtual Machine.  A VM NIC must be associated with a virtual network. It is not possible
        to change this association. To connect a VM to a different virtual network, it is necessary to create a new NIC. If
        the virtual network is managed (see POST /networks/), the NIC must be assigned an IPv4 address at creation time. If
        the network has no DHCP pool, the user must specify the IPv4 address manually. If the VM is running, the NIC is hot-added
        to the VM. The logical timestamp can optionally be provided for consistency. If a logical timestamp is specified,
        then this operation will be rejected if the logical timestamp specified is not the value of the Virtual Machine logical
        timestamp. The logical timestamp can be obtained from the Virtual Machine object. This is also an asynchronous operation
        that results in the creation of a task object. The UUID of this task object is returned as the response of this operation.
        This task can be monitored by using the /tasks/poll API.
      tags:
      - /vms
      operationId: post/vms/{uuid}/nics/createNic
      parameters:
      - name: uuid
        in: path
        description: UUID of the Virtual Machine
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create.dto.acropolis.VMNicCreateDTO'
        description: NIC Config Info
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create.dto.acropolis.ReturnValueDTO_TaskIdDTO'
