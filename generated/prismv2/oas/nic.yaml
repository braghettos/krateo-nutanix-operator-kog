components:
  schemas:
    update.dto.acropolis.ReturnValueDTO_TaskIdDTO:
      type: object
      properties:
        task_uuid:
          type: string
    create.dto.acropolis.VMNicSpecDTO:
      type: object
      properties:
        adapter_type:
          enum:
          - E1000
          - E1000e
          - PCNet32
          - Vmxnet
          - Vmxnet2
          - Vmxnet3
          - Unsupported
          type: string
        ip_address:
          type: string
        ip_addresses:
          items:
            type: string
          type: array
        is_connected:
          type: boolean
        mac_address:
          type: string
        model:
          type: string
        network_uuid:
          type: string
        nic_uuid:
          type: string
        port_id:
          type: string
        request_ip:
          type: boolean
        requested_ip_address:
          type: string
        vlan_mode:
          enum:
          - Access
          - Trunked
          - Untagged
          type: string
    update.dto.acropolis.VMNicUpdateDTO:
      type: object
      properties:
        nic_id:
          type: string
        nic_spec:
          $ref: '#/components/schemas/update.dto.acropolis.VMNicSpecDTO'
        uuid:
          type: string
        vm_logical_timestamp:
          format: int64
          type: integer
    get.base.Metadata:
      type: object
      properties:
        count:
          format: int32
          type: integer
        end_index:
          format: int32
          type: integer
        filter_criteria:
          type: string
        grand_total_entities:
          format: int32
          type: integer
        next_cursor:
          type: string
        page:
          format: int32
          type: integer
        previous_cursor:
          type: string
        search_string:
          type: string
        sort_criteria:
          type: string
        start_index:
          format: int32
          type: integer
        total_entities:
          format: int32
          type: integer
