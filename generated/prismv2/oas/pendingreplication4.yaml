openapi: 3.0.0
info:
  version: v2.0
  title: Nutanix Prism API Reference
  description: "# Introduction\n\nThe Nutanix REST APIs allow you to create scripts that run system administration commands\
    \ against the Nutanix cluster. The API enables the use of HTTP requests to get information about the cluster as well as\
    \ make changes to the configuration. Output from the API calls are returned in JSON format.\n\nAll API users should have\
    \ valid Prism login credentials to send API calls to the Prism server. APIs on nutanix.dev portal are publicly available\
    \ to all valid users without special permissions for viewing purposes.\n\nThe v2 API is an update of the v1 API. Users\
    \ of the v1 API are encouraged to migrate to v2. \n\n[Nutanix API versions \u2013 What are they and what does each one\
    \ do?](https://www.nutanix.dev/api-versions/)"
  contact:
    name: Nutanix, Inc.
    url: http://www.nutanix.com
  license:
    name: EULA
    url: http://www.nutanix.com/eula
servers:
- url: https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0
security: []
paths:
  /remote_sites/{name}/pending_replications:
    get:
      summary: Get all pending replications for the specified Remote Site.
      description: Get the list of backlogged/pending replications for the specified Remote Site in the cluster.
      tags:
      - /remote_sites
      operationId: get/remote_sites/{name}/pending_replications/getPendingReplicationsInRemote
      parameters:
      - name: name
        in: path
        description: Name of the Remote Site
        required: true
        schema:
          type: string
      - name: protection_domain_names
        in: query
        description: Names of Protection Domains
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/get.dto.dr.PendingReplicationDTO'
      x-codeSamples:
      - lang: cURL
        source: "curl --request GET \\\n    --url https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/remote_sites/{name}/pending_replications\
          \ \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type: application/json' \\\n     "
      - lang: Wget
        source: "wget --quiet \\\n    --method GET \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type:\
          \ application/json' \\\n      \\\n    --output-document \\\n    - https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/remote_sites/{name}/pending_replications"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"any_cvm_ip:9440\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Content-Type\": \"application/json\"\n}\n \nconn.request(\"GET\",\"/PrismGateway/services/rest/v2.0/remote_sites/{name}/pending_replications\"\
          , headers=headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/remote_sites/{name}/pending_replications\"\n\t \n\
          \treq, err := http.NewRequest(\"GET\", url, nil)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\"\
          , err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"Accept\", \"application/json\")\n        req.Header.Add(\"Content-Type\"\
          , \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"Error\
          \ creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\t\
          if err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\
          \n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"GET\", \"https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/remote_sites/{name}/pending_replications\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Content-Type\", \"application/json\")\n  .execute()\n\
          \  .toCompletableFuture()\n  .thenAccept(System.out::println)\n  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://any_cvm_ip:9440/PrismGateway/services/rest/v2.0/remote_sites/{name}/pending_replications';\n\
          const options = {\n  method: 'GET',\n  headers: {'Accept': 'application/json', 'Content-Type': 'application/json'}\
          \ \n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await response.json();\n  console.log(data);\n\
          } catch (error) {\n  console.error(error);\n}"
components:
  schemas:
    get.dto.dr.NfsFile:
      type: object
      properties:
        consistency_group:
          type: string
        nfs_file_path:
          type: string
        nfs_handle:
          format: int64
          type: integer
    get.dto.dr.SnapshotDTO:
      type: object
      properties:
        consistency_groups:
          items:
            type: string
          type: array
        exclusive_usage_in_bytes:
          format: int64
          type: integer
        located_remote_site_name:
          type: string
        missing_entities:
          items:
            $ref: '#/components/schemas/get.dto.dr.SnapshotDTO_MissingEntityDTO'
          type: array
        nfs_files:
          items:
            $ref: '#/components/schemas/get.dto.dr.NfsFile'
          type: array
        oob_schedule_ids:
          items:
            format: int64
            type: integer
          type: array
        protection_domain_name:
          type: string
        remote_site_names:
          items:
            type: string
          type: array
        size_in_bytes:
          format: int64
          type: integer
        snapshot_create_time_usecs:
          format: int64
          type: integer
        snapshot_expiry_time_usecs:
          format: int64
          type: integer
        snapshot_id:
          type: string
        snapshot_uuid:
          type: string
        state:
          enum:
          - EXPIRED
          - RETAIN_FOREVER
          - AVAILABLE
          - SCHEDULED
          type: string
        vms:
          items:
            $ref: '#/components/schemas/get.dto.dr.VirtualMachine'
          type: array
        volume_groups:
          items:
            $ref: '#/components/schemas/get.dto.dr.VolumeGroup'
          type: array
    get.dto.dr.VirtualMachine:
      type: object
      properties:
        app_consistent_snapshots:
          type: boolean
        consistency_group:
          type: string
        related_entity_uuids:
          items:
            type: string
          type: array
        vm_files:
          items:
            type: string
          type: array
        vm_handle:
          format: int64
          type: integer
        vm_id:
          type: string
        vm_name:
          type: string
        vm_power_state_on_recovery:
          enum:
          - Powered Off
          - Powered On
          - Power state at time of snapshot
          type: string
        vm_recoverability:
          items:
            $ref: '#/components/schemas/get.dto.dr.VmRecoverabilityDTO'
          type: array
    get.dto.dr.SnapshotDTO_MissingEntityDTO:
      type: object
      properties:
        cg_name:
          type: string
        entity_name:
          type: string
        entity_type:
          type: string
    get.dto.dr.VmRecoverabilityDTO:
      type: object
      properties:
        cerebro_error:
          type: string
        reason:
          type: string
        remote_site:
          type: string
    get.dto.dr.PendingReplicationDTO:
      type: object
      properties:
        protection_domain_name:
          type: string
        remote_site_name:
          type: string
        snapshot:
          $ref: '#/components/schemas/get.dto.dr.SnapshotDTO'
    get.dto.dr.VolumeGroup:
      type: object
      properties:
        consistency_group:
          type: string
        name:
          type: string
        nfs_file_paths:
          items:
            type: string
          type: array
        related_entity_uuids:
          items:
            type: string
          type: array
        volume_group_uuid:
          type: string
