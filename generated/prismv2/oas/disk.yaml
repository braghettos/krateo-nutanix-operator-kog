      summary: Get the list of Disks.
      description: Get the list of Disks configured in the cluster.
      tags:
      - /disks
      operationId: get/disks/getDisks
      parameters:
      - name: count
        in: query
        description: Number of Disks to retrieve
        required: false
        schema:
          type: integer
          format: int32
      - name: filter_criteria
        in: query
        description: Filter criteria
        required: false
        schema:
          type: string
      - name: sort_criteria
        in: query
        description: Sort criteria
        required: false
        schema:
          type: string
      - name: search_string
        in: query
        description: Search string
        required: false
        schema:
          type: string
      - name: search_attribute_list
        in: query
        description: Search attribute list
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          format: int32
      - name: projection
        in: query
        description: Projections on the attributes
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get.base.EntityCollection_get.dto.appliance.configuration.DiskDTO_'
