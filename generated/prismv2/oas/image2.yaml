    delete:
      summary: Delete a Disk Image.
      description: Delete a Disk Image. This is an idempotent operation. The logical timestamp can optionally be provided
        for consistency. If a logical timestamp is specified, then this operation will be rejected if the logical timestamp
        specified is not the value of the Image logical timestamp. The logical timestamp can be obtained from the Image Info
        object. This is also an asynchronous operation that results in the creation of a task object. The UUID of this task
        object is returned as the response of this operation. This task can be monitored by using the /tasks/poll API.
      tags:
      - /images
      operationId: delete/images/{uuid}/deleteImage
      parameters:
      - name: uuid
        in: path
        description: Id of the Image
        required: true
        schema:
          type: string
      - name: logical_timestamp
        in: query
        description: Logical timestamp for synchronized delete
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/delete.dto.acropolis.ReturnValueDTO_TaskIdDTO'
