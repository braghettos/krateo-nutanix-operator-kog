    put:
      tags:
      - ReplicationPolicies
      summary: Update replication policy
      description: 'Updates the replication policy with the given external identifier by using the provided request body.

        For `DATA_SYNC` replication the fields `pathOfSecondaryFileServerMountTarget` and `secondaryFileServerExtId` are immutable
        and user needs to provide inside the request body (otherwise a 400 error code will be returned).


        This api can also be used to change the status(ENABLED or DISABLED) of the replication policy which is independent
        of any other attributes. Partial enable is not supported.

        Making `DISABLED` state also supports an optional boolean parameter named as `shouldCancelOngoingReplicationJobs`
        to abort all the ongoing replication jobs for this configuration.

        All schedules, and status should be consistent across all replicationConfigurations.

        Use dry-run workflow with same payload to validate the request. Normal workflow won''t validate mount target paths,
        file servers reachability, fs version compatibility, etc before task creation.

        '
      operationId: updateReplicationPolicyById
      parameters:
      - name: extId
        in: path
        description: 'The external identifier of the replication policy. Example: 9c1e537d-6777-4c22-5d41-ddd0c3337aa9.'
