    post:
      tags:
      - ReplicationPolicies
      summary: Create replication policy
      description: 'Creates a new replication policy between a file server pair(s) by using the provided request body.


        The users need to specify the `name` and `type` of the replication along with

        replication configuration details inside the request body.

        The user also needs to provide at least one replication configuration inside the request body, which contains `primaryfileServerExtId`,

        `replicationEntities`, an array of `pathOfPrimaryFileServerMountTarget` strings, and replication `schedule`.

        All schedules, and status should be consistent across all replicationConfigurations.

        For example, if one replicationConfiguration is enabled, all replicationConfigurations should be enabled.


        Use dry-run workflow with same payload to validate the request. Normal workflow won''t validate mount target paths,
        file servers reachability, fs version compatibility, etc before task creation.

        '
      operationId: createReplicationPolicy
      parameters:
      - name: NTNX-Request-Id
        in: header
        description: 'A unique identifier that is associated with each request. The provided value must be opaque and preferably
          in Universal Unique Identifier (UUID) format. This identifier is also used as an idempotence token for safely retrying
