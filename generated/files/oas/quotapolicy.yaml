openapi: 3.0.1
info:
  title: Nutanix Files APIs
  description: Manage virtual file servers, create and configure shares for client access, protect them using DR and sync
    policies, provision storage space and administer security controls.
  version: '4.0'
  x-repo-name: files
  x-logo:
    altText: Files Logo
    url: https://developers.nutanix.com/api/v1/namespaces/files/images/files-logo-img.svg
servers:
- url: https://{pc-ip}:9440/api
security:
- basicAuthScheme: []
- apiKeyAuthScheme: []
paths:
