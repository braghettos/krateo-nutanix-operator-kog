        name:
          maxLength: 128
          minLength: 3
          type: string
          description: 'Name of the flag.

            '
        value:
          type: boolean
          description: 'Value of the flag.

            '
          default: false
      additionalProperties: false
      description: 'Many entities in the Nutanix APIs carry flags.  This object captures all the flags associated with that
        entity through this object.  The field that hosts this type of object must have an attribute called x-bounded-map-keys
        that tells which flags are actually present for that entity.

        '
    files.v4.0.error.ErrorResponse:
      type: object
      properties:
        error:
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/files.v4.0.error.AppMessage'
          - $ref: '#/components/schemas/files.v4.0.error.SchemaValidationError'
      additionalProperties: false
      description: An error response indicates that the operation has failed either due to a client error(4XX) or server error(5XX).
        Please look at the HTTP status code and namespace specific error code and error message for further details.
      x-platform-generated: true
    common.v1.0.response.ApiLink:
      type: object
      properties:
        href:
          type: string
          description: 'The URL at which the entity described by the link can be accessed.

            '
        rel:
          type: string
          description: 'A name that identifies the relationship of the link to the object that is returned by the URL.  The
            unique value of "self" identifies the URL for the object.

            '
      additionalProperties: false
      description: 'A HATEOAS style link for the response.  Each link contains a user-friendly name identifying the link and
        an address for retrieving the particular resource.

        '
    files.v4.0.error.SchemaValidationError:
      type: object
      properties:
        timestamp:
          type: string
          description: Timestamp of the response.
          format: date-time
          example: 2009-09-23 14:30:00-07:00
        statusCode:
          type: integer
          description: The HTTP status code of the response.
          example: 13
        error:
          type: string
          description: The generic error message for the response.
        path:
          type: string
          description: API path on which the request was made.
        validationErrorMessages:
          type: array
          description: List of validation error messages
          items:
            $ref: '#/components/schemas/files.v4.0.error.SchemaValidationErrorMessage'
      additionalProperties: false
      description: This schema is generated from SchemaValidationError.java
      x-platform-generated: true
    common.v1.0.config.KVPair:
      type: object
      properties:
        name:
          maxLength: 128
          minLength: 3
          type: string
          description: 'The key of the key-value pair.

            '
        value:
          description: The value associated with the key for this key-value pair
          oneOf:
          - type: string
            description: 'A string value in a key-value pair.

              '
          - type: integer
            description: 'An integer value in a key-value pair.

              '
            example: 36
          - type: boolean
            description: 'An boolean value in a key-value pair.

              '
            example: false
          - maxItems: 100
            minItems: 0
            type: array
            description: 'A value in a key-value pair that represents a list of strings.

              '
            items:
              type: string
          - type: object
            additionalProperties:
              type: string
            description: 'A value in a key-value pair that represents a map of string keys and values.

              '
          - maxItems: 20
            minItems: 0
            type: array
            description: 'A value in a key-value pair that represents an array of maps of string keys and values.

              '
            items:
              $ref: '#/components/schemas/common.v1.0.config.MapOfStringWrapper'
          - maxItems: 100
            minItems: 0
            type: array
            description: 'A value in a key-value pair that represents a list of integers.

              '
            items:
              type: integer
              example: 41
      additionalProperties: false
      description: 'A map describing a set of keys and their corresponding values.

        '
    files.v4.0.error.AppMessage:
      type: object
      properties:
        message:
          type: string
          description: The message string.
        severity:
          $ref: '#/components/schemas/common.v1.0.config.MessageSeverity'
        code:
          type: string
          description: 'The code associated with this message.This string is typically prefixed by the namespace the endpoint
            belongs to. For example: VMM-40000'
        locale:
          type: string
          description: Locale for this message. The default locale would be 'en-US'.
          default: en_US
        errorGroup:
          type: string
          description: The error group associated with this message of severity ERROR.
        argumentsMap:
          type: object
          additionalProperties:
            type: string
          description: The map of argument name to value.
      additionalProperties: false
      description: Message with associated severity describing status of the current operation.
      x-platform-generated: true
  securitySchemes:
