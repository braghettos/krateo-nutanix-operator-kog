        map:
          type: object
          additionalProperties:
            type: string
          description: 'A map with string keys and values.

            '
      additionalProperties: false
      description: 'A wrapper schema containing a map with string keys and values.

        '
    common.v1.0.config.MessageSeverity:
      type: string
      description: 'The message severity.

        '
      enum:
      - INFO
      - WARNING
      - ERROR
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        ERROR: 'Error indicating failed completion.

          '
        INFO: 'Information about successful completion.

          '
        $UNKNOWN: 'Unknown value.

          '
        WARNING: 'Warning indicating future error.

          '
        $REDACTED: 'Redacted value.

          '
    common.v1.0.config.Message:
      type: object
      properties:
        code:
          type: string
          description: 'A code that uniquely identifies a message.

            '
        message:
          type: string
          description: 'The description of the message.

            '
        locale:
          type: string
          description: 'The locale for the message description.

            '
          default: en_US
        severity:
          $ref: '#/components/schemas/common.v1.0.config.MessageSeverity'
      additionalProperties: false
    common.v1.0.config.Flag:
      type: object
