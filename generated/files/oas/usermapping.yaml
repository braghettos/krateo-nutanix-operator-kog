          description: 'An array of flags that may indicate the status of the response. For example, a flag with the name
            ''isPaginated'' and value ''false'', indicates that the response is not paginated.

            '
          items:
            $ref: '#/components/schemas/common.v1.0.config.Flag'
        links:
          maxItems: 20
          minItems: 0
          type: array
          description: 'An array of HATEOAS style links for the response that may also include pagination links for list operations.

            '
          items:
            $ref: '#/components/schemas/common.v1.0.response.ApiLink'
        totalAvailableResults:
          type: integer
          description: 'The total number of entities that are available on the server for this type.

            '
          format: int32
          example: 3
        messages:
          maxItems: 20
          minItems: 0
          type: array
          description: 'Information, Warning or Error messages that might provide additional contextual information related
            to the operation.

            '
          items:
            $ref: '#/components/schemas/common.v1.0.config.Message'
        extraInfo:
          maxItems: 20
          minItems: 0
          type: array
          description: 'An array of entity-specific metadata

            '
          items:
            $ref: '#/components/schemas/common.v1.0.config.KVPair'
