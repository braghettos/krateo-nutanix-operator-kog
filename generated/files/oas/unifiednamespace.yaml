        Each unified namespace contains list of unified namespace member configurations.

        Each unified namespace member configuration contains

        a member file server and a flag to indicate whether it is a core member.


        1. Paginate the returned unified namespaces list

        ```

        /api/files/v4.0.b1/config/unified-namespaces?$page=0&$limit=1

        ```

        If the user doesn''t specify any search query parameters, a list of root level unified namespaces are returned.

        '
