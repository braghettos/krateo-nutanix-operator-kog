openapi: 3.0.0
info:
  title: Foundation Central Service
  description: '# Introduction


    **Foundation Central** creates clusters from factory-imaged nodes and reimages existing nodes that are already registered
    with Foundation Central, remotely from Prism Central. This provides benefits such as creating clusters on remote sites
    (for example, ROBO), without arranging for a deployment personnel visit.


    **[Contact Us by Email](mailto:foundation@nutanix.com)**


    **License: Copyright Nutanix Inc. All rights reserved**

    '
  contact:
    name: Foundation Central Developers
    email: foundation@nutanix.com
  license:
    name: Copyright Nutanix Inc. All rights reserved
  version: '1.0'
servers:
- url: /api/fc/v1
security:
- BasicAuth: []
- CookieAuth: []
paths:
  /pc/clusters/{cluster_uuid}:
    get:
      description: Get the details of a Prism Element cluster managed by Prism Central. This API will return cluster and hardware
        manager specific details from Prism Central, where Foundation Central is a part of.
      tags:
      - pc_clusters
      summary: Get the details of a Prism Element cluster.
      operationId: GetPCCluster
      parameters:
      - description: UUID of the cluster whose details need to be fetched.
        name: cluster_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Details of the cluster with the given UUID.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/cluster_details'
      x-codeSamples:
      - lang: cURL
        source: "curl --request GET \\\n    --url https://www.nutanix.dev/api/fc/v1/pc/clusters/{cluster_uuid} \\\n    --header\
          \ 'Authorization: Basic <basic_auth_token>' \\\n     "
      - lang: Wget
        source: "wget --quiet \\\n    --method GET \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n      \\\
          \n    --output-document \\\n    - https://www.nutanix.dev/api/fc/v1/pc/clusters/{cluster_uuid}"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {\n    \"Authorization\"\
          : \"Basic <basic_auth_token>\"\n}\n \nconn.request(\"GET\",\"/api/fc/v1/pc/clusters/{cluster_uuid}\", headers=headers)\n\
          \nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://www.nutanix.dev/api/fc/v1/pc/clusters/{cluster_uuid}\"\n\t \n\treq, err := http.NewRequest(\"GET\"\
          , url, nil)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"\
          Authorization\", \"Basic <basic_auth_token>\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil\
          \ {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err\
          \ := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t\
          }\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"GET\", \"https://www.nutanix.dev/api/fc/v1/pc/clusters/{cluster_uuid}\"\
          )\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://www.nutanix.dev/api/fc/v1/pc/clusters/{cluster_uuid}';\nconst options = {\n  method:\
          \ 'GET',\n  headers: {'Authorization': 'Basic <basic_auth_token>'} \n};\n\ntry {\n  const response = await fetch(url,\
          \ options);\n  const data = await response.json();\n  console.log(data);\n} catch (error) {\n  console.error(error);\n\
          }"
components:
  securitySchemes:
    APIKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
    APIKeyKubAuth:
      type: apiKey
      name: X-API-Key-Kub
      in: header
    BasicAuth:
      type: http
      scheme: basic
    CookieAuth:
      type: apiKey
      name: Cookie
      in: header
    OpenIDAuth:
      type: apiKey
      name: code
      in: query
  schemas:
    common_network_settings:
      description: Common network settings across the nodes in the cluster.
      type: object
      properties:
        cvm_dns_servers:
          description: List of DNS servers for the CVMs in the cluster.
          type: array
          items:
            type: string
            format: ipv4
        cvm_ntp_servers:
          description: List of NTP servers for the CVMs in the cluster.
          type: array
          items:
            type: string
        hypervisor_dns_servers:
          description: List of DNS servers for the hypervisors in the cluster.
          type: array
          items:
            type: string
            format: ipv4
        hypervisor_ntp_servers:
          description: List of NTP servers for the hypervisors in the cluster.
          type: array
          items:
            type: string
    error_response:
      type: object
      properties:
        code:
          description: HTTP response code from the API.
          type: integer
          format: int32
        message_list:
          description: Error message in detail.
          type: array
          items:
            type: string
    hardware_manager_data:
      description: Cluster details pertaining to the hardware manager.
      type: object
      properties:
        hardware_manager_type:
          $ref: '#/components/schemas/hardware_manager_type'
        hardware_manager_uuid:
          description: UUID of the hardware manager, if the node is managed by a hardware manager.
          type: string
          format: uuid
        intersight_data:
          $ref: '#/components/schemas/intersight_deployment_settings'
    uuid_pool:
      description: UUID pool available in the Intersight.
      type: object
      required:
      - name
      - available_count
      properties:
        available_count:
          description: Number of available UUID items in the UUID pool.
          type: integer
          minimum: 0
        name:
          description: Name of the UUID pool, which is a collection of UUID items that can be allocated to server profiles.
          type: string
    hardware_manager_type:
      description: Type of the hardware manager.
      type: string
      enum:
      - INTERSIGHT
      - NOT_APPLICABLE
    cluster_details:
      description: Details of the Prism Element cluster registered with Prism Central. This includes the cluster details and
        hardware manager specific details.
      allOf:
      - $ref: '#/components/schemas/pc_cluster_details'
      - type: object
        properties:
          hardware_manager_data:
            $ref: '#/components/schemas/hardware_manager_data'
    pc_cluster_details:
      description: Details of the Prism Element cluster registered with Prism Central.
      type: object
      required:
      - cluster_uuid
      - aos_version
      - common_network_settings
      - cluster_external_ip
      - redundancy_factor
      - timezone
      - node_count
      - current_time
      - nodes_list
      properties:
        aos_version:
          description: AOS version currently installed on the cluster.
          type: string
        cluster_external_ip:
          description: External management IP of the cluster.
          type: string
          format: ipv4
        cluster_name:
          description: Name of the cluster.
          type: string
        cluster_uuid:
          description: UUID of the cluster.
          type: string
          format: uuid
        common_network_settings:
          $ref: '#/components/schemas/common_network_settings'
        current_time:
          description: Current time of Foundation Central.
          type: string
          format: date-time
        node_count:
          description: Number of nodes in the cluster.
          type: integer
        nodes_list:
          description: List of details of the nodes in the deployment.
          type: array
          items:
            $ref: '#/components/schemas/pc_cluster_node_details'
        redundancy_factor:
          description: Redundancy factor of the cluster.
          type: integer
        timezone:
          description: Timezone of the cluster.
          type: string
    intersight_deployment_data:
      description: Deployment data which is specific to Intersight.
      type: object
      required:
      - organization
      properties:
        organization:
          description: Common organization to which all the nodes in the deployment belong to.
          type: string
          minLength: 1
    intersight_imc_settings:
      description: IMC settings for IMM servers. Atleast one of inband or out-of-band settings have to be provided.
      type: object
      minProperties: 1
      properties:
        inband_settings:
          description: Inband network settings.
          type: object
          required:
          - vlan
          - ip_pool_name
          - ipv4
          - ipv6
          properties:
            ip_pool_name:
              description: Name of the IP pool which is a collection of IPv4 and/or IPv6 addresses that can be allocated to
                server profiles.
              type: string
              minLength: 1
            ipv4:
              description: This flag enables the use of IPv4 address for end-point access.
              type: boolean
            ipv4_available_count:
              description: Number of available IPv4 addresses. This is used only in case of node preparation for cluster expansion.
              type: integer
              minimum: 0
            ipv6:
              description: This flag enables the use of IPv6 address for end-point access.
              type: boolean
            ipv6_available_count:
              description: Number of available IPv6 addresses. This is used only in case of node preparation for cluster expansion.
              type: integer
              minimum: 0
            vlan:
              description: VLAN to be used for node access over Inband network.
              type: integer
              maximum: 4093
              minimum: 4
        out_of_band_settings:
          description: Out-of-band network settings.
          type: object
          required:
          - ip_pool_name
          properties:
            ip_pool_name:
              description: Name of the IP pool which is a collection of IP addresses that can be allocated to server profiles.
                Only IPv4 configuration will be supported for Out-Of-Band configuration.
              type: string
              minLength: 1
            ipv4_available_count:
              description: Number of available IPv4 addresses. This is used only in case of node preparation for cluster expansion.
              type: integer
              minimum: 0
    management_mode_intersight:
      description: Management mode of the node in Intersight.
      type: string
      enum:
      - ISM
      - IMM
    intersight_deployment_settings:
      description: Details which is specific to intersight. This includes the intersight deployment data and intersight IMM
        settings.
      allOf:
      - $ref: '#/components/schemas/intersight_deployment_data'
      - type: object
        properties:
          imm_settings:
            description: IMM settings for intersight.
            type: object
            required:
            - domain
            - vnic_settings
            - imc_settings
            properties:
              domain:
                description: Domain of the IMM.
                type: string
              imc_settings:
                $ref: '#/components/schemas/intersight_imc_settings'
              uuid_pools:
                description: UUID pools for the IMM.
                type: array
                items:
                  $ref: '#/components/schemas/uuid_pool'
              vnic_settings:
                description: vNIC settings for the IMM.
                type: object
                required:
                - mac_pools
                - vlans
                properties:
                  mac_pools:
                    description: MAC pools for the IMM.
                    type: array
                    items:
                      $ref: '#/components/schemas/mac_pool'
                  vlans:
                    description: Allowed VLAN IDs of the virtual interface. A list of comma separated VLAN ids and/or VLAN
                      id ranges.
                    type: string
          management_mode:
            $ref: '#/components/schemas/management_mode_intersight'
    pc_cluster_node_details:
      description: Details of the nodes in a cluster.
      type: object
      properties:
        block_serial:
          description: Block serial of the node.
          type: string
        cvm_gateway:
          description: Gateway of the CVM.
          type: string
          format: ipv4
        cvm_ip:
          description: CVM IP address of the node.
          type: string
          format: ipv4
        cvm_netmask:
          description: Netmask of the CVM.
          type: string
        hypervisor_gateway:
          description: Gateway of the hypervisor.
          type: string
          format: ipv4
        hypervisor_hostname:
          description: Host name of the node.
          type: string
        hypervisor_ip:
          description: Hypervisor IP address of the node.
          type: string
          format: ipv4
        hypervisor_netmask:
          description: Netmask of the hypervisor.
          type: string
        hypervisor_type:
          description: Type of hypervisor currently installed on the node.
          type: string
        hypervisor_version:
          description: Version of the hypervisor currently installed on the node.
          type: string
        model:
          description: Model name of the node.
          type: string
        node_serial:
          description: Node serial of the node.
          type: string
        node_uuid:
          description: UUID of the node.
          type: string
          format: uuid
    mac_pool:
      description: MAC pool available in Intersight.
      type: object
      required:
      - name
      - available_count
      properties:
        available_count:
          description: Number of available MAC addresses in the MAC pool.
          type: integer
          minimum: 0
        name:
          description: Name of the MAC pool which is a collection of MAC addresses that can be allocated to VNICs of a server
            profile.
          type: string
