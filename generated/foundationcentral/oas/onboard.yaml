openapi: 3.0.0
info:
  title: Foundation Central Service
  description: '# Introduction


    **Foundation Central** creates clusters from factory-imaged nodes and reimages existing nodes that are already registered
    with Foundation Central, remotely from Prism Central. This provides benefits such as creating clusters on remote sites
    (for example, ROBO), without arranging for a deployment personnel visit.


    **[Contact Us by Email](mailto:foundation@nutanix.com)**


    **License: Copyright Nutanix Inc. All rights reserved**

    '
  contact:
    name: Foundation Central Developers
    email: foundation@nutanix.com
  license:
    name: Copyright Nutanix Inc. All rights reserved
  version: '1.0'
servers:
- url: /api/fc/v1
security:
- BasicAuth: []
- CookieAuth: []
paths:
  /imaged_nodes/onboard:
    post:
      security:
      - BasicAuth: []
      - CookieAuth: []
      description: Onboards a node by pre-authorizing the node serial in Foundation Central.
      tags:
      - imaged_nodes
      summary: Onboard a node in Foundation Central.
      operationId: OnboardImagedNodes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/imaged_nodes_onboard_input'
        required: true
      responses:
        '200':
          description: Onboarded a new node.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/imaged_nodes_response'
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://www.nutanix.dev/api/fc/v1/imaged_nodes/onboard \\\n    --header\
          \ 'Authorization: Basic <basic_auth_token>' \\\n    --data '{\n    \"block_serial\": \"string\",\n    \"cpu_core_count\"\
          : 0,\n    \"hardware_manager_data\": {\n        \"intersight_data\": {\n            \"classification\": \"NUTANIX\"\
          ,\n            \"domain\": \"string\",\n            \"management_mode\": \"ISM\",\n            \"node_name\": \"\
          string\",\n            \"organizations\": [\n                \"string\"\n            ],\n            \"tags\": [\n\
          \                {\n                    \"key\": \"string\",\n                    \"value\": \"string\"\n      \
          \          }\n            ]\n        }\n    },\n    \"hardware_manager_uuid\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\
          ,\n    \"memory_gb\": null,\n    \"model\": \"string\",\n    \"node_serial\": \"string\"\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n    --body-data\
          \ '{\n    \"block_serial\": \"string\",\n    \"cpu_core_count\": 0,\n    \"hardware_manager_data\": {\n        \"\
          intersight_data\": {\n            \"classification\": \"NUTANIX\",\n            \"domain\": \"string\",\n      \
          \      \"management_mode\": \"ISM\",\n            \"node_name\": \"string\",\n            \"organizations\": [\n\
