          \ },\n    \"hardware_manager_uuid\": \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\",\n    \"memory_gb\": null,\n    \"\
          model\": \"string\",\n    \"node_serial\": \"string\"\n}' \\\n    --output-document \\\n    - https://www.nutanix.dev/api/fc/v1/imaged_nodes/onboard"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {\n    \"Authorization\"\
          : \"Basic <basic_auth_token>\"\n}\n\npayload =  \"\"\"{\n    \"block_serial\": \"string\",\n    \"cpu_core_count\"\
