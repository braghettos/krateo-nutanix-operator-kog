          }"
components:
  securitySchemes:
    APIKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
    APIKeyKubAuth:
      type: apiKey
      name: X-API-Key-Kub
      in: header
    BasicAuth:
      type: http
      scheme: basic
    CookieAuth:
      type: apiKey
      name: Cookie
      in: header
    OpenIDAuth:
      type: apiKey
      name: code
      in: query
  schemas:
    imaged_nodes_response:
      description: Response returned by the server after registering a node.
      type: object
      required:
      - object_version
      properties:
        imaged_node_uuid:
          description: UUID of the node.
          type: string
          format: uuid
        object_version:
          description: Version of the node used for CAS. This will be 0 for the newly created node.
          type: integer
          minimum: 0
    hardware_manager_node_onboard_input:
      description: Node data fetched from hardware manager using discovery API.
      type: object
      properties:
        intersight_data:
          $ref: '#/components/schemas/intersight_node_onboard_input'
    error_response:
      type: object
      properties:
        code:
          description: HTTP response code from the API.
          type: integer
          format: int32
        message_list:
          description: Error message in detail.
          type: array
          items:
            type: string
    intersight_node_onboard_input:
      description: UCS server data fetched using discovery API.
      type: object
      required:
      - organizations
      - classification
      - node_name
      properties:
        classification:
          description: Classification indicates whether UCS server is installed with Nutanix stack or not.
          type: string
          enum:
          - NUTANIX
          - UNKNOWN
        domain:
          description: Name of the UCS Domain to which the node belongs. For standalone servers, this field is empty.
          type: string
        management_mode:
          $ref: '#/components/schemas/management_mode_intersight'
        node_name:
          description: Name of the node in the Intersight.
          type: string
        organizations:
          $ref: '#/components/schemas/intersight_orgs'
        tags:
          $ref: '#/components/schemas/intersight_tags'
    intersight_orgs:
      description: List of organizations to which the UCS server belongs.
      type: array
      items:
        description: Name of the organization in Intersight.
        type: string
    imaged_nodes_onboard_input:
      description: Input parameters for onboarding a node.
      type: object
      required:
      - node_serial
      properties:
        block_serial:
          description: Serial number of the block to which the node belongs.
          type: string
        cpu_core_count:
          description: Number of CPU cores in the node.
          type: integer
        hardware_manager_data:
          $ref: '#/components/schemas/hardware_manager_node_onboard_input'
        hardware_manager_uuid:
          description: UUID of the hardware manager which manages the node. This is required for the nodes managed by a hardware
            manager.
          type: string
          format: uuid
        memory_gb:
          description: Memory of the node in GB.
          type: number
          format: float
        model:
          description: Model of the node.
          type: string
        node_serial:
          description: Serial number of the node.
          type: string
          pattern: ^[A-Z0-9a-z]+$
    management_mode_intersight:
      description: Management mode of the node in Intersight.
      type: string
      enum:
      - ISM
      - IMM
    intersight_tags:
      description: List of tags of the UCS server.
      type: array
      items:
        description: UCS server tags.
        type: object
        properties:
          key:
            description: Key of the tag.
            type: string
          value:
            description: Value of the tag.
            type: string
