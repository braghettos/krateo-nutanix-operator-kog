    delete:
      description: Deletes the hardware manager based on its UUID. You can delete a hardware manager only if there are no
        corresponding nodes onboarded in Foundation Central.
      tags:
      - hardware_managers
      summary: Delete a hardware manager
      operationId: DeleteHardwareManager
      parameters:
      - description: UUID of the hardware manager that must be deleted.
        name: hardware_manager_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The requested hardware manager is deleted from Foundation Central.
      x-codeSamples:
      - lang: cURL
        source: "curl --request DELETE \\\n    --url https://www.nutanix.dev/api/fc/v1/hardware_managers/{hardware_manager_uuid}\
          \ \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n     "
      - lang: Wget
