        name: hardware_manager_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Details of the hardware manager.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/hardware_manager_details'
      x-codeSamples:
