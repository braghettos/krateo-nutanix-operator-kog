components:
  securitySchemes:
    APIKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
    APIKeyKubAuth:
      type: apiKey
      name: X-API-Key-Kub
      in: header
    BasicAuth:
      type: http
      scheme: basic
    CookieAuth:
      type: apiKey
      name: Cookie
      in: header
    OpenIDAuth:
      type: apiKey
      name: code
      in: query
  schemas:
    hardware_manager_details:
      description: Details of a hardware manager instance.
      type: object
      required:
      - hardware_manager_uuid
      - name
      - connection_details
      - type
      - object_version
      - created_timestamp
      - current_time
      properties:
        connection_details:
          $ref: '#/components/schemas/hardware_manager_conn_details'
        created_timestamp:
          description: Time when the hardware manager was registered in Foundation Central.
          type: string
          format: date-time
        current_time:
          description: Current time of Foundation Central.
          type: string
          format: date-time
        deployment_type:
          description: Deployment type of the hardware manager instance.
          type: string
          enum:
          - SAAS
          - ONPREM
        hardware_manager_uuid:
          description: UUID of the hardware manager.
          type: string
          format: uuid
        name:
          description: Name of the hardware manager.
          type: string
        object_version:
          description: Version of the hardware manager used for CAS.
          type: integer
          minimum: 0
        region:
          description: Region in which the hardware manager is deployed.
          type: string
        type:
          description: Type of the hardware manager.
          type: string
          enum:
          - INTERSIGHT
    error_response:
      type: object
      properties:
        code:
          description: HTTP response code from the API.
          type: integer
          format: int32
        message_list:
          description: Error message in detail.
          type: array
          items:
            type: string
    hardware_manager_conn_details:
      description: Details of a connection method to a hardware manager.
      type: object
      properties:
        urls:
          description: URLs of the hardware manager.
          type: array
          maxLength: 1
          items:
            type: string
    hardware_manager_update_input:
      description: Input parameters for updating a hardware manager.
      type: object
      required:
      - object_version
      properties:
        connection_details:
          $ref: '#/components/schemas/hardware_manager_conn_details'
        name:
          description: Name of the hardware manager.
          type: string
          maxLength: 40
        object_version:
          description: Version of the hardware manager used for CAS.
          type: integer
          minimum: 0
    hardware_manager_input:
      description: Input parameters for registering a new hardware manager.
      type: object
      required:
      - name
      - connection_details
      - type
      - deployment_type
      properties:
        connection_details:
          $ref: '#/components/schemas/hardware_manager_conn_details'
        deployment_type:
          description: Deployment type of the hardware manager instance to be registered.
          type: string
          enum:
          - SAAS
          - ONPREM
        name:
          description: Name of the hardware manager to be registered. All alphanumeric characters are allowed along with special
            characters dot, hyphen and underscore(., - and _).
          type: string
          maxLength: 40
        region:
          description: Region in which the hardware manager is deployed.
          type: string
        type:
          description: Type of the hardware manager to be registered.
          type: string
          enum:
          - INTERSIGHT
