        name: hardware_manager_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hardware_manager_update_input'
        required: true
      responses:
        '200':
          description: Updated the hardware manager details.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/hardware_manager_details'
