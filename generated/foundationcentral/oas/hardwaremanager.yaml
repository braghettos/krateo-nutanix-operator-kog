openapi: 3.0.0
info:
  title: Foundation Central Service
  description: '# Introduction


    **Foundation Central** creates clusters from factory-imaged nodes and reimages existing nodes that are already registered
    with Foundation Central, remotely from Prism Central. This provides benefits such as creating clusters on remote sites
    (for example, ROBO), without arranging for a deployment personnel visit.


    **[Contact Us by Email](mailto:foundation@nutanix.com)**


    **License: Copyright Nutanix Inc. All rights reserved**

    '
  contact:
    name: Foundation Central Developers
    email: foundation@nutanix.com
  license:
    name: Copyright Nutanix Inc. All rights reserved
  version: '1.0'
servers:
- url: /api/fc/v1
security:
- BasicAuth: []
- CookieAuth: []
paths:
  /hardware_managers:
    post:
      description: Registers a new hardware manager in the Foundation Central. The Foundation Central then uses these instance
        to discover or image nodes registered to them.
      tags:
      - hardware_managers
      summary: Register a hardware manager
      operationId: PostHardwareManager
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hardware_manager_input'
        required: true
      responses:
        '200':
          description: A hardware manager is registered.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/hardware_manager_details'
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://www.nutanix.dev/api/fc/v1/hardware_managers \\\n    --header 'Authorization:\
          \ Basic <basic_auth_token>' \\\n    --data '{\n    \"connection_details\": {\n        \"urls\": [\n            \"\
          string\"\n        ]\n    },\n    \"deployment_type\": \"SAAS\",\n    \"name\": \"string\",\n    \"region\": \"string\"\
          ,\n    \"type\": \"INTERSIGHT\"\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n    --body-data\
          \ '{\n    \"connection_details\": {\n        \"urls\": [\n            \"string\"\n        ]\n    },\n    \"deployment_type\"\
          : \"SAAS\",\n    \"name\": \"string\",\n    \"region\": \"string\",\n    \"type\": \"INTERSIGHT\"\n}' \\\n    --output-document\
          \ \\\n    - https://www.nutanix.dev/api/fc/v1/hardware_managers"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {\n    \"Authorization\"\
          : \"Basic <basic_auth_token>\"\n}\n\npayload =  \"\"\"{\n    \"connection_details\": {\n        \"urls\": [\n  \
          \          \"string\"\n        ]\n    },\n    \"deployment_type\": \"SAAS\",\n    \"name\": \"string\",\n    \"\
          region\": \"string\",\n    \"type\": \"INTERSIGHT\"\n}\"\"\"\n\nconn.request(\"POST\",\"/api/fc/v1/hardware_managers\"\
          , payload, headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://www.nutanix.dev/api/fc/v1/hardware_managers\"\n\t\n\tpayload :=  strings.NewReader(`{\"connection_details\"\
          : {\"urls\": [\"string\"]}, \"deployment_type\": \"SAAS\", \"name\": \"string\", \"region\": \"string\", \"type\"\
          : \"INTERSIGHT\"}`)\n\treq, err := http.NewRequest(\"POST\", url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"\
          Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"Authorization\", \"Basic <basic_auth_token>\"\
          )\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\"\
          , err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\t\
          fmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\
          \n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://www.nutanix.dev/api/fc/v1/hardware_managers\"\
          )\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\")\n  .setBody(\"{\\\"connection_details\\\": {\\\"\
          urls\\\": [\\\"string\\\"]}, \\\"deployment_type\\\": \\\"SAAS\\\", \\\"name\\\": \\\"string\\\", \\\"region\\\"\
          : \\\"string\\\", \\\"type\\\": \\\"INTERSIGHT\\\"}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://www.nutanix.dev/api/fc/v1/hardware_managers';\nconst options = {\n  method: 'POST',\n\
          \  headers: {'Authorization': 'Basic <basic_auth_token>'},\n  body:  `{\"connection_details\": {\"urls\": [\"string\"\
          ]}, \"deployment_type\": \"SAAS\", \"name\": \"string\", \"region\": \"string\", \"type\": \"INTERSIGHT\"}`\n};\n\
          \ntry {\n  const response = await fetch(url, options);\n  const data = await response.json();\n  console.log(data);\n\
          } catch (error) {\n  console.error(error);\n}"
  /hardware_managers/{hardware_manager_uuid}:
