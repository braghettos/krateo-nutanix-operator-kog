components:
  securitySchemes:
    APIKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
    APIKeyKubAuth:
      type: apiKey
      name: X-API-Key-Kub
      in: header
    BasicAuth:
      type: http
      scheme: basic
    CookieAuth:
      type: apiKey
      name: Cookie
      in: header
    OpenIDAuth:
      type: apiKey
      name: code
      in: query
  schemas:
    imaged_cluster_details:
      description: Details of the cluster created using Foundation Central.
      type: object
      required:
      - imaged_cluster_uuid
      - cluster_size
      - imaged_node_uuid_list
      - common_network_settings
      - cluster_name
      - cluster_external_ip
      - redundancy_factor
      - storage_node_count
      - foundation_init_config
      - foundation_init_node_uuid
      - cluster_status
      - created_timestamp
      - updated_timestamp
      - destroyed
      - workflow_type
      - archived
      - current_time
      - skip_cluster_creation
      - hardware_manager_type
      - hardware_manager_uuid
      properties:
        aos_metadata_url:
          description: URL to download the AOS metadata JSON. Returned only when imaging is performed.
          type: string
        archived:
          description: True if the cluster creation request is archived. Otherwise, False.
          type: boolean
        cluster_external_ip:
          description: External management IP of the cluster.
          type: string
          format: ipv4
        cluster_metadata:
          $ref: '#/components/schemas/cluster_metadata'
        cluster_name:
          description: Name of the cluster.
          type: string
        cluster_size:
          description: Number of nodes in the cluster.
          type: integer
        cluster_status:
          $ref: '#/components/schemas/cluster_creation_status'
        common_network_settings:
          $ref: '#/components/schemas/common_network_settings'
        created_timestamp:
          description: Time when the cluster creation request was received in Foundation Central.
          type: string
          format: date-time
        current_time:
          description: Current time of Foundation Central.
          type: string
          format: date-time
        destroyed:
          description: True if the cluster is destroyed. Otherwise, False.
          type: boolean
        discovered_node_details:
          description: Details of the node discovered at the time of submitting the deployment request.
          type: array
          items:
            type: object
            additionalProperties: true
        fc_metadata:
          $ref: '#/components/schemas/fc_metadata'
        foundation_init_config:
          description: JSON configuration used by foundation to create the cluster.
          type: object
          additionalProperties: true
        foundation_init_node_uuid:
          description: UUID of the first node coordinating the cluster creation.
          type: string
          format: uuid
        hardware_manager_type:
          $ref: '#/components/schemas/hardware_manager_type'
        hardware_manager_uuid:
          description: UUID of the hardware manager if the nodes in the deployment are managed by a hardware manager.
          type: string
          format: uuid
        imaged_cluster_uuid:
          description: UUID of the cluster.
          type: string
          format: uuid
        imaged_node_uuid_list:
          description: List of UUIDs of the imaged nodes.
          type: array
          items:
            type: string
            format: uuid
        nodes_list:
          description: List of details of the nodes in the deployment.
          type: array
          items:
            $ref: '#/components/schemas/node_details_output'
        redundancy_factor:
          description: Redundancy factor of the cluster.
          type: integer
        server_configuration_data:
          $ref: '#/components/schemas/server_configuration_data'
        skip_cluster_creation:
          description: True if the cluster creation must be skipped. Otherwise, False.
          type: boolean
        storage_node_count:
          description: Number of storage-only nodes in the cluster. AHV ISO for the storage node will be taken from the AOS
            package.
          type: integer
        target_cluster:
          $ref: '#/components/schemas/target_cluster_details'
        updated_timestamp:
          description: Time when the cluster creation request's status was updated in Foundation Central.
          type: string
          format: date-time
        workflow_type:
          description: If the imaging and cluster creation are coordinated by Foundation, the value is FOUNDATION_WF. If the
            nodes are in phoenix, the value is PHOENIX_WF.
          type: string
    error_response:
      type: object
      properties:
        code:
          description: HTTP response code from the API.
          type: integer
          format: int32
        message_list:
          description: Error message in detail.
          type: array
          items:
            type: string
    intersight_deployment_data:
      description: Deployment data which is specific to Intersight.
      type: object
      required:
      - organization
      properties:
        organization:
          description: Common organization to which all the nodes in the deployment belong to.
          type: string
          minLength: 1
    server_configuration_data:
      description: Server configuration details per deployment. In the case of node preparation for cluster expansion, this
        is not a mandatory input for deployment.
      type: object
      properties:
        intersight_data:
          $ref: '#/components/schemas/intersight_deployment_data'
        skip_cleanup:
          description: True to skip server configuration cleanup, i.e., to skip unassociation and deletion of server profiles/policies
            in case of Intersight, if deployment fails. False otherwise. This input is ignored if imaging is successful on
            all nodes and if deployment fails during cluster creation or the post-cluster creation phase, as cleanup is always
            skipped in those cases.
          type: boolean
    management_mode_intersight:
      description: Management mode of the node in Intersight.
      type: string
      enum:
      - ISM
      - IMM
    intersight_imc_settings:
      description: IMC settings for IMM servers. Atleast one of inband or out-of-band settings have to be provided.
      type: object
      minProperties: 1
      properties:
        inband_settings:
          description: Inband network settings.
          type: object
          required:
          - vlan
          - ip_pool_name
          - ipv4
          - ipv6
          properties:
            ip_pool_name:
              description: Name of the IP pool which is a collection of IPv4 and/or IPv6 addresses that can be allocated to
                server profiles.
              type: string
              minLength: 1
            ipv4:
              description: This flag enables the use of IPv4 address for end-point access.
              type: boolean
            ipv4_available_count:
              description: Number of available IPv4 addresses. This is used only in case of node preparation for cluster expansion.
              type: integer
              minimum: 0
            ipv6:
              description: This flag enables the use of IPv6 address for end-point access.
              type: boolean
            ipv6_available_count:
              description: Number of available IPv6 addresses. This is used only in case of node preparation for cluster expansion.
              type: integer
              minimum: 0
            vlan:
              description: VLAN to be used for node access over Inband network.
              type: integer
              maximum: 4093
              minimum: 4
        out_of_band_settings:
          description: Out-of-band network settings.
          type: object
          required:
          - ip_pool_name
          properties:
            ip_pool_name:
              description: Name of the IP pool which is a collection of IP addresses that can be allocated to server profiles.
                Only IPv4 configuration will be supported for Out-Of-Band configuration.
              type: string
              minLength: 1
            ipv4_available_count:
              description: Number of available IPv4 addresses. This is used only in case of node preparation for cluster expansion.
              type: integer
              minimum: 0
    hypervisor_iso_details:
      description: Details of the hypervisor ISO.
      type: object
      required:
      - url
      properties:
        hyperv_product_key:
          description: Product key for hyperv ISOs. Required only if the hypervisor type is hyperv and product key is mandatory
            (for example, volume license).
          type: string
        hyperv_sku:
          description: SKU of hyperv to be installed if hypervisor_type is hyperv.
          type: string
        hypervisor_type:
          description: Type of hypervisor corresponding to the ISO.
          type: string
          enum:
          - kvm
          - esx
          - hyperv
        sha256sum:
          description: sha256sum of the hypervisor ISO.
          type: string
        url:
          description: URL to download the hypervisor ISO. This is required only if imaging is needed.
          type: string
    target_cluster_details:
      description: Details of the PE cluster to which the nodes will be added. This cluster must be registered with the Prism
        Central where Foundation Central is running.
      type: object
      required:
      - cluster_uuid
      properties:
        cluster_name:
          description: Name of the cluster. This is a read-only attribute used by the client.
          type: string
          readOnly: true
        cluster_uuid:
          description: UUID of the cluster.
          type: string
    network_bond_settings:
      description: Network bond settings.
      type: object
      properties:
        lacp_settings:
          description: Bond settings specific to LACP.
          type: object
          properties:
            rate:
              description: LACP bond rate. Supported values are 'slow' and 'fast'. This is used only when the mode is 'LACP'.
              type: string
              enum:
              - fast
              - slow
        mode:
          description: Bond mode. 'LACP' if using LACP; otherwise 'default'. ESX doesn't support LACP. The default bond mode
            for the given hypervisor type is configured when it's set to 'default'.
          type: string
          enum:
          - default
          - lacp
        uplinks_mac:
          description: MAC addresses of NICs in a bond.
          type: array
          items:
            description: MAC address of the NIC in a bond.
            type: string
    imaged_clusters_response:
      description: Response returned if the server accepted the cluster creation request.
      type: object
      properties:
        imaged_cluster_uuid:
          description: Unique ID of the cluster.
          type: string
          format: uuid
    cluster_metadata:
      description: Cluster metadata to be updated on Foundation Central.
      type: object
      required:
      - cluster_uuid
      properties:
        cluster_uuid:
          description: UUID of the cluster which is generated by genesis during cluster creation.
          type: string
          format: uuid
    server_configuration_per_node:
      description: Server configuration details per node.
      type: object
      properties:
        intersight_data:
          $ref: '#/components/schemas/intersight_node_data'
        skip_firmware_upgrade:
          description: True to skip firmware upgrade; otherwise, false.
          type: boolean
    cluster_progress_status:
      description: Denotes the progress status of the cluster creation.
      type: object
      properties:
        category:
          description: List of error categories.
          type: array
          items:
            description: Error category.
            type: string
        cluster_name:
          description: Cluster name.
          type: string
        message_list:
          description: List of messages for the client based on the progress state.
          type: array
          items:
            type: string
        percent_complete:
          description: Percentage of completion of the cluster creation process.
          type: number
          format: float
        status:
          description: Current status of the cluster creation process.
          type: string
    imaged_cluster_put_input:
      description: Input parameters for updating the cluster details.
      type: object
      properties:
        archived:
          description: Denotes the archive status of the cluster creation request. If true, the cluster will be archived.
            If false, the cluster will be removed from the archive.
          type: boolean
          nullable: true
    cluster_creation_status:
      description: Details of cluster creation process.
      type: object
      required:
      - current_foundation_ip
      - foundation_session_id
      - intent_picked_up
      - deployment_started
      - cluster_creation_started
      - imaging_stopped
      - aggregate_percent_complete
      - cluster_progress_details
      - node_progress_details
      properties:
        aggregate_percent_complete:
          description: Overall progress percentage including imaging and cluster creation.
          type: number
          format: float
        cluster_creation_started:
          description: Denotes whether the cluster creation has started in the phoenix workflow. For Foundation workflows,
            this field is the same as intent_picked_up.
          type: boolean
        cluster_progress_details:
          $ref: '#/components/schemas/cluster_progress_status'
        current_foundation_ip:
          description: Current IP address of the coordinating foundation node.
          type: string
          format: ipv4
        deployment_started:
          description: Denotes whether the deployment has started. For regular nodes, it is the same as intent_picked_up.
          type: boolean
        foundation_session_id:
          description: Foundation session ID for the cluster creation.
          type: string
        imaging_stopped:
          description: Describes whether Foundation imaging and cluster creation has stopped. True indicates that the process
            has stopped and false indicates that the process is still in-progress.
          type: boolean
        intent_picked_up:
          description: Denotes whether the remote node has picked up the cluster creation intent.
          type: boolean
        node_progress_details:
          description: List of details about the progress of each node.
          type: array
          items:
            $ref: '#/components/schemas/node_progress_status_output'
        warning_list:
          description: List of warnings for the client.
          type: array
          items:
            type: string
    imaged_clusters_input:
      description: Input parameters for imaging nodes and creating a cluster.
      type: object
      properties:
        aos_metadata_url:
          description: URL to download the AOS metadata JSON. Required only if imaging is needed.
          type: string
        aos_package_sha256sum:
          description: SHA256sum of the AOS package.
          type: string
        aos_package_url:
          description: URL to download the AOS package. Required only if imaging is needed.
          type: string
        cluster_external_ip:
          description: External management IP of the cluster.
          type: string
          format: ipv4
        cluster_name:
          description: Name of the cluster.
          type: string
        cluster_size:
          description: Number of nodes in the cluster.
          type: integer
        common_network_settings:
          $ref: '#/components/schemas/common_network_settings'
        fc_metadata:
          $ref: '#/components/schemas/fc_metadata'
        hypervisor_iso_details:
          $ref: '#/components/schemas/hypervisor_iso_details'
        hypervisor_isos:
          description: List of hypervisor ISOs.
          type: array
          items:
            $ref: '#/components/schemas/hypervisor_iso_details'
        nodes_list:
          description: List of details of the nodes for which the cluster needs to be created.
          type: array
          items:
            $ref: '#/components/schemas/node_details'
        redundancy_factor:
          description: Redundancy factor of the cluster.
          type: integer
        server_configuration_data:
          $ref: '#/components/schemas/server_configuration_data'
        skip_cluster_creation:
          description: True, if the cluster creation must be skipped. Otherwise, false. In case of node preparation for cluster
            expansion, this flag must be used together with target_cluster.
          type: boolean
        storage_node_count:
          description: Number of storage-only nodes in the cluster. The AHV ISO for the storage node will be taken from the
            AOS package.
          type: integer
        target_cluster:
          $ref: '#/components/schemas/target_cluster_details'
        timezone:
          description: Timezone to be set on the cluster.
          type: string
    intersight_node_data:
      description: Node deployment data which is specific to Intersight.
      type: object
      properties:
        imc_settings:
          $ref: '#/components/schemas/intersight_imc_settings'
        management_mode:
          $ref: '#/components/schemas/management_mode_intersight'
        uuid_pool_name:
          description: Name of the UUID pool which is a collection of UUID items that can be allocated to server profiles.
            This is only required for IMM servers.
          type: string
        vic_fec_mode:
          description: FEC Mode for VIC Adapter. This is only required for ISM servers.
          type: string
          enum:
          - cl91
          - cl74
          - 'Off'
        vnic_settings:
          description: vNIC settings for IMM servers.
          type: object
          required:
          - mac_pool_name
          properties:
            mac_pool_name:
              description: Name of the MAC pool, which is a collection of MAC addresses that can be allocated to VNICs of
                a server profile.
              type: string
              minLength: 1
            vlans:
              description: Allowed VLAN IDs of the virtual interface. A list of comma separated VLAN IDs and/or VLAN ID ranges.
              type: string
    common_network_settings:
      description: Common network settings across the nodes in the cluster.
      type: object
      properties:
        cvm_dns_servers:
          description: List of DNS servers for the CVMs in the cluster.
          type: array
          items:
            type: string
            format: ipv4
        cvm_ntp_servers:
          description: List of NTP servers for the CVMs in the cluster.
          type: array
          items:
            type: string
        hypervisor_dns_servers:
          description: List of DNS servers for the hypervisors in the cluster.
          type: array
          items:
            type: string
            format: ipv4
        hypervisor_ntp_servers:
          description: List of NTP servers for the hypervisors in the cluster.
          type: array
          items:
            type: string
    node_details:
      description: Settings for a node in the cluster.
      type: object
      properties:
        cvm_gateway:
          description: Gateway of the CVM.
          type: string
          format: ipv4
        cvm_ip:
          description: IP address to be set for the CVM on the node.
          type: string
          format: ipv4
        cvm_netmask:
          description: Netmask of the CVM.
          type: string
        cvm_ram_gb:
          description: Amount of memory to be assigned for the CVM.
          type: integer
        cvm_vlan_id:
          description: VLAN tag of the CVM, if the CVM is on a VLAN.
          type: integer
          nullable: true
        hardware_attributes_override:
          description: Hardware attributes override JSON for the node.
          type: object
          additionalProperties: true
        hypervisor_gateway:
          description: Gateway of the hypervisor.
          type: string
          format: ipv4
        hypervisor_hostname:
          description: Name to be set for the hypervisor host.
          type: string
        hypervisor_ip:
          description: IP address to be set for the hypervisor on the node.
          type: string
          format: ipv4
        hypervisor_netmask:
          description: Netmask of the hypervisor.
          type: string
        hypervisor_type:
          description: 'The type of hypervisor currently installed on the node, which should be one of the following: kvm,
            esx, hyperv.'
          type: string
        image_now:
          description: True, if the node should be imaged; otherwise, false.
          type: boolean
        imaged_node_uuid:
          description: UUID of the node.
          type: string
          format: uuid
        ipmi_gateway:
          description: Gateway of the IPMI.
          type: string
          format: ipv4
        ipmi_ip:
          description: IP address to be set for the IPMI of the node.
          type: string
          format: ipv4
        ipmi_netmask:
          description: Netmask of the IPMI.
          type: string
        network_bond_settings:
          $ref: '#/components/schemas/network_bond_settings'
        rdma_passthrough:
          description: Passthrough RDMA NIC to CVM if possible, default to false.
          type: boolean
        reuse_existing_software:
          description: True to reuse existing AOS and Hypervisor installed on nodes; otherwise, false. This should be used
            only for the nodes managed by the hardware manager when image_now is true, otherwise it will be ignored.
          type: boolean
        server_configuration_data:
          $ref: '#/components/schemas/server_configuration_per_node'
        use_existing_network_settings:
          description: Decide whether to use the existing network settings for the node. If true, the existing network settings
            of the node will be used during cluster creation. If false, the client must provide new network settings. If all
            the nodes are booted in phoenix, then by default, this field is false.
          type: boolean
    hardware_manager_type:
      description: Type of the hardware manager.
      type: string
      enum:
      - INTERSIGHT
      - NOT_APPLICABLE
    fc_metadata:
      description: Foundation Central metadata required for the deployment.
      type: object
      required:
      - api_key_uuid
      properties:
        api_key_uuid:
          description: UUID of the Foundation Central API key that will be pushed to the nodes for the deployment. This is
            only required for the nodes managed by a hardware manager.
          type: string
          minLength: 1
    node_details_output:
      description: Details of the node in the deployment.
      type: object
      properties:
        node_uuid:
          description: UUID of the node.
          type: string
          format: uuid
        server_configuration_data:
          $ref: '#/components/schemas/server_configuration_per_node'
    node_progress_status_output:
      description: Denotes the progress status of node imaging.
      type: object
      required:
      - imaged_node_uuid
      - status
      - percent_complete
      - imaging_stopped
      - intent_picked_up
      properties:
        category:
          description: List of error categories.
          type: array
          items:
            description: Error category.
            type: string
        imaged_node_uuid:
          description: UUID of the node.
          type: string
          format: uuid
        imaging_stopped:
          description: Describes whether imaging has stopped. True indicates that the process has stopped. False indicates
            that the process is still in-progress. This field will only be used by phoenix nodes to update Foundation Central.
          type: boolean
        intent_picked_up:
          description: Denotes whether the remote nodes have picked up the cluster creation intent.
          type: boolean
        message_list:
          description: List of messages for the client based on the process state.
          type: array
          items:
            type: string
        node_imaging_percent_complete:
          description: Percentage of completion of the node imaging process.
          type: number
          format: float
          nullable: true
        node_preparation_percent_complete:
          description: Percentage of completion of the node preparation process.
          type: number
          format: float
          nullable: true
        percent_complete:
          description: Overall progress percentage of the node imaging process including node preparation.
          type: number
          format: float
        status:
          description: Current status of the node imaging process.
          type: string
        warning_list:
          description: List of warnings for the client.
          type: array
          items:
            type: string
