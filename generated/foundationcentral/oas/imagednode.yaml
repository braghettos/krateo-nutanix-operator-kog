openapi: 3.0.0
info:
  title: Foundation Central Service
  description: '# Introduction


    **Foundation Central** creates clusters from factory-imaged nodes and reimages existing nodes that are already registered
    with Foundation Central, remotely from Prism Central. This provides benefits such as creating clusters on remote sites
    (for example, ROBO), without arranging for a deployment personnel visit.


    **[Contact Us by Email](mailto:foundation@nutanix.com)**


    **License: Copyright Nutanix Inc. All rights reserved**

    '
  contact:
    name: Foundation Central Developers
    email: foundation@nutanix.com
  license:
    name: Copyright Nutanix Inc. All rights reserved
  version: '1.0'
servers:
- url: /api/fc/v1
security:
- BasicAuth: []
- CookieAuth: []
paths:
  /imaged_nodes/{imaged_node_uuid}:
    get:
      security:
      - BasicAuth: []
      - APIKeyAuth: []
      - CookieAuth: []
      description: Fetches the details of a single node based on its UUID.
      tags:
      - imaged_nodes
      summary: Get details of a single node
      operationId: GetImagedNode
      parameters:
      - description: UUID of the node whose details need to be fetched.
        name: imaged_node_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Details of the node with the UUID specified in the URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/imaged_node_details'
      x-codeSamples:
      - lang: cURL
        source: "curl --request GET \\\n    --url https://www.nutanix.dev/api/fc/v1/imaged_nodes/{imaged_node_uuid} \\\n \
          \   --header 'Accept: application/json' \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n     "
      - lang: Wget
        source: "wget --quiet \\\n    --method GET \\\n    --header 'Accept: application/json' \\\n    --header 'Authorization:\
          \ Basic <basic_auth_token>' \\\n      \\\n    --output-document \\\n    - https://www.nutanix.dev/api/fc/v1/imaged_nodes/{imaged_node_uuid}"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Authorization\": \"Basic <basic_auth_token>\"\n}\n \nconn.request(\"GET\",\"/api/fc/v1/imaged_nodes/{imaged_node_uuid}\"\
          , headers=headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://www.nutanix.dev/api/fc/v1/imaged_nodes/{imaged_node_uuid}\"\n\t \n\treq, err := http.NewRequest(\"\
          GET\", url, nil)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n    \
          \    req.Header.Add(\"Accept\", \"application/json\")\n        req.Header.Add(\"Authorization\", \"Basic <basic_auth_token>\"\
          )\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\"\
          , err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\t\
          fmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\
          \n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"GET\", \"https://www.nutanix.dev/api/fc/v1/imaged_nodes/{imaged_node_uuid}\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\"\
          )\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://www.nutanix.dev/api/fc/v1/imaged_nodes/{imaged_node_uuid}';\nconst options = {\n  method:\
          \ 'GET',\n  headers: {'Accept': 'application/json', 'Authorization': 'Basic <basic_auth_token>'} \n};\n\ntry {\n\
          \  const response = await fetch(url, options);\n  const data = await response.json();\n  console.log(data);\n} catch\
          \ (error) {\n  console.error(error);\n}"
    delete:
      security:
      - BasicAuth: []
      - CookieAuth: []
      description: Deletes a node entry from Foundation Central.
      tags:
      - imaged_nodes
      summary: Delete a node
      operationId: DeleteImagedNode
      parameters:
      - description: UUID of the node which needs to be deleted.
        name: imaged_node_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Deleted node entry from Foundation Central.
      x-codeSamples:
      - lang: cURL
        source: "curl --request DELETE \\\n    --url https://www.nutanix.dev/api/fc/v1/imaged_nodes/{imaged_node_uuid} \\\n\
          \    --header 'Authorization: Basic <basic_auth_token>' \\\n     "
      - lang: Wget
        source: "wget --quiet \\\n    --method DELETE \\\n    --header 'Authorization: Basic <basic_auth_token>' \\\n    \
          \  \\\n    --output-document \\\n    - https://www.nutanix.dev/api/fc/v1/imaged_nodes/{imaged_node_uuid}"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {\n    \"Authorization\"\
          : \"Basic <basic_auth_token>\"\n}\n \nconn.request(\"DELETE\",\"/api/fc/v1/imaged_nodes/{imaged_node_uuid}\", headers=headers)\n\
          \nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://www.nutanix.dev/api/fc/v1/imaged_nodes/{imaged_node_uuid}\"\n\t \n\treq, err := http.NewRequest(\"\
          DELETE\", url, nil)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n \
          \       req.Header.Add(\"Authorization\", \"Basic <basic_auth_token>\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\
          \tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\t\
          return\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"DELETE\", \"https://www.nutanix.dev/api/fc/v1/imaged_nodes/{imaged_node_uuid}\"\
          )\n  .setHeader(\"Authorization\", \"Basic <basic_auth_token>\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://www.nutanix.dev/api/fc/v1/imaged_nodes/{imaged_node_uuid}';\nconst options = {\n  method:\
          \ 'DELETE',\n  headers: {'Authorization': 'Basic <basic_auth_token>'} \n};\n\ntry {\n  const response = await fetch(url,\
          \ options);\n  const data = await response.json();\n  console.log(data);\n} catch (error) {\n  console.error(error);\n\
          }"
components:
  securitySchemes:
    APIKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
    APIKeyKubAuth:
      type: apiKey
      name: X-API-Key-Kub
      in: header
    BasicAuth:
      type: http
      scheme: basic
    CookieAuth:
      type: apiKey
      name: Cookie
      in: header
    OpenIDAuth:
      type: apiKey
      name: code
      in: query
  schemas:
    imaged_node_details:
      description: Details of an imaged node discovered in Foundation Central.
      type: object
      required:
      - imaged_node_uuid
      - node_type
      - object_version
      - node_serial
      - block_serial
      - cvm_uuid
      - imaged_cluster_uuid
      - cvm_ipv6
      - ipv6_interface
      - cvm_ip
      - cvm_netmask
      - cvm_gateway
      - hypervisor_ip
      - hypervisor_netmask
      - hypervisor_gateway
      - ipmi_ip
      - ipmi_netmask
      - ipmi_gateway
      - hypervisor_hostname
      - hardware_attributes
      - node_position
      - model
      - foundation_version
      - aos_version
      - hypervisor_type
      - hypervisor_version
      - cvm_up
      - available
      - created_timestamp
      - cvm_vlan_id
      - latest_hb_ts_list
      - node_state
      - current_time
      - supported_features
      - last_deployment_state
      - last_deployment_uuid
      - user_name
      properties:
        aos_version:
          description: AOS version currently installed on the node.
          type: string
        api_key_uuid:
          description: API key used to register the node.
          type: string
          format: uuid
        available:
          description: Specifies whether the node is available for deployment.
          type: boolean
        block_serial:
          description: Serial number of the block to which the node belongs.
          type: string
        cpu_core_count:
          description: Number of CPU cores in the node.
          type: integer
        created_timestamp:
          description: Time when the node was discovered in Foundation Central.
          type: string
          format: date-time
        current_time:
          description: Current time of Foundation Central.
          type: string
          format: date-time
        cvm_gateway:
          description: Current gateway of the CVM.
          type: string
          format: ipv4
        cvm_ip:
          description: Current IP address of the CVM.
          type: string
          format: ipv4
        cvm_ipv6:
          description: Current IPv6 address of the CVM.
          type: string
          format: ipv6
        cvm_netmask:
          description: Current netmask of the CVM.
          type: string
        cvm_up:
          description: Denotes whether the CVM is running on this node or not.
          type: boolean
        cvm_uuid:
          description: Node UUID from the node's CVM.
          type: string
          format: uuid
        cvm_vlan_id:
          description: VLAN tag of the CVM, if the CVM is on a VLAN.
          type: integer
        foundation_version:
          description: Foundation version installed on the node.
          type: string
        hardware_attributes:
          description: Hardware attributes JSON of the node.
          type: object
          additionalProperties: true
        hardware_manager_data:
          $ref: '#/components/schemas/hardware_manager_node_output'
        hardware_manager_type:
          $ref: '#/components/schemas/hardware_manager_type'
        hardware_manager_uuid:
          description: UUID of the hardware manager if the node is managed by a hardware manager.
          type: string
          format: uuid
        hypervisor_gateway:
          description: Current gateway of the hypervisor.
          type: string
          format: ipv4
        hypervisor_hostname:
          description: Name of the hypervisor host.
          type: string
        hypervisor_ip:
          description: Current IP address of the hypervisor.
          type: string
          format: ipv4
        hypervisor_netmask:
          description: Current netmask of the hypervisor.
          type: string
        hypervisor_type:
          description: 'The type of hypervisor currently installed on the node, which should be one of the following: kvm,
            esx, hyperv.'
          type: string
        hypervisor_version:
          description: Version of the hypervisor currently installed on the node.
          type: string
        imaged_cluster_uuid:
          description: UUID of the cluster to which the node belongs, if any.
          type: string
          format: uuid
        imaged_node_uuid:
          description: UUID of the node.
          type: string
          format: uuid
        ipmi_gateway:
          description: Current gateway of the IPMI.
          type: string
          format: ipv4
        ipmi_ip:
          description: Current IP address of the IPMI.
          type: string
          format: ipv4
        ipmi_netmask:
          description: Current netmask of the IPMI.
          type: string
        ipv6_interface:
          description: Name of the CVM interface containing the IPv6 address.
          type: string
        last_deployment_state:
          description: State of the latest deployment that the node is/was part of.
          type: string
          enum:
          - STATE_IMAGING
          - STATE_IMAGED
          - STATE_CLUSTERING
          - STATE_CLUSTERED
          - STATE_FAILED
          - STATE_PREPARING
          - STATE_PREPARED
        last_deployment_uuid:
          description: UUID of the latest deployment that the node is/was part of.
          type: string
          format: uuid
        latest_hb_ts_list:
          description: List of timestamps when the node has sent heartbeats to Foundation Central
          type: array
          items:
            type: string
            format: date-time
        memory_gb:
          description: Memory of the node in GB.
          type: number
          format: float
        model:
          description: Model of the node.
          type: string
        node_position:
          description: 'Position of the node in the block which should be one of the following: A, B, up to H.'
          type: string
        node_serial:
          description: Serial number of the node.
          type: string
        node_state:
          $ref: '#/components/schemas/node_state'
        node_type:
          description: Specifies the type of node, that is, on-prem, AWS, GCP, and so on.
          type: string
        object_version:
          description: Version of the node used for CAS.
          type: integer
          minimum: 0
        supported_features:
          description: List of features supported by the remote node
          type: array
          items:
            type: string
        target_cluster:
          $ref: '#/components/schemas/target_cluster_details'
        user_name:
          description: Name of the user who onboarded the node.
          type: string
    intersight_tags:
      description: List of tags of the UCS server.
      type: array
      items:
        description: UCS server tags.
        type: object
        properties:
          key:
            description: Key of the tag.
            type: string
          value:
            description: Value of the tag.
            type: string
    management_mode_intersight:
      description: Management mode of the node in Intersight.
      type: string
      enum:
      - ISM
      - IMM
    error_response:
      type: object
      properties:
        code:
          description: HTTP response code from the API.
          type: integer
          format: int32
        message_list:
          description: Error message in detail.
          type: array
          items:
            type: string
    intersight_orgs:
      description: List of organizations to which the UCS server belongs.
      type: array
      items:
        description: Name of the organization in Intersight.
        type: string
    hardware_manager_type:
      description: Type of the hardware manager.
      type: string
      enum:
      - INTERSIGHT
      - NOT_APPLICABLE
    intersight_node_data_output:
      description: UCS server data fetched from Intersight and cached in Foundation Central. This does not need to be synchronized
        with Intersight.
      type: object
      required:
      - organizations
      - classification
      - server_profile_name
      - connected
      - deleted
      - refreshed_time
      - node_name
      - management_mode
      properties:
        classification:
          description: Classification indicates whether UCS server is installed with Nutanix stack or not.
          type: string
          enum:
          - NUTANIX
          - UNKNOWN
        connected:
          description: Connectivity status of UCS server to the Intersight. It is true if connected; otherwise false.
          type: boolean
        deleted:
          description: True if the UCS server is deleted/unclaimed from Intersight; otherwise false.
          type: boolean
        domain:
          description: Name of the UCS Domain to which the node belongs. For standalone servers, this field is empty.
          type: string
        management_mode:
          $ref: '#/components/schemas/management_mode_intersight'
        node_name:
          description: Name of the node in Intersight.
          type: string
        organizations:
          $ref: '#/components/schemas/intersight_orgs'
        refreshed_time:
          description: Time when the node was refreshed in Foundation Central.
          type: string
          format: date-time
        server_profile_name:
          description: Name of the server profile associated with the server. If no server profile is associated, the value
            will be an empty string.
          type: string
        tags:
          $ref: '#/components/schemas/intersight_tags'
    hardware_manager_node_output:
      description: Node data saved in Foundation Central that was fetched from hardware manager.
      type: object
      properties:
        intersight_data:
          $ref: '#/components/schemas/intersight_node_data_output'
    node_state:
      description: State of the node.
      type: string
      enum:
      - STATE_ONBOARDED
      - STATE_DISCOVERING
      - STATE_AVAILABLE
      - STATE_UNAVAILABLE
      - STATE_IMAGING
      - STATE_CLUSTERING
      - STATE_CLUSTERED
      - STATE_PREPARING
      - STATE_PREPARED
    target_cluster_details:
      description: Details of the PE cluster to which the nodes will be added. This cluster must be registered with the Prism
        Central where Foundation Central is running.
      type: object
      required:
      - cluster_uuid
      properties:
        cluster_name:
          description: Name of the cluster. This is a read-only attribute used by the client.
          type: string
          readOnly: true
        cluster_uuid:
          description: UUID of the cluster.
          type: string
