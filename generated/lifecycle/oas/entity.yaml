components:
  schemas:
    common.v1.0.config.MessageSeverity:
      type: string
      description: 'The message severity.

        '
      enum:
      - INFO
      - WARNING
      - ERROR
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        ERROR: 'Error indicating failed completion.

          '
        INFO: 'Information about successful completion.

          '
        $UNKNOWN: 'Unknown value.

          '
        WARNING: 'Warning indicating future error.

          '
        $REDACTED: 'Redacted value.

          '
    lifecycle.v4.0.resources.DependentEntity:
      title: LCM available version dependency.
      description: Dependency of an LCM entity available version.
      allOf:
      - $ref: '#/components/schemas/lifecycle.v4.0.common.EntityBaseModel'
      - type: object
        properties:
          dependentVersions:
            maxItems: 100
            minItems: 0
            type: array
            description: Information of the dependent entity versions for this available entity.
            readOnly: true
            items:
              $ref: '#/components/schemas/common.v1.0.config.KVPair'
        additionalProperties: false
    common.v1.0.config.Flag:
      type: object
      properties:
        name:
          maxLength: 128
          minLength: 3
          type: string
          description: 'Name of the flag.

            '
        value:
          type: boolean
          description: 'Value of the flag.

            '
      additionalProperties: false
      description: 'Many entities in the Nutanix APIs carry flags.  This object captures all the flags associated with that
        entity through this object.  The field that hosts this type of object must have an attribute called x-bounded-map-keys
        that tells which flags are actually present for that entity.

        '
    lifecycle.v4.0.common.EntityBaseModel:
      title: LCM Entity base model.
      description: The list of properties that can be expanded on the LCM entity.
      allOf:
      - $ref: '#/components/schemas/common.v1.0.response.ExternalizableAbstractModel'
      - type: object
        properties:
          entityClass:
            maxLength: 256
            minLength: 1
            type: string
            description: LCM entity class.
          entityModel:
            maxLength: 256
            minLength: 1
            type: string
            description: LCM entity model.
          entityType:
            $ref: '#/components/schemas/lifecycle.v4.0.common.EntityType'
          entityVersion:
            maxLength: 128
            minLength: 1
            type: string
            description: Current version of an LCM entity.
          hardwareFamily:
            maxLength: 256
            minLength: 1
            type: string
            description: A hardware family for a LCM entity.
        additionalProperties: false
    common.v1.0.response.ApiResponseMetadata:
      type: object
      properties:
        flags:
          maxItems: 20
          minItems: 0
          type: array
          description: 'An array of flags that may indicate the status of the response. For example, a flag with the name
            ''isPaginated'' and value ''false'', indicates that the response is not paginated.

            '
          items:
