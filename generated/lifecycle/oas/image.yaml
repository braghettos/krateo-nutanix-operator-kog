        source: "\npackage sample;\n\nimport com.nutanix.lif.java.client.ApiClient;\nimport com.nutanix.lif.java.client.api.ImagesApi;\n\
          import com.nutanix.dp1.lif.lifecycle.v4.resources.ListImagesApiResponse;\nimport org.springframework.web.client.RestClientException;\n\
          \npublic class JavaSdkSample {\n    public static void main(String[] args) {\n        // Configure the client\n\
          \        ApiClient apiClient = new ApiClient();\n        // IPv4/IPv6 address or FQDN of the cluster\n        apiClient.setHost(\"\
          localhost\");\n        // Port to which to connect to\n        apiClient.setPort(9440);\n        // Interval in\
          \ ms to use during retry attempts\n        apiClient.setRetryInterval(5000);\n        // Max retry attempts while\
          \ reconnecting on a loss of connection\n        apiClient.setMaxRetryAttempts(5);\n        // UserName to connect\
          \ to the cluster\n        String username = \"username\";\n        // Password to connect to the cluster\n     \
          \   String password = \"password\";\n        apiClient.setUsername(username);\n        apiClient.setPassword(password);\n\
          \n        // Please add authorization information here if needed.\n        ImagesApi imagesApi = new ImagesApi(apiClient);\n\
          \n        \n        int page = 0;\n        \n        int limit = 50;\n\n        try {\n            ListImagesApiResponse\
          \ listImagesApiResponse = imagesApi.listImages(page, limit, null, null, null);\n            System.out.println(listImagesApiResponse.toString());\n\
          \n        } catch (RestClientException ex) {\n            System.out.println(ex.getMessage());\n        }\n    }\n\
          }\n"
      - lang: JavaScript
        source: "\nimport { ApiClient, ImagesApi } from \"@nutanix-api/lifecycle-js-client\";\n\n// Configure the client\n\
          let apiClientInstance = new ApiClient();\n// IPv4/IPv6 address or FQDN of the cluster\napiClientInstance.host =\
          \ 'localhost';\n// Port to which to connect to\napiClientInstance.port = '9440';\n// Max retry attempts while reconnecting\
          \ on a loss of connection\napiClientInstance.maxRetryAttempts = 5;\n// Interval in ms to use during retry attempts\n\
          apiClientInstance.retryInterval = 5000;\n// UserName to connect to the cluster\napiClientInstance.username = 'username';\n\
          // Password to connect to the cluster\napiClientInstance.password = 'password';\n// Please add authorization information\
          \ here if needed.\nlet imagesApi = new ImagesApi(apiClientInstance);\n\nfunction sample() {\n\n\n    // Construct\
          \ Optional Parameters\n    var opts = {};\n    opts[\"$page\"] = 0;\n    opts[\"$limit\"] = 50;\n    opts[\"$filter\"\
          ] = \"string_sample_data\";\n    opts[\"$orderby\"] = \"string_sample_data\";\n    opts[\"$select\"] = \"string_sample_data\"\
          ;\n\n\n\n\n    imagesApi.listImages(opts).then(({data, response}) => {\n        console.log(`API returned the following\
          \ status code: ${response.status}`);\n        console.log(data.getData());\n    }).catch((error) => {\n        console.log(`Error\
          \ is: ${error}`);\n    });\n\n}\nsample()\n"
      - lang: Python
        source: "\nimport ntnx_lifecycle_py_client\n\nif __name__ == \"__main__\":\n    # Configure the client\n    config\
          \ = ntnx_lifecycle_py_client.Configuration()\n    # IPv4/IPv6 address or FQDN of the cluster\n    config.host =\
          \ \"localhost\"\n    # Port to which to connect to\n    config.port = 9440\n    # Max retry attempts while reconnecting\
          \ on a loss of connection\n    config.max_retry_attempts = 3\n    # Backoff factor to use during retry attempts\n\
          \    config.backoff_factor = 3\n    # UserName to connect to the cluster\n    config.username = \"username\"\n \
          \   # Password to connect to the cluster\n    config.password = \"password\"\n    # Please add authorization information\
          \ here if needed.\n    client = ntnx_lifecycle_py_client.ApiClient(configuration=config)\n    images_api = ntnx_lifecycle_py_client.ImagesApi(api_client=client)\n\
          \    \n    page = 0\n    \n    limit = 50\n\n\n    try:\n        api_response = images_api.list_images(_page=page,\
          \ _limit=limit)\n        print(api_response)\n    except ntnx_lifecycle_py_client.rest.ApiException as e:\n    \
          \    print(e)\n\n"
      - lang: Go
        source: "\npackage main\n\nimport (\n    \"fmt\"\n    \"time\"\n    \"github.com/nutanix/ntnx-api-golang-clients/lifecycle-go-client/v4/api\"\
          \n    \"github.com/nutanix/ntnx-api-golang-clients/lifecycle-go-client/v4/client\"\n    import1 \"github.com/nutanix/ntnx-api-golang-clients/lifecycle-go-client/v4/models/lifecycle/v4/resources\"\
          \n)\n\nvar (\n    ApiClientInstance *client.ApiClient\n    ImagesApiInstance *api.ImagesApi\n)\n\nfunc main() {\n\
          \    ApiClientInstance = client.NewApiClient()\n    // IPv4/IPv6 address or FQDN of the cluster\n    ApiClientInstance.Host\
          \ = \"localhost\"\n    // Port to which to connect to\n    ApiClientInstance.Port = 9440\n    // Interval in ms\
          \ to use during retry attempts\n    ApiClientInstance.RetryInterval = 5 * time.Second\n    // Max retry attempts\
          \ while reconnecting on a loss of connection\n    ApiClientInstance.MaxRetryAttempts = 5\n    // UserName to connect\
          \ to the cluster\n    ApiClientInstance.Username = \"username\"\n    // Password to connect to the cluster\n   \
          \ ApiClientInstance.Password = \"password\"\n    // Please add authorization information here if needed.\n    ImagesApiInstance\
          \ = api.NewImagesApi(ApiClientInstance)\n\n    \n    page_ := 0\n    \n    limit_ := 50\n\n\n    response, error\
          \ := ImagesApiInstance.ListImages(&page_, &limit_, nil, nil, nil)\n    if error != nil {\n        fmt.Println(error)\n\
          \        return\n    }\n    data, _ := response.GetData().([]import1.Image)\n    fmt.Println(data)\n\n}\n\n"
      - lang: cURL
        source: "\ncurl --request GET \\\n     --url \"https://{pc-ip}:9440/api/lifecycle/v4.0/resources/images?$filter=string_sample_data&$limit=50&$orderby=string_sample_data&$page=0&$select=string_sample_data\"\
