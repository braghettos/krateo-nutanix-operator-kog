          entityModel:
            maxLength: 256
            minLength: 1
            type: string
            description: LCM entity model.
          entityType:
            $ref: '#/components/schemas/lifecycle.v4.0.common.EntityType'
          entityVersion:
            maxLength: 128
            minLength: 1
