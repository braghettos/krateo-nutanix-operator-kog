    lifecycle.v4.0.resources.StatusInfo:
      title: LCM framework status.
      description: Detailed information about the current LCM framework status.
      allOf:
      - $ref: '#/components/schemas/common.v1.0.response.ExternalizableAbstractModel'
      - type: object
        properties:
          frameworkVersion:
