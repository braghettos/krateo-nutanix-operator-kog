openapi: 3.0.0
info:
  title: Karbon
  description: '# Introduction

    **Nutanix Kubernetes Engine** (NKE) is a curated turnkey offering that provides simplified provisioning and operations
    of Kubernetes clusters. Kubernetes is an open source container orchestration system for deploying and managing container-based
    applications.


    NKE uses the CentOS Linux-based operating systems for NKE-enabled Kubernetes cluster creation. Linux containers provide
    the flexibility to deploy applications in different environments with consistent results.


    NKE streamlines the deployment and management of Kubernetes clusters with a simple GUI integrated into Prism Central (PC).
    Kibana, the built-in add-on, lets you filter and parse logs for systems, pods, and nodes. Prometheus, another add-on,
    provides a monitoring mechanism that triggers alerts on your cluster. NKE also uses Pulse, Prism health-monitoring system,
    which interacts with Nutanix Support to expedite cluster issue resolutions.


    For more information about NKE and its offerings, refer to [NKE Documentation](https://portal.nutanix.com/page/documents/details?targetId=Nutanix-Kubernetes-Engine:Nutanix-Kubernetes-Engine).


    # Authentication

    **NKE uses basic authentication**: The user provides user ID and password every time a request is sent as the authentication
    header.

    '
  contact:
    name: NKE Developers
    email: karbon-team@nutanix.com
  license:
    name: Copyright Nutanix Inc. All rights reserved
  version: v1.1.0
servers:
- url: /karbon
security: []
paths:
  /karbon/v1-alpha.1/k8s/clusters/{name}/gpus:
    get:
      description: "List of all the GPU configurations discoverable by the Kubernetes cluster based on what PE clusters or\
        \ hosts it can span (currently restricted to one PE cluster). This only reports PASSTHROUGH_COMPUTE GPUs currently.\n\
        \n **API format**- https://server.nutanix.com:9440/karbon/v1-alpha.1/k8s/clusters/cluster01/gpus."
      tags:
      - NKE_API_Reference_Cluster
      summary: List all the GPU configurations discoverable by the Kubernetes cluster
      operationId: ListK8sClusterGPU
      parameters:
      - description: The Kubernetes cluster name.
        name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the configuration of all GPUs discoverable by the Kubernetes cluster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_k8s_cluster_gpu_list'
        '400':
          description: Invalid Kubernetes cluster name specified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '401':
          description: Invalid client credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '501':
          description: Functionality not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
      x-codeSamples:
      - lang: cURL
        source: "curl --request GET \\\n    --url https://www.nutanix.dev/karbon/v1-alpha.1/k8s/clusters/{name}/gpus \\\n\
          \    --header 'Accept: application/json' \\\n    --header 'Content-Type: application/json' \\\n     "
      - lang: Wget
        source: "wget --quiet \\\n    --method GET \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type:\
          \ application/json' \\\n      \\\n    --output-document \\\n    - https://www.nutanix.dev/karbon/v1-alpha.1/k8s/clusters/{name}/gpus"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Content-Type\": \"application/json\"\n}\n \nconn.request(\"GET\",\"/karbon/v1-alpha.1/k8s/clusters/{name}/gpus\"\
          , headers=headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://www.nutanix.dev/karbon/v1-alpha.1/k8s/clusters/{name}/gpus\"\n\t \n\treq, err := http.NewRequest(\"\
          GET\", url, nil)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n    \
          \    req.Header.Add(\"Accept\", \"application/json\")\n        req.Header.Add(\"Content-Type\", \"application/json\"\
          )\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\"\
          , err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\t\
          fmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\
          \n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"GET\", \"https://www.nutanix.dev/karbon/v1-alpha.1/k8s/clusters/{name}/gpus\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Content-Type\", \"application/json\")\n  .execute()\n\
          \  .toCompletableFuture()\n  .thenAccept(System.out::println)\n  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://www.nutanix.dev/karbon/v1-alpha.1/k8s/clusters/{name}/gpus';\nconst options = {\n  method:\
          \ 'GET',\n  headers: {'Accept': 'application/json', 'Content-Type': 'application/json'} \n};\n\ntry {\n  const response\
          \ = await fetch(url, options);\n  const data = await response.json();\n  console.log(data);\n} catch (error) {\n\
          \  console.error(error);\n}"
components:
  securitySchemes:
    v1.1.0_basicAuth:
      type: http
      scheme: basic
  schemas:
    v1.1.0_k8s_cluster_gpu_list:
      description: List of GPU configurations that are discoverable by the Kubernetes cluster.
      type: array
      items:
        $ref: '#/components/schemas/v1.1.0_k8s_cluster_gpu'
    v1.1.0_k8s_cluster_gpu:
      type: object
      properties:
        assignable_count:
          description: Count of assignable GPUs, includes all PE hosts.
          type: integer
        max_available_across_cluster:
          description: 'Count of maximum available GPUs among all hosts in a PE cluster. E.g. Host 1: 8 GPUs, Host 2: 12 GPUs,
            Host 3: 10 GPUs then, max_available_across_cluster=12.'
          type: integer
        name:
          description: The name of the GPU, such as Quadro RTX 6000/8000, Nvidia A100, Tesla P100.
          type: string
        total_count:
          description: Count of all GPUs, including assigned ones.
          type: integer
    v1.1.0_error_response:
      type: object
      properties:
        message_info:
          description: '{} with the key as the error type and the value as the error message'
          type: object
