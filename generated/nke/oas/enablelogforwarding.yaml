components:
  securitySchemes:
    v1.1.0_basicAuth:
      type: http
      scheme: basic
  schemas:
    v1.1.0_certificates_config:
      description: Certificate Authority (CA), client certificate, and the client key associated with the external endpoint.
      type: object
      properties:
        ca_cert:
          description: Certificate used as the CA in PEM format.
          type: string
        client_cert:
          description: Client certificate signed by CA in PEM format.
          type: string
        client_key:
          description: Client Key in PEM format.
          type: string
        enable_tls:
          description: Enable tls for the associated external endpoint that is served on https.
          type: boolean
        enable_tls_verify:
          description: Enable tls verification for the associated external endpoint to enforce certificate verification.
          type: boolean
    v1.1.0_error_response:
      type: object
      properties:
        message_info:
          description: '{} with the key as the error type and the value as the error message'
          type: object
    v1.1.0_log_forwarding_config:
      type: object
      required:
      - host
      - port
      - endpoint_type
      properties:
        certificates:
          $ref: '#/components/schemas/v1.1.0_certificates_config'
        endpoint_type:
          description: Type of the external endpoint.
          type: string
          enum:
          - elasticsearch
          - syslog
        host:
          description: The IP address or DNS name of the external endpoint.(For example, 10.45.43.12 or es.hosted.com).
          type: string
        http_auth:
          $ref: '#/components/schemas/v1.1.0_http_auth_config'
        port:
          description: Port of the external endpoint.
          type: integer
    v1.1.0_http_auth_config:
      description: HTTP authentication credentials of the external endpoint.
      type: object
      required:
      - username
      - password
      properties:
        password:
          description: External endpoint password.
          type: string
        username:
          description: External endpoint username.
          type: string
