  version: v1.1.0
servers:
- url: /karbon
security: []
paths:
  /karbon/v1-alpha.1/k8s/clusters/{name}/enable-log-forwarding:
    post:
      description: "Forward logs to an external endpoint. \n\n **API format**- https://server.nutanix.com:9440/karbon/v1-alpha.1/k8s/clusters/cluster1/enable-log-forwarding."
      tags:
      - NKE_API_Reference_Log
      summary: Forward Logs to an external endpoint
      operationId: PostEnableLogForwarding
      parameters:
      - description: The Kubernetes cluster name.
        name: name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1.1.0_log_forwarding_config'
      responses:
        '200':
          description: Accepted the configurations and enabling log forwarding.
        '400':
          description: Bad parameters specified in request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '401':
          description: Invalid client credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '404':
          description: The specified Kubernetes cluster is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '501':
          description: Functionality not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://www.nutanix.dev/karbon/v1-alpha.1/k8s/clusters/{name}/enable-log-forwarding\
          \ \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type: application/json' \\\n    --data '{\n\
          \    \"certificates\": {\n        \"ca_cert\": \"string\",\n        \"client_cert\": \"string\",\n        \"client_key\"\
          : \"string\",\n        \"enable_tls\": true,\n        \"enable_tls_verify\": true\n    },\n    \"endpoint_type\"\
          : \"elasticsearch\",\n    \"host\": \"string\",\n    \"http_auth\": {\n        \"password\": \"string\",\n     \
          \   \"username\": \"string\"\n    },\n    \"port\": 0\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type:\
          \ application/json' \\\n    --body-data '{\n    \"certificates\": {\n        \"ca_cert\": \"string\",\n        \"\
          client_cert\": \"string\",\n        \"client_key\": \"string\",\n        \"enable_tls\": true,\n        \"enable_tls_verify\"\
          : true\n    },\n    \"endpoint_type\": \"elasticsearch\",\n    \"host\": \"string\",\n    \"http_auth\": {\n   \
          \     \"password\": \"string\",\n        \"username\": \"string\"\n    },\n    \"port\": 0\n}' \\\n    --output-document\
          \ \\\n    - https://www.nutanix.dev/karbon/v1-alpha.1/k8s/clusters/{name}/enable-log-forwarding"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Content-Type\": \"application/json\"\n}\n\npayload =  \"\"\"{\n    \"certificates\"\
          : {\n        \"ca_cert\": \"string\",\n        \"client_cert\": \"string\",\n        \"client_key\": \"string\"\
          ,\n        \"enable_tls\": true,\n        \"enable_tls_verify\": true\n    },\n    \"endpoint_type\": \"elasticsearch\"\
          ,\n    \"host\": \"string\",\n    \"http_auth\": {\n        \"password\": \"string\",\n        \"username\": \"\
          string\"\n    },\n    \"port\": 0\n}\"\"\"\n\nconn.request(\"POST\",\"/karbon/v1-alpha.1/k8s/clusters/{name}/enable-log-forwarding\"\
          , payload, headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
