      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://www.nutanix.dev/karbon/v1-alpha.1/k8s/clusters/{name}/enable-log-forwarding\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"\
          {\\\"certificates\\\": {\\\"ca_cert\\\": \\\"string\\\", \\\"client_cert\\\": \\\"string\\\", \\\"client_key\\\"\
          : \\\"string\\\", \\\"enable_tls\\\": true, \\\"enable_tls_verify\\\": true}, \\\"endpoint_type\\\": \\\"elasticsearch\\\
