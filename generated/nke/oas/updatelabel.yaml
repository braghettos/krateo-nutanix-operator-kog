components:
  securitySchemes:
    v1.1.0_basicAuth:
      type: http
      scheme: basic
  schemas:
    v1.1.0_update_node_pool_labels_response:
      type: object
      required:
      - task_uuid
      properties:
        task_uuid:
          description: The UUID of the task tracking the label updates of a node pool.
          type: string
    v1.1.0_error_response:
      type: object
      properties:
        message_info:
          description: '{} with the key as the error type and the value as the error message'
          type: object
    v1.1.0_labels_update_config:
      type: object
      properties:
        add_labels:
          description: Map of user-provided labels to add to the node pool.
          type: object
          additionalProperties:
            type: string
            maxLength: 63
            pattern: ^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$
        remove_labels:
          type: array
          items:
            description: Key for the labels to be removed from the node pool.
            type: string
