components:
  securitySchemes:
    v1.1.0_basicAuth:
      type: http
      scheme: basic
  schemas:
    v1.1.0_certificate_rotation_status:
      type: object
      properties:
        error_detail:
          description: Details of the errors encountered in case of failure.
          type: string
        percentage_complete:
          description: Progress of the task in percentage.
          type: integer
          maximum: 100
          minimum: 0
        progress_message:
          description: Description about what the task is currently doing.
          type: string
        status:
          description: The current state of the task.
          type: string
    v1.1.0_error_response:
      type: object
      properties:
        message_info:
          description: '{} with the key as the error type and the value as the error message'
          type: object
