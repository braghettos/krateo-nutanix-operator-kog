paths:
  /karbon/v1-alpha.1/k8s/clusters/{name}/certificate-rotation/status:
    get:
      description: "Get the status of the latest certificate rotation task running on the given Kubernetes cluster.\n\n **API\
        \ format**- https://server.nutanix.com:9440/karbon/v1-alpha.1/k8s/clusters/cluster01/certificate-rotation/status."
      tags:
      - NKE_API_Reference_Cluster
      summary: Get the status of the certificate rotate operation for the Kubernetes cluster
      operationId: RotateClusterCertificatesStatus
      parameters:
      - description: The Kubernetes cluster name.
        name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved certificate rotation status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_certificate_rotation_status'
        '400':
          description: Bad parameters specified in request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '401':
          description: Invalid client credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '501':
          description: Functionality not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
