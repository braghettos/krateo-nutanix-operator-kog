  version: v1.1.0
servers:
- url: /karbon
security: []
paths:
  /karbon/v1-alpha.1/k8s/clusters/{name}/enable-infra-logging:
    post:
      description: "Enable the Elasticsearch and Kibana to monitor the ntnx-system services.\n\n **API format**- https://server.nutanix.com:9440/karbon/v1-alpha.1/k8s/clusters/cluster1/enable-infra-logging."
      tags:
      - NKE_API_Reference_Log
      summary: Enable the Elasticsearch and Kibana from the logging stack
      operationId: PostEnableInfraLogging
      parameters:
      - description: The Kubernetes cluster name.
        name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Accepted the enable request.
        '400':
          description: Bad parameters specified in request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '401':
          description: Invalid client credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '404':
          description: The specified Kubernetes cluster is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '501':
          description: Functionality not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
