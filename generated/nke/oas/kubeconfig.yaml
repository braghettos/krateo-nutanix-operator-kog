openapi: 3.0.0
info:
  title: Karbon
  description: '# Introduction

    **Nutanix Kubernetes Engine** (NKE) is a curated turnkey offering that provides simplified provisioning and operations
    of Kubernetes clusters. Kubernetes is an open source container orchestration system for deploying and managing container-based
    applications.


    NKE uses the CentOS Linux-based operating systems for NKE-enabled Kubernetes cluster creation. Linux containers provide
    the flexibility to deploy applications in different environments with consistent results.


    NKE streamlines the deployment and management of Kubernetes clusters with a simple GUI integrated into Prism Central (PC).
    Kibana, the built-in add-on, lets you filter and parse logs for systems, pods, and nodes. Prometheus, another add-on,
    provides a monitoring mechanism that triggers alerts on your cluster. NKE also uses Pulse, Prism health-monitoring system,
    which interacts with Nutanix Support to expedite cluster issue resolutions.


    For more information about NKE and its offerings, refer to [NKE Documentation](https://portal.nutanix.com/page/documents/details?targetId=Nutanix-Kubernetes-Engine:Nutanix-Kubernetes-Engine).


    # Authentication

    **NKE uses basic authentication**: The user provides user ID and password every time a request is sent as the authentication
    header.

    '
  contact:
    name: NKE Developers
    email: karbon-team@nutanix.com
  license:
    name: Copyright Nutanix Inc. All rights reserved
  version: v1.1.0
servers:
- url: /karbon
security: []
paths:
  /karbon/v1-alpha.1/k8s/cluster-registrations/{id}/kubeconfig:
    get:
      description: Retrieve kubeconfig for the registered Kubernetes cluster.
      tags:
      - NKE_API_Reference_Cluster
      summary: Get kubeconfig for a registered Kubernetes cluster
      operationId: GetK8sClusterRegistrationKubeconfig
      parameters:
      - description: Kubernetes cluster registration UUID.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved kubeconfig.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_k8s_cluster_kubeconfig_response'
        '400':
          description: Invalid Kubernetes cluster registration ID specified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '401':
          description: Invalid client credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '404':
          description: Kubernetes cluster registration or its kubeconfig not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
      x-codeSamples:
      - lang: cURL
        source: "curl --request GET \\\n    --url https://www.nutanix.dev/karbon/v1-alpha.1/k8s/cluster-registrations/{id}/kubeconfig\
          \ \\\n    --header 'Accept: application/json' \\\n     "
      - lang: Wget
        source: "wget --quiet \\\n    --method GET \\\n    --header 'Accept: application/json' \\\n      \\\n    --output-document\
          \ \\\n    - https://www.nutanix.dev/karbon/v1-alpha.1/k8s/cluster-registrations/{id}/kubeconfig"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\"\n}\n \nconn.request(\"GET\",\"/karbon/v1-alpha.1/k8s/cluster-registrations/{id}/kubeconfig\"\
          , headers=headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://www.nutanix.dev/karbon/v1-alpha.1/k8s/cluster-registrations/{id}/kubeconfig\"\n\t \n\treq, err :=\
          \ http.NewRequest(\"GET\", url, nil)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\t\
          return\n\t}\n\n        req.Header.Add(\"Accept\", \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\
          \tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\t\
          return\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"GET\", \"https://www.nutanix.dev/karbon/v1-alpha.1/k8s/cluster-registrations/{id}/kubeconfig\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://www.nutanix.dev/karbon/v1-alpha.1/k8s/cluster-registrations/{id}/kubeconfig';\nconst\
          \ options = {\n  method: 'GET',\n  headers: {'Accept': 'application/json'} \n};\n\ntry {\n  const response = await\
          \ fetch(url, options);\n  const data = await response.json();\n  console.log(data);\n} catch (error) {\n  console.error(error);\n\
          }"
    delete:
      description: Delete kubeconfig of a registered Kubernetes cluster.
      tags:
      - NKE_API_Reference_Cluster
      summary: Delete kubeconfig of a registered Kubernetes cluster.
      operationId: DeleteK8sClusterRegistrationKubeconfig
      parameters:
      - description: Kubernetes cluster registration UUID.
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: Forcefully delete the kubeconfig of a Kubernetes cluster without performing any pre-checks, such as verifying
          that Flow network policies are applied to the cluster.
        name: force
        in: query
        schema:
          type: boolean
      responses:
        '202':
          description: Delete kubeconfig operation is accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_k8s_cluster_kubeconfig_delete_response'
        '401':
          description: Invalid client credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '404':
          description: Kubernetes cluster registration is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '409':
          description: Task to delete the kubeconfig is already in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '412':
          description: The operation failed due to the current state of the Kubernetes cluster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
      x-codeSamples:
      - lang: cURL
        source: "curl --request DELETE \\\n    --url https://www.nutanix.dev/karbon/v1-alpha.1/k8s/cluster-registrations/{id}/kubeconfig\
