components:
  securitySchemes:
    v1.1.0_basicAuth:
      type: http
      scheme: basic
  schemas:
    v1.1.0_k8s_update_cluster_registration_metrics_request:
      type: object
      required:
      - cluster_metrics
      properties:
        cluster_metrics:
          $ref: '#/components/schemas/v1.1.0_k8s_cluster_metrics'
    v1.1.0_k8s_cluster_resource:
      type: object
      properties:
        ChildResource:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/v1.1.0_k8s_cluster_resource_list'
        Metadata:
          type: object
          additionalProperties:
            type: string
        Name:
          type: string
        UUID:
          type: string
    v1.1.0_k8s_update_cluster_registration_metrics_response:
      type: object
      properties:
        cluster_name:
          type: string
        cluster_uuid:
          type: string
    v1.1.0_error_response:
      type: object
      properties:
        message_info:
          description: '{} with the key as the error type and the value as the error message'
          type: object
    v1.1.0_k8s_cluster_metrics:
      description: Metrics information for this k8s cluster.
      type: object
      additionalProperties:
        $ref: '#/components/schemas/v1.1.0_k8s_cluster_resource_list'
    v1.1.0_k8s_cluster_resource_list:
      type: array
      items:
        $ref: '#/components/schemas/v1.1.0_k8s_cluster_resource'
