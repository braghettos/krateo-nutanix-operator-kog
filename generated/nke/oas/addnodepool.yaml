          ,\n        \"network_uuid\": \"string\",\n        \"prism_element_cluster_uuid\": \"string\"\n    },\n    \"gpu_config_list\"\
          : [\n        {\n            \"count\": 1,\n            \"name\": \"string\"\n        }\n    ],\n    \"labels\":\
          \ {\n        \"property1\": \"string\",\n        \"property2\": \"string\"\n    },\n    \"name\": \"etcd-node-pool\"\
          ,\n    \"node_os_version\": \"string\",\n    \"num_instances\": 0\n}'"
