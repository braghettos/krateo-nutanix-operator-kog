        source: "curl --request GET \\\n    --url https://www.nutanix.dev/karbon/v1-beta.1/k8s/clusters/{name}/node-pools/{node-pool-name}\
          \ \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type: application/json' \\\n     "
