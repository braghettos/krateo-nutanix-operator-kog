components:
  securitySchemes:
    v1.1.0_basicAuth:
      type: http
      scheme: basic
  schemas:
    v1.1.0_log_forward_endpoint:
      description: External endpoint details if the log forwarding is enabled.
      type: object
      properties:
        host:
          description: External endpoint host details if the log forwarding is configured.
          type: string
        port:
          description: External endpoint port details if the log forwarding is configured.
          type: integer
    v1.1.0_error_response:
      type: object
      properties:
        message_info:
          description: '{} with the key as the error type and the value as the error message'
          type: object
