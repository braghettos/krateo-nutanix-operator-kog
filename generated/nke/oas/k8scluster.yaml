      summary: Create a new Kubernetes cluster
      operationId: CreateK8sCluster
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1.1.0_k8s_cluster_config'
        required: true
      responses:
        '202':
          description: Kubernetes cluster creation is accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_k8s_cluster_create_response'
        '400':
          description: Bad parameters specified in request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '401':
          description: Invalid client credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '404':
          description: Invalid reference supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '409':
          description: The Kubernetes cluster name is not unique.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '412':
          description: Kubernetes cluster pre-deployment checks failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
