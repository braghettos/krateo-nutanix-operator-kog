              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '401':
          description: Invalid client credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
        '404':
          description: Kubernetes cluster is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1.1.0_error_response'
