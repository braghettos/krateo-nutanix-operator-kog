components:
  requestBodies:
    v1.1.0_k8s_cluster_addons_config:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/v1.1.0_k8s_cluster_addons_config'
      required: true
  securitySchemes:
    v1.1.0_basicAuth:
      type: http
      scheme: basic
  schemas:
    v1.1.0_k8s_cluster_addons_config:
      description: Kubernetes cluster addons config.
      type: object
      properties:
        metadata:
          type: object
        spec:
          description: Spec defines the desired state of the cluster addon.
          type: object
          required:
          - chartName
          - repoURL
          properties:
            chartName:
              description: 'ChartName is the name of the Helm chart in the repository. e.g. chart-path oci://repo-url/chart-name
                as chartName: chart-name and https://repo-url/chart-name as chartName: chart-name'
              type: string
            clusterSelector:
              description: ClusterSelector selects Clusters in the same namespace with a label that matches the specified
                label selector. The Helm chart will be installed on all selected Clusters. If a Cluster is no longer selected,
                the Helm release will be uninstalled.
              type: object
              properties:
                matchExpressions:
                  description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                  type: array
                  items:
                    description: A label selector requirement is a selector that contains values, a key, and an operator that
                      relates the key and values.
                    type: object
                    required:
                    - key
                    - operator
                    properties:
                      key:
                        description: key is the label key that the selector applies to.
                        type: string
                      operator:
                        description: operator represents a key's relationship to a set of values. Valid operators are In,
                          NotIn, Exists and DoesNotExist.
                        type: string
                      values:
                        description: values is an array of string values. If the operator is In or NotIn, the values array
                          must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This
                          array is replaced during a strategic merge patch.
                        type: array
                        items:
                          type: string
                matchLabels:
                  description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent
                    to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array
                    contains only "value". The requirements are ANDed.
                  type: object
                  additionalProperties:
                    type: string
              x-kubernetes-map-type: atomic
            namespace:
              description: ReleaseNamespace is the namespace the Helm release will be installed on each selected Cluster.
                If it is not specified, it will be set to the default namespace.
              type: string
            options:
              description: Options represents CLI flags passed to Helm operations (i.e. install, upgrade, delete) and include
                options such as wait, skipCRDs, timeout, waitForJobs, etc.
              type: object
              properties:
                atomic:
                  description: Atomic indicates the installation/upgrade process to delete the installation or rollback on
                    failure. If 'Atomic' is set, wait will be enabled automatically during helm install/upgrade operation.
                  type: boolean
                dependencyUpdate:
                  description: DependencyUpdate indicates the Helm install/upgrade action to get missing dependencies.
                  type: boolean
                disableHooks:
                  description: DisableHooks prevents hooks from running during the Helm install action.
                  type: boolean
                disableOpenAPIValidation:
                  description: DisableOpenAPIValidation controls whether OpenAPI validation is enforced.
                  type: boolean
                install:
                  description: Install represents CLI flags passed to Helm install operation which can be used to control
                    behaviour of helm Install operations via options like wait, skipCrds, timeout, waitForJobs, etc.
                  type: object
                  properties:
                    createNamespace:
                      description: CreateNamespace indicates the Helm install/upgrade action to create the HelmChartProxySpec.ReleaseNamespace
                        if it does not exist yet. On uninstall, the namespace will not be garbage collected. If it is not
                        specified by user, will be set to default 'true'.
                      type: boolean
                    includeCRDs:
                      description: IncludeCRDs determines whether CRDs stored as a part of helm templates directory should
                        be installed.
                      type: boolean
                options:
                  description: SubNotes determines whether sub-notes should be rendered in the chart.
                  type: boolean
                skipCRDs:
                  description: SkipCRDs controls whether CRDs should be installed during install/upgrade operation. By default,
                    CRDs are installed if not already present. If set, no CRDs will be installed.
                  type: boolean
                timeout:
                  description: Timeout is the time to wait for any individual Kubernetes operation (like resource creation,
                    Jobs for hooks, etc.) during the performance of a Helm install action. Defaults to '10 min'.
                  type: string
                uninstall:
                  description: Uninstall represents CLI flags passed to Helm uninstall operation which can be used to control
                    behaviour of helm Uninstall operation via options like wait, timeout, etc.
                  type: object
                  properties:
                    description:
                      description: Description represents human readable information to be shown on release uninstall.
                      type: string
                    keepHistory:
                      description: KeepHistory defines whether historical revisions of a release should be saved. If it's
                        set, helm uninstall operation will not delete the history of the release. The helm storage backend
                        (secret, configmap, etc) will be retained in the cluster.
                      type: boolean
                upgrade:
                  description: Upgrade represents CLI flags passed to Helm upgrade operation which can be used to control
                    behaviour of helm Upgrade operations via options like wait, skipCrds, timeout, waitForJobs, etc.
                  type: object
                  properties:
                    cleanupOnFail:
                      description: CleanupOnFail indicates the upgrade action to delete newly-created resources on a failed
                        update operation.
                      type: boolean
                    force:
                      description: Force indicates to ignore certain warnings and perform the helm release upgrade anyway.
                        This should be used with caution.
                      type: boolean
                    maxHistory:
                      description: MaxHistory limits the maximum number of revisions saved per release
                      type: integer
                    recreate:
                      description: Recreate will (if true) recreate pods after a rollback.
                      type: boolean
                    resetValues:
                      description: ResetValues will reset the values to the chart's built-ins rather than merging with existing.
                      type: boolean
                    reuseValues:
                      description: ReuseValues will re-use the user's last supplied values.
                      type: boolean
                wait:
                  description: Wait enables the waiting for resources to be ready after a Helm install/upgrade has been performed.
                  type: boolean
                waitForJobs:
                  description: WaitForJobs enables waiting for jobs to complete after a Helm install/upgrade has been performed.
                  type: boolean
            releaseName:
              description: ReleaseName is the release name of the installed Helm chart. If it is not specified, a name will
                be generated.
              type: string
            repoURL:
              description: 'RepoURL is the URL of the Helm chart repository. e.g. chart-path oci://repo-url/chart-name as
                repoURL: oci://repo-url and https://repo-url/chart-name as repoURL: https://repo-url'
              type: string
            valuesTemplate:
              description: ValuesTemplate is an inline YAML representing the values for the Helm chart. This YAML supports
                Go templating to reference fields from each selected workload Cluster and programatically create and set values.
              type: string
            version:
              description: Version is the version of the Helm chart. If it is not specified, the chart will use and be kept
                up to date with the latest version.
              type: string
        status:
          description: Status defines the observed state of cluster addon.
          type: object
          properties:
            conditions:
              description: Conditions defines current state of the cluster addon.
              type: array
              items:
                description: Condition defines an observation of a Cluster API resource operational state.
                type: object
                required:
                - lastTransitionTime
                - status
                - type
                properties:
                  lastTransitionTime:
                    description: Last time the condition transitioned from one status to another. This should be when the
                      underlying condition changed. If that is not known, then using the time when the API field changed is
                      acceptable.
                    type: string
                    format: date-time
                  message:
                    description: A human readable message indicating details about the transition. This field may be empty.
                    type: string
                  reason:
                    description: The reason for the condition's last transition in CamelCase. The specific API may choose
                      whether or not this field is considered a guaranteed API. This field may not be empty.
                    type: string
                  severity:
                    description: Severity provides an explicit classification of Reason code, so the users or machines can
                      immediately understand the current situation and act accordingly. The Severity field MUST be set only
                      when Status=False.
                    type: string
                  status:
                    description: Status of the condition, one of True, False, Unknown.
                    type: string
                  type:
                    description: Type of condition in CamelCase or in foo.example.com/CamelCase. Many .condition.type values
                      are consistent across resources like Available, but because arbitrary conditions can be useful (see
                      .node.status.conditions), the ability to deconflict is important.
                    type: string
            revision:
              description: Revision is the current revision of the Helm release.
              type: integer
            status:
              description: Status is the current status of the Helm release.
              type: string
    v1.1.0_error_response:
      type: object
      properties:
        message_info:
          description: '{} with the key as the error type and the value as the error message'
          type: object
    v1.1.0_k8s_cluster_addons_config_list:
      description: 'Kubernetes cluster addons list '
      type: array
      items:
        $ref: '#/components/schemas/v1.1.0_k8s_cluster_addons_config'
