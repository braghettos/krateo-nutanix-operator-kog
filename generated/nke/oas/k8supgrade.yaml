openapi: 3.0.0
info:
  title: Karbon
  description: '# Introduction

    **Nutanix Kubernetes Engine** (NKE) is a curated turnkey offering that provides simplified provisioning and operations
    of Kubernetes clusters. Kubernetes is an open source container orchestration system for deploying and managing container-based
    applications.


    NKE uses the CentOS Linux-based operating systems for NKE-enabled Kubernetes cluster creation. Linux containers provide
    the flexibility to deploy applications in different environments with consistent results.


    NKE streamlines the deployment and management of Kubernetes clusters with a simple GUI integrated into Prism Central (PC).
    Kibana, the built-in add-on, lets you filter and parse logs for systems, pods, and nodes. Prometheus, another add-on,
    provides a monitoring mechanism that triggers alerts on your cluster. NKE also uses Pulse, Prism health-monitoring system,
    which interacts with Nutanix Support to expedite cluster issue resolutions.


    For more information about NKE and its offerings, refer to [NKE Documentation](https://portal.nutanix.com/page/documents/details?targetId=Nutanix-Kubernetes-Engine:Nutanix-Kubernetes-Engine).


    # Authentication

    **NKE uses basic authentication**: The user provides user ID and password every time a request is sent as the authentication
    header.

    '
  contact:
    name: NKE Developers
    email: karbon-team@nutanix.com
  license:
    name: Copyright Nutanix Inc. All rights reserved
  version: v1.1.0
servers:
- url: /karbon
security: []
paths:
  /k8s/cluster/{uuid}/k8s_upgrade:
    get:
      operationId: GetK8sUpgradeStatus
      parameters:
      - description: UUID of the Kubernetes cluster.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Lists all the tasks for Kubernetes and the addon upgrades for the cluster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/0.1.0_k8s_upgrade_status_response'
        '400':
          description: Invalid parameters specified in the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/0.1.0_error_response'
        '401':
          description: Invalid client credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/0.1.0_error_response'
        '404':
          description: Specified Kubernetes cluster does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/0.1.0_error_response'
      summary: Get the status of all the Kubernetes and addon upgrades for the cluster
      tags:
      - NKE_Upgrade_API_Reference_upgrade
      x-codeSamples:
      - lang: cURL
        source: "curl --request GET \\\n    --url https://www.nutanix.dev/k8s/cluster/{uuid}/k8s_upgrade \\\n    --header\
          \ 'Accept: application/json' \\\n     "
      - lang: Wget
        source: "wget --quiet \\\n    --method GET \\\n    --header 'Accept: application/json' \\\n      \\\n    --output-document\
          \ \\\n    - https://www.nutanix.dev/k8s/cluster/{uuid}/k8s_upgrade"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\"\n}\n \nconn.request(\"GET\",\"/k8s/cluster/{uuid}/k8s_upgrade\", headers=headers)\n\nres\
          \ = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://www.nutanix.dev/k8s/cluster/{uuid}/k8s_upgrade\"\n\t \n\treq, err := http.NewRequest(\"GET\", url,\
          \ nil)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"\
          Accept\", \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"\
          Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\t\
          fmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"GET\", \"https://www.nutanix.dev/k8s/cluster/{uuid}/k8s_upgrade\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://www.nutanix.dev/k8s/cluster/{uuid}/k8s_upgrade';\nconst options = {\n  method: 'GET',\n\
          \  headers: {'Accept': 'application/json'} \n};\n\ntry {\n  const response = await fetch(url, options);\n  const\
          \ data = await response.json();\n  console.log(data);\n} catch (error) {\n  console.error(error);\n}"
    post:
      operationId: PostK8sUpgrade
      parameters:
      - description: UUID of the Kubernetes cluster.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/0.1.0_k8s_upgrade_input'
        required: true
      responses:
        '202':
          description: Kubernetes upgrade call was submitted to the NKE controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/0.1.0_k8s_upgrade_response'
        '400':
          description: Invalid parameters specified in the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/0.1.0_error_response'
        '401':
          description: Invalid client credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/0.1.0_error_response'
        '404':
          description: Specified Kubernetes cluster does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/0.1.0_error_response'
        '412':
          description: Pre-upgrade checks for the specified Kubernetes cluster failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/0.1.0_error_response'
      summary: Upgrade the Kubernetes and addon components of the cluster
      tags:
      - NKE_Upgrade_API_Reference_upgrade
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://www.nutanix.dev/k8s/cluster/{uuid}/k8s_upgrade \\\n    --header\
          \ 'Accept: application/json' \\\n    --header 'Content-Type: application/json' \\\n    --data '{\n    \"drain-policy\"\
          : \"kAlways\",\n    \"drain-timeout\": \"600s\",\n    \"dry_run\": false,\n    \"skip_prechecks\": false,\n    \"\
          upgrade_config\": {\n        \"pkg_version\": \"string\"\n    }\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Content-Type:\
          \ application/json' \\\n    --body-data '{\n    \"drain-policy\": \"kAlways\",\n    \"drain-timeout\": \"600s\"\
          ,\n    \"dry_run\": false,\n    \"skip_prechecks\": false,\n    \"upgrade_config\": {\n        \"pkg_version\":\
          \ \"string\"\n    }\n}' \\\n    --output-document \\\n    - https://www.nutanix.dev/k8s/cluster/{uuid}/k8s_upgrade"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Content-Type\": \"application/json\"\n}\n\npayload =  \"\"\"{\n    \"drain-policy\"\
          : \"kAlways\",\n    \"drain-timeout\": \"600s\",\n    \"dry_run\": false,\n    \"skip_prechecks\": false,\n    \"\
          upgrade_config\": {\n        \"pkg_version\": \"string\"\n    }\n}\"\"\"\n\nconn.request(\"POST\",\"/k8s/cluster/{uuid}/k8s_upgrade\"\
          , payload, headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://www.nutanix.dev/k8s/cluster/{uuid}/k8s_upgrade\"\n\t\n\tpayload :=  strings.NewReader(`{\"drain-policy\"\
          : \"kAlways\", \"drain-timeout\": \"600s\", \"dry_run\": false, \"skip_prechecks\": false, \"upgrade_config\": {\"\
          pkg_version\": \"string\"}}`)\n\treq, err := http.NewRequest(\"POST\", url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"\
          Error creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"Accept\", \"application/json\")\n \
          \       req.Header.Add(\"Content-Type\", \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\
          \tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\t\
          return\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://www.nutanix.dev/k8s/cluster/{uuid}/k8s_upgrade\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"\
          {\\\"drain-policy\\\": \\\"kAlways\\\", \\\"drain-timeout\\\": \\\"600s\\\", \\\"dry_run\\\": false, \\\"skip_prechecks\\\
          \": false, \\\"upgrade_config\\\": {\\\"pkg_version\\\": \\\"string\\\"}}\")\n  .execute()\n  .toCompletableFuture()\n\
          \  .thenAccept(System.out::println)\n  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://www.nutanix.dev/k8s/cluster/{uuid}/k8s_upgrade';\nconst options = {\n  method: 'POST',\n\
          \  headers: {'Accept': 'application/json', 'Content-Type': 'application/json'},\n  body:  `{\"drain-policy\": \"\
          kAlways\", \"drain-timeout\": \"600s\", \"dry_run\": false, \"skip_prechecks\": false, \"upgrade_config\": {\"pkg_version\"\
          : \"string\"}}`\n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await response.json();\n\
          \  console.log(data);\n} catch (error) {\n  console.error(error);\n}"
components:
  securitySchemes:
    v1.1.0_basicAuth:
      type: http
      scheme: basic
  schemas:
    0.1.0_k8s_upgrade_response:
      properties:
        status_code:
          type: integer
        task_uuid:
          type: string
      required:
      - status_code
      - task_uuid
      type: object
    0.1.0_error_response:
      properties:
        message_list:
          additionalProperties:
            type: string
          type: object
        status_code:
          type: integer
      type: object
    0.1.0_k8s_upgrade_status_response_item:
      properties:
        error_detail:
          description: Reason for failure of Kubernetes and the addon upgrade task.
          type: string
        percent_complete:
          description: Percentage of progress of Kubernetes and the addon upgrade task.
          type: integer
        progress_message:
          description: Progress message of Kubernetes and the addon upgrade task.
          type: string
        status:
          description: Status of Kubernetes and the addon upgrade task.
          type: string
        upgrade_info:
          $ref: '#/components/schemas/0.1.0_k8s_pkg_info_item'
        upgrade_start_time:
          description: Epoch time (in microseconds) at which the upgrade task for Kubernetes and the addon was created.
          type: integer
        uuid:
          description: UUID of Kubernetes and the addon upgrade task.
          type: string
      type: object
    0.1.0_k8s_upgrade_input:
      properties:
        drain-policy:
          description: Apply drain policy during the node upgrade.
          enum:
          - kAlways
          - kBestEffort
          - kNever
        drain-timeout:
          description: Timeout (in seconds) for draining a node.
          type: string
        dry_run:
          description: Skip the Kubernetes upgrade for the cluster.
          type: boolean
        skip_prechecks:
          description: Skip the pre-upgrade checks for the Kubernetes cluster.
          type: boolean
        upgrade_config:
          $ref: '#/components/schemas/0.1.0_upgrade_config'
      required:
      - upgrade_config
      type: object
    0.1.0_upgrade_config:
      properties:
        pkg_version:
          description: Name of the package to fetch and upgrade.
          type: string
      required:
      - pkg_version
      type: object
    0.1.0_k8s_pkg_info_item:
      properties:
        cluster_name:
          description: Name of the Kubernetes cluster.
          type: string
        controller_version:
          description: Controller version in which the Kubernetes and addon upgrade is done.
          type: string
        source_version:
          description: Current kubernetes version of the cluster.
          type: string
        target_version:
          description: Target ntnx-k8s package version to upgrade.
          type: string
      type: object
    0.1.0_k8s_upgrade_status_response:
      items:
        $ref: '#/components/schemas/0.1.0_k8s_upgrade_status_response_item'
      type: array
