      x-code-samples:
      - lang: Java
        source: "\npackage sample;\n\nimport com.nutanix.vol.java.client.ApiClient;\nimport com.nutanix.vol.java.client.api.VolumeGroupsApi;\n\
          import com.nutanix.dp1.vol.volumes.v4.config.GetVolumeGroupMetadataApiResponse;\nimport org.springframework.web.client.RestClientException;\n\
          \npublic class JavaSdkSample {\n    public static void main(String[] args) {\n        // Configure the client\n\
          \        ApiClient apiClient = new ApiClient();\n        // IPv4/IPv6 address or FQDN of the cluster\n        apiClient.setHost(\"\
          localhost\");\n        // Port to which to connect to\n        apiClient.setPort(9440);\n        // Interval in\
          \ ms to use during retry attempts\n        apiClient.setRetryInterval(5000);\n        // Max retry attempts while\
          \ reconnecting on a loss of connection\n        apiClient.setMaxRetryAttempts(5);\n        // UserName to connect\
          \ to the cluster\n        String username = \"username\";\n        // Password to connect to the cluster\n     \
          \   String password = \"password\";\n        apiClient.setUsername(username);\n        apiClient.setPassword(password);\n\
          \n        // Please add authorization information here if needed.\n        VolumeGroupsApi volumeGroupsApi = new\
          \ VolumeGroupsApi(apiClient);\n\n        \n        String volumeGroupExtId = \"79D7fdAd-b3a9-F8b8-CdeD-a6FB8Be88EAC\"\
          ;\n\n        try {\n            GetVolumeGroupMetadataApiResponse getVolumeGroupMetadataApiResponse = volumeGroupsApi.getVolumeGroupMetadataById(volumeGroupExtId);\n\
          \            System.out.println(getVolumeGroupMetadataApiResponse.toString());\n\n        } catch (RestClientException\
          \ ex) {\n            System.out.println(ex.getMessage());\n        }\n    }\n}\n"
      - lang: JavaScript
        source: "\nimport { ApiClient, VolumeGroupsApi } from \"@nutanix-api/volumes-js-client\";\n\n// Configure the client\n\
          let apiClientInstance = new ApiClient();\n// IPv4/IPv6 address or FQDN of the cluster\napiClientInstance.host =\
          \ 'localhost';\n// Port to which to connect to\napiClientInstance.port = '9440';\n// Max retry attempts while reconnecting\
          \ on a loss of connection\napiClientInstance.maxRetryAttempts = 5;\n// Interval in ms to use during retry attempts\n\
          apiClientInstance.retryInterval = 5000;\n// UserName to connect to the cluster\napiClientInstance.username = 'username';\n\
          // Password to connect to the cluster\napiClientInstance.password = 'password';\n// Please add authorization information\
          \ here if needed.\nlet volumeGroupsApi = new VolumeGroupsApi(apiClientInstance);\n\nfunction sample() {\n\n    \n\
          \    let volumeGroupExtId = \"E5afA8fc-4fa8-6cAf-aaed-a17c6eebBEce\";\n\n\n\n\n\n    volumeGroupsApi.getVolumeGroupMetadataById(volumeGroupExtId).then(({data,\
          \ response}) => {\n        console.log(`API returned the following status code: ${response.status}`);\n        console.log(data.getData());\n\
          \    }).catch((error) => {\n        console.log(`Error is: ${error}`);\n    });\n\n}\nsample()\n"
      - lang: Python
        source: "\nimport ntnx_volumes_py_client\n\nif __name__ == \"__main__\":\n    # Configure the client\n    config =\
          \ ntnx_volumes_py_client.Configuration()\n    # IPv4/IPv6 address or FQDN of the cluster\n    config.host = \"localhost\"\
          \n    # Port to which to connect to\n    config.port = 9440\n    # Max retry attempts while reconnecting on a loss\
          \ of connection\n    config.max_retry_attempts = 3\n    # Backoff factor to use during retry attempts\n    config.backoff_factor\
          \ = 3\n    # UserName to connect to the cluster\n    config.username = \"username\"\n    # Password to connect to\
          \ the cluster\n    config.password = \"password\"\n    # Please add authorization information here if needed.\n\
          \    client = ntnx_volumes_py_client.ApiClient(configuration=config)\n    volume_groups_api = ntnx_volumes_py_client.VolumeGroupsApi(api_client=client)\n\
          \    \n    volume_group_ext_id = \"b47EcfB9-Fe1e-62E0-AFfe-C2FCC1CF6ee6\"\n\n\n    try:\n        api_response =\
          \ volume_groups_api.get_volume_group_metadata_by_id(volumeGroupExtId=volume_group_ext_id)\n        print(api_response)\n\
          \    except ntnx_volumes_py_client.rest.ApiException as e:\n        print(e)\n\n"
      - lang: Go
        source: "\npackage main\n\nimport (\n    \"fmt\"\n    \"time\"\n    \"github.com/nutanix/ntnx-api-golang-clients/volumes-go-client/v4/api\"\
          \n    \"github.com/nutanix/ntnx-api-golang-clients/volumes-go-client/v4/client\"\n    import1 \"github.com/nutanix/ntnx-api-golang-clients/volumes-go-client/v4/models/common/v1/config\"\
          \n)\n\nvar (\n    ApiClientInstance *client.ApiClient\n    VolumeGroupsApiInstance *api.VolumeGroupsApi\n)\n\nfunc\
          \ main() {\n    ApiClientInstance = client.NewApiClient()\n    // IPv4/IPv6 address or FQDN of the cluster\n   \
          \ ApiClientInstance.Host = \"localhost\"\n    // Port to which to connect to\n    ApiClientInstance.Port = 9440\n\
          \    // Interval in ms to use during retry attempts\n    ApiClientInstance.RetryInterval = 5 * time.Second\n   \
          \ // Max retry attempts while reconnecting on a loss of connection\n    ApiClientInstance.MaxRetryAttempts = 5\n\
          \    // UserName to connect to the cluster\n    ApiClientInstance.Username = \"username\"\n    // Password to connect\
          \ to the cluster\n    ApiClientInstance.Password = \"password\"\n    // Please add authorization information here\
          \ if needed.\n    VolumeGroupsApiInstance = api.NewVolumeGroupsApi(ApiClientInstance)\n\n    \n    volumeGroupExtId\
          \ := \"a9D0f1fe-78F8-bdab-D1cb-8Fcf88dcEf67\"\n\n\n    response, error := VolumeGroupsApiInstance.GetVolumeGroupMetadataById(&volumeGroupExtId)\n\
          \    if error != nil {\n        fmt.Println(error)\n        return\n    }\n    data, _ := response.GetData().(import1.Metadata)\n\
          \    fmt.Println(data)\n\n}\n\n"
      - lang: cURL
        source: "\ncurl --request GET \\\n     --url \"https://{pc-ip}:9440/api/volumes/v4.0/config/volume-groups/eAF84A5e-1Fed-2BAf-eeAF-CA2DAaCDbE5e/metadata\"\
          \ \\\n     --header 'Accept: application/json' \\\n     --header 'Authorization:Basic $APP_ACCESS_TOKEN' \\\n\n"
      - lang: Wget
        source: "\n\nwget --verbose \\\n     --method GET \\\n     --header 'Accept: application/json' \\\n--header 'Authorization:Basic\
          \ $APP_ACCESS_TOKEN' \\\n- \"https://{pc-ip}:9440/api/volumes/v4.0/config/volume-groups/a03cA4fC-EaCf-051C-1Aad-c3Ece0EB0cbB/metadata\"\
          \n"
