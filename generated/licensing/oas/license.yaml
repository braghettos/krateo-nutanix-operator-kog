      x-code-samples:
      - lang: Java
        source: "\npackage sample;\n\nimport com.nutanix.lic.java.client.ApiClient;\nimport com.nutanix.lic.java.client.api.LicensesApi;\n\
          import com.nutanix.dp1.lic.licensing.v4.config.ListLicensesApiResponse;\nimport org.springframework.web.client.RestClientException;\n\
          \npublic class JavaSdkSample {\n    public static void main(String[] args) {\n        // Configure the client\n\
          \        ApiClient apiClient = new ApiClient();\n        // IPv4/IPv6 address or FQDN of the cluster\n        apiClient.setHost(\"\
          localhost\");\n        // Port to which to connect to\n        apiClient.setPort(9440);\n        // Interval in\
          \ ms to use during retry attempts\n        apiClient.setRetryInterval(5000);\n        // Max retry attempts while\
          \ reconnecting on a loss of connection\n        apiClient.setMaxRetryAttempts(5);\n        // UserName to connect\
          \ to the cluster\n        String username = \"username\";\n        // Password to connect to the cluster\n     \
          \   String password = \"password\";\n        apiClient.setUsername(username);\n        apiClient.setPassword(password);\n\
          \n        // Please add authorization information here if needed.\n        LicensesApi licensesApi = new LicensesApi(apiClient);\n\
          \n        \n        int page = 0;\n        \n        int limit = 50;\n\n        try {\n            ListLicensesApiResponse\
          \ listLicensesApiResponse = licensesApi.listLicenses(page, limit, null, null, null, null);\n            System.out.println(listLicensesApiResponse.toString());\n\
          \n        } catch (RestClientException ex) {\n            System.out.println(ex.getMessage());\n        }\n    }\n\
          }\n"
      - lang: JavaScript
        source: "\nimport { ApiClient, LicensesApi } from \"@nutanix-api/licensing-js-client\";\n\n// Configure the client\n\
          let apiClientInstance = new ApiClient();\n// IPv4/IPv6 address or FQDN of the cluster\napiClientInstance.host =\
          \ 'localhost';\n// Port to which to connect to\napiClientInstance.port = '9440';\n// Max retry attempts while reconnecting\
          \ on a loss of connection\napiClientInstance.maxRetryAttempts = 5;\n// Interval in ms to use during retry attempts\n\
          apiClientInstance.retryInterval = 5000;\n// UserName to connect to the cluster\napiClientInstance.username = 'username';\n\
          // Password to connect to the cluster\napiClientInstance.password = 'password';\n// Please add authorization information\
          \ here if needed.\nlet licensesApi = new LicensesApi(apiClientInstance);\n\nfunction sample() {\n\n\n    // Construct\
          \ Optional Parameters\n    var opts = {};\n    opts[\"$page\"] = 0;\n    opts[\"$limit\"] = 50;\n    opts[\"$filter\"\
          ] = \"string_sample_data\";\n    opts[\"$orderby\"] = \"string_sample_data\";\n    opts[\"$expand\"] = \"string_sample_data\"\
          ;\n    opts[\"$select\"] = \"string_sample_data\";\n\n\n\n\n    licensesApi.listLicenses(opts).then(({data, response})\
          \ => {\n        console.log(`API returned the following status code: ${response.status}`);\n        console.log(data.getData());\n\
          \    }).catch((error) => {\n        console.log(`Error is: ${error}`);\n    });\n\n}\nsample()\n"
      - lang: Python
        source: "\nimport ntnx_licensing_py_client\n\nif __name__ == \"__main__\":\n    # Configure the client\n    config\
          \ = ntnx_licensing_py_client.Configuration()\n    # IPv4/IPv6 address or FQDN of the cluster\n    config.host =\
          \ \"localhost\"\n    # Port to which to connect to\n    config.port = 9440\n    # Max retry attempts while reconnecting\
          \ on a loss of connection\n    config.max_retry_attempts = 3\n    # Backoff factor to use during retry attempts\n\
          \    config.backoff_factor = 3\n    # UserName to connect to the cluster\n    config.username = \"username\"\n \
          \   # Password to connect to the cluster\n    config.password = \"password\"\n    # Please add authorization information\
          \ here if needed.\n    client = ntnx_licensing_py_client.ApiClient(configuration=config)\n    licenses_api = ntnx_licensing_py_client.LicensesApi(api_client=client)\n\
          \    \n    page = 0\n    \n    limit = 50\n\n\n    try:\n        api_response = licenses_api.list_licenses(_page=page,\
          \ _limit=limit)\n        print(api_response)\n    except ntnx_licensing_py_client.rest.ApiException as e:\n    \
          \    print(e)\n\n"
      - lang: Go
        source: "\npackage main\n\nimport (\n    \"fmt\"\n    \"time\"\n    \"github.com/nutanix/ntnx-api-golang-clients/licensing-go-client/v4/api\"\
          \n    \"github.com/nutanix/ntnx-api-golang-clients/licensing-go-client/v4/client\"\n    import1 \"github.com/nutanix/ntnx-api-golang-clients/licensing-go-client/v4/models/licensing/v4/config\"\
          \n)\n\nvar (\n    ApiClientInstance *client.ApiClient\n    LicensesApiInstance *api.LicensesApi\n)\n\nfunc main()\
          \ {\n    ApiClientInstance = client.NewApiClient()\n    // IPv4/IPv6 address or FQDN of the cluster\n    ApiClientInstance.Host\
          \ = \"localhost\"\n    // Port to which to connect to\n    ApiClientInstance.Port = 9440\n    // Interval in ms\
          \ to use during retry attempts\n    ApiClientInstance.RetryInterval = 5 * time.Second\n    // Max retry attempts\
          \ while reconnecting on a loss of connection\n    ApiClientInstance.MaxRetryAttempts = 5\n    // UserName to connect\
          \ to the cluster\n    ApiClientInstance.Username = \"username\"\n    // Password to connect to the cluster\n   \
          \ ApiClientInstance.Password = \"password\"\n    // Please add authorization information here if needed.\n    LicensesApiInstance\
          \ = api.NewLicensesApi(ApiClientInstance)\n\n    \n    page_ := 0\n    \n    limit_ := 50\n\n\n    response, error\
          \ := LicensesApiInstance.ListLicenses(&page_, &limit_, nil, nil, nil, nil)\n    if error != nil {\n        fmt.Println(error)\n\
          \        return\n    }\n    data, _ := response.GetData().([]import1.License)\n    fmt.Println(data)\n\n}\n\n"
      - lang: cURL
        source: "\ncurl --request GET \\\n     --url \"https://{pc-ip}:9440/api/licensing/v4.0/config/licenses?$filter=string_sample_data&$limit=50&$orderby=string_sample_data&$expand=string_sample_data&$page=0&$select=string_sample_data\"\
          \ \\\n     --header 'Accept: application/json' \\\n     --header 'Authorization:Basic $APP_ACCESS_TOKEN' \\\n\n"
      - lang: Wget
        source: "\n\nwget --verbose \\\n     --method GET \\\n     --header 'Accept: application/json' \\\n--header 'Authorization:Basic\
          \ $APP_ACCESS_TOKEN' \\\n- \"https://{pc-ip}:9440/api/licensing/v4.0/config/licenses?$filter=string_sample_data&$limit=50&$orderby=string_sample_data&$expand=string_sample_data&$page=0&$select=string_sample_data\"\
          \n"
