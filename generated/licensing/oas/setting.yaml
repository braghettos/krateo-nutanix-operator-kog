paths:
  /licensing/v4.0/config/settings:
    get:
      tags:
      - Licenses
      summary: List license configurations
      description: API to fetch license settings list.
      operationId: listSettings
      parameters:
      - name: $page
        in: query
        description: 'A URL query parameter that specifies the page number of the result set. It must be a positive integer
          between 0 and the maximum number of pages that are available for that resource. Any number out of this range might
          lead to no results.

          '
        required: false
        style: form
        explode: false
        schema:
          minimum: 0
          type: integer
          description: 'A URL query parameter that specifies the page number of the result set. It must be a positive integer
            between 0 and the maximum number of pages that are available for that resource. Any number out of this range might
            lead to no results.

            '
          format: int32
      - name: $limit
        in: query
        description: 'A URL query parameter that specifies the total number of records returned in the result set.  Must be
          a positive integer between 1 and 100. Any number out of this range will lead to a validation error. If the limit
          is not provided, a default value of 50 records will be returned in the result set.

          '
        required: false
        style: form
        explode: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          description: 'A URL query parameter that specifies the total number of records returned in the result set.  Must
            be a positive integer between 1 and 100. Any number out of this range will lead to a validation error. If the
            limit is not provided, a default value of 50 records will be returned in the result set.

            '
          format: int32
      responses:
        '200':
          description: List of license configurations
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/licensing.v4.0.config.Setting'
                additionalProperties: false
                description: REST response for all response codes in API path /licensing/v4.0/config/settings Get operation
        4XX:
          description: Client error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/licensing.v4.0.error.ErrorResponse'
                additionalProperties: false
                description: REST response for all response codes in API path /licensing/v4.0/config/settings Get operation
        5XX:
          description: Server error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/licensing.v4.0.error.ErrorResponse'
                additionalProperties: false
                description: REST response for all response codes in API path /licensing/v4.0/config/settings Get operation
