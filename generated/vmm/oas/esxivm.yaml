      tags:
      - EsxiVm
      summary: List VMs
      description: Lists the Virtual Machines defined on the system. List of Virtual Machines can be further filtered out
        using various filtering options.
      operationId: listVms
      parameters:
      - name: $page
        in: query
        description: 'A URL query parameter that specifies the page number of the result set. It must be a positive integer
          between 0 and the maximum number of pages that are available for that resource. Any number out of this range might
          lead to no results.

          '
        required: false
        style: form
        explode: false
        schema:
          minimum: 0
          type: integer
          description: 'A URL query parameter that specifies the page number of the result set. It must be a positive integer
            between 0 and the maximum number of pages that are available for that resource. Any number out of this range might
            lead to no results.

            '
          format: int32
      - name: $limit
