          type: integer
          description: Device index on the bus. This field is ignored unless the bus details are specified.
      additionalProperties: false
      description: Virtual Machine disk (VM disk).
    vmm.v4.0.ahv.config.Unattendxml:
      type: object
      properties:
        value:
          maxLength: 32000
          type: string
          description: Value of Sysprep unattend xml definition. The value must be base64 encoded.
      additionalProperties: false
      description: This field contains a Sysprep unattend xml definition, as a string. The value must be base64 encoded.
    vmm.v4.0.ahv.config.EmulatedNic:
      type: object
      properties:
        model:
          $ref: '#/components/schemas/vmm.v4.0.ahv.config.EmulatedNicModel'
        macAddress:
          pattern: ^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$
          type: string
          description: MAC address of the emulated NIC.
        isConnected:
          type: boolean
          description: Indicates whether the NIC is connected or not. Default is True.
        numQueues:
          minimum: 1
          type: integer
          description: The number of Tx/Rx queue pairs for this NIC.
      additionalProperties: false
      description: Defines a NIC emulated by the hypervisor
    common.v1.0.config.KVPair:
      type: object
      properties:
        name:
          maxLength: 128
          minLength: 3
          type: string
          description: 'The key of the key-value pair.

            '
        value:
          description: The value associated with the key for this key-value pair
          oneOf:
          - type: string
            description: 'A string value in a key-value pair.

              '
          - type: integer
            description: 'An integer value in a key-value pair.

              '
          - type: boolean
            description: 'An boolean value in a key-value pair.

              '
          - maxItems: 100
            minItems: 0
            type: array
            description: 'A value in a key-value pair that represents a list of strings.

              '
            items:
              type: string
          - type: object
            additionalProperties:
              type: string
            description: 'A value in a key-value pair that represents a map of string keys and values.

              '
          - maxItems: 20
            minItems: 0
            type: array
            description: 'A value in a key-value pair that represents an array of maps of string keys and values.

              '
            items:
              $ref: '#/components/schemas/common.v1.0.config.MapOfStringWrapper'
          - maxItems: 100
            minItems: 0
            type: array
            description: 'A value in a key-value pair that represents a list of integers.

              '
            items:
              type: integer
      additionalProperties: false
      description: 'A map describing a set of keys and their corresponding values.

        '
    vmm.v4.0.ahv.config.EmulatedNicModel:
      type: string
      description: Options for the NIC emulation.
      enum:
      - VIRTIO
      - E1000
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        VIRTIO: The NIC adapter type is Virtio.
        E1000: The NIC adapter type is E1000.
        $UNKNOWN: 'Unknown value.

          '
        $REDACTED: 'Redacted value.

          '
