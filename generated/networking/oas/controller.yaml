      x-code-samples:
      - lang: Java
        source: "\npackage sample;\n\nimport com.nutanix.networking.java.client.ApiClient;\nimport com.nutanix.networking.java.client.api.NetworkControllersApi;\n\
          import com.nutanix.dp1.networking.networking.v4.config.TaskReferenceApiResponse;\nimport org.springframework.web.client.RestClientException;\n\
          \npublic class JavaSdkSample {\n    public static void main(String[] args) {\n        // Configure the client\n\
          \        ApiClient apiClient = new ApiClient();\n        // IPv4/IPv6 address or FQDN of the cluster\n        apiClient.setHost(\"\
          localhost\");\n        // Port to which to connect to\n        apiClient.setPort(9440);\n        // Interval in\
          \ ms to use during retry attempts\n        apiClient.setRetryInterval(5000);\n        // Max retry attempts while\
          \ reconnecting on a loss of connection\n        apiClient.setMaxRetryAttempts(5);\n        // UserName to connect\
          \ to the cluster\n        String username = \"username\";\n        // Password to connect to the cluster\n     \
          \   String password = \"password\";\n        apiClient.setUsername(username);\n        apiClient.setPassword(password);\n\
          \n        // Please add authorization information here if needed.\n        NetworkControllersApi networkControllersApi\
          \ = new NetworkControllersApi(apiClient);\n\n        \n        String extId = \"D9d3AEB5-aAE1-d7eB-2eA9-4aCdc8d231EB\"\
          ;\n\n        try {\n            TaskReferenceApiResponse taskReferenceApiResponse = networkControllersApi.deleteNetworkControllerById(extId);\n\
          \            System.out.println(taskReferenceApiResponse.toString());\n\n        } catch (RestClientException ex)\
          \ {\n            System.out.println(ex.getMessage());\n        }\n    }\n}\n"
      - lang: JavaScript
        source: "\nimport { ApiClient, NetworkControllersApi } from \"@nutanix-api/networking-js-client\";\n\n// Configure\
          \ the client\nlet apiClientInstance = new ApiClient();\n// IPv4/IPv6 address or FQDN of the cluster\napiClientInstance.host\
          \ = 'localhost';\n// Port to which to connect to\napiClientInstance.port = '9440';\n// Max retry attempts while\
          \ reconnecting on a loss of connection\napiClientInstance.maxRetryAttempts = 5;\n// Interval in ms to use during\
          \ retry attempts\napiClientInstance.retryInterval = 5000;\n// UserName to connect to the cluster\napiClientInstance.username\
          \ = 'username';\n// Password to connect to the cluster\napiClientInstance.password = 'password';\n// Please add\
          \ authorization information here if needed.\nlet networkControllersApi = new NetworkControllersApi(apiClientInstance);\n\
          \nfunction sample() {\n\n    \n    let extId = \"69C0b132-61AC-8AeC-1DF9-15AaCec176C9\";\n\n\n\n\n\n    networkControllersApi.deleteNetworkControllerById(extId).then(({data,\
          \ response}) => {\n        console.log(`API returned the following status code: ${response.status}`);\n        console.log(data.getData());\n\
          \    }).catch((error) => {\n        console.log(`Error is: ${error}`);\n    });\n\n}\nsample()\n"
      - lang: Python
        source: "\nimport ntnx_networking_py_client\n\nif __name__ == \"__main__\":\n    # Configure the client\n    config\
          \ = ntnx_networking_py_client.Configuration()\n    # IPv4/IPv6 address or FQDN of the cluster\n    config.host =\
          \ \"localhost\"\n    # Port to which to connect to\n    config.port = 9440\n    # Max retry attempts while reconnecting\
          \ on a loss of connection\n    config.max_retry_attempts = 3\n    # Backoff factor to use during retry attempts\n\
          \    config.backoff_factor = 3\n    # UserName to connect to the cluster\n    config.username = \"username\"\n \
          \   # Password to connect to the cluster\n    config.password = \"password\"\n    # Please add authorization information\
          \ here if needed.\n    client = ntnx_networking_py_client.ApiClient(configuration=config)\n    network_controllers_api\
          \ = ntnx_networking_py_client.NetworkControllersApi(api_client=client)\n    \n    ext_id = \"cCD37aF1-B5dD-BeC0-daa7-6fB9FC40B26A\"\
          \n\n\n    try:\n        api_response = network_controllers_api.delete_network_controller_by_id(extId=ext_id)\n \
          \       print(api_response)\n    except ntnx_networking_py_client.rest.ApiException as e:\n        print(e)\n\n"
      - lang: Go
        source: "\npackage main\n\nimport (\n    \"fmt\"\n    \"time\"\n    \"github.com/nutanix/ntnx-api-golang-clients/networking-go-client/v4/api\"\
          \n    \"github.com/nutanix/ntnx-api-golang-clients/networking-go-client/v4/client\"\n    import1 \"github.com/nutanix/ntnx-api-golang-clients/networking-go-client/v4/models/prism/v4/config\"\
          \n)\n\nvar (\n    ApiClientInstance *client.ApiClient\n    NetworkControllersApiInstance *api.NetworkControllersApi\n\
          )\n\nfunc main() {\n    ApiClientInstance = client.NewApiClient()\n    // IPv4/IPv6 address or FQDN of the cluster\n\
          \    ApiClientInstance.Host = \"localhost\"\n    // Port to which to connect to\n    ApiClientInstance.Port = 9440\n\
          \    // Interval in ms to use during retry attempts\n    ApiClientInstance.RetryInterval = 5 * time.Second\n   \
          \ // Max retry attempts while reconnecting on a loss of connection\n    ApiClientInstance.MaxRetryAttempts = 5\n\
          \    // UserName to connect to the cluster\n    ApiClientInstance.Username = \"username\"\n    // Password to connect\
          \ to the cluster\n    ApiClientInstance.Password = \"password\"\n    // Please add authorization information here\
          \ if needed.\n    NetworkControllersApiInstance = api.NewNetworkControllersApi(ApiClientInstance)\n\n    \n    extId\
          \ := \"2e3C5F0e-1BAd-CF7a-e1C0-5CB0ACffbF33\"\n\n\n    response, error := NetworkControllersApiInstance.DeleteNetworkControllerById(&extId)\n\
          \    if error != nil {\n        fmt.Println(error)\n        return\n    }\n    data, _ := response.GetData().(import1.TaskReference)\n\
          \    fmt.Println(data)\n\n}\n\n"
