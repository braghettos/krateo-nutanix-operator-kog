      description: 'Create a network controller. For large Prism Centrals, an additional 3GB of memory and 3 vCPUs are required,
        for each Prism Central node. For small Prism Centrals, an additional 1GB of memory and 1 vCPU is required, for each
        Prism Central node.

        '
