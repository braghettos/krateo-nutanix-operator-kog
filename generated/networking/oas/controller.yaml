        in: header
        description: 'A unique identifier that is associated with each request. The provided value must be opaque and preferably
          in Universal Unique Identifier (UUID) format. This identifier is also used as an idempotence token for safely retrying
          requests in case of network errors. All the supported Nutanix API clients add this auto-generated request identifier
          to each request.

          '
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
      requestBody:
        description: Network controller to create
        content:
          application/json:
            schema:
