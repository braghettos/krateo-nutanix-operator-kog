        \ OR subnet_type==VLAN) AND\n    (is_external==[no_val] OR is_external==false)\n  OVERLAY\n    (subnet_type==OVERLAY)\
        \ AND\n    (is_external==[no_val] OR is_external==false)\n  External\n    is_external==true\n"
      operationId: listSubnets
      parameters:
