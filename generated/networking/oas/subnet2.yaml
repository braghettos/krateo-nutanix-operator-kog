          - clusterReference

          - extId

          - hypervisorType

          - ipPrefix

          - isAdvancedNetworking

          - isExternal

          - isNatEnabled

          - links

          - metadata

          - name

          - networkId

          - subnetType

          - tenantId

          - virtualSwitchReference

          - vpcReference

