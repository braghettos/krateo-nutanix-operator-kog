    api_version:
      readOnly: true
      type: string
      description: API Version of the Nutanix v3 API framework.
      title: API Version
    entity_filter_expression:
      description: "Entity Filter Expression is a combination of LHS-Operator-RHS. This filter expression helps express the\
        \ Filter on actual entities. Example1 - To express All VMs\n  left_hand_side = VM\n  operator = IN\n  right_hand_side\
        \ = ALL\nExample2 - To express Not VM1 or VM2\n  left_hand_side =  VM\n  operator = NOT_IN\n  right_hand_side = [\"\
        VM1\", \"VM2\"]\n"
      required:
      - left_hand_side
      - operator
      - right_hand_side
      type: object
      properties:
        operator:
          x-ntnx-enum:
          - IN
          - NOT_IN
          type: string
          description: The operator in the filter expression.
        right_hand_side:
          $ref: '#/components/schemas/right_hand_side'
        left_hand_side:
          description: The LHS of the filter expression - the entity type.
          type: object
          x-ntnx-one-of:
          - required:
            - entity_type
          properties:
            entity_type:
              type: string
              description: 'The representation of the possible value of an LHS, in this case it is an entity type.A certain
                entity type e.g. VM Note. To express all entity types, use ALL

                '
              maxLength: 64
      title: Entity Filter Expression.
    scope_filter_expression:
      description: "The Scope filter expression is a combination of LHS-Operator-RHS. This type of filter expression helps\
        \ express the \"Context\" part of a Filter. Example1 - To express a context = Belonging to Project P1 or Project P2\n\
        \  left_hand_side = PROJECT\n  operator = IN\n  right_hand_side = [\"P1\", \"P2\"]\nExample2 - To express Belonging\
        \ to 2 categories\n  left_hand_side = CATEGORY\n  operator = IN_ALL\n  right_hand_side = [\"location:nyc\", \"env:prod\"\
        ]\n"
      required:
      - left_hand_side
      - operator
      - right_hand_side
      type: object
      properties:
        operator:
          x-ntnx-enum:
          - IN
          - IN_ALL
          - NOT_IN
          type: string
          description: The operator of the filter expression.
        right_hand_side:
          $ref: '#/components/schemas/scope_right_hand_side'
        left_hand_side:
          type: string
          description: 'The LHS of the filter expression - the scope type. Following is the list of supported values - * CATEGORY
            * PROJECT * CLUSTER * VPC * CONNECTIVITY_TYPE

            '
      title: Scope Filter Expression.
    storage_policy_resources:
      description: Storage Policy Resources Definition
      type: object
      properties:
        encryption:
          type: object
          properties:
            state:
              x-ntnx-enum:
              - ENABLE
              - SYSTEM_DERIVED
              type: string
              description: 'Enable encryption for entities. Once enabled, cannot be disabled.

                If user does not have an explicit preference towards enabling

                encryption, the system decides an appropriate value.

                '
          title: Encryption parameters for the entities.
        fault_tolerance:
          type: object
          properties:
            replication_factor:
              type: integer
              description: 'Set replication factor for entities.

