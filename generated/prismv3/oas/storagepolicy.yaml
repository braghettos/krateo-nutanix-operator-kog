      type: object
      properties:
        state:
          type: string
          description: The state of the storage policy
        name:
          type: string
          description: Storage policy name
        resources:
          $ref: '#/components/schemas/storage_policy_resources_def_status'
        description:
          type: string
          description: A description for storage policy
