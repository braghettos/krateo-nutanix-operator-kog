              format: int64
          title: Fault tolerance parameters for the entities.
        qos:
          type: object
          properties:
            throttled_iops:
              type: integer
              description: 'Throttled IOPS for the entities being governed. The block size

                for the IO is 32kB.

                '
              format: int64
          title: Storage QoS parameters for the entities.
        compression:
          type: object
          properties:
            state:
              x-ntnx-enum:
