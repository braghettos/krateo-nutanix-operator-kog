            config:
              $ref: '#/components/schemas/cluster_config'
            network:
              $ref: '#/components/schemas/cluster_network'
            analysis:
              $ref: '#/components/schemas/cluster_analysis'
            runtime_status_list:
              items:
                x-ntnx-enum:
                - UPGRADE_QUEUED
                - UPGRADE_CANCELLED
                - UPGRADE_IN_PROGRESS
                - UPGRADE_SCHEDULED
                - HAVE_SELF_ENCRYPTING_DRIVE
                - SSP_CONFIG_OWNER
                type: string
              type: array
              description: Cluster current attributes and onging operations.
      title: Cluster Status
