      required:
      - username
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      title: Credentials to login server
    cluster_network:
      description: Cluster network.
      type: object
      properties:
        masquerading_ip:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
          description: 'The cluster NAT''d or proxy IP which maps to the cluster local IP.

            '
        masquerading_port:
          type: integer
          description: 'Port used together with masquerading_ip to connect to the cluster.

            '
          format: int32
        external_ip:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
          description: The local IP of cluster visible externally.
        http_proxy_list:
          items:
            $ref: '#/components/schemas/cluster_network_entity'
          type: array
          description: List of proxies to connect to the service centers.
        smtp_server:
          $ref: '#/components/schemas/smtp_server'
        ntp_server_ip_list:
          items:
            type: string
          type: array
          description: The list of IP addresses or FQDNs of the NTP servers.
        external_subnet:
          type: string
          description: 'External subnet for cross server communication. The format is

            IP/netmask.

            '
        nfs_subnet_whitelist:
          items:
            type: string
          type: array
          description: 'Comma separated list of subnets (of the form ''a.b.c.d/l.m.n.o'') that

            are allowed to send NFS requests to this container. If not specified,

            the global NFS whitelist will be looked up for access permission.

            The internal subnet is always automatically considered part of the

            whitelist, even if the field below does not explicitly specify it.

            Similarly, all the hypervisor IPs are considered part of the

            whitelist. Finally, to permit debugging, all of the SVMs local IPs

            are considered to be implicitly part of the whitelist.

            '
        external_data_services_ip:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
          description: 'The cluster IP address that provides external entities access to

            various cluster data services.

            '
        domain_server:
          $ref: '#/components/schemas/cluster_domain_server'
        fully_qualified_domain_name:
          type: string
          description: fully qualified domain name of the cluster visible externally.
        name_server_ip_list:
          items:
            pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
            type: string
          type: array
          description: The list of IP addresses of the name servers.
        http_proxy_whitelist:
          items:
            $ref: '#/components/schemas/http_proxy_whitelist'
          type: array
          description: HTTP proxy whitelist.
        internal_subnet:
          type: string
          description: 'The internal subnet is local to every server - its not visible

            outside.iSCSI requests generated internally within the appliance

            (by user VMs or VMFS) are sent to the internal subnet. The format is

            IP/netmask.

            '
        default_vswitch_config:
          $ref: '#/components/schemas/vswitch_config'
      title: Cluster Network Configuration
    cluster_list_metadata_output:
      description: 'All api calls that return a list will have this metadata block

        '
