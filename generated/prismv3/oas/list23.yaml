                              IQN, HYPERVISOR. Specify IQN in case of "iSCSI Qualified Name" based attachments. In case of
                              IQN based attachment, authentication_type, client_secret can be specified for client authentication.
                              Specify HYPERVISOR for directly attaching Volumes to VM through the hypervisor, this is only
                              supported when VM is running on AHV hypervisor."

                              '
