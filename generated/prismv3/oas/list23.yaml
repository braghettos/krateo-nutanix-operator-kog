                \ present at any storage over the network. EARLY - VM/Volume Group will be made available for active\n  consumption\
                \ before completely hydrating the data for them from\n  the recovery point available over the remote network\
                \ storage.\n  Hydration of data will keep happening in the background for the\n  recovered VMs/Volume Groups.\n\
                LATE - VM/Volume Group will be made available for active\n  consumption after completely hydrating the data\
                \ for them from\n  the recovery point available over the remote network storage.\n"
            network_mapping_list:
              items:
                type: object
                properties:
