                    items:
                      required:
                      - availability_zone_url
                      type: object
                      properties:
                        recovery_ip_assignment_list:
                          items:
                            $ref: '#/components/schemas/recovery_plan_vm_ip_assignment'
                          type: array
                          description: 'Static IP configuration for the VMs to be applied post recovery in the recovery network
                            for migrate/ failover action on the Recovery Plan.

                            '
                        test_ip_assignment_list:
                          items:
                            $ref: '#/components/schemas/recovery_plan_vm_ip_assignment'
                          type: array
                          description: 'Static IP configuration for the VMs to be applied post recovery in the test network
                            for test failover action on the Recovery Plan.

                            '
                        availability_zone_url:
                          type: string
                          description: 'URL of the Availability Zone.

                            '
                        recovery_network:
                          $ref: '#/components/schemas/recovery_plan_network'
                        test_network:
                          $ref: '#/components/schemas/recovery_plan_network'
                        cluster_reference_list:
                          items:
                            $ref: '#/components/schemas/cluster_reference'
                          type: array
                          description: 'The clusters where the recovery and test networks reside. This is required to specify
                            network mapping across clusters for a Recovery Plan created to handle failover within the same
                            Availability Zone.

                            '
                    type: array
                    description: 'Mapping of networks across the Availability Zones.

                      '
              type: array
              description: "Network mappings to be used for the Recovery Plan. This will be represented by array of network\
                \ mappings across the Availability Zones. Each entry of network mapping will have Availability Zone URL, recovery\
                \ and test network information, static IP assignment for the VMs for the recovery and test networks. For example,\
                \ Let RNx, TNx denote the recovery and test network information and RIPMx, TIPMx denote the static IP assignment\
                \ for the VMs. As per below matrix, while performing failover action from Availability Zone AZ1 to AZ2, RN1\
                \ will be mapped to RN4 and static IP \"a.b.c.d\" of the VM with reference VMx will be mapped to \"i.j.k.l\"\
                . On performing test failover from AZ1 to AZ2, RN1 will be mapped to TN4 and static IP \"a.b.c.d\" of the\
                \ VM with reference VMx will be mapped to \"I.J.K.L\". [[(AZ1 URL, RN1, TN1, [{VMx, \"a.b.c.d\"}, {VMy, \"\
                e.f.g.h\"}],\n   [{VMx, \"A.B.C.D\"}, {VMy, \"E.F.G.H\"}]),\n  (AZ2 URL, RN4, TN4, [{VMx, \"i.j.k.l\"}, {VMy,\
                \ \"m.n.p.q\"}],\n   [{VMx, \"I.J.K.L\"}, {VMy, \"M.N.P.Q\"}]),\n  (AZ3 URL, RN7, TN7)],\n [(AZ1 URL, RN2,\
                \ TN2), (AZ2 URL, RN5, TN5),\n  (AZ3 URL, RN8, TN8)],\n [(AZ1 URL, RN3, TN3), (AZ2 URL, RN6, TN6)]]\nThe order\
                \ of the static IP assignment for the VMs should remain same across all the networks provided in a network\
                \ mapping. It forms a matrix containing IP mapping for the VMs across the Availability Zones. If a VM has\
                \ multiple static IP addresses, static IP mapping will happen on the array indices. For example, Let IPrxy\
                \ denote an IP address in subnet RNz and IPtxy denote an IP address in the subnet TNz. Lets VMx has two static\
                \ IP address and VMy, VMz has one static IP associated with a vNIC created in network RN1. The IP mapping\
                \ for the VMs will be as below.\n    AZ1, RN1        AZ1, TN1        AZ2, RN3        AZ2, TN2\n[(VMx, [IPr11]),\
                \ (VMx, [IPt11]), (VMx, [IPr12]), (VMx,  [IPt12])] [(VMy, [IPr21]), (VMy, [IPt21]), (VMy, [IPr22]), (VMy,\
                \  [IPt22])] [(VMz, [IPr31]), (VMz, [IPt31]), (VMz, [IPr32]), (VMz,  [IPt32])]\nIn case of recovery of VMs\
                \ from one Prism Element to the other within the same Availability Zone, a list of cluster references where\
                \ the network exists can be specified. The network mapping to be used for a vNIC is decided as follows -\n\
                1. If a VM that has a vNIC in a network N1 on cluster C1, then\n   the network mapping of N1 that has C1 in\
                \ the cluster\n   references list will be used.\n\n2. In case there is no network mapping for N1 with cluster\
                \ C1,\n   the default mapping of N1 for the Availability Zone (in which\n   cluster is not specified), will\
                \ be used if present.\n"
            data_service_ip_mapping_list:
              items:
                type: object
                properties:
                  data_service_ip_mapping:
                    minItems: 2
                    items:
                      $ref: '#/components/schemas/recovery_plan_data_service_ip_config'
                    type: array
                    description: 'Data Services IP address mapping, each entry in this mapping will include Availability Zone
                      URL, Cluster reference, recovery and test data services IP. During the Volume Groups attachment step
                      of Recovery Plan failover operation , the data service IP specified for the target Cluster will be reconfigured
                      in the VMs.

                      '
                    maxItems: 2
              type: array
              description: 'IP address mappings for attaching Volume Groups to VMs upon failover.

                '
            availability_zone_list:
              items:
                $ref: '#/components/schemas/availability_zone_information'
              type: array
              description: 'A list containing information about primary and secondary Availability zones.

                '
            primary_location_index:
              type: integer
              description: 'This field should be set to the index of the Availability Zone in the availability_zone_list which
                should be considered as a protected Availability Zone.

                '
      title: Recovery Plan resources
