        guest_tools:
          $ref: '#/components/schemas/guest_tools_status'
        gpu_console_enabled:
          type: boolean
          description: Indicates whether vGPU console is enabled or not.
        vtpm_config:
          $ref: '#/components/schemas/vm_vtpm_status'
        enable_cpu_passthrough:
          type: boolean
          description: 'Indicates whether to passthrough the host''s CPU features to the guest. Enabling this will disable
            live migration of the VM.

            '
        parent_reference:
          $ref: '#/components/schemas/reference'
        hypervisor_type:
          x-ntnx-enum:
          - ESX
          - HyperV
          - AHV
          type: string
          description: 'The hypervisor type for the hypervisor the VM is hosted on.

            '
        disable_branding:
          type: boolean
          description: 'Indicates whether to remove AHV branding from VM firmware tables.

            '
