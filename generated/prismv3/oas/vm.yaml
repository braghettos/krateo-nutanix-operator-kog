            '
        storage_config:
          $ref: '#/components/schemas/vm_storage_config_status'
        protection_type:
          x-ntnx-enum:
          - UNPROTECTED
          - PD_PROTECTED
          - RULE_PROTECTED
          type: string
          description: 'The type of protection applied on a VM. PD_PROTECTED indicates a VM protected using Prism Element.
            RULE_PROTECTED indicates a VM protected using Prism Central.

            '
        gpu_list:
          items:
            $ref: '#/components/schemas/vm_gpu_output_status'
          type: array
          description: GPUs attached to the VM.
        machine_type:
          x-ntnx-enum:
          - PC
          - PSERIES
          - Q35
          type: string
          description: 'Machine type for the VM. Machine type Q35 is required for secure boot and does not support IDE disks.

            '
        hardware_clock_timezone:
          type: string
          description: 'VM''s hardware clock timezone in IANA TZDB format (America/Los_Angeles).

            '
        guest_customization:
          $ref: '#/components/schemas/guest_customization_status'
        power_state_mechanism:
          $ref: '#/components/schemas/vm_power_state_mechanism'
        is_vcpu_hard_pinned:
          type: boolean
          description: Indicates whether the vCPUs should be hard pinned to specific pCPUs.
        memory_overcommit_enabled:
          type: boolean
