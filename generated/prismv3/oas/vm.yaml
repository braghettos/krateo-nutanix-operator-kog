          $ref: '#/components/schemas/policy_compliance_state'
        enforcement_mode:
          x-ntnx-enum:
          - MONITORING
          - ENFORCING
          - ENFORCEMENT_FAILED
          type: string
          description: 'Policy enforcement mode informs us about what the policy engine is currently doing to enforce the
            policy on the entity. Monitoring indicates that the policy engine is simply monitoring the entity''s state. Enforcing
