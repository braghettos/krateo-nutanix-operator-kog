          - 'ON'
          - 'OFF'
          type: string
          description: The current or desired power state of the VM.
        num_vcpus_per_socket:
          minimum: 1
          type: integer
          description: Number of vCPUs per socket.
          format: int32
        num_sockets:
          minimum: 1
          type: integer
          description: Number of vCPU sockets.
          format: int32
        hardware_virtualization_enabled:
          type: boolean
