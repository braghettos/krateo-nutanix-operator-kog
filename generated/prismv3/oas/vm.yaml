            '
        vnuma_config:
          $ref: '#/components/schemas/vm_vnuma_config'
        nic_list:
          items:
            $ref: '#/components/schemas/vm_nic_output_status'
          type: array
          description: NICs attached to the VM.
        host_reference:
          $ref: '#/components/schemas/reference'
        guest_os_id:
          type: string
          description: String that identifies the OS running inside of the guest. Reserved for use by the system. Do not set
