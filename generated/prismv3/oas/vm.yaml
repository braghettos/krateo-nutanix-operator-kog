        is_agent_vm:
          type: boolean
          description: 'Indicates whether the VM is an agent VM. When their host enters maintenance mode, after normal VMs
            are evacuated, agent VMs are powered off. When the host is restored, agent VMs are powered on before normal VMs
            are restored. In other words, agent VMs cannot be HA-protected or live migrated.

