          properties:
            status:
              x-ntnx-enum:
              - RECOVERABLE
              - PARTIAL_RECOVERABLE
              - UNRECOVERABLE
              type: string
              description: Recoverability status of the entity.
            reason:
              type: string
              description: Reason for the status of the entity.
              maxLength: 256
      title: Recovery Plan information.
    vm_resources_def_status:
      description: VM Resources Status Definition.
      type: object
      properties:
