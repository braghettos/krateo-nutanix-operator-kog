        enable_cpu_passthrough:
          type: boolean
          description: 'Indicates whether to passthrough the host''s CPU features to the guest. Enabling this will disable
            live migration of the VM.

            '
        parent_reference:
          $ref: '#/components/schemas/reference'
        disable_branding:
          type: boolean
          description: 'Indicates whether to remove AHV branding from VM firmware tables.

