      type: http
      scheme: basic
  schemas:
    guest_customization:
      description: 'VM guests may be customized at boot time using one of several different methods. Currently, cloud-init
        w/ ConfigDriveV2 (for Linux VMs) and Sysprep (for Windows VMs) are supported. Only ONE OF sysprep or cloud_init should
        be provided. Note that guest customization can currently only be set during VM creation. Attempting to change it after
        creation will result in an error. Additional properties can be specified. For example - in the context of VM template
        creation if "override_script" is set to "True" then the deployer can upload their own custom script.

        '
      title: Guest Customization Configuration for creation/modification request
      additionalProperties:
        type: string
      type: object
      properties:
        cloud_init:
          description: 'If this field is set, the guest will be customized using cloud-init. Either user_data or custom_key_values
            should be provided. If custom_key_ves are provided then the user data will be generated using these key-value
            pairs.

            '
          type: object
          x-ntnx-one-of:
          - required:
            - user_data
          - required:
            - custom_key_values
          properties:
            meta_data:
              type: string
              description: 'The contents of the meta_data configuration for cloud-init. This can be formatted as YAML or JSON.
                The value must be base64 encoded.

                '
              maxLength: 32000
            user_data:
              type: string
              description: 'The contents of the user_data configuration for cloud-init. This can be formatted as YAML, JSON,
                or could be a shell script. The value must be base64 encoded.

                '
              maxLength: 128000
            custom_key_values:
              $ref: '#/components/schemas/custom_generic_key_value_pair'
        is_overridable:
          type: boolean
          description: Flag to allow override of customization by deployer.
        sysprep:
          description: 'If this field is set, the guest will be customized using Sysprep. Either unattend_xml or custom_key_values
            should be provided. If custom_key_values are provided then the unattended answer file will be generated using
            these key-value pairs.

            '
          type: object
          x-ntnx-one-of:
          - required:
            - unattend_xml
          - required:
            - custom_key_values
          properties:
            install_type:
              x-ntnx-enum:
              - FRESH
              - PREPARED
              type: string
              description: 'Whether the guest will be freshly installed using this unattend configuration, or whether this
                unattend configuration will be applied to a pre-prepared image. Default is "PREPARED".

                '
            unattend_xml:
              type: string
              description: 'This field contains a Sysprep unattend xml definition, as a string. The value must be base64 encoded.

                '
              maxLength: 32000
            custom_key_values:
              $ref: '#/components/schemas/custom_generic_key_value_pair'
      x-ntnx-one-of:
      - required:
        - sysprep
      - required:
        - cloud_init
    vm_vnuma_config:
      description: 'Indicates how VM vNUMA should be configured

        '
      type: object
      properties:
        num_vnuma_nodes:
          type: integer
          description: Number of vNUMA nodes. 0 means vNUMA is disabled.
          format: int64
      title: VM vNUMA configuration
    guest_customization_status:
      description: 'VM guests may be customized at boot time using one of several different methods. Currently, cloud-init
        w/ ConfigDriveV2 (for Linux VMs) and Sysprep (for Windows VMs) are supported. Only ONE OF sysprep or cloud_init should
        be provided. Note that guest customization can currently only be set during VM creation. Attempting to change it after
        creation will result in an error. Additional properties can be specified. For example - in the context of VM template
