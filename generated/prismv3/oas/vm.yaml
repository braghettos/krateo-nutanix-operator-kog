          - SCSI
          - IDE
          - PCI
          - SATA
          - SPAPR
          type: string
      title: Disk Address
    guest_tools_spec:
      description: Information regarding guest tools.
      type: object
      properties:
        nutanix_guest_tools:
          $ref: '#/components/schemas/nutanix_guest_tools_spec'
      title: Guest Tools information
    vm_gpu:
