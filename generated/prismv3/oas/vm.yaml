          format: int32
        num_sockets:
          type: integer
          description: Number of vCPU sockets.
          format: int32
        hardware_virtualization_enabled:
          type: boolean
          description: 'Indicates whether hardware assisted virtualization should be enabled for the Guest OS. Once enabled,
