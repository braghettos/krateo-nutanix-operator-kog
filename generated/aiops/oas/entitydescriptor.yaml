            additionalProperties:
              type: string
            description: 'A value in a key-value pair that represents a map of string keys and values.

              '
          - maxItems: 20
            minItems: 0
            type: array
            description: 'A value in a key-value pair that represents an array of maps of string keys and values.

              '
            items:
              $ref: '#/components/schemas/common.v1.0.config.MapOfStringWrapper'
          - maxItems: 100
            minItems: 0
            type: array
            description: 'A value in a key-value pair that represents a list of integers.

              '
            items:
              type: integer
      additionalProperties: false
      description: 'A map describing a set of keys and their corresponding values.

        '
    common.v1.0.config.MapOfStringWrapper:
      type: object
      properties:
        map:
          type: object
          additionalProperties:
            type: string
          description: 'A map with string keys and values.

            '
      additionalProperties: false
      description: 'A wrapper schema containing a map with string keys and values.

        '
    aiops.v4.0.error.SchemaValidationError:
      type: object
      properties:
        timestamp:
