        downsamplingOperator:
          $ref: '#/components/schemas/common.v1.0.stats.DownSamplingOperator'
        additionalProperties:
          maxItems: 100
          minItems: 0
          type: array
          description: Additional properties for metric descriptor definition. Like anomaly metric, alert metric and search
            UI metric.
          items:
            $ref: '#/components/schemas/common.v1.0.config.KVPair'
      additionalProperties: false
    common.v1.0.config.KVPair:
      type: object
      properties:
        name:
          maxLength: 128
          minLength: 3
          type: string
          description: 'The key of the key-value pair.

            '
        value:
          description: The value associated with the key for this key-value pair
          oneOf:
          - type: string
            description: 'A string value in a key-value pair.

              '
          - type: integer
            description: 'An integer value in a key-value pair.

              '
          - type: boolean
            description: 'An boolean value in a key-value pair.

              '
