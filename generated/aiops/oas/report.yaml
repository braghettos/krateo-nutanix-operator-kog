        messages:
          maxItems: 20
          minItems: 0
          type: array
          description: 'Information, Warning or Error messages that might provide additional contextual information related
            to the operation.

            '
          items:
            $ref: '#/components/schemas/common.v1.0.config.Message'
        extraInfo:
          maxItems: 20
          minItems: 0
          type: array
