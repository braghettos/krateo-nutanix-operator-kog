              '
            example: string
          - type: integer
            description: 'An integer value in a key-value pair.

              '
            example: 60
          - type: boolean
            description: 'An boolean value in a key-value pair.

              '
            example: true
          - maxItems: 100
            minItems: 0
            type: array
            description: 'A value in a key-value pair that represents a list of strings.

              '
            items:
              type: string
              example: string
          - type: object
            additionalProperties:
              type: string
            description: 'A value in a key-value pair that represents a map of string keys and values.

              '
          - maxItems: 20
            minItems: 0
            type: array
            description: 'A value in a key-value pair that represents an array of maps of string keys and values.

              '
            items:
              $ref: '#/components/schemas/common.v1.0.config.MapOfStringWrapper'
          - maxItems: 100
            minItems: 0
            type: array
            description: 'A value in a key-value pair that represents a list of integers.

