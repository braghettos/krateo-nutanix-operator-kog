        message:
          type: string
          description: The message string.
          example: string
        severity:
          $ref: '#/components/schemas/common.v1.0.config.MessageSeverity'
        code:
          type: string
          description: 'The code associated with this message. This string is typically prefixed with the namespace to which
            the endpoint belongs. For example: VMM-40000'
          example: string
        locale:
          type: string
          description: Locale for this message. The default locale would be 'en-US'.
          default: en_US
        errorGroup:
          type: string
