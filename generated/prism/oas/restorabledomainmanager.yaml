                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/prism.v4.0.error.ErrorResponse'
                additionalProperties: false
                description: REST response for all response codes in API path /prism/v4.0/management/restore-sources/{restoreSourceExtId}/restorable-domain-managers
                  Get operation
      x-permissions:
        deploymentList:
        - ON_PREM
        - CLOUD
        operationName: View Restorable Domain Manager
        roleList:
        - Super Admin
        - Prism Admin
        - Prism Viewer
        - Domain Manager Admin
        - Domain Manager Viewer
      x-rate-limit:
      - type: xsmall
        count: 5
        timeUnit: seconds
      - type: small
        count: 5
        timeUnit: seconds
      - type: large
        count: 5
        timeUnit: seconds
      - type: xlarge
        count: 5
        timeUnit: seconds
      x-supported-versions:
      - product: PE
        version: '7.0'
      x-code-samples:
      - lang: Java
        source: "\npackage sample;\n\nimport com.nutanix.pri.java.client.ApiClient;\nimport com.nutanix.pri.java.client.api.DomainManagerBackupsApi;\n\
          import com.nutanix.dp1.pri.prism.v4.management.ListRestorableDomainManagersApiResponse;\nimport org.springframework.web.client.RestClientException;\n\
          \npublic class JavaSdkSample {\n    public static void main(String[] args) {\n        // Configure the client\n\
          \        ApiClient apiClient = new ApiClient();\n        // IPv4/IPv6 address or FQDN of the cluster\n        apiClient.setHost(\"\
          localhost\");\n        // Port to which to connect to\n        apiClient.setPort(9440);\n        // Interval in\
          \ ms to use during retry attempts\n        apiClient.setRetryInterval(5000);\n        // Max retry attempts while\
          \ reconnecting on a loss of connection\n        apiClient.setMaxRetryAttempts(5);\n        // UserName to connect\
          \ to the cluster\n        String username = \"username\";\n        // Password to connect to the cluster\n     \
          \   String password = \"password\";\n        apiClient.setUsername(username);\n        apiClient.setPassword(password);\n\
          \n        // Please add authorization information here if needed.\n        DomainManagerBackupsApi domainManagerBackupsApi\
          \ = new DomainManagerBackupsApi(apiClient);\n\n        \n        String restoreSourceExtId = \"3cbBfCFd-0CaC-89Cb-4fEc-aaEc5A9cafC4\"\
          ;\n        \n        int page = 0;\n        \n        int limit = 50;\n\n        try {\n            ListRestorableDomainManagersApiResponse\
          \ listRestorableDomainManagersApiResponse = domainManagerBackupsApi.listRestorableDomainManagers(restoreSourceExtId,\
          \ page, limit, null);\n            System.out.println(listRestorableDomainManagersApiResponse.toString());\n\n \
          \       } catch (RestClientException ex) {\n            System.out.println(ex.getMessage());\n        }\n    }\n\
          }\n"
      - lang: JavaScript
        source: "\nimport { ApiClient, DomainManagerBackupsApi } from \"@nutanix-api/prism-js-client\";\n\n// Configure the\
          \ client\nlet apiClientInstance = new ApiClient();\n// IPv4/IPv6 address or FQDN of the cluster\napiClientInstance.host\
          \ = 'localhost';\n// Port to which to connect to\napiClientInstance.port = '9440';\n// Max retry attempts while\
          \ reconnecting on a loss of connection\napiClientInstance.maxRetryAttempts = 5;\n// Interval in ms to use during\
          \ retry attempts\napiClientInstance.retryInterval = 5000;\n// UserName to connect to the cluster\napiClientInstance.username\
          \ = 'username';\n// Password to connect to the cluster\napiClientInstance.password = 'password';\n// Please add\
          \ authorization information here if needed.\nlet domainManagerBackupsApi = new DomainManagerBackupsApi(apiClientInstance);\n\
          \nfunction sample() {\n\n    \n    let restoreSourceExtId = \"Ab0ae680-097d-DeBF-AD6d-e2eE6791AaB2\";\n\n    //\
          \ Construct Optional Parameters\n    var opts = {};\n    opts[\"$page\"] = 0;\n    opts[\"$limit\"] = 50;\n    opts[\"\
          $filter\"] = \"string_sample_data\";\n\n\n\n\n    domainManagerBackupsApi.listRestorableDomainManagers(restoreSourceExtId,\
          \ opts).then(({data, response}) => {\n        console.log(`API returned the following status code: ${response.status}`);\n\
          \        console.log(data.getData());\n    }).catch((error) => {\n        console.log(`Error is: ${error}`);\n \
          \   });\n\n}\nsample()\n"
      - lang: Python
        source: "\nimport ntnx_prism_py_client\n\nif __name__ == \"__main__\":\n    # Configure the client\n    config = ntnx_prism_py_client.Configuration()\n\
          \    # IPv4/IPv6 address or FQDN of the cluster\n    config.host = \"localhost\"\n    # Port to which to connect\
          \ to\n    config.port = 9440\n    # Max retry attempts while reconnecting on a loss of connection\n    config.max_retry_attempts\
          \ = 3\n    # Backoff factor to use during retry attempts\n    config.backoff_factor = 3\n    # UserName to connect\
          \ to the cluster\n    config.username = \"username\"\n    # Password to connect to the cluster\n    config.password\
          \ = \"password\"\n    # Please add authorization information here if needed.\n    client = ntnx_prism_py_client.ApiClient(configuration=config)\n\
          \    domain_manager_backups_api = ntnx_prism_py_client.DomainManagerBackupsApi(api_client=client)\n    \n    restore_source_ext_id\
          \ = \"EE8FDd1F-aa3f-EC6b-F5fE-D3B84f57e3a0\"\n    \n    page = 0\n    \n    limit = 50\n\n\n    try:\n        api_response\
          \ = domain_manager_backups_api.list_restorable_domain_managers(restoreSourceExtId=restore_source_ext_id, _page=page,\
          \ _limit=limit)\n        print(api_response)\n    except ntnx_prism_py_client.rest.ApiException as e:\n        print(e)\n\
          \n"
      - lang: Go
        source: "\npackage main\n\nimport (\n    \"fmt\"\n    \"time\"\n    \"github.com/nutanix/ntnx-api-golang-clients/prism-go-client/v4/api\"\
          \n    \"github.com/nutanix/ntnx-api-golang-clients/prism-go-client/v4/client\"\n    import1 \"github.com/nutanix/ntnx-api-golang-clients/prism-go-client/v4/models/prism/v4/management\"\
          \n)\n\nvar (\n    ApiClientInstance *client.ApiClient\n    DomainManagerBackupsApiInstance *api.DomainManagerBackupsApi\n\
          )\n\nfunc main() {\n    ApiClientInstance = client.NewApiClient()\n    // IPv4/IPv6 address or FQDN of the cluster\n\
          \    ApiClientInstance.Host = \"localhost\"\n    // Port to which to connect to\n    ApiClientInstance.Port = 9440\n\
          \    // Interval in ms to use during retry attempts\n    ApiClientInstance.RetryInterval = 5 * time.Second\n   \
          \ // Max retry attempts while reconnecting on a loss of connection\n    ApiClientInstance.MaxRetryAttempts = 5\n\
          \    // UserName to connect to the cluster\n    ApiClientInstance.Username = \"username\"\n    // Password to connect\
          \ to the cluster\n    ApiClientInstance.Password = \"password\"\n    // Please add authorization information here\
          \ if needed.\n    DomainManagerBackupsApiInstance = api.NewDomainManagerBackupsApi(ApiClientInstance)\n\n    \n\
          \    restoreSourceExtId := \"dC6A4B74-C2AE-00F3-56B0-dd6BADAEF0Fa\"\n    \n    page_ := 0\n    \n    limit_ := 50\n\
          \n\n    response, error := DomainManagerBackupsApiInstance.ListRestorableDomainManagers(&restoreSourceExtId, &page_,\
          \ &limit_, nil)\n    if error != nil {\n        fmt.Println(error)\n        return\n    }\n    data, _ := response.GetData().([]import1.RestorableDomainManager)\n\
          \    fmt.Println(data)\n\n}\n\n"
      - lang: cURL
        source: "\ncurl --request GET \\\n     --url \"https://{pc-ip}:9440/api/prism/v4.0/management/restore-sources/DE0af6Ed-B5E7-D166-aBE4-c2fabada5A0a/restorable-domain-managers?$filter=string_sample_data&$limit=50&$page=0\"\
          \ \\\n     --header 'Accept: application/json' \\\n     --header 'Authorization:Basic $APP_ACCESS_TOKEN' \\\n\n"
      - lang: Wget
        source: "\n\nwget --verbose \\\n     --method GET \\\n     --header 'Accept: application/json' \\\n--header 'Authorization:Basic\
          \ $APP_ACCESS_TOKEN' \\\n- \"https://{pc-ip}:9440/api/prism/v4.0/management/restore-sources/eC3bCA8C-38b7-eAd0-24E2-28fFBEBfF2Bb/restorable-domain-managers?$filter=string_sample_data&$limit=50&$page=0\"\
          \n"
