      - name: $filter
        in: query
        description: 'A URL query parameter that allows clients to filter a collection of resources. The expression specified
          with $filter is evaluated for each resource in the collection, and only items where the expression evaluates to
          true are included in the response. Expression specified with the $filter must conform to the [OData V4.01](https://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html)
          URL conventions.

          For example, filter ''$filter=name eq ''karbon-ntnx-1.0'' would filter the result on cluster name ''karbon-ntnx1.0'',
          filter ''$filter=startswith(name, ''C'')'' would filter on cluster name starting with ''C''.

          The filter can be applied to the following fields:

          - extId

          - key

          - ownerUuid

          - type

          - value

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: $orderby
        in: query
        description: 'A URL query parameter that allows clients to specify the sort criteria for the returned list of objects.
          Resources can be sorted in ascending order using asc or descending order using desc. If asc or desc are not specified,
          the resources will be sorted in ascending order by default. For example, ''$orderby=templateName desc'' would get
          all templates sorted by templateName in descending order.

          The orderby can be applied to the following fields:

          - key

          - value

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: $expand
        in: query
