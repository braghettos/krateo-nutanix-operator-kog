          a particular request is retrieved. Each expanded item is evaluated relative to the entity containing the property
          being expanded. Other query options can be applied to an expanded property by appending a semicolon-separated list
          of query options, enclosed in parentheses, to the property name. Permissible system query options are $filter, $select
          and $orderby. The following expansion keys are supported.

          - associations

          - detailedAssociations

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: $select
        in: query
        description: 'A URL query parameter that allows clients to request a specific set of properties for each entity or
