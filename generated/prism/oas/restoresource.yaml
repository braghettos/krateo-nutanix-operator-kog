paths:
  /prism/v4.0/management/restore-sources:
    post:
      tags:
      - DomainManager
      summary: 'Create restore source

        '
      description: "Creates a restore source pointing to a cluster or object store to restore the domain manager. The created\
        \ \nrestore source is intended to be deleted after use. If the restore source is\nnot deleted using the deleteRestoreSource\
        \ API, then it is auto-deleted after sometime. Also note that a restore \nsource will not contain a backup policy.\
        \ It is only used to access the backup data at the location from where \nthe Prism Central may be restored. Credentials\
        \ used to access the restore source are not validated at the time \nof creation of the restore source. They are validated\
        \ when the restore source is used to fetch data.\n"
      operationId: createRestoreSource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/prism.v4.0.management.RestoreSource'
        required: true
      responses:
        '201':
          description: 'Restore source response for cluster identified by the external identifier.

            '
          headers:
            Location:
              style: simple
              explode: false
              schema:
                pattern: ^((http[s]?):\/)?\/?([^:\/\s]+)((\/\w+)*(:[0-9]+)*?\/)([\w\-\.]+[^#?\s]+)(.*)?(#[\w\-]+)?$
                type: string
                description: Indicates the target of a redirection or the URL of a newly created resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/prism.v4.0.management.RestoreSource'
                additionalProperties: false
                description: REST response for all response codes in API path /prism/v4.0/management/restore-sources Post
                  operation
