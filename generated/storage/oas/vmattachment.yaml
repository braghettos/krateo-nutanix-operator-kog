      x-code-samples:
      - lang: Java
        source: "\npackage sample;\n\nimport sto.java.client.api.VolumeGroupApi;\nimport dp1.sto.storage.v4.config.GetVmAttachmentsApiResponse;\n\
          \npublic class JavaSdkSample {\n\tprivate static final VolumeGroupApi volumeGroupApi = new VolumeGroupApi();\n\n\
          \tpublic static void main(String[] args) {\n\t\tvolumeGroupApi.getApiClient().setBasePath(\"https://api.nutanix.com\"\
          );\n\t\tvolumeGroupApi.getApiClient().setBackOffPeriod(100);\n\t\tvolumeGroupApi.getApiClient().setMaxRetryAttempts(2);\n\
          \n\t\tString volumeGroupExtId = \"^BB6cBcB2-0e9a-f7E6-EffE-DB773782C1EB$\";\n\t\tint $page = 0;\n\t\tint $limit\
          \ = 50;\n\t\tGetVmAttachmentsApiResponse getVmAttachmentsApiResponse = volumeGroupApi.getVmAttachments(volumeGroupExtId,\
          \ $page, $limit);\n\t}\n}\n"
      - lang: JavaScript
        source: "\nimport {ApiClient} from \"../src/ApiClient\";\nimport {VolumeGroupApi} from \"../src/apis/VolumeGroup-endpoints\"\
          ;\nimport GetVmAttachmentsApiResponse from \"../src/models/storage/v4/config/GetVmAttachmentsApiResponse\";\n\n\
          var apiClientInstance = new ApiClient();\napiClientInstance.maxRetryAttempts = 2;\napiClientInstance.backOffPeriod\
          \ = 500;\napiClientInstance.basePath = \"https://api.nutanix.com\";\nvar volumeGroupApi = new VolumeGroupApi(apiClientInstance);\n\
          \nfunction sample() {\n    let volumeGroupExtId = \"^bCA2b3ce-d374-aD56-42ee-Ab3D153fDbEB$\";\n    let $page = 0;\n\
          \    let $limit = 50;\n\n    volumeGroupApi.getVmAttachments(volumeGroupExtId, $page, $limit).then(({data, response})\
          \ =>\n        console.log(response.status);\n        console.log(data.getData());\n        done();\n    }).catch((error)\
          \ => {\n        console.log(error);\n        done(error);\n    });\n}\n"
      - lang: Python
        source: "\nimport swagger_client\n\nif __name__ == \"__main__\":\n    configuration = swagger_client.configuration.Configuration()\n\
          \    configuration.host = \"http://api.nutanix.com\"\n    api_client = swagger_client.ApiClient(configuration, max_retry_attempts=1,\
          \ retry_backoff_period=100)\n    volumeGroupApi = swagger_client.VolumeGroupApi(api_client)\n    volumeGroupExtId\
          \ = \"^DF9E224D-d2DE-0025-e6cc-C55f2CDBD2bc$\"\n    $page = 0\n    $limit = 50\n    api_response = volumeGroupApi.get_vm_attachments(volumeGroupExtId,\
          \ $page, $limit)\n"
      - lang: Go
        source: "\npackage main\n\nimport {\n    \"fmt\"\n    \"storage_go_sdk/api\"\n    \"storage_go_sdk/client\"\n}\n\n\
          func main() {\n    var VolumeGroupApiInstance *api.VolumeGroupApi\n    VolumeGroupApiInstance = api.NewVolumeGroupApi()\n\
          \    VolumeGroupApiInstance.ApiClient.BasePath = \"http://localhost:8080\"\n    VolumeGroupApiInstance.ApiClient.AllowVersionNegotiation\
          \ = true\n\n    volumeGroupExtId := \"^fDbAdE2A-19dF-eBfF-F9DA-Ea75A5bd0293$\"\n    $page := 0\n    $limit := 50\n\
          \n    response, _ := VolumeGroupApiInstance.GetVmAttachments(volumeGroupExtId, $page, $limit)\n    fmt.Println(response)\n\
          }\n\n"
      - lang: cURL
        source: "\ncurl --request GET \\\n     --url \"https://api.nutanix.com/storage/v4.0.a3/config/volume-groups/^d7E5CbDD-a5f3-9dec-9D09-AFd1DDCD83aB$/vm-attachments?$limit=50&$page=0\"\
          \ \\\n     --header 'Accept: application/json' \\\n"
      - lang: Wget
        source: "\nwget --verbose \\\n     --method GET \\\n     --header 'Accept: application/json' \\\n     - \"https://api.nutanix.com/storage/v4.0.a3/config/volume-groups/^FbffABFd-6Edd-AAEA-E9Fd-0bcbDf5329fF$/vm-attachments?$limit=50&$page=0\"\
          \n"
