          than the total available pages would be set to the last page.

          '
        required: false
        style: form
        explode: false
        schema:
          minimum: 0
          type: integer
          description: 'A URL query parameter that specifies the page number of the result set.  Must be a positive integer
            between 0 and the maximum number of pages that are available for that resource.  Any number out of this range
            will be set to its nearest bound.  In other words, a page number of less than 0 would be set to 0 and a page number
