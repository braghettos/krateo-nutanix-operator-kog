          true are included in the response. Expression specified with the $filter must conform to the OData V4.01 URL conventions.

          The filter can be applied on the following fields:

          - affinityHostUuid

          - clusterExtId

          - containerExtId

          - containerId

          - name

          - ownerUuid

          - replicationFactor

          - storagePoolUuid

          '
        required: false
        style: form
        explode: true
        schema:
