        description: 'A URL query parameter that specifies the total number of records returned in the result set.  Must be
          a positive integer between 0 and 100. Any number out of this range will be set to the default maximum number of
          records, which is 100.

          '
        required: false
        style: form
        explode: false
        schema:
          maximum: 100
          type: integer
          description: 'A URL query parameter that specifies the total number of records returned in the result set.  Must
            be a positive integer between 0 and 100. Any number out of this range will be set to the default maximum number
            of records, which is 100.

