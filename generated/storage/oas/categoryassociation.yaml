      - lang: Java
        source: "\npackage sample;\n\nimport sto.java.client.api.VolumeGroupApi;\nimport dp1.sto.storage.v4.config.GetCategoryAssociationsApiResponse;\n\
          \npublic class JavaSdkSample {\n\tprivate static final VolumeGroupApi volumeGroupApi = new VolumeGroupApi();\n\n\
          \tpublic static void main(String[] args) {\n\t\tvolumeGroupApi.getApiClient().setBasePath(\"https://api.nutanix.com\"\
          );\n\t\tvolumeGroupApi.getApiClient().setBackOffPeriod(100);\n\t\tvolumeGroupApi.getApiClient().setMaxRetryAttempts(2);\n\
          \n\t\tString volumeGroupExtId = \"^B6FEdBE9-b003-DEAb-DCAb-B1BcDE7F9c62$\";\n\t\tint $page = 0;\n\t\tint $limit\
          \ = 50;\n\t\tGetCategoryAssociationsApiResponse getCategoryAssociationsApiResponse = volumeGroupApi.getCategoryAssociations(volumeGroupExtId,\
          \ $page, $limit);\n\t}\n}\n"
      - lang: JavaScript
        source: "\nimport {ApiClient} from \"../src/ApiClient\";\nimport {VolumeGroupApi} from \"../src/apis/VolumeGroup-endpoints\"\
          ;\nimport GetCategoryAssociationsApiResponse from \"../src/models/storage/v4/config/GetCategoryAssociationsApiResponse\"\
          ;\n\nvar apiClientInstance = new ApiClient();\napiClientInstance.maxRetryAttempts = 2;\napiClientInstance.backOffPeriod\
          \ = 500;\napiClientInstance.basePath = \"https://api.nutanix.com\";\nvar volumeGroupApi = new VolumeGroupApi(apiClientInstance);\n\
          \nfunction sample() {\n    let volumeGroupExtId = \"^C4EEabFf-5dc2-B46e-d8Fd-dAdBe64cC9ef$\";\n    let $page = 0;\n\
          \    let $limit = 50;\n\n    volumeGroupApi.getCategoryAssociations(volumeGroupExtId, $page, $limit).then(({data,\
          \ response}) =>\n        console.log(response.status);\n        console.log(data.getData());\n        done();\n\
          \    }).catch((error) => {\n        console.log(error);\n        done(error);\n    });\n}\n"
      - lang: Python
        source: "\nimport swagger_client\n\nif __name__ == \"__main__\":\n    configuration = swagger_client.configuration.Configuration()\n\
          \    configuration.host = \"http://api.nutanix.com\"\n    api_client = swagger_client.ApiClient(configuration, max_retry_attempts=1,\
          \ retry_backoff_period=100)\n    volumeGroupApi = swagger_client.VolumeGroupApi(api_client)\n    volumeGroupExtId\
          \ = \"^BeFDBF5f-Bbc6-c3D6-Fc7E-8A89edb7A2fC$\"\n    $page = 0\n    $limit = 50\n    api_response = volumeGroupApi.get_category_associations(volumeGroupExtId,\
          \ $page, $limit)\n"
      - lang: Go
        source: "\npackage main\n\nimport {\n    \"fmt\"\n    \"storage_go_sdk/api\"\n    \"storage_go_sdk/client\"\n}\n\n\
          func main() {\n    var VolumeGroupApiInstance *api.VolumeGroupApi\n    VolumeGroupApiInstance = api.NewVolumeGroupApi()\n\
          \    VolumeGroupApiInstance.ApiClient.BasePath = \"http://localhost:8080\"\n    VolumeGroupApiInstance.ApiClient.AllowVersionNegotiation\
          \ = true\n\n    volumeGroupExtId := \"^1cC71dAF-04fc-C09A-fFF5-CeCFf2DDa4bf$\"\n    $page := 0\n    $limit := 50\n\
          \n    response, _ := VolumeGroupApiInstance.GetCategoryAssociations(volumeGroupExtId, $page, $limit)\n    fmt.Println(response)\n\
          }\n\n"
      - lang: cURL
        source: "\ncurl --request GET \\\n     --url \"https://api.nutanix.com/storage/v4.0.a3/config/volume-groups/^b5bbAB59-FCBD-eCB5-0f8C-d2DeAB23AbcE$/category-associations?$limit=50&$page=0\"\
          \ \\\n     --header 'Accept: application/json' \\\n"
      - lang: Wget
        source: "\nwget --verbose \\\n     --method GET \\\n     --header 'Accept: application/json' \\\n     - \"https://api.nutanix.com/storage/v4.0.a3/config/volume-groups/^5dfAbedb-3850-57A2-F13f-cdD057cCC5aE$/category-associations?$limit=50&$page=0\"\
          \n"
