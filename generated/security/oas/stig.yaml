          URL conventions. If a $select expression consists of a single select item that is an asterisk (i.e., *), then all
          properties on the matching resource will be returned.
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: string
        x-odata-fields:
        - name: affectedClusters
          example: https://{pc-ip}:9440/api/security/v4.0/report/stigs?$select=affectedClusters
        - name: benchmarkId
          example: https://{pc-ip}:9440/api/security/v4.0/report/stigs?$select=benchmarkId
        - name: comments
          example: https://{pc-ip}:9440/api/security/v4.0/report/stigs?$select=comments
        - name: extId
          example: https://{pc-ip}:9440/api/security/v4.0/report/stigs?$select=extId
        - name: fixText
