          : [\n            \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\n        ],\n        \"TargetType\": \"string\",\n   \
          \     \"VMUuids\": [\n            \"b4d15375-1097-4c96-a4c4-4cb5809b05bb\"\n        ]\n    },\n    \"Limit\": 0,\n\
          \    \"Query\": \"string\",\n    \"RefreshInventory\": false,\n    \"ShowVMS\": \"all\",\n    \"SortBy\": \"VMName\"\
          ,\n    \"SortOrderDesc\": true,\n    \"UpdateInventoryToPlans\": true\n}'"
