          \ 'Content-Type: application/json' \\\n    --data '{\n    \"AfterOffset\": 0,\n    \"BeforeOffset\": 0,\n    \"\
          Fields\": [\n        \"string\"\n    ],\n    \"Filter\": {\n        \"Categories\": {\n            \"property1\"\
          : [\n                \"string\"\n            ],\n            \"property2\": [\n                \"string\"\n    \
          \        ]\n        },\n        \"Cluster\": [\n            \"string\"\n        ],\n        \"Datacenter\": [\n\
