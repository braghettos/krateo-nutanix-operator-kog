components:
  securitySchemes:
    Bearer:
      in: header
      name: Authorization
      type: apiKey
  schemas:
    VpcProps:
      description: VPC-related properties of the source VM.
      properties:
        ID:
          description: VPC identifier.
          type: string
        Name:
          description: VPC name.
          type: string
      type: object
    Error:
      description: Error information
      properties:
        ApiVersion:
          description: Move API version.
          type: string
        Code:
          description: Error Code.
          format: uint64
          type: integer
        Kind:
          description: Error kind.
          type: string
        Message:
          description: Error Message.
          type: string
        State:
          description: Error State.
          type: string
      required:
      - Message
      type: object
    SecurityPolicyEntity:
      description: Security policy entity information.
      properties:
        Entities:
          description: It can be id if it is an object such as Address Group or Category, or it can be an IP address if it
            is a single Raw IpAddress, such as 10.10.1/24 or 10.10.10.10
          items:
            type: string
          type: array
        EntitySubType:
          description: The sub type of the entity.
          enum:
          - Category
          - Address Group
          - Raw IpAddress
          type: string
        EntityType:
          description: The type of the entity.
          enum:
          - VM
          - Network Address
          type: string
      type: object
    ShareInventory:
      description: Share inventory information.
      properties:
        AdditionalProperties:
          additionalProperties:
            type: string
          type: object
        ProtocolTypes:
          description: Protocol types supported by the share.
          items:
            type: string
          type: array
        RecID:
          description: Database index.
          format: int64
          type: integer
        ShareName:
          description: Name of the share.
          type: string
        SharePath:
          description: Path of the share.
          type: string
        ShareUuid:
          description: UUID of share.
          type: string
        SourceUuid:
          description: UUID of source provider.
          type: string
      type: object
    NsxPolicyToFnsPolicyMinimal:
      description: Minimal information about the NSX security policy  translated to the FNS policy.
      properties:
        FnsSplitPoliciesNames:
          description: List of names of the split policies in FNS corresponding to given NSX policy.
          items:
            type: string
          type: array
        Nsx:
          $ref: '#/components/schemas/NsxSecurityPolicy'
      type: object
    Category:
      description: This is the category collected from Prism Central.
      properties:
        Description:
          description: Description of the Category.
          type: string
        Id:
          description: ID of the category.
          type: string
        Key:
          description: Key of the category
          type: string
        ProviderUuid:
          description: UUID of provider.
          type: string
        RecId:
          description: Index of the record in the Database.
          format: int64
          type: integer
        ResourceType:
          description: Resource type of the entity (Category).
          type: string
        Type:
          description: created by user or system
          type: string
        Value:
          description: value of the category
          type: string
      type: object
    NsService:
      description: NsService information.
      properties:
        CreateUser:
          description: ID of the user who created.
          type: string
        DefaultService:
          description: Boolean denoting if the service is present by default.
          type: boolean
        Description:
          description: Description of the NsService.
          type: string
        Id:
          description: ID of NsService.
          type: string
        Name:
          description: Name of the NsService.
          type: string
        ProviderUuid:
          description: UUID of provider.
          type: string
        RecId:
          description: Index of the record in the Database.
          format: int64
          type: integer
        ResourceType:
          description: Resource type of the NSX entity.
          type: string
        ServiceElements:
          description: Additional info of the service, specific to the service type.
          items:
            $ref: '#/components/schemas/ServiceEntry'
          type: array
        SystemOwned:
          description: Boolean denoting if the service is system owned.
          type: boolean
      type: object
    AddressGroup:
      description: This is the address group collected from Prism Central.
      properties:
        Description:
          description: Description of the address group.
          type: string
        Id:
          description: ID of address group.
          type: string
        IpRanges:
          description: List of IP ranges.
          items:
            $ref: '#/components/schemas/IpRange'
          type: array
        Ipv4Addresses:
          description: List of IPv4 addresses.
          items:
            $ref: '#/components/schemas/Ipv4Address'
          type: array
        Name:
          description: Name of the address group.
          type: string
        ProviderUuid:
          description: UUID of provider.
          type: string
        RecId:
          description: Index of the record in the Database.
          format: int64
          type: integer
        ResourceType:
          description: Resource type of the address group entity.
          type: string
      type: object
    SecurityPolicyInventoryMetadata:
      description: Security policy inventory metadata.
      properties:
        AddressGroups:
          $ref: '#/components/schemas/InventoryMetadata'
        Categories:
          $ref: '#/components/schemas/InventoryMetadata'
        NsGroups:
          $ref: '#/components/schemas/InventoryMetadata'
        NsServices:
          $ref: '#/components/schemas/InventoryMetadata'
        NsVirtualMachines:
          $ref: '#/components/schemas/InventoryMetadata'
        NsVpcs:
          $ref: '#/components/schemas/InventoryMetadata'
        SecurityPolicies:
          $ref: '#/components/schemas/InventoryMetadata'
      type: object
    NsGroupEffectiveMembers:
      description: Group of different effective members of the NsGroup.
      properties:
        IpAddresses:
          description: List of effective IP addresses of the NsGroup.
          items:
            type: string
          type: array
        VirtualMachineIds:
          description: List of IDs of effective virtual machines of the NsGroup.
          items:
            type: string
          type: array
      type: object
    SecurityPolicy:
      description: Security policy information.
      properties:
        Category:
          description: Category of the security policy.
          type: string
        CreateUser:
          description: ID of the user who created the policy.
          type: string
        Id:
          description: ID of security policy.
          type: string
        Name:
          description: Name of the security policy.
          type: string
        ProviderUuid:
          description: UUID of provider.
          type: string
        RecId:
          description: Index of the record in the Database.
          format: int64
          type: integer
        ResourceType:
          description: Resource type of the NSX entity.
          type: string
        RuleCount:
          description: Count of all rules in the security policy.
          format: int64
          type: integer
        Rules:
          items:
            $ref: '#/components/schemas/SecurityPolicyRule'
          type: array
        SecuredEntity:
          $ref: '#/components/schemas/SecuredEntity'
        SequenceNumber:
          description: Sequence number of the security policy.
          format: int64
          type: integer
        UniqueId:
          description: UniqueId of the security policy.
          type: string
      type: object
    NsxSecurityPolicy:
      description: The NSX security policy info used during the translation of security policies.
      properties:
        PolicyName:
          description: The NSX security policy name.
          type: string
        PolicyUuid:
          description: The NSX security policy UUID.
          type: string
      type: object
    IpRange:
      description: This is the IP range collected from Prism Central.
      properties:
        EndIp:
          description: End IP of the range.
          type: string
        ResourceType:
          description: Resource type of the entity (IP Range).
          type: string
        StartIp:
          description: Start IP of the range.
          type: string
      type: object
    ServiceEntry:
      description: Additional details of a service such as type, protocol, port etc.
      properties:
        DestinationPorts:
          description: List of destination ports of the service.
          items:
            type: string
          type: array
        IcmpCode:
          description: The ICMP code of the service.
          format: int64
          type: integer
        IcmpType:
          description: The ICMP type of the service.
          format: int64
          type: integer
        MarkedForDelete:
          description: Denotes if the service is deleted locally.
          type: boolean
        Overridden:
          description: Denotes if the service is overridden locally.
          type: boolean
        Protocol:
          description: The protocol of the service, such as TCP or UDP, or ICMPv4.
          type: string
        ResourceType:
          description: Type of the service entry.
          enum:
          - L4PortSetServiceEntryType
          - ICMPTypeServiceEntryType
          type: string
        SourcePorts:
          description: List of source ports of the service.
          items:
            type: string
          type: array
      type: object
    SearchFilter:
      description: Filter to select and view specific VMs from a workload.
      properties:
        AfterOffset:
          format: int64
          type: integer
        BeforeOffset:
          format: int64
          type: integer
        Fields:
          items:
            type: string
          type: array
        Filter:
          $ref: '#/components/schemas/Filters'
        Limit:
          format: int64
          type: integer
        Query:
          type: string
        RefreshInventory:
          description: Refresh Provider Inventory.
          type: boolean
        ShowVMS:
          enum:
          - all
          - ineligiblevms
          - eligiblevms
          type: string
        SortBy:
          $ref: '#/components/schemas/SortColumn'
        SortOrderDesc:
          type: boolean
        UpdateInventoryToPlans:
          description: Update refreshed inventory details to all available plans which have the provider as the source. This
            flag is honored only if 'RefreshInventory' is also 'true'.
          type: boolean
      type: object
    NsGroup:
      description: NsGroup information.
      properties:
        CreateUser:
          description: ID of the user who created.
          type: string
        Description:
          description: Description of the NsGroup.
          type: string
        EffectiveMembers:
          $ref: '#/components/schemas/NsGroupEffectiveMembers'
        Id:
          description: ID of NsGroup.
          type: string
        IsNestedGroup:
          description: Denotes if the NsGroup is a nested group or not.
          type: boolean
        MemberCount:
          description: Member count of the NsGroup. Valid only for static membership.
          format: int64
          type: integer
        Name:
          description: Name of the NsGroup.
          type: string
        ProviderUuid:
          description: UUID of provider.
          type: string
        RecId:
          description: Index of the record in the Database.
          format: int64
          type: integer
        ResourceType:
