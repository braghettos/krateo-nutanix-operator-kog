- url: /
security: []
paths:
  /move/v2/plans/{id}/prepare:
    get:
      description: Get the preparation details of the plan.
      operationId: getPreperationDetails
      parameters:
      - description: Migration plan UUID.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestOperationsEntity'
      security:
      - Bearer: []
      summary: Get the preparation details of the plan
      tags:
      - Plan
