                VMId: vm-18954
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestOperationsEntity'
        description: Workload credentials to prepare the source environment.
      responses:
        '202':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepareWorkloadsResponse'
            awsauto1: {}
            awsauto2: {}
            awsauto3: {}
            awsmanual: {}
            esxhyperv: {}
