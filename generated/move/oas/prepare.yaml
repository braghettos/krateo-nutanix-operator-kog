components:
  securitySchemes:
    Bearer:
      in: header
      name: Authorization
      type: apiKey
  schemas:
    VMResult:
      description: VM information for readiness check results.
      properties:
        Message:
          type: string
        Status:
          description: VM status.
          type: string
        VMId:
          description: VM Id.
          type: string
        VMName:
          description: VM name.
          type: string
      type: object
    PrepareWorkloadsResponse:
      description: Workload preparation status.
      properties:
        APIVersion:
          description: Move API version.
          type: string
        MetaData:
          $ref: '#/components/schemas/MetaData'
        Spec:
          $ref: '#/components/schemas/GuestOperationsInput'
        Status:
          $ref: '#/components/schemas/PrepareWorkloadsResultEntity'
        TaskUUID:
          description: Task UUID for the prepare plan.
          format: uuid
          type: string
      type: object
    VpcProps:
      description: VPC-related properties of the source VM.
      properties:
        ID:
          description: VPC identifier.
          type: string
        Name:
          description: VPC name.
          type: string
      type: object
    Error:
      description: Error information
      properties:
        ApiVersion:
          description: Move API version.
          type: string
        Code:
          description: Error Code.
          format: uint64
          type: integer
        Kind:
          description: Error kind.
          type: string
        Message:
          description: Error Message.
          type: string
        State:
          description: Error State.
          type: string
      required:
      - Message
      type: object
    GuestOperationsInput:
      properties:
        CommonCredentials:
          $ref: '#/components/schemas/Credentials'
        GuestPrepMode:
          enum:
          - manual
          - auto
          type: string
        RePrepareVMs:
          description: Flag to indicate if all the VMs need to be re-prepared.
          type: boolean
        Region:
          type: string
        RunInBackground:
          type: boolean
        VMInventory:
          additionalProperties:
            $ref: '#/components/schemas/VMConversionEntity'
          description: Mapping of VM UUIDs to VM entity for conversion plan.
        VMs:
          items:
            $ref: '#/components/schemas/GuestCredentials'
          type: array
      type: object
    VMConversionEntity:
      description: VM conversion entity.
      properties:
        VMSpec:
          $ref: '#/components/schemas/VMInventory'
      type: object
    NsxPolicyToFnsPolicyMinimal:
      description: Minimal information about the NSX security policy  translated to the FNS policy.
      properties:
        FnsSplitPoliciesNames:
          description: List of names of the split policies in FNS corresponding to given NSX policy.
          items:
            type: string
          type: array
        Nsx:
          $ref: '#/components/schemas/NsxSecurityPolicy'
      type: object
    PrepareWorkloadsResultEntity:
      description: Workloads preparation result.
      properties:
        AgentID:
          description: Move Agent Id
          type: string
        Message:
          description: Message
          type: string
        Result:
          $ref: '#/components/schemas/PrepareWorkloadsResult'
        State:
          description: Migration plan state
          type: string
      type: object
    NsxSecurityPolicy:
      description: The NSX security policy info used during the translation of security policies.
      properties:
        PolicyName:
          description: The NSX security policy name.
          type: string
        PolicyUuid:
          description: The NSX security policy UUID.
          type: string
      type: object
    GuestScript:
      properties:
        LinuxGuestCleanupScript:
          description: Linux Guest Cleanup Script.
          items:
            type: string
          type: array
        LinuxGuestScript:
          description: Linux Guest Script.
          items:
            type: string
          type: array
        Region:
          type: string
        WindowsGuestCleanupScript:
          description: Windows Guest Cleanup Script.
          items:
            type: string
          type: array
        WindowsGuestScript:
          description: Windows Guest Script.
          items:
            type: string
          type: array
      type: object
    MetaData:
      description: Metadata information
      properties:
        Count:
          type: integer
        CreationTime:
          description: Token creation time.
          type: string
        Kind:
          type: string
        LastUpdateTime:
          description: Last updated time.
          type: string
        Name:
          description: User name
          type: string
        SpecVersion:
          description: Specification version
          type: string
        UUID:
          description: UUID
          format: uuid
          type: string
      type: object
    VMInventory:
      description: VM Inventory information.
      properties:
        AdditionalProperties:
          additionalProperties:
            type: string
          type: object
        AssociatedCategories:
          description: The list of categories associated with the Virtual Machine.
          items:
            type: string
          type: array
        AssociatedPolicies:
          description: The list of NSX security policies associated with the Virtual Machine.
          items:
            $ref: '#/components/schemas/NsxPolicyToFnsPolicyMinimal'
          type: array
        Categories:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
        ClusterName:
          type: string
        DatacenterName:
          type: string
        ErrorMessages:
          items:
            type: string
          type: array
        HostName:
          type: string
