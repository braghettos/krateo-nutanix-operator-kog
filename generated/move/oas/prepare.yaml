    post:
      description: Prepares the source VMs in a migration plan. For example- Install VirtIO drivers, retaining IP and so on.<br/>
        If the preparation mode is set to 'manual', the API returns OS specific scripts that can be executed manually to prepare
        the source VMs. <br/><br/><b>Sample API Syntax:</b> https://move.address/move/v2/plans/867b4a4f-cb8c-4416-8d7e-26e033023aa4/prepare
      operationId: preparePlan
      parameters:
      - description: Migration plan UUID.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Uninstall guest tools flag.
        in: query
        name: UninstallGuestTools
        schema:
          type: boolean
      - description: Skip IP retention flag.
        in: query
        name: SkipIPRetention
        schema:
          type: boolean
      - description: Install NGT flag
        in: query
        name: InstallNGT
        x-examples:
          awsauto:
            Spec:
              CommonCredentials:
                LinuxPassword: linux_password
                LinuxUserName: linux_username
                PemFile: ''
                WindowsPassword: windows_password
                WindowsUserName: windows_username
              GuestPrepMode: auto
              Region: ap-south-1
              VMs:
              - Password: vm_password
                UUID: 00000000-0000-0000-2cf9-70aeef8c742c
                UserName: vm_username
          esxhyperv:
            Spec:
              CommonCredentials:
                LinuxPassword: linux_password
                LinuxUserName: linux_username
              VMs:
