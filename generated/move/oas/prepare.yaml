          type: string
      type: object
    NetworkInventory:
      description: Network Inventory information.
      properties:
        Devices:
          description: List of devices in the network.
          items:
            format: int32
            type: integer
          type: array
        ID:
          description: Network Id.
          type: string
        IpAddresses:
          description: List of IP addresses of devices in this network.
          items:
            type: string
          type: array
        MacIDs:
          description: List of MAC addresses of devices in this network.
          items:
            type: string
          type: array
        Name:
          description: Network name.
          type: string
        VPC:
          $ref: '#/components/schemas/VpcProps'
      type: object
    VmIpConf:
      description: IP address information for the source VM NIC, such as IP address, netmask, gateway, and DNS.
      properties:
        DnsIps:
          description: Comma separated DNS IPs, such as '8.8.8.8,8.8.4.4'
          type: string
        Gateway:
          description: The gateway for the given IP address.
          type: string
        IpAddress:
          description: The IP address in IPv4 notation.
          type: string
        PrefixLength:
          description: The number denoting the subnet mask in CIDR notation for the given IP address, i.e.  for a CIDR notation
            "10.10.10.10/24", "24" is the prefix length. Valid value x such that 0 <= x <= 32.
          format: int32
          maximum: 32
          minimum: 0
          type: integer
      type: object
