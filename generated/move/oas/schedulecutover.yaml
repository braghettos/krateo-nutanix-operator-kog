components:
  securitySchemes:
    Bearer:
      in: header
      name: Authorization
      type: apiKey
  schemas:
    ScheduleCutoverResult:
      description: Result of workload batch action.
      properties:
        ErrorMessage:
          description: Error message that indicates whether the workload batch action failed.
          type: string
        ScheduleCutoverConfig:
          $ref: '#/components/schemas/ScheduleCutoverConfig'
        Success:
          description: Flag that indicates whether the workload batch action is completed.
          type: boolean
      required:
      - ScheduleCutoverConfig
      type: object
    ScheduleCutoverResponse:
      description: Response of the workload batch action.
      properties:
        Status:
          description: Status of workload batch action.
          items:
            $ref: '#/components/schemas/ScheduleCutoverResult'
          type: array
      type: object
    ScheduleCutoverConfig:
      description: Plan and workload UUIDs.
      properties:
        PlanReference:
          description: Migration plan UUID.
          format: uuid
          type: string
        ScheduleCutoverFlag:
          description: Schedule cutover flag.
          type: boolean
        ScheduleCutoverOptions:
          $ref: '#/components/schemas/ScheduleCutoverOptions'
        WorkloadReference:
          description: Workload UUID.
          format: uuid
          type: string
      required:
      - PlanReference
      - WorkloadReference
      - ScheduleCutoverFlag
      type: object
    PlanWorkloadReference:
      description: Plan and workload UUIDs.
      properties:
        Password:
          description: Password of the workload.
          type: string
        PlanReference:
          description: Migration plan UUID.
          format: uuid
          type: string
        UserName:
          description: Username of the workload.
          type: string
        WorkloadReference:
          description: Workload UUID.
          format: uuid
          type: string
      required:
      - PlanReference
      - WorkloadReference
      type: object
    Error:
      description: Error information
      properties:
        ApiVersion:
          description: Move API version.
          type: string
        Code:
          description: Error Code.
          format: uint64
          type: integer
        Kind:
          description: Error kind.
          type: string
        Message:
          description: Error Message.
          type: string
        State:
          description: Error State.
          type: string
      required:
      - Message
      type: object
    ScheduleCutoverOptions:
      description: ScheduleCutover Options
      properties:
        Autocutover:
          description: Set schedule cutover to auto cutover.
          type: boolean
        EndDateTime:
          description: End date and time information.
          type: string
        StartDateTime:
          description: Start date and time information.
          type: string
        Timezone:
          description: Required to store for UI.
          type: string
      type: object
    GetScheduleCutoverPayload:
      description: Schedule cutover payload.
      properties:
        Spec:
          description: Reference of required VMs.
          items:
            $ref: '#/components/schemas/PlanWorkloadReference'
          type: array
      required:
      - Spec
      type: object
    ScheduleCutoverAction:
      description: Schedule cutover action.
      properties:
        Spec:
          description: Workload schedule cutover action request.
          properties:
            ScheduleCutoverConfigurations:
              description: Schedule cutover configurations.
              items:
                $ref: '#/components/schemas/ScheduleCutoverConfig'
              type: array
          required:
          - ScheduleCutoverConfigurations
          type: object
      required:
      - Spec
      type: object
