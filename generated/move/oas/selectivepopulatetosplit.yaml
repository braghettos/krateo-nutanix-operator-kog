openapi: 3.0.0
info:
  description: "# Introduction\n\n**Nutanix Move (Move)** is a cross-hypervisor mobility solution to move VMs with minimal\
    \ downtime. Move helps streamline 'lift-and-shift' virtual machine (VM) migrations to a Nutanix Enterprise Cloud. Move\
    \ provides:\n\n- Streamlined migrations with one-click simplicity\n- Near-zero downtime with full cutover control\n- Simple\
    \ test migrations and roll-back capabilities\n- Cost efficiency included with all Nutanix software editions. \n\nThis\
    \ document covers APIs that are available in Move-6.2.0.\n\nRefer to the [Move user guide](https://portal.nutanix.com/page/documents/details?targetId=Nutanix-Move:Nutanix-Move)\
    \ for more information related to the supported source to target migration details.\n\n> Note: Since the infrastructure\
    \ underneath is completely different, a small downtime is incurred during cutover from any of the above sources to targets.\n\
    \n\n# Authentication\n\n**Move uses JWT token based bearer authentication.**\n\nThe user provides username and password\
    \ once to generate an authentication token (using the login API).\nThis authentication token is added as an HTTP Authorization\
    \ header every time a request is sent.\n\n## Best Practice\n\nIt is advised that the user revoke the authentication token\
    \ using the Revoke API after completing required tasks.\n\n**Error codes**\n\nList of HTTP Status codes returned by Move\
    \ application:\n\n|Error codes    |       Messages    |\n| :-----------: | :----- |\n| 200 |   Successful operation  \
    \  |\n| 201       |  Created|\n| 202    | Accepted |\n| 204    | No Content  |\n| 401    | Unauthorized  |\n| 403    |\
    \ Forbidden  |\n| 404    | Not Found   |\n| 409    | Conflict  |\n| 422    | Unprocessable Entity  |\n| 500    | Internal\
    \ Server Error  |\n| 501    | Not Implemented  |\n| 503    |      Service unavailable |\n\n# Workflow\n\nThis documentation\
    \ helps in familiarizing with **Nutanix Move V2 API workflow**. The API's need to be executed in the following sequence\
    \ to successfully migrate a VM using the Move application.\n\n**Authentication:**\n\n- [Login](#tag/User/operation/loginUser)-\
    \ User has to login and obtain an authentication token. This token is used for authorization in all APIs.\n\n**Inventory:**\n\
    \n- [Add the source and target provider](#tag/Provider/operation/createProvider) for migration.\n- [Fetch provider Inventory](#tag/Provider/operation/getProvider)\
    \ to obtain provider networks and VMs information.\n\n**Migration:**\n\n- [Create a Migration plan](#tag/Plan/operation/createPlan)\
    \ by providing source information, target information, network mappings, schedule settings, and workload.\n\n- [Prepare\
    \ the VMs for Migration](#tag/Plan/operation/preparePlan)\u2013 in manual or automatic mode. If the preparation mode is\
    \ set to 'manual', OS specific scripts are to be executed manually to prepare the source VMs.\n\n- [Perform readiness\
    \ checks](#tag/Plan/operation/checkReadiness) to confirm if that particular migration plan is ready to start.\n\n- [Start\
    \ the Migration plan](#tag/Plan/operation/startPlan) and wait for VMs to reach the cutover state. User can[ view workload\
    \ details](#tag/Workload/operation/getAllWorkloads) for a migration plan and the list of actions that can be performed\
    \ on the current VM.\n\n- [Perform cutover](#tag/Plan/operation/workloadAction). The cutover process begins immediately\
    \ and takes a few minutes. Once the cutover is complete, the VM is ready for use in the target provider.\n\n**Application:**\n\
    \n- [View the application information](#tag/Application/operation/getAppInfo).\n\n- [Check if an upgrade ](#tag/Upgrade/operation/checkUpgrade)\
    \ is available and [initiate an upgrade](#tag/Upgrade/operation/initUpgrade) Users can also upload files to do an [offline\
    \ upgrade](#tag/Upgrade/operation/getUploadedUpgradeInfo) of the Move application.\n\n- In case of issues, the[ support\
    \ bundle can be downloaded ](#tag/Application/operation/getSupportBundle) to provide logs and information about the current\
    \ state of the VM.\n"
  title: Nutanix Move REST APIs
  version: 2.4.0
servers:
- url: /
security: []
paths:
  /move/v2/translatedsecuritypolicy/fnspoliciespreview/selectivepopulatetosplit:
    post:
      description: Populate split FNS policies preview of a translated security policy as per user request. The API is in
        beta and might be subjected to change. This API checks the migration validations and stores the status internally.
      operationId: SelectivePopulateToSplitFppInTranslatedSecurityPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectivePopulateToSplitFppTspRequest'
        required: true
      responses:
        '200':
          description: Basic success information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectivePopulateToSplitFppTspResponse'
      security:
      - Bearer: []
      summary: Populate split FNS policies preview of a translated security policy
      tags:
      - Translation
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://www.nutanix.dev//move/v2/translatedsecuritypolicy/fnspoliciespreview/selectivepopulatetosplit\
          \ \\\n    --header 'Accept: application/json' \\\n    --header 'Authorization: Bearer <your_access_token>' \\\n\
          \    --header 'Content-Type: application/json' \\\n    --data '{\n    \"AddNsxInfo\": false,\n    \"NsxPolicyUuid\"\
          : \"string\",\n    \"SplitMethod\": \"ByRulesCount\",\n    \"TranslationKey\": {\n        \"PlanId\": \"string\"\
          ,\n        \"SourceProviderId\": \"string\",\n        \"TargetProviderId\": \"string\"\n    }\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Authorization:\
          \ Bearer <your_access_token>' \\\n    --header 'Content-Type: application/json' \\\n    --body-data '{\n    \"AddNsxInfo\"\
          : false,\n    \"NsxPolicyUuid\": \"string\",\n    \"SplitMethod\": \"ByRulesCount\",\n    \"TranslationKey\": {\n\
          \        \"PlanId\": \"string\",\n        \"SourceProviderId\": \"string\",\n        \"TargetProviderId\": \"string\"\
          \n    }\n}' \\\n    --output-document \\\n    - https://www.nutanix.dev//move/v2/translatedsecuritypolicy/fnspoliciespreview/selectivepopulatetosplit"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Authorization\": \"Bearer <your_access_token>\",\n    \"Content-Type\": \"application/json\"\
          \n}\n\npayload =  \"\"\"{\n    \"AddNsxInfo\": false,\n    \"NsxPolicyUuid\": \"string\",\n    \"SplitMethod\":\
          \ \"ByRulesCount\",\n    \"TranslationKey\": {\n        \"PlanId\": \"string\",\n        \"SourceProviderId\": \"\
          string\",\n        \"TargetProviderId\": \"string\"\n    }\n}\"\"\"\n\nconn.request(\"POST\",\"//move/v2/translatedsecuritypolicy/fnspoliciespreview/selectivepopulatetosplit\"\
          , payload, headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://www.nutanix.dev//move/v2/translatedsecuritypolicy/fnspoliciespreview/selectivepopulatetosplit\"\n\
          \t\n\tpayload :=  strings.NewReader(`{\"AddNsxInfo\": false, \"NsxPolicyUuid\": \"string\", \"SplitMethod\": \"\
          ByRulesCount\", \"TranslationKey\": {\"PlanId\": \"string\", \"SourceProviderId\": \"string\", \"TargetProviderId\"\
          : \"string\"}}`)\n\treq, err := http.NewRequest(\"POST\", url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"Error\
          \ creating request:\", err)\n\t\treturn\n\t}\n\n        req.Header.Add(\"Accept\", \"application/json\")\n     \
          \   req.Header.Add(\"Authorization\", \"Bearer <your_access_token>\")\n        req.Header.Add(\"Content-Type\",\
          \ \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\tfmt.Println(\"Error\
          \ creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\tbody, err := io.ReadAll(res.Body)\n\t\
          if err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\
          \n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://www.nutanix.dev//move/v2/translatedsecuritypolicy/fnspoliciespreview/selectivepopulatetosplit\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Authorization\", \"Bearer <your_access_token>\"\
          )\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"{\\\"AddNsxInfo\\\": false, \\\"NsxPolicyUuid\\\
          \": \\\"string\\\", \\\"SplitMethod\\\": \\\"ByRulesCount\\\", \\\"TranslationKey\\\": {\\\"PlanId\\\": \\\"string\\\
          \", \\\"SourceProviderId\\\": \\\"string\\\", \\\"TargetProviderId\\\": \\\"string\\\"}}\")\n  .execute()\n  .toCompletableFuture()\n\
          \  .thenAccept(System.out::println)\n  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://www.nutanix.dev//move/v2/translatedsecuritypolicy/fnspoliciespreview/selectivepopulatetosplit';\n\
          const options = {\n  method: 'POST',\n  headers: {'Accept': 'application/json', 'Authorization': 'Bearer <your_access_token>',\
          \ 'Content-Type': 'application/json'},\n  body:  `{\"AddNsxInfo\": false, \"NsxPolicyUuid\": \"string\", \"SplitMethod\"\
          : \"ByRulesCount\", \"TranslationKey\": {\"PlanId\": \"string\", \"SourceProviderId\": \"string\", \"TargetProviderId\"\
          : \"string\"}}`\n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await response.json();\n\
          \  console.log(data);\n} catch (error) {\n  console.error(error);\n}"
components:
  securitySchemes:
    Bearer:
      in: header
      name: Authorization
      type: apiKey
  schemas:
    TranslationKey:
      description: To denote the translation key denoting the translation of security policies.
      properties:
        PlanId:
          description: The ID of the source provider from which the security policy is to be translated, such as that of a
            NSX-T environment.
          type: string
        SourceProviderId:
          description: The ID of the source provider from which the security policy is to be translated, such as that of a
            NSX-T environment. This is mandatory.
          type: string
        TargetProviderId:
          description: The ID of the target provider to which the security policy is to be translated, such as that of a PC-FNS
            environment.
          type: string
      required:
      - SourceProviderId
      type: object
    PcRules:
      description: The Prism Central security policy rules used during the translation of security policies.
      properties:
        Inbound:
          items:
            $ref: '#/components/schemas/InboundPcRule'
          type: array
        Intra:
          items:
            $ref: '#/components/schemas/IntraPcRule'
          type: array
        Outbound:
          items:
            $ref: '#/components/schemas/OutboundPcRule'
          type: array
      type: object
    ServicesInRule:
      description: The PC/NSX services used during the translation of security policies.
      properties:
        NamedServices:
          description: The list of named services in the environment.
          items:
            $ref: '#/components/schemas/TspServiceMinimal'
          type: array
        Raw:
          items:
            properties:
              IcmpCode:
                description: The ICMP code, if any, of the service.
                format: int64
                type: integer
              IcmpType:
                description: The ICMP type, if any, of the service.
                format: int64
                type: integer
              Ports:
                description: Comma seperated string of ports of the service.
                type: string
              Protocol:
                description: The protocol of the service.
                type: string
            type: object
          type: array
      type: object
    Error:
      description: Error information
      properties:
        ApiVersion:
          description: Move API version.
          type: string
        Code:
          description: Error Code.
          format: uint64
          type: integer
        Kind:
          description: Error kind.
          type: string
        Message:
          description: Error Message.
          type: string
        State:
          description: Error State.
          type: string
      required:
      - Message
      type: object
    EntityInfo:
      description: The intra Prism Central security policy rule of a secured entity used during the translation of security
        policies.
      properties:
        NsxGroupUuid:
          description: The UUID of the respective group in NSX. This would serve as the identifier for the whole object.
          type: string
        SubType:
          description: The sub type of the secured entity, such as a Category.
          type: string
        Type:
          description: The type of the secured entity, such as a VM.
          type: string
        Value:
          description: The value of the secured entity such as a category "AppType:CategorySe1"
          type: string
      type: object
    SelectivePopulateToSplitFppTspResponse:
      description: The response for repopulation of split FNS security policies preview for the given NSX security policy.
      properties:
        NsxPolicyInfo:
          $ref: '#/components/schemas/TspInventory'
        NsxPolicyToPcPolicy:
          $ref: '#/components/schemas/NsxPolicyToFnsPolicy'
      type: object
    SplitPolicyInfo:
      description: The split info of the policies when translated from the NSX into multiple Prism Central FNS policies.
      properties:
        HasUserConsent:
          description: Flag to indicate if split is by user selection.
          type: boolean
        Method:
          description: The method used for splitting the policies.
          enum:
          - ByRulesCount
          - BySecuredEntity
          type: string
        TotalCount:
          description: The total number of Prism Central FNS policies created from the NSX security policy.
          format: int64
          type: integer
      type: object
    TspNsxSecurityPolicyRule:
      description: A NSX security policy rule info used during the translation of security policies.
      properties:
        DestinationGroups:
          description: The list of destination groups associated with the NSX security policy rule.
          items:
            $ref: '#/components/schemas/TspNsxGroupMinimal'
          type: array
        DestinationIps:
          description: The list of destination IPs associated with the NSX security policy rule.
          items:
            type: string
          type: array
        Id:
          description: The ID of the NSX security policy rule.
          type: string
        IsNonMigratable:
          description: Flag to indicate if the NSX security policy rule is non-migratable.
          type: boolean
        MigratableWarnings:
          description: List of migration warnings for the NSX security policy rule.
          items:
            type: string
          type: array
        Name:
          description: The name of the NSX security policy rule.
          type: string
        NonMigratableReasons:
          description: The reasons why the NSX security policy rule is non-migratable.
          items:
            type: string
          type: array
        Services:
          $ref: '#/components/schemas/ServicesInRule'
        SourceGroups:
          description: The list of source groups associated with the NSX security policy rule.
          items:
            $ref: '#/components/schemas/TspNsxGroupMinimal'
          type: array
        SourceIps:
          description: The list of source IPs associated with the NSX security policy rule.
          items:
            type: string
          type: array
        TrafficFlow:
          description: The traffic flow of the NSX security policy rule such as Allow, Deny etc.
          type: string
      type: object
    TspNsxSecurityPolicies:
      description: Map of all NSX policies' inventory used during the translation of security policies.
      properties:
        Migratable:
          items:
            $ref: '#/components/schemas/TspNsxSecurityPolicy'
          type: array
        NonMigratable:
          items:
            $ref: '#/components/schemas/TspNsxSecurityPolicy'
          type: array
      type: object
    TspNsxService:
      description: A NSX service info used during the translation of security policies.
      properties:
        Id:
          description: The ID of the NSX service.
          type: string
        Name:
          description: The name of the NSX service.
          type: string
        ServiceElements:
          description: The list of service entries associated with the NSX service.
          items:
            $ref: '#/components/schemas/TspNsxServiceEntry'
          type: array
      type: object
    TspServiceMinimal:
      description: A minimal service info used during the translation of security policies.
      properties:
        Name:
          description: The name of the service.
          type: string
        NsxServiceUuid:
          description: The UUID of the respective service in NSX. This would serve as the identifier for the whole object.
          type: string
      type: object
    PolicyScope:
      properties:
        CreateCategory:
          description: Flag to indicate if the category should be created for the VPC.
          type: boolean
        NsVpc:
          $ref: '#/components/schemas/NsVpc'
        ScopeType:
          description: The scope type of the policy.
          enum:
          - VPC
          - VLAN
          type: string
      type: object
    Category:
      description: This is the category collected from Prism Central.
      properties:
        Description:
          description: Description of the Category.
          type: string
        Id:
          description: ID of the category.
          type: string
        Key:
          description: Key of the category
          type: string
        ProviderUuid:
          description: UUID of provider.
          type: string
        RecId:
          description: Index of the record in the Database.
          format: int64
          type: integer
        ResourceType:
          description: Resource type of the entity (Category).
          type: string
        Type:
          description: created by user or system
          type: string
        Value:
          description: value of the category
          type: string
      type: object
    TspNsxGroupMinimal:
      description: NSX group minimal info used during the translation of security policies.
      properties:
        Id:
          description: The ID of the NSX group.
          type: string
        Name:
          description: The name of the NSX group.
          type: string
      type: object
    IntraPcRule:
      description: The intra Prism Central security policy rule used during the translation of security policies.
      properties:
        SecuredEntity:
          items:
            $ref: '#/components/schemas/EntityInfo'
          type: array
        TrafficFlow:
          description: The traffic flow of the intra Prism Central security policy rule.
          enum:
          - Allow
          - Deny
          type: string
      type: object
    PcSecurityPolicy:
      description: Prism Central FNS security policy to be created during the translation of security policies.
      properties:
        IsMigrated:
          description: Flag to indicate if the Prism Central FNS policy is migrated.
          type: boolean
        PolicyMode:
          description: The Prism Central security policy mode.
          enum:
          - Save
          - Monitor
          - Enforce
          type: string
        PolicyName:
          description: The Prism Central security policy name.
          type: string
        PolicyUuid:
          description: The Prism Central security policy UUID. This will be set once migrated.
          type: string
        PotentialSecuredEntities:
          description: The list of potential secured entities associated with the Prism Central FNS policy.s
          items:
            $ref: '#/components/schemas/PotentialSeEntityInfo'
          type: array
        Rules:
          $ref: '#/components/schemas/PcRules'
      type: object
    NsxSecurityPolicy:
      description: The NSX security policy info used during the translation of security policies.
      properties:
        PolicyName:
          description: The NSX security policy name.
          type: string
        PolicyUuid:
          description: The NSX security policy UUID.
          type: string
      type: object
    InboundPcRule:
      description: The inbound Prism Central security policy rule used during the translation of security policies.
      properties:
        SecuredEntity:
          description: The secured entity of the inbound Prism Central security policy rule. This might be defined by a group
            of categories.
          items:
            $ref: '#/components/schemas/EntityInfo'
          type: array
        Services:
          $ref: '#/components/schemas/ServicesInRule'
        Source:
          description: The source of the inbound Prism Central security policy rule. This might be defined by a group of categories
            or address groups.
          items:
            $ref: '#/components/schemas/EntityInfo'
          type: array
      type: object
    TspInventory:
      description: The inventory info during the translation of security policies.
      properties:
        NsxGroups:
          $ref: '#/components/schemas/TspNsxGroups'
        NsxSecurityPolicies:
          $ref: '#/components/schemas/TspNsxSecurityPolicies'
        NsxServices:
          $ref: '#/components/schemas/TspNsxServices'
      type: object
    TspNsxServices:
      additionalProperties:
        $ref: '#/components/schemas/TspNsxService'
      description: Map of all the NSX service inventory used during the translation of security policies.
      type: object
    TspNsxGroup:
      description: NSX group info used during the translation of security policies.
      properties:
        AssociatedIps:
          description: The list of IPs associated with the NSX group.
          items:
            type: string
          type: array
        AssociatedVms:
          description: The list of VMs associated with the NSX group.
          items:
            $ref: '#/components/schemas/TspNsxVm'
          type: array
        Id:
          description: The ID of the NSX group.
          type: string
        Name:
          description: The name of the NSX group.
          type: string
      type: object
    OutboundPcRule:
      description: The outbound Prism Central security policy rule used during the translation of security policies.
      properties:
        Destination:
          description: The destination of the outbound Prism Central security policy rule. This might be defined by a group
            of categories or address groups.
          items:
            $ref: '#/components/schemas/EntityInfo'
          type: array
        SecuredEntity:
          description: The secured entities of the outbound Prism Central security policy rule. This might be defined by a
            group of categories.
          items:
            $ref: '#/components/schemas/EntityInfo'
          type: array
        Services:
          $ref: '#/components/schemas/ServicesInRule'
      type: object
    NsVpc:
      description: VPC information.
      properties:
        AssociatedCategories:
          description: List of associated categories for the VPC.
          items:
            $ref: '#/components/schemas/Category'
          type: array
        Id:
          description: Identifier of the VPC.
          type: string
        Name:
          description: Name of the VPC.
          type: string
      type: object
    TspNsxGroups:
      additionalProperties:
        $ref: '#/components/schemas/TspNsxGroup'
      description: Map of all NSX group inventory used during the translation of security policies.
      type: object
    TspNsxSecurityPolicy:
      description: A NSX security policy info used during the translation of security policies.
      properties:
        AssociatedMovePlan:
          description: The UUID of the Move plan associated with the NSX security policy.
          type: string
        Id:
          description: The ID of the NSX security policy.
          type: string
        IsNonMigratable:
          description: Flag to indicate if the security policy is non-migratable.
          type: boolean
        IsPartial:
          description: Flag to indicate if the security policy is labelled partial.
          type: boolean
        MigratableWarnings:
          description: List of migration warnings for the NSX security policy.
          items:
            type: string
          type: array
        Name:
          description: The name of the NSX security policy.
          type: string
        NonMigratableReasons:
          description: The reasons why the NSX security policy is non-migratable.
          items:
            type: string
          type: array
        NonMigratableRulesCount:
          description: The number of non-migratable rules in the security policy.
          format: int64
          type: integer
        Rules:
          items:
            $ref: '#/components/schemas/TspNsxSecurityPolicyRule'
          type: array
        TotalRulesCount:
          description: The total number of rules in the security policy.
          format: int64
          type: integer
        Uuid:
          description: The UUID of the NSX security policy.
          type: string
      type: object
    SelectivePopulateToSplitFppTspRequest:
      description: The request to repopulate a particular security policy information by splitting based on the given SplitMethod.
      properties:
        AddNsxInfo:
          description: Optional flag to indicate if the NSX security policy information is to be added in the response.
          type: boolean
        NsxPolicyUuid:
          description: The NSX security policy UUID whose FNS security policy preview is to be updated.
          type: string
        SplitMethod:
          description: The method to split NSX policy to FNS security policies.
          enum:
          - ByRulesCount
          - BySecuredEntity
          type: string
        TranslationKey:
          $ref: '#/components/schemas/TranslationKey'
      required:
      - TranslationKey
      - NsxPolicyUuid
      - SplitMethod
      type: object
    TspNsxVm:
      description: NSX VM info used during the translation of security policies.
      properties:
        Name:
          description: The name of the NSX VM.
          type: string
        Uuid:
          description: The UUID of the NSX VM.
          type: string
      type: object
    PotentialSeEntityInfo:
      description: The potential secured entity info used during the translation of security policies.
      properties:
        IsSecuredEntity:
          description: Flag to indicate if the potential secured entity is selected as a SE.
          type: boolean
        NsxGroupUuid:
          description: The UUID of the respective group in NSX. This would serve as the identifier for the whole object.
          type: string
        SubType:
          description: The sub type of the secured entity, such as 'Category'.
          type: string
        Type:
          description: The type of the secured entity, such as 'VM'.
          type: string
        Value:
          description: The value of the secured entity such as category 'AppType:CategorySe1'
          type: string
      type: object
    TspNsxServiceEntry:
      description: A NSX service entry info used during the translation of security policies.
      properties:
        IcmpCode:
          description: The ICMP code, if any, of the service entry.
          format: int64
          type: integer
        IcmpType:
          description: The ICMP type, if any, of the service entry.
          format: int64
          type: integer
        Ports:
          description: Comma-seperated string of ports of the service entry.
          type: string
        Protocol:
          description: The protocol of the service entry.
          type: string
      type: object
    NsxPolicyToFnsPolicy:
      description: Map info between NSX policy to Prism Central FNS policy used during the translation of security policies.
