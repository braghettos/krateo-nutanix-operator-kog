components:
  securitySchemes:
    Bearer:
      in: header
      name: Authorization
      type: apiKey
  schemas:
    VmCustomPropertiesTypeInfo:
      description: VM details with type and properties metadata required for custom-view.
      properties:
        CustomizableProperties:
          description: List of properties which can be customized.
          items:
            type: string
          type: array
        GenericVmCustomProperties:
          $ref: '#/components/schemas/GenericVmCustomProperties'
        Type:
          description: Type of the custom properties used.
          enum:
          - GenericVmCustomProperties
          type: string
      type: object
    MetaDataWorkloadCustomProperties:
      description: Metadata of the customized workload properties.
      properties:
        Version:
          description: Customized workload properties definition version.
          type: string
      required:
      - Version
      type: object
    VMCustomizeType:
      description: Defines the way customizable properties are synchronized on the target side. The default value is "static".
        When set to the "replicate" value, the customizable properties of the target VM would be the same as those of the
        source at the time of the cutover. When set to "static", the value remains as set by the user.
      enum:
      - replicate
      - static
      type: string
    WorkloadCustomPropertiesRequest:
      description: Customized workload properties response.
      properties:
        APIVersion:
          description: Move API version.
          type: string
        CustomProperties:
          $ref: '#/components/schemas/WorkloadCustomPropertiesReq'
        MetaData:
          $ref: '#/components/schemas/MetaDataWorkloadCustomProperties'
      required:
      - CustomProperties
      - MetaData
      - APIVersion
      type: object
    GenericVmCustomProperties:
      description: Generic VM properties, usually of on-premise VMs that are needed for custom-view.
      properties:
        Memory:
          description: Memory in bytes for the VM.
          format: uint64
          type: integer
        Name:
          description: Name of the VM.
          type: string
        NumCDROMs:
          description: Number of CD-ROMs for the VM.
          format: uint32
          type: integer
        NumCoresPerSocket:
          description: Number of cores per vCPU for the VM.
          format: uint32
          type: integer
        NumDisks:
          description: Number of disks for the VM.
          format: uint32
          type: integer
        NumNICs:
          description: Number of NICs for the VM.
          format: uint32
          type: integer
        NumvCPUs:
          description: vCPUs for the VM.
          format: uint32
          type: integer
        PowerState:
          description: Power state of the VM.
          enum:
          - PoweredOn
          - PoweredOff
          type: string
      required:
      - Name
      - PowerState
      - NumvCPUs
      - NumCoresPerSocket
      - Memory
      - NumDisks
      - NumCDROMs
      - NumNICs
      type: object
    MimicGenericVmCustomProperties:
      description: Properties that are used synchronously with GenericVmCustomProperties, denote the same values that are
        present on the server. This prevents sending all field values if you do not need to change the values.
      type: object
    WorkloadCustomProperties:
      description: Workload properties needed for the custom-view.
      properties:
        Type:
          description: Based on the workload type, the field denotes the appropriate property type.
          enum:
          - VmCustomPropertiesInfo
          type: string
        VmCustomPropertiesInfo:
          $ref: '#/components/schemas/VmCustomPropertiesInfo'
      type: object
    VmCustomPropertyMapper:
      description: Custom-view properties of a VM.
      properties:
        DisplayName:
          description: External name for the property.
          type: string
        SourceName:
          description: Name of the property in the source provider.
          type: string
        TargetName:
          description: Name of the property in the target provider.
          type: string
      type: object
    WorkloadCustomPropertiesResponse:
      description: Customized workload properties response.
      properties:
        APIVersion:
          description: Move API version.
          type: string
        CustomProperties:
          $ref: '#/components/schemas/WorkloadCustomProperties'
        MetaData:
          $ref: '#/components/schemas/MetaDataWorkloadCustomProperties'
      required:
      - APIVersion
      type: object
    Error:
      description: Error information
      properties:
        ApiVersion:
          description: Move API version.
          type: string
        Code:
          description: Error Code.
          format: uint64
          type: integer
        Kind:
          description: Error kind.
