components:
  securitySchemes:
    Bearer:
      in: header
      name: Authorization
      type: apiKey
  schemas:
    VMCustomizeType:
      description: Defines the way customizable properties are synchronized on the target side. The default value is "static".
        When set to the "replicate" value, the customizable properties of the target VM would be the same as those of the
        source at the time of the cutover. When set to "static", the value remains as set by the user.
      enum:
      - replicate
      - static
      type: string
    VMCustomizationConfig:
      description: Configuration for customizing the target VM.
      properties:
        AWSVMConfig:
          $ref: '#/components/schemas/AWSVMConfig'
        AzureVMConfig:
          $ref: '#/components/schemas/AzureVMConfig'
      type: object
    AzureVMConfig:
      description: Custom VM instance properties.
      properties:
        DiskCategory:
          type: string
        VMSize:
          type: string
      type: object
    AWSVMConfig:
      description: Custom EC2 instance properties.
      properties:
        AMIID:
          type: string
        InstanceType:
          type: string
      type: object
    VMRunbookInput:
      description: Input for the runbooks to be executed on a target VM after migration.
      properties:
        UUID:
          description: UUID of the runbook.
          format: uuid
          type: string
        Variables:
          description: Runbook variables information and input.
          items:
            properties:
              IsSecret:
                description: Flag indicating if a variable is secret.
                type: boolean
              UUID:
                description: Runbook variable UUID.
                format: uuid
                type: string
              Value:
                description: Runbook variable input. For multi-value (array) input, separate the elements of the array using
                  comma (,).
                type: string
            required:
            - UUID
            type: object
          type: array
      required:
      - UUID
      type: object
    Error:
      description: Error information
      properties:
        ApiVersion:
          description: Move API version.
          type: string
        Code:
          description: Error Code.
          format: uint64
          type: integer
        Kind:
          description: Error kind.
          type: string
        Message:
          description: Error Message.
          type: string
        State:
          description: Error State.
          type: string
      required:
      - Message
      type: object
    PowerOnVMsEntity:
      properties:
        APIVersion:
          type: string
        Spec:
          $ref: '#/components/schemas/VMToMigrate'
      type: object
    VMToMigrate:
      description: VM information.
      properties:
        VMs:
          description: List of VMs to power on and migrate.
          items:
            $ref: '#/components/schemas/VM'
          type: array
      type: object
    VM:
      description: Details of the VM including login information, UUID, timezone and so on.
      properties:
        AllowUVMOps:
          description: Flag to indicate if the user VM operations are allowed. Example- VirtIO installation, static IP retention
            and so on.
          type: boolean
        CategoriesMapping:
          additionalProperties:
            items:
              type: string
            type: array
          description: Categories mapping that will be assigned to the target VM
          type: object
        CreatePublicIpAddress:
          description: Indicates whether the migrated VM should have a public IP address. This flag is only valid for Azure
            and AWS target providers. The valid values are true and false.
          type: boolean
        DiskConfig:
          $ref: '#/components/schemas/DiskConfig'
        EnableMemoryOvercommit:
          description: Flag to denote whether the migrated VM will have memory overcommit enabled. The valid values are true
            and false.
          type: boolean
        GuestPrepMode:
          description: Select the migration preparation mode. The vaild values are manual and auto.
          enum:
          - manual
          - auto
          type: string
        ID:
          description: VM Id
          type: string
        InstallNGT:
          description: Install NGT on the target VM.
          type: boolean
        Owner:
          description: Owner of the target VM. Only applicable if a project is assigned to the VM.
          type: string
        Password:
          description: Password to login to VM.
          type: string
        PemFile:
          description: PEM file to login to VM.
          type: string
        PowerOffForpRDMtovRDMConversion:
          description: Flag to determine whether to automatically power off the VM to convert PRDM disks to vRDM when migrating
            from ESXi.
          type: boolean
        RetainMacAddress:
          description: Flag to denote whether the migrated VM has the same MAC Address. The valid values are true and false.
          type: boolean
        RetainUserData:
          description: Flag to denote whether the migrated VM has the same user data string. The valid values are true and
            false.
          type: boolean
        Runbooks:
          description: Runbooks that will be executed on the target VM after migration. Only one runbook is allowed to be
            executed per VM. This is only applicable if a project is assigned to the VM.
          items:
            $ref: '#/components/schemas/VMRunbookInput'
          type: array
        SkipCdrom:
          description: Flag to denote whether the migrated VM will skip the CD-ROM addition. The options SkipCdrom and AddCdrom
            cannot be true simultaneously. The valid values are true and false.
          type: boolean
        SkipIPRetention:
          description: Flag to indicate if the static IP should be retained in the user VM. Set 'AllowUVMOps' flag as 'false'
            to override this flag entry. This field is deprecated, instead, refer 'NicConfigMode'.
          type: boolean
        TimeZone:
          description: Time zone configuration for the VM hardware clock.
          type: string
        UUID:
          description: VM UUID
          format: uuid
          type: string
        UninstallGuestTools:
          description: Flag to denote if the guest tools will be uninstalled in the migrated VM. Examples of the guest tools
            are - VMware Tools, Open VM Tools, etc.
          type: boolean
        UserName:
          description: User name to login to VM.
          type: string
        VMCustomizationConfig:
          $ref: '#/components/schemas/VMCustomizationConfig'
        VMCustomizeType:
          $ref: '#/components/schemas/VMCustomizeType'
        VMPriority:
          description: The VM priority to be used for scheduling/QoS.
          enum:
          - High
          - Medium
          - Low
          type: string
      type: object
    DiskConfig:
      description: Details of disk-related properties.
      properties:
        AddCdrom:
          description: Flag to denote whether to add CD-ROM on the migrated VM if it is not in the source VM. The options
            SkipCdrom and AddCdrom cannot be true simulataneously. The valid values are true and false.
          type: boolean
      type: object
