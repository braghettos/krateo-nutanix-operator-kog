openapi: 3.0.0
info:
  description: "# Introduction\n\n**Nutanix Move (Move)** is a cross-hypervisor mobility solution to move VMs with minimal\
    \ downtime. Move helps streamline 'lift-and-shift' virtual machine (VM) migrations to a Nutanix Enterprise Cloud. Move\
    \ provides:\n\n- Streamlined migrations with one-click simplicity\n- Near-zero downtime with full cutover control\n- Simple\
    \ test migrations and roll-back capabilities\n- Cost efficiency included with all Nutanix software editions. \n\nThis\
    \ document covers APIs that are available in Move-6.2.0.\n\nRefer to the [Move user guide](https://portal.nutanix.com/page/documents/details?targetId=Nutanix-Move:Nutanix-Move)\
    \ for more information related to the supported source to target migration details.\n\n> Note: Since the infrastructure\
    \ underneath is completely different, a small downtime is incurred during cutover from any of the above sources to targets.\n\
    \n\n# Authentication\n\n**Move uses JWT token based bearer authentication.**\n\nThe user provides username and password\
    \ once to generate an authentication token (using the login API).\nThis authentication token is added as an HTTP Authorization\
    \ header every time a request is sent.\n\n## Best Practice\n\nIt is advised that the user revoke the authentication token\
    \ using the Revoke API after completing required tasks.\n\n**Error codes**\n\nList of HTTP Status codes returned by Move\
    \ application:\n\n|Error codes    |       Messages    |\n| :-----------: | :----- |\n| 200 |   Successful operation  \
    \  |\n| 201       |  Created|\n| 202    | Accepted |\n| 204    | No Content  |\n| 401    | Unauthorized  |\n| 403    |\
    \ Forbidden  |\n| 404    | Not Found   |\n| 409    | Conflict  |\n| 422    | Unprocessable Entity  |\n| 500    | Internal\
    \ Server Error  |\n| 501    | Not Implemented  |\n| 503    |      Service unavailable |\n\n# Workflow\n\nThis documentation\
    \ helps in familiarizing with **Nutanix Move V2 API workflow**. The API's need to be executed in the following sequence\
    \ to successfully migrate a VM using the Move application.\n\n**Authentication:**\n\n- [Login](#tag/User/operation/loginUser)-\
    \ User has to login and obtain an authentication token. This token is used for authorization in all APIs.\n\n**Inventory:**\n\
    \n- [Add the source and target provider](#tag/Provider/operation/createProvider) for migration.\n- [Fetch provider Inventory](#tag/Provider/operation/getProvider)\
    \ to obtain provider networks and VMs information.\n\n**Migration:**\n\n- [Create a Migration plan](#tag/Plan/operation/createPlan)\
    \ by providing source information, target information, network mappings, schedule settings, and workload.\n\n- [Prepare\
    \ the VMs for Migration](#tag/Plan/operation/preparePlan)\u2013 in manual or automatic mode. If the preparation mode is\
    \ set to 'manual', OS specific scripts are to be executed manually to prepare the source VMs.\n\n- [Perform readiness\
    \ checks](#tag/Plan/operation/checkReadiness) to confirm if that particular migration plan is ready to start.\n\n- [Start\
    \ the Migration plan](#tag/Plan/operation/startPlan) and wait for VMs to reach the cutover state. User can[ view workload\
    \ details](#tag/Workload/operation/getAllWorkloads) for a migration plan and the list of actions that can be performed\
    \ on the current VM.\n\n- [Perform cutover](#tag/Plan/operation/workloadAction). The cutover process begins immediately\
    \ and takes a few minutes. Once the cutover is complete, the VM is ready for use in the target provider.\n\n**Application:**\n\
    \n- [View the application information](#tag/Application/operation/getAppInfo).\n\n- [Check if an upgrade ](#tag/Upgrade/operation/checkUpgrade)\
    \ is available and [initiate an upgrade](#tag/Upgrade/operation/initUpgrade) Users can also upload files to do an [offline\
    \ upgrade](#tag/Upgrade/operation/getUploadedUpgradeInfo) of the Move application.\n\n- In case of issues, the[ support\
    \ bundle can be downloaded ](#tag/Application/operation/getSupportBundle) to provide logs and information about the current\
    \ state of the VM.\n"
  title: Nutanix Move REST APIs
  version: 2.4.0
servers:
- url: /
security: []
paths:
  /move/v2/providers/{id}/runbooks/{runbookid}:
    get:
      description: Retrieves the details of a specified runbook from the Prism Central provider. The runbook details include
        the runbook variables, tasks, and whether the runbook is supported to run with Move. <br/><br/><b>Sample API syntax:</b>
        https://move.address/move/v2/81b0a14d-c937-4872-b792-d46484ee8905/runbooks/d376e450-4185-ea73-22a4-1820f3865eea
      operationId: getRunbook
      parameters:
      - description: UUID of the provider.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: UUID of the runbook.
        in: path
        name: runbookid
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunbookEntity'
            MetaData: {}
            Spec: {}
      security:
      - Bearer: []
      summary: Get details about a specified runbook from the Prism Central provider
      tags:
      - Provider
      x-codeSamples:
      - lang: cURL
        source: "curl --request GET \\\n    --url https://www.nutanix.dev//move/v2/providers/{id}/runbooks/{runbookid} \\\n\
          \    --header 'Accept: application/json' \\\n    --header 'Authorization: Bearer <your_access_token>' \\\n    --header\
          \ 'Content-Type: application/json' \\\n     "
      - lang: Wget
        source: "wget --quiet \\\n    --method GET \\\n    --header 'Accept: application/json' \\\n    --header 'Authorization:\
          \ Bearer <your_access_token>' \\\n    --header 'Content-Type: application/json' \\\n      \\\n    --output-document\
          \ \\\n    - https://www.nutanix.dev//move/v2/providers/{id}/runbooks/{runbookid}"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Authorization\": \"Bearer <your_access_token>\",\n    \"Content-Type\": \"application/json\"\
          \n}\n \nconn.request(\"GET\",\"//move/v2/providers/{id}/runbooks/{runbookid}\", headers=headers)\n\nres = conn.getresponse()\n\
          data = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://www.nutanix.dev//move/v2/providers/{id}/runbooks/{runbookid}\"\n\t \n\treq, err := http.NewRequest(\"\
          GET\", url, nil)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n    \
          \    req.Header.Add(\"Accept\", \"application/json\")\n        req.Header.Add(\"Authorization\", \"Bearer <your_access_token>\"\
          )\n        req.Header.Add(\"Content-Type\", \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\
          \tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\t\
          return\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"GET\", \"https://www.nutanix.dev//move/v2/providers/{id}/runbooks/{runbookid}\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Authorization\", \"Bearer <your_access_token>\"\
          )\n  .setHeader(\"Content-Type\", \"application/json\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://www.nutanix.dev//move/v2/providers/{id}/runbooks/{runbookid}';\nconst options = {\n\
          \  method: 'GET',\n  headers: {'Accept': 'application/json', 'Authorization': 'Bearer <your_access_token>', 'Content-Type':\
          \ 'application/json'} \n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await response.json();\n\
          \  console.log(data);\n} catch (error) {\n  console.error(error);\n}"
components:
  securitySchemes:
    Bearer:
      in: header
      name: Authorization
      type: apiKey
  schemas:
    RunbookVariableOptions:
      description: Choices for variable value and type of choices.
      properties:
        AdditionalProperties:
          additionalProperties: true
          description: EScript/HTTP request information for dynamic variables.
          type: object
        Choices:
          description: Choices for variable value.
          items:
            type: string
          type: array
        Type:
          description: Whether choices are predefined, script based, or HTTP request based.
          enum:
          - PREDEFINED
          - EXEC
          - HTTP
          type: string
      type: object
    SplMessage:
      description: Move application message.
      properties:
        Message:
          description: Contents of the message.
          type: string
        Title:
          description: Title of the message.
          type: string
        Type:
          description: Type of the message.
          enum:
          - INFO
          - WARN
          - ERROR
          type: string
      type: object
    MetaData:
      description: Metadata information
      properties:
        Count:
          type: integer
        CreationTime:
          description: Token creation time.
          type: string
        Kind:
          type: string
        LastUpdateTime:
          description: Last updated time.
          type: string
        Name:
          description: User name
          type: string
        SpecVersion:
          description: Specification version
          type: string
        UUID:
          description: UUID
          format: uuid
          type: string
      type: object
    Runbook:
      description: Structure of runbook.
      properties:
        Description:
          description: Runbook description.
          type: string
        ErrorList:
          description: List of error messages for runbook, runbook variables and runbook tasks.
          items:
            $ref: '#/components/schemas/SplMessage'
          type: array
        IsSupported:
          description: Flag to indicate if the runbook execution is supported using Move.
          type: boolean
        MessageList:
          description: List of messages for the runbook.
          items:
            $ref: '#/components/schemas/SplMessage'
          type: array
        Name:
          description: Runbook name.
          type: string
        ProjectUUID:
          description: UUID of the project under which the runbook is present.
          type: string
        TaskList:
          description: List of tasks present in the runbook.
          items:
            $ref: '#/components/schemas/RunbookTask'
          type: array
        UUID:
          description: UUID of the runbook.
          type: string
        VariableList:
          description: List of variables present in the runbook.
          items:
            $ref: '#/components/schemas/RunbookVariable'
          type: array
        WarningList:
          description: List of warning messages for runbook, runbook variables and runbook tasks.
          items:
            $ref: '#/components/schemas/SplMessage'
          type: array
      type: object
    RunbookVariableRegex:
      description: Regular expression to which runbook variable value should adhere to.
      properties:
        ShouldValidate:
          description: Flag to indicate whether runbook variable value should be validated against the regular expression.
          type: boolean
        Value:
          description: Value of regular expression.
          type: string
      type: object
    RunbookVariable:
      description: Information about runbook variable.
      properties:
        DataType:
          description: Runbook variable data type.
          enum:
          - BASE
          - LIST
          - SINGLE_SELECT_LIST
          type: string
        Description:
          description: Runbook variable description.
          type: string
        IsDynamic:
          description: Falg to indicate if the runbook variable choices are determined using EScript or HTTP request.
          type: boolean
        IsEditable:
          description: Flag to indicate if the runbook variable value is editable.
          type: boolean
        IsHidden:
          description: Flag to indicate if the runbook variable is hidden.
          type: boolean
        IsMandatory:
          description: Flag to indicate if the runbook variable value is mandatory.
          type: boolean
        IsSecret:
          description: Flag to indicate if the runbook variable value is a secret.
          type: boolean
        Label:
          description: Runbook variable label.
          type: string
        MessageList:
          description: List of messages for the runbook variable.
          items:
            $ref: '#/components/schemas/SplMessage'
          type: array
        Name:
          description: Runbook variable name.
          type: string
        Options:
          $ref: '#/components/schemas/RunbookVariableOptions'
        Regex:
          $ref: '#/components/schemas/RunbookVariableRegex'
        UUID:
          description: Runbook variable UUID.
          type: string
        Value:
          description: Runbook variable value. For arrays, the array elements are separated by comma delimiter.
          type: string
        ValueType:
          description: Runbook variable value type.
          enum:
          - STRING
          - INT
          - DATE
          - TIME
          - DATE_TIME
          - MULTILINE_STRING
          type: string
      type: object
    Error:
      description: Error information
      properties:
        ApiVersion:
          description: Move API version.
          type: string
        Code:
          description: Error Code.
          format: uint64
          type: integer
        Kind:
          description: Error kind.
          type: string
        Message:
          description: Error Message.
          type: string
        State:
          description: Error State.
          type: string
      required:
      - Message
      type: object
    RunbookTask:
      description: Information about the runbook task.
      properties:
        AdditionalProperties:
          additionalProperties: true
          description: Runbook task additional properties.
          type: object
        MessageList:
          description: List of messages for the runbook task.
          items:
            $ref: '#/components/schemas/SplMessage'
          type: array
        Name:
          description: Runbook task name.
          type: string
        Type:
          description: Runbook task type.
          type: string
        UUID:
          description: Runbook task UUID.
          type: string
      type: object
    RunbookEntity:
      description: Runbook details output.
      properties:
        APIVersion:
          description: Move API version.
          type: string
        MetaData:
          $ref: '#/components/schemas/MetaData'
        Spec:
          $ref: '#/components/schemas/Runbook'
      type: object
