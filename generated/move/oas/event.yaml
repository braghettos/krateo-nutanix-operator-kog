openapi: 3.0.0
info:
  description: "# Introduction\n\n**Nutanix Move (Move)** is a cross-hypervisor mobility solution to move VMs with minimal\
    \ downtime. Move helps streamline 'lift-and-shift' virtual machine (VM) migrations to a Nutanix Enterprise Cloud. Move\
    \ provides:\n\n- Streamlined migrations with one-click simplicity\n- Near-zero downtime with full cutover control\n- Simple\
    \ test migrations and roll-back capabilities\n- Cost efficiency included with all Nutanix software editions. \n\nThis\
    \ document covers APIs that are available in Move-6.2.0.\n\nRefer to the [Move user guide](https://portal.nutanix.com/page/documents/details?targetId=Nutanix-Move:Nutanix-Move)\
    \ for more information related to the supported source to target migration details.\n\n> Note: Since the infrastructure\
    \ underneath is completely different, a small downtime is incurred during cutover from any of the above sources to targets.\n\
    \n\n# Authentication\n\n**Move uses JWT token based bearer authentication.**\n\nThe user provides username and password\
    \ once to generate an authentication token (using the login API).\nThis authentication token is added as an HTTP Authorization\
    \ header every time a request is sent.\n\n## Best Practice\n\nIt is advised that the user revoke the authentication token\
    \ using the Revoke API after completing required tasks.\n\n**Error codes**\n\nList of HTTP Status codes returned by Move\
    \ application:\n\n|Error codes    |       Messages    |\n| :-----------: | :----- |\n| 200 |   Successful operation  \
    \  |\n| 201       |  Created|\n| 202    | Accepted |\n| 204    | No Content  |\n| 401    | Unauthorized  |\n| 403    |\
    \ Forbidden  |\n| 404    | Not Found   |\n| 409    | Conflict  |\n| 422    | Unprocessable Entity  |\n| 500    | Internal\
    \ Server Error  |\n| 501    | Not Implemented  |\n| 503    |      Service unavailable |\n\n# Workflow\n\nThis documentation\
    \ helps in familiarizing with **Nutanix Move V2 API workflow**. The API's need to be executed in the following sequence\
    \ to successfully migrate a VM using the Move application.\n\n**Authentication:**\n\n- [Login](#tag/User/operation/loginUser)-\
    \ User has to login and obtain an authentication token. This token is used for authorization in all APIs.\n\n**Inventory:**\n\
    \n- [Add the source and target provider](#tag/Provider/operation/createProvider) for migration.\n- [Fetch provider Inventory](#tag/Provider/operation/getProvider)\
    \ to obtain provider networks and VMs information.\n\n**Migration:**\n\n- [Create a Migration plan](#tag/Plan/operation/createPlan)\
    \ by providing source information, target information, network mappings, schedule settings, and workload.\n\n- [Prepare\
    \ the VMs for Migration](#tag/Plan/operation/preparePlan)\u2013 in manual or automatic mode. If the preparation mode is\
    \ set to 'manual', OS specific scripts are to be executed manually to prepare the source VMs.\n\n- [Perform readiness\
    \ checks](#tag/Plan/operation/checkReadiness) to confirm if that particular migration plan is ready to start.\n\n- [Start\
    \ the Migration plan](#tag/Plan/operation/startPlan) and wait for VMs to reach the cutover state. User can[ view workload\
    \ details](#tag/Workload/operation/getAllWorkloads) for a migration plan and the list of actions that can be performed\
    \ on the current VM.\n\n- [Perform cutover](#tag/Plan/operation/workloadAction). The cutover process begins immediately\
    \ and takes a few minutes. Once the cutover is complete, the VM is ready for use in the target provider.\n\n**Application:**\n\
    \n- [View the application information](#tag/Application/operation/getAppInfo).\n\n- [Check if an upgrade ](#tag/Upgrade/operation/checkUpgrade)\
    \ is available and [initiate an upgrade](#tag/Upgrade/operation/initUpgrade) Users can also upload files to do an [offline\
    \ upgrade](#tag/Upgrade/operation/getUploadedUpgradeInfo) of the Move application.\n\n- In case of issues, the[ support\
    \ bundle can be downloaded ](#tag/Application/operation/getSupportBundle) to provide logs and information about the current\
    \ state of the VM.\n"
  title: Nutanix Move REST APIs
  version: 2.4.0
servers:
- url: /
security: []
paths:
  /move/v2/events:
    post:
      description: Get the list of Move events.<br/><br/> Input :- <ul><li>Pagination details:- page number and records per
        page</li> <li>Filter details:- Event types, VM names, Migration plan names, and status</li> </ul> Output :- <ul><li>List
        of Move events</li> <li>Paging details such as total number of records, total number of pages, and current page number</li>
        </ul> <b>Sample API Syntax:</b> https://{move_ip}/move/v2/events
      operationId: getEvents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventsListInput'
        description: Get the list of events for the input entities
        required: true
        x-examples:
          application/json:
            Filter:
              EventNames:
              - Initiate Cutover
              - Resume Migration Plan
              EventStatuses:
              - Defunct
              - In Progress
              - Failed
              EventTypes:
              - VM Migration
              - Global
              - Migration Plan
              - Files Migration
              - SP Migration
              MpNames:
              - Migplan-1
              - Migplan-2
              VmNames:
              - VM1
              - VM2
            PaginationCriteria:
              PageNumber: 2
              RecordsPerPage: 10
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsListOutput'
      security:
      - Bearer: []
      summary: Get a list of Move events
      tags:
      - Events
      x-codeSamples:
      - lang: cURL
        source: "curl --request POST \\\n    --url https://www.nutanix.dev//move/v2/events \\\n    --header 'Accept: application/json'\
          \ \\\n    --header 'Authorization: Bearer <your_access_token>' \\\n    --header 'Content-Type: application/json'\
          \ \\\n    --data '{\n    \"Filter\": {\n        \"EventNames\": [\n            \"string\"\n        ],\n        \"\
          EventStatuses\": [\n            \"string\"\n        ],\n        \"EventTypes\": [\n            \"string\"\n    \
          \    ],\n        \"IamNames\": [\n            \"string\"\n        ],\n        \"MpNames\": [\n            \"string\"\
          \n        ],\n        \"SourcePaths\": [\n            \"string\"\n        ],\n        \"TargetPaths\": [\n     \
          \       \"string\"\n        ],\n        \"UserNames\": [\n            \"string\"\n        ],\n        \"VmNames\"\
          : [\n            \"string\"\n        ]\n    },\n    \"PaginationCriteria\": {\n        \"PageNumber\": 0,\n    \
          \    \"RecordsPerPage\": 0\n    }\n}'"
      - lang: Wget
        source: "wget --quiet \\\n    --method POST \\\n    --header 'Accept: application/json' \\\n    --header 'Authorization:\
          \ Bearer <your_access_token>' \\\n    --header 'Content-Type: application/json' \\\n    --body-data '{\n    \"Filter\"\
          : {\n        \"EventNames\": [\n            \"string\"\n        ],\n        \"EventStatuses\": [\n            \"\
          string\"\n        ],\n        \"EventTypes\": [\n            \"string\"\n        ],\n        \"IamNames\": [\n \
          \           \"string\"\n        ],\n        \"MpNames\": [\n            \"string\"\n        ],\n        \"SourcePaths\"\
          : [\n            \"string\"\n        ],\n        \"TargetPaths\": [\n            \"string\"\n        ],\n      \
          \  \"UserNames\": [\n            \"string\"\n        ],\n        \"VmNames\": [\n            \"string\"\n      \
          \  ]\n    },\n    \"PaginationCriteria\": {\n        \"PageNumber\": 0,\n        \"RecordsPerPage\": 0\n    }\n\
          }' \\\n    --output-document \\\n    - https://www.nutanix.dev//move/v2/events"
      - lang: Python
        source: "import http.client\n\nconn = http.client.HTTPSConnection(\"www.nutanix.dev\")\n\nheaders = {\n    \"Accept\"\
          : \"application/json\",\n    \"Authorization\": \"Bearer <your_access_token>\",\n    \"Content-Type\": \"application/json\"\
          \n}\n\npayload =  \"\"\"{\n    \"Filter\": {\n        \"EventNames\": [\n            \"string\"\n        ],\n  \
          \      \"EventStatuses\": [\n            \"string\"\n        ],\n        \"EventTypes\": [\n            \"string\"\
          \n        ],\n        \"IamNames\": [\n            \"string\"\n        ],\n        \"MpNames\": [\n            \"\
          string\"\n        ],\n        \"SourcePaths\": [\n            \"string\"\n        ],\n        \"TargetPaths\": [\n\
          \            \"string\"\n        ],\n        \"UserNames\": [\n            \"string\"\n        ],\n        \"VmNames\"\
          : [\n            \"string\"\n        ]\n    },\n    \"PaginationCriteria\": {\n        \"PageNumber\": 0,\n    \
          \    \"RecordsPerPage\": 0\n    }\n}\"\"\"\n\nconn.request(\"POST\",\"//move/v2/events\", payload, headers)\n\n\
          res = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\n\t\"io\"\n)\n\nfunc main() {\n\n\turl\
          \ := \"https://www.nutanix.dev//move/v2/events\"\n\t\n\tpayload :=  strings.NewReader(`{\"Filter\": {\"EventNames\"\
          : [\"string\"], \"EventStatuses\": [\"string\"], \"EventTypes\": [\"string\"], \"IamNames\": [\"string\"], \"MpNames\"\
          : [\"string\"], \"SourcePaths\": [\"string\"], \"TargetPaths\": [\"string\"], \"UserNames\": [\"string\"], \"VmNames\"\
          : [\"string\"]}, \"PaginationCriteria\": {\"PageNumber\": 0, \"RecordsPerPage\": 0}}`)\n\treq, err := http.NewRequest(\"\
          POST\", url, payload)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\
          \        req.Header.Add(\"Accept\", \"application/json\")\n        req.Header.Add(\"Authorization\", \"Bearer <your_access_token>\"\
          )\n        req.Header.Add(\"Content-Type\", \"application/json\")\n    \n\tres, err := http.DefaultClient.Do(req)\n\
          \tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\treturn\n\t}\n\n\tdefer res.Body.Close()\n\
          \tbody, err := io.ReadAll(res.Body)\n\tif err != nil {\n\t\tfmt.Println(\"Error creating request:\", err)\n\t\t\
          return\n\t}\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Java
        source: "AsyncHttpClient client = new DefaultAsyncHttpClient();\nclient.prepare(\"POST\", \"https://www.nutanix.dev//move/v2/events\"\
          )\n  .setHeader(\"Accept\", \"application/json\")\n  .setHeader(\"Authorization\", \"Bearer <your_access_token>\"\
          )\n  .setHeader(\"Content-Type\", \"application/json\")\n  .setBody(\"{\\\"Filter\\\": {\\\"EventNames\\\": [\\\"\
          string\\\"], \\\"EventStatuses\\\": [\\\"string\\\"], \\\"EventTypes\\\": [\\\"string\\\"], \\\"IamNames\\\": [\\\
          \"string\\\"], \\\"MpNames\\\": [\\\"string\\\"], \\\"SourcePaths\\\": [\\\"string\\\"], \\\"TargetPaths\\\": [\\\
          \"string\\\"], \\\"UserNames\\\": [\\\"string\\\"], \\\"VmNames\\\": [\\\"string\\\"]}, \\\"PaginationCriteria\\\
          \": {\\\"PageNumber\\\": 0, \\\"RecordsPerPage\\\": 0}}\")\n  .execute()\n  .toCompletableFuture()\n  .thenAccept(System.out::println)\n\
          \  .join();\n\nclient.close();"
      - lang: JavaScript
        source: "const url = 'https://www.nutanix.dev//move/v2/events';\nconst options = {\n  method: 'POST',\n  headers:\
          \ {'Accept': 'application/json', 'Authorization': 'Bearer <your_access_token>', 'Content-Type': 'application/json'},\n\
          \  body:  `{\"Filter\": {\"EventNames\": [\"string\"], \"EventStatuses\": [\"string\"], \"EventTypes\": [\"string\"\
          ], \"IamNames\": [\"string\"], \"MpNames\": [\"string\"], \"SourcePaths\": [\"string\"], \"TargetPaths\": [\"string\"\
          ], \"UserNames\": [\"string\"], \"VmNames\": [\"string\"]}, \"PaginationCriteria\": {\"PageNumber\": 0, \"RecordsPerPage\"\
          : 0}}`\n};\n\ntry {\n  const response = await fetch(url, options);\n  const data = await response.json();\n  console.log(data);\n\
          } catch (error) {\n  console.error(error);\n}"
components:
  securitySchemes:
    Bearer:
      in: header
      name: Authorization
      type: apiKey
  schemas:
    EventsFilterOptions:
      description: Events Filter.
      properties:
        FilterName:
          description: Filter name.
          type: string
        Items:
          description: Array of filter options.
          items:
            type: string
          type: array
      type: object
    EventsListInput:
      description: Input entity to get list of events.
      properties:
        Filter:
          $ref: '#/components/schemas/EventsFilter'
        PaginationCriteria:
          $ref: '#/components/schemas/PaginationCriteria'
      required:
      - PaginationCriteria
      type: object
    EventsListOutput:
      description: Events list output
      properties:
        Events:
          description: List of events
          items:
            $ref: '#/components/schemas/Event'
          type: array
        MetaData:
          $ref: '#/components/schemas/EventsListMetaData'
        PaginationDetails:
          $ref: '#/components/schemas/PaginationDetails'
      type: object
    PaginationCriteria:
      description: Used as input for lists with pagination
      properties:
        PageNumber:
          description: Page number for which records are required
          format: int32
          type: integer
        RecordsPerPage:
          description: Records per page
          format: int32
          type: integer
      required:
      - PageNumber
      - RecordsPerPage
      type: object
    Event:
      description: Structure of event.
      properties:
        CreatedTime:
          description: Event creation time.
          format: int64
          type: integer
        EndTime:
          description: Event end time.
          format: int64
          type: integer
        EntityUuid:
          description: Entity UUID. This field is returned empty if the event does not belong to a VM/Files migration.
          format: uuid
          type: string
        EventCode:
          description: Event code.
          format: uint32
          type: integer
        EventId:
          description: Event Id.
          type: string
        EventName:
          description: Event name.
          type: string
        EventStatus:
          description: Event status.
          type: string
        EventType:
          description: Event type.
          type: string
        FailureNotes:
          description: Event failure information.
          type: string
        IamName:
          description: IAM provider name, returned empty if the user who triggered the event is not an IAM user.
          type: string
        IsCyclic:
          description: Indicates if this event occurs at regular intervals.
          format: int32
          type: integer
        LastUpdatedTime:
          description: Last updated time for the event.
          format: int64
          type: integer
        MpName:
          description: Migration plan name, returned empty if event does not belong to a migration plan.
          type: string
        MpUuid:
          description: Migration plan UUID, returned empty if event does not belong to a migration plan.
          format: uuid
          type: string
        Notes:
          description: Additional information for an event. For example service name, provider information etc.
          type: string
        SourcePath:
          description: Source Path. This field is returned empty if the event does not belong to a Files migration.
          type: string
        TargetPath:
          description: Target Path. This field is returned empty if theevent does not belong to a Files migration.
          type: string
        Username:
          description: Username of the user who triggered this event.
          type: string
        VmName:
          description: VM name. This field is returned empty if the event does not belong to a VM migration.
          type: string
        VmUuid:
          description: VM UUID. This field is returned empty if the event does not belong to a VM migration (deprecated).
          format: uuid
          type: string
      type: object
    Error:
      description: Error information
      properties:
        ApiVersion:
          description: Move API version.
          type: string
        Code:
          description: Error Code.
          format: uint64
          type: integer
        Kind:
          description: Error kind.
          type: string
        Message:
          description: Error Message.
          type: string
        State:
          description: Error State.
          type: string
      required:
      - Message
      type: object
    EventsFilter:
      description: Filter for listing Move Events.
      properties:
        EventNames:
          description: List of event names.
          items:
            type: string
          type: array
        EventStatuses:
          description: List of event statuses.
          items:
            type: string
          type: array
        EventTypes:
          description: List of event types.
          items:
            type: string
          type: array
        IamNames:
          description: List of IAM provider names.
          items:
            type: string
          type: array
        MpNames:
          description: List of migration plan names.
          items:
            type: string
          type: array
        SourcePaths:
          description: List of source paths.
          items:
            type: string
          type: array
        TargetPaths:
          description: List of target paths.
          items:
            type: string
          type: array
        UserNames:
          description: List of user names.
          items:
            type: string
          type: array
        VmNames:
          description: List of vm names.
          items:
            type: string
          type: array
      type: object
    EventsListMetaData:
      properties:
        EventsFilters:
          properties:
            EventNames:
              $ref: '#/components/schemas/EventsFilterOptions'
            EventStatuses:
              $ref: '#/components/schemas/EventsFilterOptions'
            EventTypes:
              $ref: '#/components/schemas/EventsFilterOptions'
            IamNames:
              $ref: '#/components/schemas/EventsFilterOptions'
            MpNames:
              $ref: '#/components/schemas/EventsFilterOptions'
            SourcePaths:
              $ref: '#/components/schemas/EventsFilterOptions'
            TargetPaths:
              $ref: '#/components/schemas/EventsFilterOptions'
            UserNames:
              $ref: '#/components/schemas/EventsFilterOptions'
            VmNames:
              $ref: '#/components/schemas/EventsFilterOptions'
          type: object
      type: object
    PaginationDetails:
      description: Used as input for lists with pagination
      properties:
        PageNumber:
          description: Page number for which records are returned
          format: int32
          type: integer
        RecordsPerPage:
          description: Records per page
          format: int32
          type: integer
        TotalPages:
          description: Total number of pages
          format: int32
          type: integer
        TotalRecords:
          description: Total number of records
          format: int64
          type: integer
      required:
      - PageNumber
      - RecordsPerPage
      - TotalPages
      - TotalRecords
      type: object
