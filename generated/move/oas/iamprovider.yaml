components:
  securitySchemes:
    Bearer:
      in: header
      name: Authorization
      type: apiKey
  schemas:
    PcIamDeregisterInfo:
      description: Prism Central access information.
      properties:
        Password:
          description: Prism Central password
          type: string
        Username:
          description: Prism Central user name
          type: string
      required:
      - Username
      - Password
      type: object
    Status:
      properties:
        Message:
          type: string
        State:
          type: string
      type: object
    GenericResponse:
      description: Generic API response.
      properties:
        APIVersion:
          description: Move API version
          type: string
        MetaData:
          $ref: '#/components/schemas/MetaData'
        Status:
          $ref: '#/components/schemas/Status'
      type: object
    AuthRoleMap:
      description: Mapping between roles and usernames.
      properties:
        Groups:
          description: List of user groups to be allowed to authorize on Move.
          items:
            type: string
          type: array
          uniqueItems: true
        Role:
          description: Role name to be assigned to usernames.
          enum:
          - MoveAdmin
          type: string
        Usernames:
          description: List of usernames. Maximum 10 users allowed currently.
          items:
            type: string
          type: array
          uniqueItems: true
      required:
      - Role
      - Usernames
      type: object
    PcIamRegisterInfo:
      description: Prism Central access information.
      properties:
        IPorFQDN:
          description: Prism Central IP Address or FQDN
          type: string
        Password:
          description: Prism Central password
          type: string
        Username:
          description: Prism Central user name
          type: string
      required:
      - IPorFQDN
      - Username
      - Password
      type: object
    MetaData:
      description: Metadata information
      properties:
        Count:
          type: integer
        CreationTime:
          description: Token creation time.
          type: string
        Kind:
          type: string
        LastUpdateTime:
          description: Last updated time.
          type: string
        Name:
          description: User name
          type: string
        SpecVersion:
          description: Specification version
          type: string
        UUID:
          description: UUID
          format: uuid
          type: string
      type: object
    IamProviderRegisterRequest:
      description: Information required to register IAM provider.
      properties:
        PcIamRegisterInfo:
          $ref: '#/components/schemas/PcIamRegisterInfo'
        RolesMap:
          items:
            $ref: '#/components/schemas/AuthRoleMap'
          type: array
        Type:
          description: IAM provider type. Currently only Prism Central is supported as IAM provider.
          enum:
          - PC
          type: string
      required:
      - Type
      type: object
    PcIamInfo:
      description: Prism Central IAM provider information.
      properties:
        IPorFQDN:
          description: Prism Central IP Address or FQDN
          type: string
      type: object
    IamProviderEntities:
      description: IAM providers information.
      properties:
        APIVersion:
          description: Move API version
          type: string
        Entities:
          items:
            $ref: '#/components/schemas/IamProvider'
          type: array
        MetaData:
          $ref: '#/components/schemas/MetaData'
      type: object
    Error:
      description: Error information
      properties:
        ApiVersion:
          description: Move API version.
          type: string
        Code:
          description: Error Code.
          format: uint64
          type: integer
        Kind:
          description: Error kind.
          type: string
        Message:
          description: Error Message.
          type: string
        State:
          description: Error State.
          type: string
      required:
      - Message
      type: object
    IamProvider:
      description: IAM provider information.
      properties:
        PcInfo:
          $ref: '#/components/schemas/PcIamInfo'
        RolesMap:
          items:
            $ref: '#/components/schemas/AuthRoleMap'
          type: array
        Type:
          description: IAM provider type. Currently only Prism Central is supported as IAM provider.
          enum:
          - PC
          type: string
        UUID:
          description: IAM provider UUID.
          format: uuid
          type: string
      type: object
    IamProviderUpdateRequest:
      description: Information required to register IAM provider.
      properties:
        RolesMap:
          items:
            $ref: '#/components/schemas/AuthRoleMap'
          type: array
      required:
      - RolesMap
      type: object
    IamProviderDeregisterRequest:
      description: Information to deregister IAM provider.
      properties:
        ForceDeregister:
          description: Forcefully deregister IAM provider from Move.
          type: boolean
        PcIamDeregisterInfo:
          $ref: '#/components/schemas/PcIamDeregisterInfo'
      type: object
    IamProviderEntity:
      description: Response for registering provider.
      properties:
        APIVersion:
          description: Move API version
          type: string
        MetaData:
          $ref: '#/components/schemas/MetaData'
        Spec:
          $ref: '#/components/schemas/IamProvider'
      type: object
