- url: /
security: []
paths:
  /move/v2/providers:
    post:
      description: Creates a new provider.<br/><br/> A provider is an environment (ESXi/AOS/AWS/AZURE and so on) which can
        act as a migration source, target or both. The provider can later be added as a source/target during the creation
        of migration plans. See the Move User Guide to know about supported source/target types. <br/><br/><b>Sample API Syntax:</b>
        https://move.address/move/v2/providers
      operationId: createProvider
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderAddEntity'
        description: Provider object information required to create a new provider.
        required: true
        x-examples:
          aos:
            Spec:
              AOSAccessInfo:
                IPorFQDN: my_ahv_ip
                Password: my_ahv_password
                Username: my_ahv_username
              Name: AHV-Provider
              Type: AOS
          aws:
            Spec:
              AWSAccessInfo:
                AccessKey: aws_access_key
                SecretKey: aws_secret_key
              Name: AWS-Provider
              Type: AWS
          azure:
            spec:
              AzureAccessInfo:
                ClientID: my_client_id
                ClientSecret: my_client_secret_id
                SubscriptionID: my_subscription_id
                TenantID: my_tenant_id
              Name: AZURE-Provider
              Type: AZURE
          esx:
            Spec:
              ESXAccessInfo:
                IPorFQDN: my_vcenter_ip
                Password: my_vcenter_password
                Username: my_vcenter_username
              Name: ESXi-Provider
              Type: ESXI
          esx_ntnx:
            Spec:
              AOSAccessInfo:
                IPorFQDN: my_aos_ip
                Password: my_aos_password
                RegisteredVCAccessInfo:
                - IPAddress: my_vcenter_ip
                  Password: my_vcenter_password
                  Username: my_vcenter_username
                Username: my_aos_username
              Name: ESXi-On-Nutanix-Provider
              Type: AOS
          hyperv:
            Spec:
              HyperVAccessInfo:
                IPorFQDN: my_hyperv_ip
                Password: my_hyperv_password
                Username: my_hyperv_username
              HyperVSettings:
                OverrideAgent: false
              Name: HyperV-Provider
              Type: HYPERV
      responses:
        '201':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderAddResponse'
            aos: {}
            aws: {}
            azure: {}
            esx: {}
            esx_ntnx: {}
            hyperv: {}
      security:
      - Bearer: []
      summary: Create a new provider
      tags:
      - Provider
