components:
  securitySchemes:
    Bearer:
      in: header
      name: Authorization
      type: apiKey
  schemas:
    EntityPausedStatus:
      description: Returns information about paused entities.
      properties:
        PausedTime:
          description: Time of pausing migration (in milliseconds).
          format: int64
          type: integer
        State:
          description: State of migration before getting paused.
          format: int64
          type: integer
      type: object
    ScanData:
      properties:
        CompletedAt:
          description: Unix timestamp indicating when the scanning process was completed.
          format: int64
          type: integer
        ScanningError:
          description: Any error message encountered during the scanning process.
          type: string
        ScanningPercentage:
          description: The percentage of completion for the scanning process.
          format: int32
          maximum: 100
          minimum: 0
          type: integer
        ScanningStatus:
          description: The current status of the scanning process, for example, "StatusInProgress", "StatusCompleted", and
            so on.
          enum:
          - StatusUnknown
          - StatusInProgress
          - StatusFailed
          - StatusCompleted
          - StatusCancelled
          - StatusPaused
          - StatusCancelling
          - StatusQueued
          - StatusCompletedWithErrors
          type: string
        StartedAt:
          description: Unix timestamp indicating when the scanning process started.
          format: int64
          type: integer
        TotalBytes:
          description: The total size of scanned files in bytes.
          format: int64
          type: integer
        TotalDirs:
          description: The total number of directories scanned.
          format: int32
          type: integer
        TotalFiles:
          description: The total number of files scanned.
          format: int32
          type: integer
      type: object
    TaskAssociatedEntity:
      description: Entity associated with a task.
      properties:
        Type:
          description: Entity type.
          type: integer
        Uuid:
          description: Entity UUID.
          format: uuid
          type: string
      type: object
    IterationStatus:
      description: Iteration status.
      properties:
        BytesPerSec:
          description: Bytes copied per second.
          format: uint64
          type: integer
        CopiedDataSizeInBytes:
          description: Size of copied data in bytes.
          format: uint64
          type: integer
        CopiedDirectories:
          description: Number of directories copied.
          format: uint64
          type: integer
        CopiedFiles:
          description: Number of files copied.
          format: uint64
          type: integer
        ElapsedTime:
          $ref: '#/components/schemas/ElapsedTime'
        EndTime:
          description: End time of an iteration (in Unix time unit of nanoseconds).
          format: int64
          type: integer
        ErrorMessage:
          description: Error message.
          type: string
        EstimatedTimeToCompleteInSecs:
          description: Time to complete iteration in seconds.
          format: int64
          type: integer
        FailedDirectories:
          description: Number of directories that could not be migrated.
          format: uint64
          type: integer
        FailedFiles:
          description: Number of files that could not be migrated.
          format: uint64
          type: integer
        FilesScannedPerSec:
          description: Files scanned per second.
          format: uint64
          type: integer
        IterationNumber:
          description: Iteration number.
          format: int64
          type: integer
        IterationType:
          description: Defines the type of iteration.
          format: int
          type: integer
        NodeJobStatusInfo:
          description: Status of jobs for iteration on nodes.
          items:
            $ref: '#/components/schemas/NodeJobStatusInfo'
          type: array
        ProgressPercentage:
          description: The completion status of the iterations in percentage.
          format: float64
          type: number
        ScannedFiles:
          description: Number of files scanned per second.
          format: uint64
          type: integer
        ScanningPercentage:
          description: The progress of the scanning process in percentage.
          format: float64
          type: number
        SkippedFiles:
          description: Number of files skipped.
          format: uint64
          type: integer
        SourcePath:
          description: Source path.
          type: string
        StartTime:
          description: Start time of an iteration (in Unix time unit of nanoseconds).
          format: int64
          type: integer
        State:
          description: Files state.
          format: int64
          type: integer
        Status:
          description: Files status.
          format: int64
          type: integer
        StatusMessage:
          description: Status message of iteration.
          type: string
        TargetPath:
          description: Target path.
          type: string
        WarningMessage:
          description: Warning message.
          type: string
      type: object
    VMRunbookInput:
      description: Input for the runbooks to be executed on a target VM after migration.
      properties:
        UUID:
          description: UUID of the runbook.
          format: uuid
          type: string
        Variables:
          description: Runbook variables information and input.
          items:
            properties:
              IsSecret:
                description: Flag indicating if a variable is secret.
                type: boolean
              UUID:
                description: Runbook variable UUID.
                format: uuid
                type: string
              Value:
                description: Runbook variable input. For multi-value (array) input, separate the elements of the array using
                  comma (,).
                type: string
            required:
            - UUID
            type: object
          type: array
      required:
      - UUID
      type: object
    AOSCCProviderAttrs:
      description: AOS provider attributes.
      properties:
        ClusterUUID:
          description: AOS cluster UUID.
          format: uuid
          type: string
      type: object
    SplMessage:
      description: Move application message.
      properties:
        Message:
          description: Contents of the message.
          type: string
        Title:
          description: Title of the message.
          type: string
        Type:
          description: Type of the message.
          enum:
          - INFO
          - WARN
          - ERROR
          type: string
      type: object
    MSchedule:
      description: Migration schedule.
      properties:
        RWEndTimeAtEpochSec:
          description: Migration plan end time
          format: int64
          type: integer
        RWStartTimeAtEpochSec:
          description: Migration plan start time
          format: int64
          type: integer
        ScheduleAtEpochSec:
          description: Migration plan scheduled at time
          format: int64
