    put:
      description: Updates the migration plan using the plan UUID as input. When not in progress, all migration plan entities
        can be updated. <br/><br/><b>Sample API Syntax:</b> https://move.address/move/v2/plans/867b4a4f-cb8c-4416-8d7e-26e033023aa4/
      operationId: updatePlan
      parameters:
