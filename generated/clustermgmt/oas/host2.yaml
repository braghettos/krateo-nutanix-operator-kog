                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/clustermgmt.v4.0.error.ErrorResponse'
                additionalProperties: false
                description: REST response for all response codes in API path /clustermgmt/v4.0/config/hosts Get operation
      x-permissions:
        deploymentList:
        - ON_PREM
        - CLOUD
        operationName: View Host
        roleList:
