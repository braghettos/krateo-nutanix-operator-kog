          \ = 'username';\n// Password to connect to the cluster\napiClientInstance.password = 'password';\n// Please add\
          \ authorization information here if needed.\nlet storageContainersApi = new StorageContainersApi(apiClientInstance);\n\
          \nfunction sample() {\n\n    \n    let clusterExtId = \"beea613e-3EFF-badc-Fd69-62D0199D7AA5\";\n\n    // Construct\
          \ Optional Parameters\n    var opts = {};\n    opts[\"$page\"] = 0;\n    opts[\"$limit\"] = 50;\n    opts[\"$filter\"\
          ] = \"string_sample_data\";\n\n\n\n\n    storageContainersApi.listDataStoresByClusterId(clusterExtId, opts).then(({data,\
          \ response}) => {\n        console.log(`API returned the following status code: ${response.status}`);\n        console.log(data.getData());\n\
          \    }).catch((error) => {\n        console.log(`Error is: ${error}`);\n    });\n\n}\nsample()\n"
      - lang: Python
        source: "\nimport ntnx_clustermgmt_py_client\n\nif __name__ == \"__main__\":\n    # Configure the client\n    config\
          \ = ntnx_clustermgmt_py_client.Configuration()\n    # IPv4/IPv6 address or FQDN of the cluster\n    config.host\
          \ = \"localhost\"\n    # Port to which to connect to\n    config.port = 9440\n    # Max retry attempts while reconnecting\
          \ on a loss of connection\n    config.max_retry_attempts = 3\n    # Backoff factor to use during retry attempts\n\
          \    config.backoff_factor = 3\n    # UserName to connect to the cluster\n    config.username = \"username\"\n \
          \   # Password to connect to the cluster\n    config.password = \"password\"\n    # Please add authorization information\
          \ here if needed.\n    client = ntnx_clustermgmt_py_client.ApiClient(configuration=config)\n    storage_containers_api\
          \ = ntnx_clustermgmt_py_client.StorageContainersApi(api_client=client)\n    \n    cluster_ext_id = \"7b1F5739-Add6-FeaE-B21B-E9Abb6e1F2E4\"\
          \n    \n    page = 0\n    \n    limit = 50\n\n\n    try:\n        api_response = storage_containers_api.list_data_stores_by_cluster_id(clusterExtId=cluster_ext_id,\
          \ _page=page, _limit=limit)\n        print(api_response)\n    except ntnx_clustermgmt_py_client.rest.ApiException\
          \ as e:\n        print(e)\n\n"
      - lang: Go
        source: "\npackage main\n\nimport (\n    \"fmt\"\n    \"time\"\n    \"github.com/nutanix/ntnx-api-golang-clients/clustermgmt-go-client/v4/api\"\
          \n    \"github.com/nutanix/ntnx-api-golang-clients/clustermgmt-go-client/v4/client\"\n    import1 \"github.com/nutanix/ntnx-api-golang-clients/clustermgmt-go-client/v4/models/clustermgmt/v4/config\"\
          \n)\n\nvar (\n    ApiClientInstance *client.ApiClient\n    StorageContainersApiInstance *api.StorageContainersApi\n\
          )\n\nfunc main() {\n    ApiClientInstance = client.NewApiClient()\n    // IPv4/IPv6 address or FQDN of the cluster\n\
          \    ApiClientInstance.Host = \"localhost\"\n    // Port to which to connect to\n    ApiClientInstance.Port = 9440\n\
          \    // Interval in ms to use during retry attempts\n    ApiClientInstance.RetryInterval = 5 * time.Second\n   \
          \ // Max retry attempts while reconnecting on a loss of connection\n    ApiClientInstance.MaxRetryAttempts = 5\n\
          \    // UserName to connect to the cluster\n    ApiClientInstance.Username = \"username\"\n    // Password to connect\
          \ to the cluster\n    ApiClientInstance.Password = \"password\"\n    // Please add authorization information here\
          \ if needed.\n    StorageContainersApiInstance = api.NewStorageContainersApi(ApiClientInstance)\n\n    \n    clusterExtId\
          \ := \"e4EFbEeF-BA1a-ccB1-fcef-A2ECd6C2c5f0\"\n    \n    page_ := 0\n    \n    limit_ := 50\n\n\n    response, error\
          \ := StorageContainersApiInstance.ListDataStoresByClusterId(&clusterExtId, &page_, &limit_, nil)\n    if error !=\
          \ nil {\n        fmt.Println(error)\n        return\n    }\n    data, _ := response.GetData().([]import1.DataStore)\n\
          \    fmt.Println(data)\n\n}\n\n"
