          \ listDataStoresByClusterIdApiResponse = storageContainersApi.listDataStoresByClusterId(clusterExtId, page, limit,\
          \ null);\n            System.out.println(listDataStoresByClusterIdApiResponse.toString());\n\n        } catch (RestClientException\
          \ ex) {\n            System.out.println(ex.getMessage());\n        }\n    }\n}\n"
      - lang: JavaScript
        source: "\nimport { ApiClient, StorageContainersApi } from \"@nutanix-api/clustermgmt-js-client\";\n\n// Configure\
          \ the client\nlet apiClientInstance = new ApiClient();\n// IPv4/IPv6 address or FQDN of the cluster\napiClientInstance.host\
          \ = 'localhost';\n// Port to which to connect to\napiClientInstance.port = '9440';\n// Max retry attempts while\
          \ reconnecting on a loss of connection\napiClientInstance.maxRetryAttempts = 5;\n// Interval in ms to use during\
