components:
  schemas:
    monitoring.v4.0.common.IntValue:
      required:
      - intValue
      type: object
      properties:
        intValue:
          type: integer
          description: Denotes a value of type integer.
          format: int64
          example: 0
      additionalProperties: false
      description: Denotes a value of type integer.
    monitoring.v4.0.serviceability.SeverityTrail:
      type: object
      properties:
        severity:
          $ref: '#/components/schemas/monitoring.v4.0.common.Severity'
        severityChangeTime:
          type: string
          description: The time in ISO 8601 format when the severity of the alert was changed.
          format: date-time
          example: 2009-09-23 14:30:00-07:00
      additionalProperties: false
      description: Contains information on the severity change history for alerts. If an alert was de-duplicated without change
        in severity, then no trail will be present.
    monitoring.v4.0.common.BoolValue:
      required:
      - boolValue
      type: object
      properties:
        boolValue:
          type: boolean
          description: Denotes a value of type boolean.
          example: false
      additionalProperties: false
      description: Denotes a value of type boolean.
    common.v1.0.config.Flag:
      type: object
      properties:
        name:
          maxLength: 128
          minLength: 3
          type: string
          description: 'Name of the flag.

            '
        value:
          type: boolean
          description: 'Value of the flag.

            '
          default: false
      additionalProperties: false
      description: 'Many entities in the Nutanix APIs carry flags.  This object captures all the flags associated with that
        entity through this object.  The field that hosts this type of object must have an attribute called x-bounded-map-keys
        that tells which flags are actually present for that entity.

        '
    monitoring.v4.0.error.SchemaValidationError:
      type: object
      properties:
        timestamp:
          type: string
          description: Timestamp of the response.
          format: date-time
          example: 2009-09-23 14:30:00-07:00
        statusCode:
          type: integer
          description: The HTTP status code of the response.
          example: 28
        error:
          type: string
          description: The generic error message for the response.
        path:
          type: string
          description: API path on which the request was made.
