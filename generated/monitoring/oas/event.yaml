      - GREATER_THAN
      - GREATER_THAN_OR_EQUAL_TO
      - LESS_THAN
      - LESS_THAN_OR_EQUAL_TO
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        GREATER_THAN: Indicates a > operator used in conjunction with a metric in a condition. An alert may be generated when
          the metric value equals the static threshold set depending on the trigger condition set.
        LESS_THAN_OR_EQUAL_TO: Indicates a <= operator used in conjunction with a metric in a condition. An alert may be generated
          when the metric value is less than or equal to the static threshold set depending on the trigger condition set.
        EQUAL_TO: Indicates an = operator used in conjunction with a metric in a condition. An alert may be generated when
          the metric value equals the static threshold set depending on the trigger condition set.
        GREATER_THAN_OR_EQUAL_TO: Indicates a >= operator used in conjunction with a metric in a condition. An alert may be
          generated when the metric value is greater than or equal to the static threshold set depending on the trigger condition
          set.
        LESS_THAN: Indicates a < operator used in conjunction with a metric in a condition. An alert may be generated when
          the metric value is less than the static threshold set depending on the trigger condition set.
