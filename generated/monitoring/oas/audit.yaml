          URL conventions. If a $select expression consists of a single select item that is an asterisk (i.e., *), then all
          properties on the matching resource will be returned.

          - affectedEntities

          - auditType

          - clusterReference

          - creationTime

          - extId

          - links

          - message

          - operationEndTime

          - operationStartTime

          - operationType

          - parameters

          - serviceName

          - sourceEntity/extId

          - sourceEntity/name

          - sourceEntity/type

          - status

          - tenantId

          - userReference/extId

          - userReference/ipAddress

          - userReference/name

