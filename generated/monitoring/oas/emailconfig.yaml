          maximum: 65536
          minimum: 0
          type: integer
          description: Port on which proxy is binding.
          format: int32
          example: 16
        username:
          maxLength: 255
          type: string
          description: User name for proxy authentication.
          example: user123
        password:
          type: string
          description: Password for proxy authentication.
          example: password123
        proxyTypes:
          maxItems: 100
          minItems: 0
          type: array
          description: Proxy types to send applicable traffic.
          items:
            $ref: '#/components/schemas/monitoring.v4.0.serviceability.ProxyType'
      additionalProperties: false
      description: HTTP proxy used to establish the remote tunnel.
    common.v1.0.config.IPv4Address:
      required:
      - value
      type: object
      properties:
        value:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
          description: 'The IPv4 address of the host.

            '
          example: 137.167.21.40
        prefixLength:
          maximum: 32
          minimum: 0
          type: integer
          description: 'The prefix length of the network to which this host IPv4 address belongs.

            '
          format: int32
          default: 32
      additionalProperties: false
      description: 'An unique address that identifies a device on the internet or a local network in IPv4 format.

        '
    monitoring.v4.0.serviceability.ParameterizedMessage:
      type: object
      properties:
        message:
          type: string
          description: Message.
          example: Tunnel is stable and secure.
        attributes:
          maxItems: 100
          minItems: 0
          type: array
          description: Attributes.
          items:
            $ref: '#/components/schemas/common.v1.0.config.KVStringPair'
      additionalProperties: false
      description: To store any custom message and attributes.
  securitySchemes:
    basicAuthScheme:
      type: http
      scheme: basic
    apiKeyAuthScheme:
      type: apiKey
      name: X-ntnx-api-key
      in: header
