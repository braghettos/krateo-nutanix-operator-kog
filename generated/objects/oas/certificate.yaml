          \     String objectStoreExtId = \"EBbceACC-a2e3-b0FF-c2cE-aA4B7Baf589c\";\n      String extId = \"A43cDe8f-FABE-a9c0-8843-CF34FA2F1D5c\"\
          ;\n\n        // Create request object with parameters\n        var request = new GetCertificateByIdRequest {\n \
          \           ObjectStoreExtId = objectStoreExtId,\n            ExtId = extId\n        };\n        try {\n       \
          \     GetCertificateApiResponse getCertificateApiResponse = objectStoresApi.GetCertificateById(request);\n     \
          \   } catch (ApiException ex) {\n            Console.WriteLine(ex.Message);\n        }\n    }\n  }\n}\n"
