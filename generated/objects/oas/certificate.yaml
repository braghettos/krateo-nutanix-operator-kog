      - lang: Java
        source: "\npackage sample;\n\nimport com.nutanix.obj.java.client.ApiClient;\nimport com.nutanix.obj.java.client.api.ObjectStoresApi;\n\
          import com.nutanix.dp1.obj.objects.v4.request.ObjectStores.CreateCertificateRequest;\n\nimport java.util.HashMap;\n\
