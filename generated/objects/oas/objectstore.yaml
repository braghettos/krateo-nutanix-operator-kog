          \ extId: &extId }\n    getResponse, err := ObjectStoresServiceApiInstance.GetObjectstoreById(ctx, &getRequest)\n\
          \    if err != nil {\n        fmt.Println(err)\n        return\n    }\n\n    // Extract E-Tag Header\n    etagValue\
          \ := ApiClientInstance.GetEtag(getResponse)\n\n    args := make(map[string] interface{})\n    args[\"If-Match\"\
