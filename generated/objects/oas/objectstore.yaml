    get:
      tags:
      - ObjectStores
      summary: Get an Object store
      description: "Get an Object store for the provided UUID.\n`state` string (State of the Object store)\nEnum for the state\
        \ of the Object store.\n| Enum | Description |\n| ----------- | ----------- |\n| `\"DEPLOYING_OBJECT_STORE\"`\t| The\
        \ Object store will be in this state during an ongoing deployment of the Object store. The Object store will be unavailable\
        \ through S3 APIs in this state. The Object store will move to the OBJECT_STORE_AVAILABLE state if the deployment\
        \ succeeds, and to the OBJECT_STORE_DEPLOYMENT_FAILED state if the deployment fails. |\n| `\"OBJECT_STORE_OPERATION_FAILED\"\
        `\t| The Object store is in this state when there is an error while performing an operation on the Object store. The\
        \ Object store may not be available through S3 APIs in this state. |\n| `\"OBJECT_STORE_CERT_CREATION_FAILED\"` |\
        \ \tAn Object store enters this state if there is an error while creating the Object store certificate. Creating a\
        \ new certificate can be retried from this state. The Object store may not be available through S3 APIs in this state.\
        \ |\n| `\"OBJECT_STORE_OPERATION_PENDING\"` | \tThe Object store is in this state during an ongoing operation on the\
        \ Object store. The Object store may not be available through S3 APIs in this state. The Object store will enter the\
        \ OBJECT_STORE_OPERATION_FAILED state if the operation fails, or the OBJECT_STORE_AVAILABLE state if the operation\
        \ is successful. |\n| `\"UNDEPLOYED_OBJECT_STORE\"` | \tThe Object store is in this state if it has not been deployed.\
        \ |\n| `\"CREATING_OBJECT_STORE_CERT\"` | \tThe Object store is in this state during a certificate creation for the\
        \ Object store. The Object store will be unavailable through S3 APIs in this state. It will move to the OBJECT_STORE_AVAILABLE\
        \ state if the certificate was created successfully, or to the OBJECT_STORE_CERT_CREATION_FAILED state if an error\
        \ occurs while creating the certificate. |\n| `\"OBJECT_STORE_AVAILABLE\"`\t | An Object store is in this state if\
        \ its deployment was successful, and there are no ongoing operations on the Object store. The Object store will be\
        \ available through S3 APIs in this state. In this state, the Object store can be deleted or a new certificate can\
        \ be created for this Object store. |\n| `\"OBJECT_STORE_DELETION_FAILED\"` | \tAn Object store enters this state\
        \ if there is an error deleting the Object store. The Object store will not be available through S3 APIs in this state.\
        \ Deleting the Object store can be retried from this state. |\n| `\"OBJECT_STORE_DEPLOYMENT_FAILED\"` | \tAn Object\
        \ store enters this state when its deployment fails. The Object store deployment can be retried or the Object store\
        \ can be deleted from this state. |\n| `\"DELETING_OBJECT_STORE\"` | \tA deployed Object store is in this state when\
        \ the Object store is being deleted. The Object store will be unavailable through S3 APIs in this state. It can be\
        \ either deleted or move to the OBJECT_STORE_DELETION_FAILED state if the deletion fails. |\n"
