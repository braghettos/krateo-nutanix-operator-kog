          type: string
        software_tier:
          description: The software tier of the cluster.
          enum:
          - pro
          - ultimate
          type: string
        terminate_at:
          description: The termination time of the cluster.
          format: date-time
          type: string
        use_case:
          $ref: '#/components/schemas/Cluster use-case'
