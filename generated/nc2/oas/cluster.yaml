          type: string
        network:
          properties:
            availability_zone:
              description: The availability zone for the cluster.
              type: string
            dns_servers:
              description: List of DNS server IP addresses for new mode.
              items:
                type: string
              type: array
            fvn_config:
              properties:
                nat_ip_ranges:
                  items:
                    properties:
                      cidr:
                        allOf:
                        - $ref: '#/components/schemas/CIDR'
                        description: The CIDR for NAT IP range for new mode.
                      name:
                        description: The name of the NAT IP range.
                        type: string
                    type: object
                  title: NAT IP Ranges Configuration
                  type: array
                no_nat:
                  properties:
                    cidr:
                      allOf:
                      - $ref: '#/components/schemas/CIDR'
                      description: The CIDR for no NAT subnet for new mode.
                    name:
                      description: The subnet name for no NAT for existing mode or CIDR for new mode.
                      type: string
                  title: No NAT Configuration
                  type: object
              required:
              - no_nat
              - nat_ip_ranges
              title: Flow Virtual Network Configuration
              type: object
            management_services_access_policy:
              properties:
                ip_addresses:
                  description: List of allowed IP addresses/CIDRs. Required only if mode is restricted.
                  items:
                    $ref: '#/components/schemas/CIDR'
                  type: array
                mode:
                  description: Access policy Mode
                  enum:
                  - disabled
                  - restricted
                  type: string
              required:
              - mode
              title: Management Services Access Policy
              type: object
            management_subnet:
              description: The management subnet name for existing mode.
              type: string
            mode:
              description: 'Network mode: existing or new.'
              enum:
              - existing
              - new
              type: string
            prism_element_access_policy:
              properties:
                ip_addresses:
                  description: List of allowed IP addresses/CIDRs. Required only if mode is restricted.
                  items:
                    $ref: '#/components/schemas/CIDR'
                  type: array
                mode:
                  description: Access policy Mode
                  enum:
                  - disabled
                  - restricted
                  type: string
              required:
              - mode
              title: Prism Element Access Policy
              type: object
            subnet_cidr:
              allOf:
              - $ref: '#/components/schemas/CIDR'
              description: The subnet CIDR for new mode.
            vpc:
              description: The VPC name for existing mode.
              type: string
          required:
          - mode
          - management_services_access_policy
          - prism_element_access_policy
          title: Google Cloud Network Configuration
          type: object
        organization_id:
          description: The ID of the organization.
          type: Elixir.CPanelWeb.Api.Specs.UUID
        prism_central:
          properties:
            dns_server_ip_list:
