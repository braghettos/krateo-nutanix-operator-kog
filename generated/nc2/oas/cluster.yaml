components:
  schemas:
    Google Cloud Cluster Capacity:
      description: Capacity configuration for Google Cloud cluster.
      properties:
        instance_type:
          description: The instance type
          type: string
        nodes_count:
          description: The number of nodes
          type: integer
      required:
      - instance_type
      - nodes_count
      title: Google Cloud Cluster Capacity
      type: object
    Flow Gateway Capacity Settings:
      properties:
        active_nodes:
          description: Number of Flow Gateway nodes.
          type: integer
        vm_size:
          description: The VM type.
          type: string
      required:
      - active_nodes
      - vm_size
      title: Flow Gateway Capacity Settings
      type: object
    Basic cluster:
      properties:
        active:
          description: Designates the cluster as either active or inactive.
          type: boolean
        aos_version:
          description: The AOS version of the cluster.
          type: string
        cloud_account_id:
          description: The ID of the cloud account.
          type: Elixir.CPanelWeb.Api.Specs.Base64ID
        cluster_fault_tolerance:
          $ref: '#/components/schemas/Cluster fault tolerance factor'
        consumption:
          $ref: '#/components/schemas/Cluster consumption'
        created_at:
          description: The creation time of the cluster.
          format: date-time
          type: string
        created_by:
          $ref: '#/components/schemas/User Details'
        customer_id:
          description: The ID of the customer.
          type: Elixir.CPanelWeb.Api.Specs.UUID
        description:
          description: Add a description for the customer.
          type: string
        hosts:
          description: A list of cluster hosts.
          properties:
            data:
              items:
                $ref: '#/components/schemas/Cluster host'
              type: array
          title: Cluster host list
          type: object
        id:
          description: The ID of the cluster.
          type: Elixir.CPanelWeb.Api.Specs.UUID
        license:
          additionalProperties:
            type: string
          description: The license type of the cluster.
          type: object
        name:
          description: The name of the customer.
          type: string
        organization_id:
          description: The ID of the organization.
          type: Elixir.CPanelWeb.Api.Specs.UUID
        redundancy:
          $ref: '#/components/schemas/Cluster redundancy'
        region:
          description: The region of the cluster.
          type: string
        software_tier:
          description: The software tier of the cluster.
          type: string
        status:
          enum:
          - creating
          - creation_failed
          - hibernated
          - hibernating
          - hibernation_failed
          - hibernation_stalled
          - resuming
          - resuming_failed
          - resuming_stalled
          - running
          - terminated
          - terminating
          type: string
        url_slug:
          description: Slug of the URL unique to your cluster.
          type: string
        use_case:
          $ref: '#/components/schemas/Cluster use-case'
      required:
      - cloud_account_id
      - customer_id
      - name
      - organization_id
      - region
      - use_case
      title: Basic cluster
      type: object
    User Details:
      description: Details of the user.
      properties:
        email:
          description: The email of the user.
          format: email
          type: string
        first_name:
          description: The first name of the user.
          type: string
        id:
          description: The ID of the user.
          format: uuid
          type: string
        identity_provider:
          description: The identity provider of the user.
          type: string
        last_name:
          description: The last name of the user.
          type: string
      required:
      - id
      - email
      - identity_provider
      title: User Details
      type: object
    Flow Gateway Node:
      properties:
        chassis_id:
          type: string
        cloud_id:
          type: string
        cloud_status:
          type: string
        delete_reason:
          type: string
        deleted_time:
          type: string
        host_id:
          type: string
        id:
          type: string
        provisioned_time:
          type: string
        state:
          type: string
      title: Flow Gateway Node
      type: object
    Host Remote Storage Volumes:
      items:
        properties:
          capacity:
            description: Remote Storage Volume capacity in gigabytes.
            type: string
          cloud_id:
            description: The cloud volume ID.
            type: string
          disk_id:
            description: The volume disk ID.
            type: string
          iqn_name:
            description: The IQN name of the volume.
            type: string
          status:
            description: The volume status.
            type: string
          type:
            description: The remote storage volume type.
            type: string
        title: Host Remote Storage Volume item
        type: object
      title: Host Remote Storage Volumes
      type: array
    Cluster use-case:
      description: The use-case for the cluster.
      enum:
      - general
      - vdi
      title: Cluster use-case
      type: string
    Cluster capacity:
      items:
        properties:
          host_type:
            description: Type of the host instance in the cluster. Refer to our NC2 user guide for supported host types.
            type: string
          number_of_hosts:
            description: Number of hosts of the given host type.
            maximum: 28
            minimum: 3
            type: integer
          remote_storage:
            $ref: '#/components/schemas/Remote Storage configuration'
        required:
        - host_type
        - number_of_hosts
        title: Cluster capacity item
        type: object
      title: Cluster capacity
      type: array
    Flow Gateway BGP:
      properties:
        asn:
          description: BGP ASN
          type: integer
        cloud_provider:
          type: string
        cloud_provider_id:
          type: string
        resource_group:
          type: string
        subnet:
          type: string
        subnet_cidr:
          type: string
        vnet:
          type: string
      required:
      - asn
      - cloud_provider
      - vm_size
      title: Flow Gateway BGP
      type: object
    Base64ID:
      description: Base 64 encoded ID.
      title: Base64ID
      type: string
    Cluster host:
      properties:
        cvm_ip:
          description: The IP of the controller VM (CVM).
          type: string
        ip:
          description: The IP of the host.
          type: string
        name:
          description: The name of the host.
          type: string
        node_type:
          description: The type of the node.
          enum:
          - hci
          - storage_only
          type: string
        state:
          type: string
        type:
          type: string
        volumes:
          $ref: '#/components/schemas/Host Remote Storage Volumes'
      required:
      - name
      - type
      - state
      title: Cluster host
      type: object
    AWS cluster:
      allOf:
      - $ref: '#/components/schemas/Basic cluster'
      - properties:
          capacity:
            $ref: '#/components/schemas/Cluster capacity for AWS'
          files_capacity:
            $ref: '#/components/schemas/Files Capacity'
          files_dedicated:
            $ref: '#/components/schemas/Files Dedicated'
          host_access_ssh_key:
            description: The name of the SSH key.
            type: string
          network:
            properties:
              availability_zone:
                type: string
              management_services_access_policy:
                properties:
                  ip_addresses:
                    items:
                      $ref: '#/components/schemas/CIDR'
                    type: array
                  mode:
                    enum:
                    - disabled
                    - restricted
                    type: string
                required:
                - mode
                title: AWS network access policy for management services
                type: object
              management_subnet:
                type: string
              prism_element_access_policy:
                properties:
                  ip_addresses:
                    items:
                      $ref: '#/components/schemas/CIDR'
                    type: array
                  mode:
                    enum:
                    - disabled
                    - public
                    - restricted
                    type: string
                required:
                - mode
                title: AWS network access policy for Prism Element
                type: object
              replacement_cluster_details:
                properties:
                  id:
                    description: The ID of the replacement cluster.
                    type: string
                  recovery_status:
                    description: The recovery status of the replacement cluster.
                    enum:
                    - failed
                    - in_progress
                    - not_in_progress
                    - success
                    - creating_replacement_cluster
                    - deprovisioning_replaced_cluster
                    - terminating_cluster_nodes
                    type: string
                title: Replacement cluster details
                type: object
              replacing_cluster_details:
                properties:
                  id:
                    description: The ID of the replacing cluster.
                    type: string
                  recovery_status:
                    description: The recovery status of the replacing cluster.
                    enum:
                    - failed
                    - in_progress
                    - not_in_progress
                    - success
                    - creating_replacement_cluster
                    - deprovisioning_replaced_cluster
                    - terminating_cluster_nodes
                    type: string
                title: Replacing cluster details
                type: object
              vpc:
                description: The name of the VPC.
                type: string
              vpc_cidr:
                $ref: '#/components/schemas/CIDR'
            required:
            - management_services_access_policy
            - prism_element_access_policy
            title: AWS cluster network
            type: object
          protected:
            type: boolean
        required:
        - capacity
        - network
        type: object
      title: AWS cluster
      type: object
    Advanced Capacity Settings:
      description: Advanced settings for capacity configuration.
      properties:
        cvm_volume_iops:
          description: IOPS configuration for CVM volumes on AWS cluster.
          maximum: 16000
          minimum: 3000
          type: integer
      title: Advanced Capacity Settings
      type: object
    Cluster update:
      properties:
        data:
          properties:
            description:
              description: Add a description of the cluster.
              type: string
            schedule_termination:
              description: Whether to schedule termination for the cluster.
              type: boolean
            status:
              description: The status of the cluster.
              enum:
              - failed
              type: string
            terminate_at:
              description: Termination time for the cluster.
              format: date-time
              type: string
            url_slug:
              description: The slug of the URL unique to your cluster.
              type: string
          type: object
      required:
      - data
      title: Cluster update
      type: object
    Remote Storage configuration:
      properties:
        capacity:
          description: Remote storage capacity per host in GB. Valid values can be retrieved from the /v2/remote-storage-profiles
            endpoint.
          minimum: 2
          type: integer
      required:
      - capacity
      title: Remote Storage configuration
      type: object
    Cluster redundancy:
      properties:
        factor:
          description: The redundancy factor of the cluster.
          type: integer
      required:
      - factor
      title: Cluster redundancy
      type: object
    Cluster License:
      description: Specifies the cluster's license type. 'nci' is always available; 'aos' requires the legacy portfolio feature
        to be enabled.
      enum:
      - aos
      - nci
      title: Cluster License
      type: string
    Cluster capacity for AWS:
      items:
        properties:
          advanced_settings:
            $ref: '#/components/schemas/Advanced Capacity Settings'
          host_type:
            description: Type of the host instance in the cluster. Refer to our NC2 user guide for supported host types.
            type: string
          node_type:
            description: The type of the node.
            enum:
            - hci
            - storage_only
            type: string
          number_of_hosts:
            description: Number of hosts of the given host type.
            maximum: 28
            minimum: 3
            type: integer
          remote_storage:
            $ref: '#/components/schemas/Remote Storage configuration'
          tenancy:
            description: Host instance tenancy.
            enum:
            - default
            - dedicated
            type: string
        required:
        - host_type
        - number_of_hosts
        title: Cluster capacity item for AWS
        type: object
      title: Cluster capacity for AWS
      type: array
    Advanced Replication:
      description: Advanced Replication allows Metro File Sync Replication and Near-Sync FSVM-level Replication.
      title: Advanced Replication
      type: boolean
    Cluster fault tolerance factor:
      properties:
        factor:
          description: Cluster's ability to survive hardware failures - 1D/1N means your data and applications stay safe even
            if one disk fails OR one node fails.
          type: string
      required:
      - factor
      title: Cluster fault tolerance factor
      type: object
    Files Dedicated:
      description: Is this a dedicated cluster for Files?
      title: Files Dedicated
      type: boolean
    Cluster consumption:
      properties:
        max_number_of_concurrent_users:
          description: The limit on the maximum number of concurrent users.
          minimum: 1
          type: integer
        method:
          description: The consumption method for the VDI cluster.
          enum:
          - user_based
          type: string
      required:
      - method
      - max_number_of_concurrent_users
      title: Cluster consumption
      type: object
    Data at Rest Encryption:
      description: Data at rest encryption enables the encryption of existing data in place, and all new data is written in
        an encrypted format.
      title: Data at Rest Encryption
      type: boolean
    Files Capacity:
      description: Files dedicated cluster capacity in TB
      minimum: 1
      title: Files Capacity
      type: integer
    Prism Central:
      properties:
        cloud_account_id:
          $ref: '#/components/schemas/Base64ID'
        flow_gateway:
          $ref: '#/components/schemas/Flow Gateway'
        health_status:
          type: string
        id:
          $ref: '#/components/schemas/Base64ID'
        management_subnet:
          type: string
        management_subnet_cidr:
          $ref: '#/components/schemas/CIDR'
        region:
          type: string
        status:
          type: string
        version:
          description: The version of the Prism Central (PC).
          type: string
        virtual_ip:
          type: string
        vm_ips:
          items:
            type: string
          type: array
        vnet:
          description: The name of the VNet.
          type: string
        vnet_cidr:
          $ref: '#/components/schemas/CIDR'
      required:
      - flow_gateway
      title: Prism Central
      type: object
    Cluster:
      oneOf:
      - $ref: '#/components/schemas/AWS cluster'
      - $ref: '#/components/schemas/Azure cluster'
      - $ref: '#/components/schemas/Google Cloud Cluster'
      title: Cluster
      type: object
