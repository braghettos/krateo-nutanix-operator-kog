components:
  schemas:
    Task:
      description: A task
      properties:
        cluster_id:
          description: The ID of the cluster.
          type: Elixir.CPanelWeb.Api.Specs.UUID
        created_at:
          description: The creation date of the task.
          format: date-time
          type: string
        customer_id:
          description: The ID of the customer.
          type: Elixir.CPanelWeb.Api.Specs.UUID
        display_name:
          description: The display name of the task.
          type: string
        duration:
          description: The duration of the task in seconds.
          type: integer
        ended_at:
          description: The completion date of the task.
          format: date-time
          type: string
        id:
          description: The ID of the task.
          type: Elixir.CPanelWeb.Api.Specs.UUID
        initiated_by:
          $ref: '#/components/schemas/User Details'
        initiated_by_id:
          description: The ID of the user who initiated the task.
          type: Elixir.CPanelWeb.Api.Specs.UUID
        kind:
          description: The kind of the task.
          type: string
        organization_id:
          description: The ID of the organization.
          type: Elixir.CPanelWeb.Api.Specs.UUID
        status:
          description: The status of the task.
          enum:
          - not_started
          - running
          - succeeding
          - cancelling
          - failing
          - done
          - failed
          - cancelled
          title: Task status
          type: string
        status_details:
          $ref: '#/components/schemas/Task Status Details'
        updated_at:
          description: The update date of the task.
          format: date-time
          type: string
      required:
      - id
      - created_at
      - customer_id
      - display_name
      - kind
      - stage
      - updated_at
      title: Task
      type: object
    Task Status Details:
      description: Additional details about the status of the task.
      properties:
        description:
          description: A detailed description of the task status.
          type: string
      title: Task Status Details
      type: object
    Google Cloud Cluster Capacity:
      description: Capacity configuration for Google Cloud cluster.
      properties:
        instance_type:
          description: The instance type
          type: string
        nodes_count:
          description: The number of nodes
          type: integer
      required:
      - instance_type
      - nodes_count
      title: Google Cloud Cluster Capacity
      type: object
    Cluster fault tolerance factor:
      properties:
        factor:
          description: Cluster's ability to survive hardware failures - 1D/1N means your data and applications stay safe even
            if one disk fails OR one node fails.
          type: string
      required:
      - factor
      title: Cluster fault tolerance factor
      type: object
    Files Dedicated:
      description: Is this a dedicated cluster for Files?
      title: Files Dedicated
      type: boolean
    Cluster consumption:
      properties:
        max_number_of_concurrent_users:
          description: The limit on the maximum number of concurrent users.
          minimum: 1
          type: integer
        method:
          description: The consumption method for the VDI cluster.
          enum:
          - user_based
          type: string
      required:
      - method
      - max_number_of_concurrent_users
      title: Cluster consumption
      type: object
    Data at Rest Encryption:
      description: Data at rest encryption enables the encryption of existing data in place, and all new data is written in
        an encrypted format.
      title: Data at Rest Encryption
      type: boolean
    Google Cloud Cluster:
      description: A Google Cloud Platform cluster configuration.
      properties:
        advanced_replication:
          $ref: '#/components/schemas/Advanced Replication'
        aos_version:
          description: The AOS version of the cluster.
          type: string
        capacity:
          description: The capacity configuration of the cluster.
          items:
            $ref: '#/components/schemas/Google Cloud Cluster Capacity'
          minItems: 1
          type: array
        cloud_account_id:
          description: The ID of the cloud account.
          type: Elixir.CPanelWeb.Api.Specs.Base64ID
        cluster_fault_tolerance:
          $ref: '#/components/schemas/Cluster fault tolerance factor'
        consumption:
          $ref: '#/components/schemas/Cluster consumption'
        data_at_rest_encryption:
          $ref: '#/components/schemas/Data at Rest Encryption'
        files_capacity:
          $ref: '#/components/schemas/Files Capacity'
        files_dedicated:
          $ref: '#/components/schemas/Files Dedicated'
        license:
          $ref: '#/components/schemas/Cluster License'
        name:
          description: The name of the cluster.
          type: string
        network:
          properties:
            availability_zone:
              description: The availability zone for the cluster.
              type: string
            dns_servers:
              description: List of DNS server IP addresses for new mode.
              items:
                type: string
              type: array
            fvn_config:
              properties:
                nat_ip_ranges:
                  items:
                    properties:
                      cidr:
                        allOf:
                        - $ref: '#/components/schemas/CIDR'
                        description: The CIDR for NAT IP range for new mode.
                      name:
                        description: The name of the NAT IP range.
                        type: string
                    type: object
                  title: NAT IP Ranges Configuration
                  type: array
                no_nat:
                  properties:
                    cidr:
                      allOf:
                      - $ref: '#/components/schemas/CIDR'
                      description: The CIDR for no NAT subnet for new mode.
                    name:
                      description: The subnet name for no NAT for existing mode or CIDR for new mode.
                      type: string
                  title: No NAT Configuration
                  type: object
              required:
              - no_nat
              - nat_ip_ranges
              title: Flow Virtual Network Configuration
              type: object
            management_services_access_policy:
              properties:
                ip_addresses:
                  description: List of allowed IP addresses/CIDRs. Required only if mode is restricted.
                  items:
                    $ref: '#/components/schemas/CIDR'
                  type: array
                mode:
                  description: Access policy Mode
                  enum:
                  - disabled
                  - restricted
                  type: string
              required:
              - mode
              title: Management Services Access Policy
              type: object
            management_subnet:
              description: The management subnet name for existing mode.
              type: string
            mode:
              description: 'Network mode: existing or new.'
              enum:
              - existing
              - new
              type: string
            prism_element_access_policy:
              properties:
                ip_addresses:
                  description: List of allowed IP addresses/CIDRs. Required only if mode is restricted.
                  items:
                    $ref: '#/components/schemas/CIDR'
                  type: array
                mode:
                  description: Access policy Mode
                  enum:
                  - disabled
                  - restricted
                  type: string
              required:
              - mode
              title: Prism Element Access Policy
              type: object
            subnet_cidr:
              allOf:
              - $ref: '#/components/schemas/CIDR'
              description: The subnet CIDR for new mode.
            vpc:
              description: The VPC name for existing mode.
              type: string
          required:
          - mode
          - management_services_access_policy
          - prism_element_access_policy
          title: Google Cloud Network Configuration
          type: object
        organization_id:
          description: The ID of the organization.
          type: Elixir.CPanelWeb.Api.Specs.UUID
        prism_central:
          properties:
            dns_server_ip_list:
              description: List of DNS server IP addresses.
              items:
                type: string
              type: array
            mode:
              description: Prism Central Deployment Mode
              enum:
              - new
              - existing
              type: string
            ntp_server_ip_list:
              description: List of NTP server IP addresses.
              items:
                type: string
              minItems: 1
              type: array
            version:
              description: Prism Central Version
              type: string
            vm_size:
              description: Virtual machine size for Prism Central.
              type: string
          required:
          - mode
          title: Prism Central Configuration
          type: object
        region:
          description: The Google Cloud region where the cluster is to be deployed.
          type: string
        software_tier:
          description: The software tier of the cluster.
          enum:
          - pro
          - ultimate
          type: string
        terminate_at:
          description: The termination time of the cluster.
          format: date-time
          type: string
        use_case:
          $ref: '#/components/schemas/Cluster use-case'
      required:
      - organization_id
      - cloud_account_id
      - name
      - use_case
      - region
      - license
      - aos_version
      - software_tier
      - capacity
      - cluster_fault_tolerance
      - network
      title: Google Cloud Cluster
      type: object
    Files Capacity:
      description: Files dedicated cluster capacity in TB
      minimum: 1
      title: Files Capacity
      type: integer
    User Details:
      description: Details of the user.
      properties:
        email:
          description: The email of the user.
          format: email
          type: string
        first_name:
          description: The first name of the user.
          type: string
        id:
          description: The ID of the user.
          format: uuid
          type: string
        identity_provider:
          description: The identity provider of the user.
          type: string
        last_name:
          description: The last name of the user.
          type: string
      required:
      - id
      - email
      - identity_provider
      title: User Details
      type: object
    Advanced Replication:
      description: Advanced Replication allows Metro File Sync Replication and Near-Sync FSVM-level Replication.
      title: Advanced Replication
      type: boolean
    Cluster License:
      description: Specifies the cluster's license type. 'nci' is always available; 'aos' requires the legacy portfolio feature
        to be enabled.
      enum:
      - aos
      - nci
      title: Cluster License
      type: string
    Cluster use-case:
      description: The use-case for the cluster.
      enum:
      - general
      - vdi
      title: Cluster use-case
      type: string
    CIDR:
      description: Classless Inter-Domain Routing.
      format: cidr
      title: CIDR
      type: string
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
