            '
          items:
            $ref: '#/components/schemas/common.v1.0.config.Message'
        extraInfo:
          maxItems: 20
          minItems: 0
          type: array
          description: 'An array of entity-specific metadata

            '
          items:
            $ref: '#/components/schemas/common.v1.0.config.KVPair'
      additionalProperties: false
      description: 'The metadata associated with an API response. This value is always present and minimally contains the
        self-link for the API request that produced this response. It also contains pagination data for the paginated requests.

