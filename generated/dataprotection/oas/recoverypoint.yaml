    dataprotection.v4.0.common.BackupType:
      title: Backup type for vss snapshot
      type: string
      description: 'The backup type specifies the criteria for identifying the files to be backed up. This property should
        be specified to the application-consistent recovery points for Windows VMs/agents. The following backup types are
        supported for the application-consistent recovery points:

        1. FULL_BACKUP - All files are backed up irrespective of their last backup date/time and state. Also, this backup
        type updates the backup history of every file that was involved in the recovery point.

        2. COPY_BACKUP - All files are backed up regardless of their last backup date/time and state. However, this backup
        type does not update the backup history of individual files involved in the recovery point.'
      enum:
      - FULL_BACKUP
      - COPY_BACKUP
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        FULL_BACKUP: All the files are backed up irrespective of their last backup date/time or state. Also, this backup type
          updates the backup history of each file that participated in the recovery point. If not explicitly specified, this
          is the default backup type.
        $UNKNOWN: 'Unknown value.

