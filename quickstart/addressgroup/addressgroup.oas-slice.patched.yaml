      - lang: Go
        source: "\npackage main\n\nimport (\n    \"fmt\"\n    \"time\"\n    \"github.com/nutanix/ntnx-api-golang-clients/microseg-go-client/v4/api\"\n    \"github.com/nutanix/ntnx-api-golang-clients/microseg-go-client/v4/client\"\n    import1 \"github.com/nutanix/ntnx-api-golang-clients/microseg-go-client/v4/models/prism/v4/config\"\n)\n\nvar (\n    ApiClientInstance *client.ApiClient\n    AddressGroupsApiInstance *api.AddressGroupsApi\n)\n\nfunc main() {\n    ApiClientInstance = client.NewApiClient()\n    // IPv4/IPv6 address or FQDN of the cluster\n    ApiClientInstance.Host = \"localhost\"\n    // Port to which to connect to\n    ApiClientInstance.Port = 9440\n    // Interval in ms to use during retry attempts\n    ApiClientInstance.RetryInterval = 5 * time.Second\n    // Max retry attempts while reconnecting on a loss of connection\n    ApiClientInstance.MaxRetryAttempts = 5\n    // UserName to connect to the cluster\n    ApiClientInstance.Username = \"username\"\n    // Password to connect to the cluster\n    ApiClientInstance.Password = \"password\"\n    // Please add authorization information here if needed.\n    AddressGroupsApiInstance = api.NewAddressGroupsApi(ApiClientInstance)\n\n    \n    extId := \"ADcFeBbd-51Dd-bBcB-83B8-3cacB585d87b\"\n\n\n    response, error := AddressGroupsApiInstance.DeleteAddressGroupById(&extId)\n    if error != nil {\n        fmt.Println(error)\n        return\n    }\n    data, _ := response.GetData().(import1.TaskReference)\n    fmt.Println(data)\n\n}\n\n"
