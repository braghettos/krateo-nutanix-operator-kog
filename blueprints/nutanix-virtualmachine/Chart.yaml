apiVersion: v2
name: nutanix-virtualmachine
description: |
  Krateo blueprint that provisions a complete Nutanix AHV virtual machine — with its
  disks, NICs, CD-ROMs and serial ports declared INLINE on the VM — as a single KOG
  resource. This is the composition-friendly way to model what would otherwise be a
  parent->child chain: the Nutanix v4 Vm create body accepts disks/nics/cdRoms/
  serialPorts inline, so no runtime extId wiring is needed.
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords: [krateo, nutanix, blueprint, composition, virtual-machine]
home: https://github.com/braghettos/krateo-nutanix-operator-kog
maintainers:
  - name: braghettos
