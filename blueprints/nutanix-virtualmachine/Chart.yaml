apiVersion: v2
name: nutanix-virtualmachine
description: |
  Krateo blueprint that provisions a complete Nutanix AHV virtual machine — with its
  disks, NICs and serial ports declared INLINE on the VM — as a single KOG
  resource. This is the composition-friendly way to model what would otherwise be a
  parent->child chain: the Nutanix v4 Vm create body accepts disks/nics/
  serialPorts inline, so no runtime extId wiring is needed.
type: application
version: 0.3.0
appVersion: "0.3.0"

# Krateo portal Composition page: an opinionated, composition-agnostic page that shows
# this blueprint's Events, managed-resource Status and Values in the Krateo portal.
# Pulled from the Krateo Marketplace Helm registry.
dependencies:
  - name: portal-composition-page-generic
    version: "1.4.3"
    repository: "https://marketplace.krateo.io"

keywords:
  - krateo
  - blueprint
  - composition
  - compute
  - nutanix
  - virtualmachine
  - vm
  - kog
home: https://github.com/krateo-blueprints/krateo-nutanix-operator-kog
icon: https://raw.githubusercontent.com/krateoplatformops/krateo/main/docs/media/logo.svg
maintainers:
  - name: braghettos
annotations:
  krateo.io/category: compute
  krateo.io/display-name: "Nutanix VirtualMachine"
  krateo.io/maturity: beta
  krateoSupportedVersion: ">= 2.5.1"
