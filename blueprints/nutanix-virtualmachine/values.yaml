# Krateo blueprint values for a Nutanix AHV virtual machine.

# The KOG Configuration that holds the Prism Central credentials.
configuration:
  name: nutanix-pc
  namespace: nutanix-system
  authSecret:
    name: nutanix-pc-auth   # keys: username, password
    namespace: nutanix-system

vm:
  name: krateo-bp-vm
  description: "Provisioned by the Krateo nutanix-virtualmachine blueprint"
  numSockets: 1
  numCoresPerSocket: 1
  memorySizeBytes: 2147483648        # 2 GiB
  clusterExtId: ""                   # REQUIRED: registered PE cluster extId
  categories: []                     # optional: list of category extIds

# Inline disks. Each becomes an entry in the VM's spec.disks (no separate child resource).
disks:
  - sizeBytes: 21474836480           # 20 GiB
    busType: SCSI
    storageContainerExtId: ""        # optional; PC picks a default container if empty

# Inline NICs.
nics: []
  # - subnetExtId: "<subnet-extId>"
  #   nicType: NORMAL_NIC

# Inline serial ports.
serialPorts: []
  # - index: 0
  #   isConnected: false
