apiVersion: v2
name: nutanix-v4-proxy
description: |
  Translating proxy that lets the Krateo rest-dynamic-controller (KOG) drive the
  Nutanix Prism Central v4 API: OData $filter quoting, $objectType discriminator
  injection, NTNX-Request-Id, async task resolution (failures surfaced), ETag /
  parent If-Match, read-modify-write day-2 updates, int-stringify, and optional
  X-Cluster-Id.
type: application
version: 0.6.0          # chart version
appVersion: "0.6.0"    # nutanix_v4_proxy.py version
keywords:
  - krateo
  - nutanix
  - prism-central
  - oasgen-provider
  - rest-dynamic-controller
home: https://github.com/krateo-blueprints/krateo-nutanix-operator-kog
sources:
  - https://github.com/krateo-blueprints/krateo-nutanix-operator-kog
maintainers:
  - name: braghettos
