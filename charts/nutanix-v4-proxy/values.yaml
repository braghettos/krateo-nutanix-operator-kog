# Default values for nutanix-v4-proxy.

replicaCount: 1

image:
  repository: ghcr.io/braghettos/nutanix-v4-proxy
  # Pin to a digest in production; tag shown for readability.
  tag: "0.2.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Proxy configuration -> container env. PC_BASE is REQUIRED.
config:
  # Prism Central API base. MUST end in /api. e.g. https://pc.example.com:9440/api
  pcBase: ""
  # Verify the PC TLS cert. PC often serves a private CA -> false by default.
  tlsVerify: false
  # Async task poll budget (seconds).
  taskTimeoutSeconds: 180
  # INFO or DEBUG.
  logLevel: INFO
  # Optional default cluster extId added as X-Cluster-Id when a request lacks one
  # (needed by cluster-scoped endpoints such as clustermgmt storage-containers).
  xClusterId: ""
  # Optional JSON map {"<path-prefix>": "<$objectType>"} for irregular paths.
  objectTypeOverrides: {}

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Hardened by default: non-root, read-only rootfs, no privilege escalation.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
