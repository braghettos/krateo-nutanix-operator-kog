# Example instance of the generated Image CRD (URL-sourced disk image).
apiVersion: vmm.nutanix.krateo.io/v1alpha1
kind: Image
metadata:
  name: ubuntu-2404
  namespace: nutanix-system
spec:
  configurationRef:
    name: nutanix-image-config
    namespace: nutanix-system
  name: ubuntu-2404
  description: "Managed by Krateo"
  type: DISK_IMAGE
  source:
    url: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img"
    shouldAllowInsecureUrl: false
