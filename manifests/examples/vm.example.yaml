# Example instance of the generated VirtualMachine CRD.
# Confirm the real schema after reconcile: kubectl explain virtualmachine.vmm.nutanix.krateo.io
apiVersion: vmm.nutanix.krateo.io/v1alpha1
kind: VirtualMachine
metadata:
  name: demo-vm
  namespace: nutanix-system
spec:
  configurationRef:
    name: nutanix-vm-config
    namespace: nutanix-system
  name: demo-vm
  description: "Managed by Krateo"
  numSockets: 2
  numCoresPerSocket: 2
  memorySizeBytes: 4294967296   # 4 GiB
  powerState: "ON"
  cluster:
    # extId of the target cluster (discover via the Cluster resource / findby).
    extId: "REPLACE_WITH_CLUSTER_EXTID"
