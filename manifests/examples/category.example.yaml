# Example instance of the generated Category CRD.
# Field names mirror the OAS schema (oas/prism/category.yaml). After the
# RestDefinition reconciles, confirm the real schema with:
#   kubectl explain category.prism.nutanix.krateo.io
apiVersion: prism.nutanix.krateo.io/v1alpha1
kind: Category
metadata:
  name: env-production
  namespace: nutanix-system
spec:
  # Ties this resource to its Configuration (server + auth).
  configurationRef:
    name: nutanix-category-config
    namespace: nutanix-system
  key: environment
  value: production
  description: "Managed by Krateo"
  type: USER
