# Example instance of the generated Subnet CRD.
apiVersion: networking.nutanix.krateo.io/v1alpha1
kind: Subnet
metadata:
  name: demo-vlan
  namespace: nutanix-system
spec:
  configurationRef:
    name: nutanix-subnet-config
    namespace: nutanix-system
  name: demo-vlan
  description: "Managed by Krateo"
  subnetType: VLAN
  networkId: 100
  clusterReference: "REPLACE_WITH_CLUSTER_EXTID"
  ipConfig:
    - ipv4:
        ipSubnet:
          ip:
            value: "10.10.10.0"
          prefixLength: 24
        defaultGatewayIp:
          value: "10.10.10.1"
