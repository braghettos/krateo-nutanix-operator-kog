# Configuration CR - generated by oasgen-provider alongside each resource CRD as
# "<Kind>Configuration". It carries the target server (your Prism Central) and the
# auth wiring (secret refs). The EXACT field layout is produced by the controller
# from the OAS securitySchemes + servers - after the RestDefinition reconciles,
# inspect the real schema with:
#   kubectl explain categoryconfiguration.prism.nutanix.krateo.io
# and adjust the fields below to match. Treat this as an illustrative template.
---
apiVersion: prism.nutanix.krateo.io/v1alpha1
kind: CategoryConfiguration
metadata:
  name: nutanix-category-config
  namespace: nutanix-system
spec:
  # Fills the {prismCentral} server variable from the OAS.
  configuration:
    server:
      variables:
        prismCentral: "prism-central.example.com:9440"
  authentication:
    # Use the block matching your chosen securityScheme; remove the other.
    basic:
      usernameRef:
        name: nutanix-pc-credentials
        namespace: nutanix-system
        key: username
      passwordRef:
        name: nutanix-pc-credentials
        namespace: nutanix-system
        key: password
    # apiKey:
    #   keyRef:
    #     name: nutanix-pc-credentials
    #     namespace: nutanix-system
    #     key: apiKey
