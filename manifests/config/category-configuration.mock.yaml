# Configuration CR pointed at the in-cluster MOCK (scheme=http, mock Service).
# Use this to validate the toolchain; swap to category-configuration.example.yaml
# (scheme=https + real PC host) when you have a live Prism Central.
#
# NOTE: confirm the generated field layout after reconcile:
#   kubectl explain categoryconfiguration.prism.nutanix.krateo.io --recursive
---
apiVersion: prism.nutanix.krateo.io/v1alpha1
kind: CategoryConfiguration
metadata:
  name: nutanix-category-config
  namespace: nutanix-system
spec:
  configuration:
    server:
      variables:
        scheme: "http"
        prismCentral: "nutanix-mock.nutanix-system.svc.cluster.local:8080"
  authentication:
    # The mock accepts any credentials; values are placeholders.
    basic:
      usernameRef:
        name: nutanix-pc-credentials
        namespace: nutanix-system
        key: username
      passwordRef:
        name: nutanix-pc-credentials
        namespace: nutanix-system
        key: password
