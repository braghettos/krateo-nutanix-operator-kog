# Prism Central credentials. Pick ONE auth method matching the OAS securityScheme.
#
# Do NOT commit real credentials. Create the secret from the CLI instead, e.g.:
#   kubectl -n nutanix-system create secret generic nutanix-pc-credentials \
#     --from-literal=username='admin' \
#     --from-literal=password='REDACTED'
# or for API-key auth:
#   kubectl -n nutanix-system create secret generic nutanix-pc-credentials \
#     --from-literal=apiKey='REDACTED'
---
apiVersion: v1
kind: Secret
metadata:
  name: nutanix-pc-credentials
  namespace: nutanix-system
type: Opaque
stringData:
  # Basic auth (basicAuth scheme)
  username: "admin"
  password: "CHANGE_ME"
  # API-key auth (apiKeyAuth scheme, X-Ntnx-Api-Key) - use instead of user/pass
  apiKey: "CHANGE_ME"
