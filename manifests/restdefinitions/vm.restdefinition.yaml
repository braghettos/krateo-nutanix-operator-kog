apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: nutanix-virtualmachine
  namespace: nutanix-system
spec:
  # OAS slice is mounted as a ConfigMap (see scripts/make-configmaps.sh).
  oasPath: configmap://nutanix-system/nutanix-vm-oas/vm.yaml
  resourceGroup: vmm.nutanix.krateo.io
  resource:
    kind: VirtualMachine
    # findby matches spec.name against the listed VMs to discover the entity.
    # (Async create does not return the extId synchronously, so we discover it
    # by name and then drive get/update/delete from status.extId.)
    identifiers:
      - name
    additionalStatusFields:
      # extId lives under "data" in the v4 response envelope. If your controller
      # build does not auto-unwrap "data", change this to data.extId.
      - extId
    verbsDescription:
      - action: findby
        method: GET
        path: /vmm/v4.1/ahv/config/vms
      - action: create
        method: POST
        path: /vmm/v4.1/ahv/config/vms
      - action: get
        method: GET
        path: /vmm/v4.1/ahv/config/vms/{extId}
        requestFieldMapping:
          - inPath: extId
            inCustomResource: status.extId
      - action: update
        method: PUT
        path: /vmm/v4.1/ahv/config/vms/{extId}
        requestFieldMapping:
          - inPath: extId
            inCustomResource: status.extId
      - action: delete
        method: DELETE
        path: /vmm/v4.1/ahv/config/vms/{extId}
        requestFieldMapping:
          - inPath: extId
            inCustomResource: status.extId
