name: release

# Builds + pushes the proxy image and packages + publishes the Helm chart.
# Trigger by pushing a semver tag, e.g.:  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without leading v), e.g. 0.2.0"
        required: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nutanix-v4-proxy
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

permissions:
  contents: write      # create the GitHub Release / upload assets
  packages: write      # push to GHCR (image + chart)

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: quickstart/middleware
          file: quickstart/middleware/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}

  chart:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        run: helm lint charts/nutanix-v4-proxy

      - name: Package
        run: |
          helm package charts/nutanix-v4-proxy \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.version }}" \
            --destination dist

      - name: Push chart to GHCR (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} --password-stdin
          helm push dist/nutanix-v4-proxy-${{ steps.ver.outputs.version }}.tgz ${{ env.CHART_REPO }}

      - name: Attach chart to the GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nutanix-v4-proxy-${{ steps.ver.outputs.version }}.tgz
