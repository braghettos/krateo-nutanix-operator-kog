name: ci

# Validates the proxy image builds and the chart lints/renders on every PR and
# push to main that touches them. No registry push.
on:
  pull_request:
    paths:
      - "quickstart/middleware/**"
      - "charts/nutanix-v4-proxy/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "quickstart/middleware/**"
      - "charts/nutanix-v4-proxy/**"

permissions:
  contents: read

jobs:
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: quickstart/middleware
          file: quickstart/middleware/Dockerfile
          push: false
          load: true
          tags: nutanix-v4-proxy:ci
      - name: Smoke test /healthz
        run: |
          docker run -d --name mw -e PC_BASE=https://example.invalid:9440/api -p 18080:8080 nutanix-v4-proxy:ci
          for i in $(seq 1 10); do
            [ "$(curl -s -m 2 http://127.0.0.1:18080/healthz || true)" = "ok" ] && ok=1 && break
            sleep 1
          done
          docker rm -f mw
          test "${ok:-0}" = "1"

  chart-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Lint
        run: helm lint charts/nutanix-v4-proxy
      - name: Render (requires config.pcBase)
        run: |
          helm template t charts/nutanix-v4-proxy \
            --set config.pcBase=https://pc.example.com:9440/api > /dev/null
      - name: Render must FAIL without config.pcBase
        run: |
          if helm template t charts/nutanix-v4-proxy > /dev/null 2>&1; then
            echo "ERROR: chart rendered without required config.pcBase"; exit 1
          fi
          echo "ok: chart correctly refuses to render without config.pcBase"
