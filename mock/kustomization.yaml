apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deploys the mock Nutanix v4 API into nutanix-system.
#   kubectl apply -k mock/
# Test-only - keep it OUT of the root kustomization.

namespace: nutanix-system

resources:
  - deploy.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: nutanix-mock-src
    files:
      - mock_server.py=mock_server.py
